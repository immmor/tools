<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent - FUNLE Blue Neumorphic & Glassmorphism Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        funle: {
                            DEFAULT: '#81D8CF',        // RGB(129, 216, 207) - classic Tiffany Blue
                            hover: '#68C7BD',          // Darker shade for hover state
                            dark: '#3A988E',           // Deep teal for icons and high contrast accents
                            bg: '#EAF6F5',             // Soft pastel minty blue background
                            card: '#E2F2F0',           // Slightly deeper shade for card elements
                            text: '#1C3E3A',           // Deep dark slate/teal for excellent text legibility
                            muted: '#618C86',          // Muted text color matching the hue
                            glass: 'rgba(255, 255, 255, 0.55)',
                            glassDark: 'rgba(215, 238, 235, 0.75)'
                        }
                    },
                    boxShadow: {
                        // Hue-matched Neumorphic shadows tinting against #EAF6F5
                        'neu-out': '8px 8px 18px #c8e4e1, -8px -8px 18px #ffffff',
                        'neu-out-sm': '4px 4px 10px #c8e4e1, -4px -4px 10px #ffffff',
                        'neu-in': 'inset 4px 4px 8px #c8e4e1, inset -4px -4px 8px #ffffff',
                        'neu-in-sm': 'inset 2px 2px 5px #c8e4e1, inset -2px -2px 5px #ffffff',
                        'glass-shadow': '0 8px 32px 0 rgba(40, 110, 100, 0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Customizations for FUNLE Blue Aesthetics */
        body {
            background-color: #EAF6F5;
            color: #1C3E3A;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.75);
        }

        .glass-panel-dark {
            background: rgba(215, 238, 235, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(234, 246, 245, 0.5);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(160, 215, 207, 0.8);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(129, 216, 207, 1);
        }

        /* Typing Dots Animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Smooth UI transitions */
        .neu-transition {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Collapsible search sources */
        details.sources > summary { list-style: none; cursor: pointer; }
        details.sources > summary::-webkit-details-marker { display: none; }
        details.sources .chevron { transition: transform 0.2s ease; }
        details.sources[open] .chevron { transform: rotate(180deg); }
    </style>
</head>
<body class="h-full flex flex-col justify-between select-none">

    <!-- Main Outer Container -->
    <div class="flex h-full w-full p-2 md:p-4 gap-4 overflow-hidden relative">

        <!-- Mobile Drawer Backdrop Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-30 hidden md:hidden transition-opacity duration-300"></div>

        <!-- SIDEBAR / HISTORY PANEL -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 md:w-80 flex-col flex-shrink-0 h-full transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out p-1">
            <div class="h-full w-full rounded-3xl glass-panel p-4 flex flex-col shadow-glass-shadow border border-white/70 relative overflow-hidden">
                
                <!-- Sidebar Header -->
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-white/50">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-2xl bg-funle-bg shadow-neu-out flex items-center justify-center text-funle-dark">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-funle-text text-base tracking-wide">FUNLE AI 助手</h1>
                            <span class="text-xs text-funle-muted flex items-center">
                                <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block mr-1.5 animate-pulse"></span>在线服务
                            </span>
                        </div>
                    </div>
                    <!-- Close Mobile Sidebar -->
                    <button id="close-sidebar-btn" class="md:hidden w-8 h-8 rounded-xl bg-funle-bg shadow-neu-out flex items-center justify-center text-funle-muted active:shadow-neu-in">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- New Chat Button -->
                <button id="new-chat-btn" class="w-full py-3 px-4 rounded-2xl bg-funle shadow-neu-out hover:bg-funle-hover active:shadow-neu-in text-funle-text font-bold flex items-center justify-center space-x-2 neu-transition mb-4 group">
                    <i data-lucide="plus-circle" class="w-5 h-5 transition-transform group-hover:rotate-90"></i>
                    <span>开启新对话</span>
                </button>

                <!-- Search Sessions Input -->
                <div class="relative mb-3">
                    <input type="text" id="search-history" placeholder="搜索历史会话..." class="w-full py-2.5 pl-9 pr-3 text-xs rounded-xl bg-funle-bg shadow-neu-in border-none focus:outline-none text-funle-text placeholder-funle-muted/70">
                    <i data-lucide="search" class="w-4 h-4 text-funle-muted absolute left-3 top-3"></i>
                </div>

                <!-- History List Label -->
                <div class="flex items-center justify-between text-xs font-semibold text-funle-muted px-1 mb-2">
                    <span>历史记录</span>
                    <button id="clear-all-history" class="hover:text-red-500 transition-colors" title="清空全部历史">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>

                <!-- Session List Container -->
                <div id="session-list" class="flex-1 overflow-y-auto pr-1 space-y-2.5 my-1">
                    <!-- Sessions will be dynamically inserted here -->
                </div>

                <!-- Sidebar Footer Status -->
                <div class="pt-3 mt-auto border-t border-white/50 flex items-center justify-between text-xs text-funle-muted">
                    <span class="flex items-center"><i data-lucide="cpu" class="w-3.5 h-3.5 mr-1"></i> FUNLE Blue v2.5</span>
                    <span id="session-count" class="px-2 py-0.5 rounded-md bg-white/60 text-[10px] font-mono">0 会话</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CHAT & SEARCH AGENT CONTAINER -->
        <main class="flex-1 flex flex-col h-full rounded-3xl glass-panel shadow-glass-shadow border border-white/80 overflow-hidden relative">
            
            <!-- Header Area -->
            <header class="h-16 px-4 md:px-6 flex items-center justify-between border-b border-white/60 glass-panel-dark z-10 flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <!-- Mobile Toggle Button -->
                    <button id="open-sidebar-btn" class="md:hidden w-10 h-10 rounded-2xl bg-funle-bg shadow-neu-out flex items-center justify-center text-funle-text active:shadow-neu-in">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    
                    <div class="flex flex-col">
                        <h2 id="current-session-title" class="font-bold text-funle-text text-sm md:text-base line-clamp-1">新会话</h2>
                        <span id="agent-sub-status" class="text-[11px] text-funle-muted flex items-center">
                            <i data-lucide="bot" class="w-3 h-3 mr-1 text-funle-dark"></i>智能对话模式已就绪
                        </span>
                    </div>
                </div>

                <!-- Mode Switcher & Tools -->
                <div class="flex items-center space-x-2 md:space-x-3">
                    <!-- Dual Mode Switch Segmented Control -->
                    <div class="p-1 rounded-2xl bg-funle-bg shadow-neu-in flex items-center text-xs font-medium">
                        <button id="mode-chat-btn" class="px-3 py-1.5 rounded-xl flex items-center space-x-1.5 neu-transition text-funle-text bg-funle shadow-neu-out font-bold">
                            <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                            <span class="hidden sm:inline">智能对话</span>
                        </button>
                        <button id="mode-search-btn" class="px-3 py-1.5 rounded-xl flex items-center space-x-1.5 neu-transition text-funle-muted hover:text-funle-text">
                            <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                            <span class="hidden sm:inline">网络搜索</span>
                        </button>
                    </div>

                    <!-- Clear Chat Current Screen -->
                    <button id="clear-current-chat" title="清空当前对话" class="w-9 h-9 rounded-2xl bg-funle-bg shadow-neu-out hover:shadow-neu-out-sm active:shadow-neu-in flex items-center justify-center text-funle-muted hover:text-red-500 neu-transition">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                </div>
            </header>

            <!-- Chat Messages Container -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth">
                <!-- Welcome Banner State when empty -->
                <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-6 max-w-md mx-auto my-auto">
                    <div class="w-20 h-20 rounded-3xl bg-funle-bg shadow-neu-out flex items-center justify-center text-funle-dark mb-6">
                        <i data-lucide="bot" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-xl font-bold text-funle-text mb-2">你好，我是 FUNLE AI 智能体</h3>
                    <p class="text-xs md:text-sm text-funle-muted mb-6 leading-relaxed">
                        基于 FUNLE Blue 经典色调与新拟态、毛玻璃极简视效构建。支持全网实时检索、图片解析以及多轮智能对话。
                    </p>

                    <!-- Quick Starter Chips -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full text-left">
                        <button class="quick-prompt p-3 rounded-2xl bg-funle-bg shadow-neu-out hover:shadow-neu-out-sm active:shadow-neu-in text-xs text-funle-text flex items-center space-x-2 neu-transition">
                            <i data-lucide="search" class="w-4 h-4 text-funle-dark flex-shrink-0"></i>
                            <span class="truncate">搜索 2026 科技最新趋势</span>
                        </button>
                        <button class="quick-prompt p-3 rounded-2xl bg-funle-bg shadow-neu-out hover:shadow-neu-out-sm active:shadow-neu-in text-xs text-funle-text flex items-center space-x-2 neu-transition">
                            <i data-lucide="code" class="w-4 h-4 text-funle-dark flex-shrink-0"></i>
                            <span class="truncate">编写高效的 JavaScript 脚本</span>
                        </button>
                        <button class="quick-prompt p-3 rounded-2xl bg-funle-bg shadow-neu-out hover:shadow-neu-out-sm active:shadow-neu-in text-xs text-funle-text flex items-center space-x-2 neu-transition">
                            <i data-lucide="image" class="w-4 h-4 text-funle-dark flex-shrink-0"></i>
                            <span class="truncate">上传图片分析内容与细节</span>
                        </button>
                        <button class="quick-prompt p-3 rounded-2xl bg-funle-bg shadow-neu-out hover:shadow-neu-out-sm active:shadow-neu-in text-xs text-funle-text flex items-center space-x-2 neu-transition">
                            <i data-lucide="lightbulb" class="w-4 h-4 text-funle-dark flex-shrink-0"></i>
                            <span class="truncate">帮我策划创意品牌营销方案</span>
                        </button>
                    </div>
                </div>

                <!-- Messages stream injected dynamically -->
            </div>

            <!-- Bottom Input Floating Area -->
            <div class="p-3 md:p-5 border-t border-white/60 glass-panel-dark flex-shrink-0">
                <div class="max-w-4xl mx-auto flex flex-col gap-2">
                    
                    <!-- Image Preview Area (Hidden by default) -->
                    <div id="image-preview-container" class="hidden items-center gap-3 p-2 bg-funle-bg/90 rounded-2xl shadow-neu-in max-w-xs relative border border-white/60">
                        <div class="relative w-14 h-14 rounded-xl overflow-hidden shadow-sm flex-shrink-0">
                            <img id="image-preview" src="" alt="上传预览" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0 pr-6">
                            <p id="image-name" class="text-xs font-medium text-funle-text truncate">image.png</p>
                            <span class="text-[10px] text-funle-muted">已添加待发送</span>
                        </div>
                        <button id="remove-image-btn" class="absolute top-2 right-2 w-5 h-5 rounded-full bg-red-400 text-white flex items-center justify-center hover:bg-red-500 neu-transition">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </div>

                    <!-- Input Box Main Bar -->
                    <div class="flex items-end space-x-2 md:space-x-3 bg-funle-bg p-2 rounded-3xl shadow-neu-in border border-white/50 relative">
                        <!-- Image Upload Button -->
                        <input type="file" id="file-input" accept="image/*" class="hidden">
                        <button id="upload-btn" title="上传图片" class="w-10 h-10 rounded-2xl bg-funle-bg shadow-neu-out hover:shadow-neu-out-sm active:shadow-neu-in flex items-center justify-center text-funle-muted hover:text-funle-dark flex-shrink-0 neu-transition mb-0.5">
                            <i data-lucide="image" class="w-5 h-5"></i>
                        </button>

                        <!-- Auto-Expanding Textarea -->
                        <textarea id="user-input" rows="1" placeholder="发送消息" class="flex-1 bg-transparent border-none focus:outline-none resize-none py-2 text-sm text-funle-text placeholder-funle-muted/70 max-h-32 min-h-[40px] scrollbar-thin"></textarea>

                        <!-- Send Button -->
                        <button id="send-btn" class="w-10 h-10 rounded-2xl bg-funle shadow-neu-out hover:bg-funle-hover active:shadow-neu-in text-funle-text font-bold flex items-center justify-center flex-shrink-0 neu-transition disabled:opacity-50 disabled:cursor-not-allowed mb-0.5">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <!-- Footer Info/Disclaimer -->
                    <div class="flex items-center justify-between text-[11px] text-funle-muted px-2">
                        <span class="flex items-center space-x-1">
                            <i data-lucide="shield-check" class="w-3 h-3 text-funle-dark"></i>
                            <span>AI 输出由大模型驱动，内容仅供参考</span>
                        </span>
                        <span class="hidden md:inline">支持键盘 Enter 发送</span>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // State Management
        const STATE = {
            sessions: [], // { id, title, timestamp, messages: [] }
            currentSessionId: null,
            mode: 'chat', // 'chat' or 'search'
            attachedImage: null, // base64 representation of attached image
            isGenerating: false
        };

        // DOM Elements
        const DOM = {
            sidebar: document.getElementById('sidebar'),
            openSidebarBtn: document.getElementById('open-sidebar-btn'),
            closeSidebarBtn: document.getElementById('close-sidebar-btn'),
            mobileOverlay: document.getElementById('mobile-overlay'),
            sessionList: document.getElementById('session-list'),
            newChatBtn: document.getElementById('new-chat-btn'),
            clearAllHistory: document.getElementById('clear-all-history'),
            searchHistory: document.getElementById('search-history'),
            sessionCount: document.getElementById('session-count'),
            currentSessionTitle: document.getElementById('current-session-title'),
            agentSubStatus: document.getElementById('agent-sub-status'),
            modeChatBtn: document.getElementById('mode-chat-btn'),
            modeSearchBtn: document.getElementById('mode-search-btn'),
            clearCurrentChat: document.getElementById('clear-current-chat'),
            messagesContainer: document.getElementById('messages-container'),
            emptyState: document.getElementById('empty-state'),
            userInput: document.getElementById('user-input'),
            sendBtn: document.getElementById('send-btn'),
            uploadBtn: document.getElementById('upload-btn'),
            fileInput: document.getElementById('file-input'),
            imagePreviewContainer: document.getElementById('image-preview-container'),
            imagePreview: document.getElementById('image-preview'),
            imageName: document.getElementById('image-name'),
            removeImageBtn: document.getElementById('remove-image-btn')
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            setupEventListeners();
            renderSessions();
            
            if (STATE.sessions.length === 0) {
                createNewSession();
            } else {
                switchSession(STATE.sessions[0].id);
            }
            
            lucide.createIcons();
        });

        // Event Listeners Setup
        function setupEventListeners() {
            // Mobile Drawer Events
            DOM.openSidebarBtn.addEventListener('click', toggleMobileSidebar);
            DOM.closeSidebarBtn.addEventListener('click', toggleMobileSidebar);
            DOM.mobileOverlay.addEventListener('click', toggleMobileSidebar);

            // Session Events
            DOM.newChatBtn.addEventListener('click', () => {
                createNewSession();
                if (window.innerWidth < 768) toggleMobileSidebar();
            });
            DOM.clearAllHistory.addEventListener('click', clearAllSessions);
            DOM.searchHistory.addEventListener('input', (e) => renderSessions(e.target.value));
            DOM.clearCurrentChat.addEventListener('click', clearCurrentChat);

            // Mode Switching
            DOM.modeChatBtn.addEventListener('click', () => setMode('chat'));
            DOM.modeSearchBtn.addEventListener('click', () => setMode('search'));

            // Textarea Auto-Resize & Submit on Enter
            DOM.userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            DOM.userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            DOM.sendBtn.addEventListener('click', sendMessage);

            // Image Upload Logic
            DOM.uploadBtn.addEventListener('click', () => DOM.fileInput.click());
            DOM.fileInput.addEventListener('change', handleImageUpload);
            DOM.removeImageBtn.addEventListener('click', clearImageUpload);

            // Quick Prompt Starter Chips
            document.querySelectorAll('.quick-prompt').forEach(chip => {
                chip.addEventListener('click', () => {
                    const text = chip.querySelector('span').innerText;
                    DOM.userInput.value = text;
                    DOM.userInput.style.height = 'auto';
                    DOM.userInput.focus();
                });
            });
        }

        // Mobile Sidebar Toggle
        function toggleMobileSidebar() {
            const isHidden = DOM.sidebar.classList.contains('-translate-x-full');
            if (isHidden) {
                DOM.sidebar.classList.remove('-translate-x-full');
                DOM.mobileOverlay.classList.remove('hidden');
            } else {
                DOM.sidebar.classList.add('-translate-x-full');
                DOM.mobileOverlay.classList.add('hidden');
            }
        }

        // Mode Switching
        function setMode(mode) {
            STATE.mode = mode;
            if (mode === 'chat') {
                DOM.modeChatBtn.className = "px-3 py-1.5 rounded-xl flex items-center space-x-1.5 neu-transition text-funle-text bg-funle shadow-neu-out font-bold";
                DOM.modeSearchBtn.className = "px-3 py-1.5 rounded-xl flex items-center space-x-1.5 neu-transition text-funle-muted hover:text-funle-text";
                DOM.agentSubStatus.innerHTML = `<i data-lucide="bot" class="w-3 h-3 mr-1 text-funle-dark"></i>智能对话模式已就绪`;
            } else {
                DOM.modeSearchBtn.className = "px-3 py-1.5 rounded-xl flex items-center space-x-1.5 neu-transition text-funle-text bg-funle shadow-neu-out font-bold";
                DOM.modeChatBtn.className = "px-3 py-1.5 rounded-xl flex items-center space-x-1.5 neu-transition text-funle-muted hover:text-funle-text";
                DOM.agentSubStatus.innerHTML = `<i data-lucide="globe" class="w-3 h-3 mr-1 text-funle-dark"></i>全网实时检索模式已就绪`;
            }
            lucide.createIcons();
        }

        // Local Storage Utilities
        function saveToLocalStorage() {
            localStorage.setItem('funle_chat_sessions', JSON.stringify(STATE.sessions));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('funle_chat_sessions');
            if (saved) {
                try {
                    STATE.sessions = JSON.parse(saved);
                } catch (e) {
                    STATE.sessions = [];
                }
            }
        }

        // Session Management
        function createNewSession() {
            const id = 'session_' + Date.now();
            const newSession = {
                id: id,
                title: '未命名新对话',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                messages: []
            };
            
            STATE.sessions.unshift(newSession);
            STATE.currentSessionId = id;
            saveToLocalStorage();
            renderSessions();
            renderMessages();
            
            DOM.currentSessionTitle.innerText = newSession.title;
        }

        function switchSession(id) {
            if (STATE.isGenerating) return;
            STATE.currentSessionId = id;
            const current = getCurrentSession();
            if (current) {
                DOM.currentSessionTitle.innerText = current.title;
                renderMessages();
                renderSessions();
            }
        }

        function getCurrentSession() {
            return STATE.sessions.find(s => s.id === STATE.currentSessionId);
        }

        function deleteSession(id, e) {
            e.stopPropagation();
            STATE.sessions = STATE.sessions.filter(s => s.id !== id);
            saveToLocalStorage();
            
            if (STATE.sessions.length === 0) {
                createNewSession();
            } else if (STATE.currentSessionId === id) {
                switchSession(STATE.sessions[0].id);
            } else {
                renderSessions();
            }
        }

        function clearAllSessions() {
            if (confirm('确定要清空所有的历史会话记录吗？')) {
                STATE.sessions = [];
                saveToLocalStorage();
                createNewSession();
            }
        }

        function clearCurrentChat() {
            const session = getCurrentSession();
            if (session && session.messages.length > 0) {
                session.messages = [];
                saveToLocalStorage();
                renderMessages();
            }
        }

        // Render Sidebar Sessions
        function renderSessions(filterText = '') {
            DOM.sessionList.innerHTML = '';
            
            const filtered = STATE.sessions.filter(s => 
                s.title.toLowerCase().includes(filterText.toLowerCase())
            );

            DOM.sessionCount.innerText = `${STATE.sessions.length} 会话`;

            if (filtered.length === 0) {
                DOM.sessionList.innerHTML = `
                    <div class="text-center py-8 text-xs text-funle-muted">
                        无历史记录
                    </div>
                `;
                return;
            }

            filtered.forEach(session => {
                const isActive = session.id === STATE.currentSessionId;
                const card = document.createElement('div');
                card.className = `p-3 rounded-2xl cursor-pointer neu-transition flex items-center justify-between group ${
                    isActive 
                    ? 'bg-funle-bg shadow-neu-in border-l-4 border-funle-dark' 
                    : 'bg-funle-bg/60 shadow-neu-out hover:shadow-neu-out-sm border border-white/40'
                }`;
                
                card.innerHTML = `
                    <div class="flex items-center space-x-3 min-w-0 flex-1">
                        <i data-lucide="message-square-text" class="w-4 h-4 ${isActive ? 'text-funle-dark' : 'text-funle-muted'} flex-shrink-0"></i>
                        <div class="min-w-0 flex-1">
                            <h4 class="text-xs font-semibold text-funle-text truncate">${escapeHtml(session.title)}</h4>
                            <span class="text-[10px] text-funle-muted">${session.timestamp}</span>
                        </div>
                    </div>
                    <button class="delete-session-btn opacity-0 group-hover:opacity-100 p-1 text-funle-muted hover:text-red-500 rounded-lg neu-transition">
                        <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                    </button>
                `;

                card.addEventListener('click', () => switchSession(session.id));
                const delBtn = card.querySelector('.delete-session-btn');
                delBtn.addEventListener('click', (e) => deleteSession(session.id, e));

                DOM.sessionList.appendChild(card);
            });

            lucide.createIcons();
        }

        // Image Handling
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                STATE.attachedImage = event.target.result;
                DOM.imagePreview.src = STATE.attachedImage;
                DOM.imageName.innerText = file.name;
                DOM.imagePreviewContainer.classList.remove('hidden');
                DOM.imagePreviewContainer.classList.add('flex');
            };
            reader.readAsDataURL(file);
        }

        function clearImageUpload() {
            STATE.attachedImage = null;
            DOM.fileInput.value = '';
            DOM.imagePreviewContainer.classList.add('hidden');
            DOM.imagePreviewContainer.classList.remove('flex');
        }

        // Message Rendering Logic
        function renderMessages() {
            const session = getCurrentSession();
            if (!session) return;

            DOM.messagesContainer.innerHTML = '';

            if (session.messages.length === 0) {
                DOM.messagesContainer.appendChild(DOM.emptyState);
                DOM.emptyState.classList.remove('hidden');
                return;
            } else {
                DOM.emptyState.classList.add('hidden');
            }

            session.messages.forEach((msg, index) => {
                const msgNode = createMessageNode(msg, index);
                DOM.messagesContainer.appendChild(msgNode);
            });

            scrollToBottom();
            lucide.createIcons();
        }

        function createMessageNode(msg, index) {
            const isUser = msg.sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} space-y-1.5 group`;

            let citationsHTML = '';
            if (msg.citations && msg.citations.length > 0) {
                citationsHTML = `
                    <details class="sources mt-3 pt-2 border-t border-white/50 text-xs">
                        <summary class="font-semibold text-funle-dark flex items-center select-none">
                            <i data-lucide="link" class="w-3 h-3 mr-1"></i>
                            <span>参考网页与检索来源 (${msg.citations.length})</span>
                            <i data-lucide="chevron-down" class="chevron w-3 h-3 ml-1"></i>
                        </summary>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
                            ${msg.citations.map(c => `
                                <a href="${c.url}" target="_blank" class="p-2 rounded-xl bg-white/50 shadow-neu-out-sm hover:shadow-neu-in flex items-center space-x-2 text-funle-text truncate neu-transition">
                                    <i data-lucide="external-link" class="w-3 h-3 text-funle-muted flex-shrink-0"></i>
                                    <span class="truncate font-medium text-[11px]">${escapeHtml(c.title)}</span>
                                </a>
                            `).join('')}
                        </div>
                    </details>
                `;
            }

            let imageHTML = '';
            if (msg.image) {
                imageHTML = `
                    <div class="mb-2 max-w-xs rounded-2xl overflow-hidden shadow-neu-out border-2 border-white/80">
                        <img src="${msg.image}" alt="上传图片" class="w-full h-auto object-cover max-h-56">
                    </div>
                `;
            }

            wrapper.innerHTML = `
                <div class="flex items-center space-x-2 text-[11px] text-funle-muted px-1">
                    <span>${isUser ? '你' : (msg.isSearch ? 'FUNLE 检索智能体' : 'FUNLE AI')}</span>
                    <span>•</span>
                    <span>${msg.time || ''}</span>
                </div>

                <div class="relative max-w-[88%] md:max-w-[75%] p-4 rounded-3xl neu-transition ${
                    isUser 
                    ? 'bg-funle text-funle-text font-medium shadow-neu-out rounded-tr-xs' 
                    : 'glass-panel text-funle-text shadow-glass-shadow rounded-tl-xs border border-white/80'
                }">
                    ${imageHTML}
                    <div class="text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(msg.text)}</div>
                    ${citationsHTML}
                </div>

                <!-- Message Action Buttons Bar -->
                <div class="opacity-0 group-hover:opacity-100 neu-transition flex items-center space-x-1 px-1 py-0.5">
                    <button onclick="copyMessage('${escapeJsString(msg.text)}')" title="复制内容" class="p-1 rounded-lg text-funle-muted hover:text-funle-dark neu-transition">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    </button>
                    ${isUser ? `
                        <button onclick="retryPrompt(${index})" title="重新发起" class="p-1 rounded-lg text-funle-muted hover:text-funle-dark neu-transition">
                            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                        </button>
                    ` : ''}
                    <button onclick="deleteMessage(${index})" title="删除此消息" class="p-1 rounded-lg text-funle-muted hover:text-red-500 neu-transition">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `;

            return wrapper;
        }

        // Send Message Handler
        function sendMessage() {
            const text = DOM.userInput.value.trim();
            if ((!text && !STATE.attachedImage) || STATE.isGenerating) return;

            const session = getCurrentSession();
            if (!session) return;

            // Auto title session from first prompt
            if (session.messages.length === 0 && text) {
                session.title = text.length > 18 ? text.substring(0, 18) + '...' : text;
                DOM.currentSessionTitle.innerText = session.title;
                renderSessions();
            }

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Construct user message object
            const userMsg = {
                sender: 'user',
                text: text,
                image: STATE.attachedImage,
                time: timeStr
            };

            session.messages.push(userMsg);
            
            // Clear input & preview
            DOM.userInput.value = '';
            DOM.userInput.style.height = 'auto';
            const currentImg = STATE.attachedImage;
            clearImageUpload();

            renderMessages();
            saveToLocalStorage();

            // 联网模式 = AI + 联网；对话模式 = 直连 AI；图片仍走本地模拟
            if (STATE.mode === 'search') {
                realAIResponse(text, timeStr, true);
            } else if (currentImg) {
                simulateAIResponse(text, currentImg, false);
            } else {
                realAIResponse(text, timeStr, false);
            }
        }

        // Build the skeleton (label + bubble) for an AI response
        function createAISkeleton(isSearchMode, timeStr) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex flex-col items-start space-y-1.5 group';

            const bubble = document.createElement('div');
            bubble.className = 'relative max-w-[88%] md:max-w-[75%] p-4 rounded-3xl glass-panel text-funle-text shadow-glass-shadow rounded-tl-xs border border-white/80 text-sm leading-relaxed';
            bubble.innerHTML = `
                <div class="flex items-center space-x-2 text-funle-dark py-1">
                    <span class="text-xs font-semibold">${isSearchMode ? '正在检索网络资源并汇总分析...' : 'FUNLE AI 思考中...'}</span>
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 rounded-full bg-funle-dark typing-dot"></div>
                        <div class="w-2 h-2 rounded-full bg-funle-dark typing-dot"></div>
                        <div class="w-2 h-2 rounded-full bg-funle-dark typing-dot"></div>
                    </div>
                </div>
            `;

            wrapper.innerHTML = `
                <div class="flex items-center space-x-2 text-[11px] text-funle-muted px-1">
                    <span>${isSearchMode ? 'FUNLE 检索智能体' : 'FUNLE AI'}</span>
                    <span>•</span>
                    <span>${timeStr}</span>
                </div>
            `;
            wrapper.appendChild(bubble);
            DOM.messagesContainer.appendChild(wrapper);
            scrollToBottom();
            return { wrapper, bubble };
        }

        // Progressively type text into a bubble
        function animateTyping(bubble, text, onDone) {
            let i = 0;
            const speed = 25; // ms per char
            const interval = setInterval(() => {
                i += 2;
                bubble.innerHTML = `<div class="whitespace-pre-wrap">${escapeHtml(text.substring(0, i))}</div>`;
                scrollToBottom();
                if (i >= text.length) {
                    clearInterval(interval);
                    if (onDone) onDone();
                }
            }, speed);
        }

        // Finalize an AI message into session history
        function finishAIResponse(session, msg) {
            session.messages.push(msg);
            saveToLocalStorage();
            STATE.isGenerating = false;
            DOM.sendBtn.disabled = false;
            renderMessages();
        }

        // Real AI response via backend (chat = direct AI, search = AI + web)
        async function realAIResponse(promptText, timeStr, isSearch) {
            STATE.isGenerating = true;
            DOM.sendBtn.disabled = true;

            const session = getCurrentSession();
            const { bubble } = createAISkeleton(isSearch, timeStr);

            try {
                const resp = await fetch('http://localhost:8080/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: isSearch ? 'search' : 'chat', message: promptText })
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error);

                animateTyping(bubble, data.text || '', () => {
                    finishAIResponse(session, {
                        sender: 'ai',
                        text: data.text || '',
                        isSearch: !!isSearch,
                        citations: data.citations || [],
                        time: timeStr
                    });
                });
            } catch (err) {
                bubble.innerHTML = `<div class="whitespace-pre-wrap text-red-500">请求失败：${escapeHtml(err.message)}</div>`;
                STATE.isGenerating = false;
                DOM.sendBtn.disabled = false;
            }
        }

        // Simulated AI Response (chat / image modes, local only)
        function simulateAIResponse(promptText, hasImage, isSearchMode) {
            STATE.isGenerating = true;
            DOM.sendBtn.disabled = true;

            const session = getCurrentSession();
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const { bubble } = createAISkeleton(isSearchMode, timeStr);

            let targetText = "";
            if (hasImage) {
                targetText = `我已经成功识别并解析了您上传的图像！\n\n- **色彩特征**：包含清晰的构图与良好的对比度。\n- **分析结果**：基于多模态模型，该图像内容与您的问题“${promptText || '图片分析'}”匹配良好，上下文已录入会话记录。`;
            } else {
                targetText = `感谢您的提问！关于“${promptText}”，解答如下：\n\n这是一个采用 FUNLE Blue (RGB: 129, 216, 207 / #81D8CF) 为主题色的轻量级 AI Agent 交互界面。在柔和的清爽浅色背景下，保持了极佳的对比度与优雅外观。`;
            }

            animateTyping(bubble, targetText, () => {
                finishAIResponse(session, {
                    sender: 'ai',
                    text: targetText,
                    isSearch: isSearchMode,
                    citations: [],
                    time: timeStr
                });
            });
        }

        // Actions: Copy, Retry, Delete Message
        function copyMessage(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        function deleteMessage(index) {
            const session = getCurrentSession();
            if (!session) return;
            session.messages.splice(index, 1);
            saveToLocalStorage();
            renderMessages();
        }

        function retryPrompt(index) {
            const session = getCurrentSession();
            if (!session || STATE.isGenerating) return;
            const userMsg = session.messages[index];
            if (userMsg && userMsg.sender === 'user') {
                DOM.userInput.value = userMsg.text;
                if (userMsg.image) {
                    STATE.attachedImage = userMsg.image;
                    DOM.imagePreview.src = STATE.attachedImage;
                    DOM.imagePreviewContainer.classList.remove('hidden');
                    DOM.imagePreviewContainer.classList.add('flex');
                }
                sendMessage();
            }
        }

        // Helper Utilities
        function scrollToBottom() {
            DOM.messagesContainer.scrollTop = DOM.messagesContainer.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeJsString(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
        }
    </script>
</body>
</html>
