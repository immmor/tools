<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casting Directory</title>
    <!-- 引入高级时装感衬线体与打字机等宽字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EAE9E5;
            --paper: #F9F9F7;
            --ink: #111111;
            --marker-red: #FF2A00;
            --proof-blue: #1A1AFF;
            --border-color: rgba(17, 17, 17, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            font-family: 'Space Mono', monospace;
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        /* 顶部信息 */
        header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--ink);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        /* 卡片容器区 */
        .stack-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .card-stack {
            position: relative;
            width: 100%;
            max-width: 340px;
            height: 70vh;
            max-height: 480px;
            min-height: 400px;
        }

        /* 利用伪元素模拟底层堆叠的实体相片 */
        .card-stack::before, .card-stack::after {
            content: '';
            position: absolute;
            left: 12px;
            right: -12px;
            top: 12px;
            bottom: -12px;
            background: var(--paper);
            border: 1px solid var(--ink);
            z-index: 1;
        }
        .card-stack::after {
            left: 24px; right: -24px; top: 24px; bottom: -24px;
            z-index: 0;
        }

        /* 顶层可拖拽相片 */
        .card {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--paper);
            border: 1px solid var(--ink);
            z-index: 2;
            cursor: grab;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: none; /* 防止移动端滚动干扰拖拽 */
        }
        .card:active {
            cursor: grabbing;
        }

        .card-img-wrapper {
            flex: 1;
            overflow: hidden;
            border-bottom: 1px solid var(--ink);
            position: relative;
            background-color: #ddd;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            pointer-events: none;
            filter: grayscale(100%) contrast(1.1); /* 黑白摄影质感 */
        }

        .card-info {
            padding: 1.2rem;
            background: var(--paper);
        }

        .card-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            line-height: 1;
            margin-bottom: 0.8rem;
            font-style: italic;
            font-weight: 600;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* 拖拽时浮现的印章 */
        .stamp {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 4rem;
            font-weight: 700;
            padding: 0.2rem 1rem;
            border: 4px solid;
            border-radius: 6px; 
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: multiply;
            transition: opacity 0.1s ease-out;
        }

        .stamp.book {
            color: var(--proof-blue);
            border-color: var(--proof-blue);
            transform: translate(-50%, -50%) rotate(-15deg);
        }

        .stamp.pass {
            color: var(--marker-red);
            border-color: var(--marker-red);
            transform: translate(-50%, -50%) rotate(15deg);
        }

        /* 底部操作区 */
        footer {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            border-top: 1px solid var(--ink);
            padding-top: 1rem;
        }

        .action-btn {
            background: none;
            border: 1px solid;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            padding: 0.8rem 1.5rem;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .action-btn.reject {
            color: var(--marker-red);
            border-color: var(--marker-red);
        }
        
        .action-btn.book {
            color: var(--proof-blue);
            border-color: var(--proof-blue);
        }

        .action-btn.reject:hover {
            background: var(--marker-red);
            color: var(--paper);
        }

        .action-btn.book:hover {
            background: var(--proof-blue);
            color: var(--paper);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div>AGENCY / MODEL SELECT</div>
        <div id="counter">01 / 05</div>
    </header>
    
    <div class="stack-container">
        <div class="card-stack" id="cardStack">
            <!-- 卡片由 JS 动态注入 -->
        </div>
    </div>
    
    <footer>
        <button class="action-btn reject" id="btnReject">PASS [←]</button>
        <button class="action-btn book" id="btnBook">[→] BOOK</button>
    </footer>
</div>

<script>
    const models = [
        { name: "Elara Vance", id: "094-A", height: "178CM", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" },
        { name: "Julian Hayes", id: "102-B", height: "185CM", img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=800&q=80" },
        { name: "Naomi Ricci", id: "088-C", height: "175CM", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80" },
        { name: "Liam O'Connor", id: "115-D", height: "190CM", img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=800&q=80" },
        { name: "Zoe Chen", id: "076-E", height: "172CM", img: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=800&q=80" }
    ];

    const stack = document.getElementById('cardStack');
    const counter = document.getElementById('counter');
    const btnReject = document.getElementById('btnReject');
    const btnBook = document.getElementById('btnBook');
    
    let currentIndex = 0;
    let isAnimating = false;

    function loadCard() {
        if (currentIndex >= models.length) {
            counter.textContent = `00 / 00`;
            stack.innerHTML = '<div style="display:flex; justify-content:center; align-items:center; height:100%; font-family:\'Cormorant Garamond\', serif; font-size:2.2rem; font-style:italic;">Selection Complete.</div>';
            return;
        }
        
        const model = models[currentIndex];
        counter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(models.length).padStart(2, '0')}`;
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="stamp book">BOOK</div>
            <div class="stamp pass">PASS</div>
            <div class="card-img-wrapper">
                <img src="${model.img}" alt="${model.name}" draggable="false">
            </div>
            <div class="card-info">
                <div class="card-name">${model.name}</div>
                <div class="card-meta">
                    <span>ID: ${model.id}</span>
                    <span>H: ${model.height}</span>
                </div>
            </div>
        `;
        stack.appendChild(card);
        attachDragEvents(card);
    }

    function attachDragEvents(card) {
        let startX = 0, startY = 0, x = 0, y = 0;
        let isDragging = false;
        
        const bookStamp = card.querySelector('.stamp.book');
        const passStamp = card.querySelector('.stamp.pass');

        card.addEventListener('pointerdown', (e) => {
            if (isAnimating) return;
            isDragging = true;
            startX = e.clientX - x;
            startY = e.clientY - y;
            card.style.transition = 'none';
            card.setPointerCapture(e.pointerId);
        });

        card.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            x = e.clientX - startX;
            y = e.clientY - startY;
            
            const rotation = x * 0.05; // 随位移旋转
            card.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
            
            // 根据滑动方向显示对应印章
            if (x > 0) {
                bookStamp.style.opacity = Math.min(x / 120, 1);
                passStamp.style.opacity = 0;
            } else {
                passStamp.style.opacity = Math.min(Math.abs(x) / 120, 1);
                bookStamp.style.opacity = 0;
            }
        });

        const releaseHandler = () => {
            if (!isDragging) return;
            isDragging = false;
            const threshold = 120; // 触发阈值
            
            if (x > threshold) {
                swipeOut(card, 1);
            } else if (x < -threshold) {
                swipeOut(card, -1);
            } else {
                // 未达阈值，弹性吸附回原位
                card.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
                card.style.transform = `translate(0px, 0px) rotate(0deg)`;
                x = 0; y = 0;
                bookStamp.style.opacity = 0;
                passStamp.style.opacity = 0;
            }
        };

        card.addEventListener('pointerup', releaseHandler);
        card.addEventListener('pointercancel', releaseHandler);
    }

    function swipeOut(card, direction) {
        if (isAnimating) return;
        isAnimating = true;
        
        // 飞出屏幕动画
        card.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 1, 1), opacity 0.4s ease-out';
        card.style.transform = `translate(${direction * window.innerWidth}px, 0px) rotate(${direction * 30}deg)`;
        card.style.opacity = '0';
        
        setTimeout(() => {
            card.remove();
            currentIndex++;
            loadCard();
            isAnimating = false;
        }, 400);
    }

    // 底部按钮交互
    btnReject.addEventListener('click', () => {
        const card = stack.querySelector('.card');
        if(card) swipeOut(card, -1);
    });

    btnBook.addEventListener('click', () => {
        const card = stack.querySelector('.card');
        if(card) swipeOut(card, 1);
    });

    // 初始化
    loadCard();
</script>
</body>
</html>
