<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>模特作品集 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap">
<style>
:root{
  --bg:#ffeef4; --ink:#1c1519; --mute:#7d6670; --pink:#ff3d85; --pink-soft:#ffb3d1;
  --glass:rgba(255,255,255,.45); --glass-line:rgba(255,255,255,.75); --shadow:0 20px 50px -20px rgba(255,61,133,.35);
  --blob1:#ff8fbd; --blob2:#ffd1e3; --blob3:#ff5c9c;
  --font:"Helvetica Neue",Helvetica,Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a0f15; --ink:#fff0f6; --mute:#c7a3b3; --pink:#ff5c9c; --pink-soft:#ff8fbd;
    --glass:rgba(40,22,31,.5); --glass-line:rgba(255,160,200,.22); --shadow:0 20px 50px -20px rgba(0,0,0,.7);
    --blob1:#c2185b; --blob2:#5a1735; --blob3:#e91e78; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a0f15; --ink:#fff0f6; --mute:#c7a3b3; --pink:#ff5c9c; --pink-soft:#ff8fbd;
  --glass:rgba(40,22,31,.5); --glass-line:rgba(255,160,200,.22); --shadow:0 20px 50px -20px rgba(0,0,0,.7);
  --blob1:#c2185b; --blob2:#5a1735; --blob3:#e91e78; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* 背景光斑：毛玻璃需要有东西可以“模糊” */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:var(--blob1);top:-12vmax;right:-10vmax}
.bg i:nth-child(2){width:38vmax;height:38vmax;background:var(--blob2);bottom:-10vmax;left:-8vmax}
.bg i:nth-child(3){width:22vmax;height:22vmax;background:var(--blob3);top:45%;left:40%;opacity:.4}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}

/* 导航 */
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0;gap:16px}
.logo{font-weight:900;font-size:18px;letter-spacing:-.02em}
.logo b{color:var(--pink)}
nav{display:flex;gap:4px;padding:5px;border-radius:999px}
nav a{padding:7px 16px;border-radius:999px;font-size:14px;transition:background .2s}
nav a:hover{background:var(--pink);color:#fff}

/* 首屏：12 栏网格 */
.hero{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;padding:clamp(28px,6vw,80px) 0 clamp(40px,7vw,96px);align-items:end}
.hero h1{grid-column:1/8;margin:0;font-size:clamp(56px,12vw,176px);line-height:.92;letter-spacing:-.05em;font-weight:900}
.hero h1 span{display:block;color:var(--pink)}
.hero .meta{grid-column:1/7;color:var(--mute);max-width:36ch;margin:0;font-size:15px}
.feature{grid-column:8/13;grid-row:1/3;border-radius:28px;padding:14px;position:relative}
.feature .portrait{aspect-ratio:4/5;border-radius:18px}
.feature .cap{display:flex;justify-content:space-between;align-items:baseline;padding:14px 6px 4px}
.feature .cap strong{font-size:20px;letter-spacing:-.01em}
.feature .cap small{color:var(--mute)}

/* 画像占位：SVG 渐变人像，可替换为真实照片 */
.portrait{width:100%;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--c1),var(--c2))}
.portrait svg{width:100%;height:100%;display:block}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* 名册 */
.sec-head{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end;border-top:2px solid var(--ink);padding-top:18px;margin-bottom:28px}
.sec-head h2{grid-column:1/7;margin:0;font-size:clamp(28px,4vw,48px);letter-spacing:-.03em;line-height:1.1}
.filters{grid-column:7/13;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.filters button{font:inherit;font-size:14px;color:var(--ink);padding:8px 18px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);cursor:pointer;transition:background .2s,color .2s}
.filters button:hover{border-color:var(--pink)}
.filters button[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{border-radius:24px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:block;width:100%;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.card:hover{transform:translateY(-6px)}
.card .portrait{aspect-ratio:3/4;border-radius:14px}
.card .info{display:flex;justify-content:space-between;align-items:baseline;padding:14px 6px 6px;gap:8px}
.card h3{margin:0;font-size:19px;letter-spacing:-.01em}
.card .tag{font-size:13px;color:var(--pink);font-weight:700}
.card .sub{padding:0 6px 8px;color:var(--mute);font-size:13px}
.card[hidden]{display:none}

/* 详情弹层 */
dialog{border:0;padding:0;background:transparent;max-width:min(880px,94vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(255,120,170,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal{display:grid;grid-template-columns:5fr 6fr;gap:24px;border-radius:30px;padding:16px;margin:auto}
.modal .portrait{aspect-ratio:3/4;border-radius:20px}
.modal .body{padding:14px 10px 10px 0;display:flex;flex-direction:column}
.modal h3{margin:0 0 4px;font-size:clamp(30px,4vw,44px);letter-spacing:-.03em;line-height:1.1}
.modal .cat{color:var(--pink);font-weight:700;margin-bottom:18px}
.modal p{color:var(--mute);margin:0 0 20px}
.specs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);margin:0 0 24px}
.specs div{padding:12px 0;border-bottom:1px solid var(--glass-line)}
.specs dt{font-size:12px;color:var(--mute)}
.specs dd{margin:0;font-weight:700;font-size:17px}
.btn{display:inline-block;background:var(--pink);color:#fff;padding:12px 26px;border-radius:999px;font-weight:700;border:0;font:inherit;font-weight:700;cursor:pointer;margin-top:auto;align-self:flex-start;transition:filter .2s}
.btn:hover{filter:brightness(1.08)}
.close{position:absolute;top:26px;right:26px;width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font-size:20px;cursor:pointer}
dialog .wrapm{position:relative}

/* 联系 */
.contact{margin:clamp(56px,8vw,110px) 0 40px;border-radius:32px;padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end}
.contact h2{grid-column:1/8;margin:0;font-size:clamp(34px,6vw,84px);letter-spacing:-.04em;line-height:1}
.contact div{grid-column:8/13}
.contact p{margin:0 0 18px;color:var(--mute)}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:0 0 32px;color:var(--mute);font-size:13px}

/* 平板与手机 */
@media (max-width:1024px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{grid-column:1/13}
  .hero .meta{grid-column:1/13}
  .feature{grid-column:1/13;grid-row:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
  .feature .portrait{aspect-ratio:4/3}
}
@media (max-width:640px){
  header{padding:16px 0}
  nav a{padding:6px 11px;font-size:13px}
  .hero{gap:18px}
  .feature{grid-template-columns:1fr;border-radius:22px}
  .feature .portrait{aspect-ratio:4/5}
  .sec-head h2,.filters,.contact h2,.contact div{grid-column:1/13}
  .filters{justify-content:flex-start}
  .grid{gap:12px}
  .card{border-radius:18px;padding:8px}
  .card .info{flex-direction:column;gap:0;padding-top:10px}
  .card h3{font-size:16px}
  .modal{grid-template-columns:1fr;border-radius:24px;max-height:90vh;overflow:auto}
  .modal .body{padding:0 8px 8px}
  .modal .portrait{aspect-ratio:4/3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <header>
    <a class="logo" href="#top">模特<b>作品集</b></a>
    <nav class="glass" aria-label="主导航">
      <a href="#roster">模特</a>
      <a href="#contact">合作</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1>2026<span>模特集</span></h1>
      <p class="meta">六位签约模特，覆盖时装、商业与街拍。点击任意卡片查看身高、城市与合作类型。</p>
      <article class="feature glass" id="feature" aria-label="本季主推"></article>
    </section>

    <section id="roster">
      <div class="sec-head">
        <h2>签约模特</h2>
        <div class="filters" role="group" aria-label="按类型筛选">
          <button aria-pressed="true" data-f="all">全部</button>
          <button aria-pressed="false" data-f="时装">时装</button>
          <button aria-pressed="false" data-f="商业">商业</button>
          <button aria-pressed="false" data-f="街拍">街拍</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="contact glass" id="contact">
      <h2>一起拍点<br>好看的东西</h2>
      <div>
        <p>品牌拍摄、秀场与广告项目，请告诉我们档期和预算范围，一个工作日内回复。</p>
        <a class="btn" href="mailto:hello@example.com" style="margin-top:0">发送合作邮件</a>
      </div>
    </section>
  </main>

  <footer><span>© 2026 模特作品集</span><span>图片位为占位，可替换为真实照片</span></footer>
</div>

<dialog id="dlg" aria-label="模特详情">
  <div class="wrapm">
    <div class="modal glass" id="modal"></div>
    <button class="close" id="close" aria-label="关闭">×</button>
  </div>
</dialog>

<script>
// 把 img 字段改成真实图片地址（需用 data: 图片或你自己的图床）即可替换占位图
var models=[
  {n:"林夕",en:"Lin Xi",c:"时装",city:"上海",h:"176 cm",s:"34 / 24 / 35",e:"4 年",a:"秀场与杂志大片，擅长冷调、克制的镜头表达。",c1:"#ff9cc4",c2:"#ff3d85",img:""},
  {n:"苏芮",en:"Su Rui",c:"商业",city:"北京",h:"170 cm",s:"33 / 24 / 35",e:"3 年",a:"美妆与生活方式广告，表情自然，上镜亲和。",c1:"#ffd1e3",c2:"#ff7aae",img:""},
  {n:"陈薇",en:"Chen Wei",c:"街拍",city:"成都",h:"172 cm",s:"34 / 25 / 36",e:"2 年",a:"街头与潮流品牌，动作感强，适合动态拍摄。",c1:"#ffb3d1",c2:"#e0307a",img:""},
  {n:"许安",en:"Xu An",c:"时装",city:"深圳",h:"178 cm",s:"33 / 23 / 34",e:"5 年",a:"高级定制与品牌 Lookbook，线条利落，镜头感成熟。",c1:"#ff8fbd",c2:"#c2185b",img:""},
  {n:"周一诺",en:"Zhou Yinuo",c:"商业",city:"杭州",h:"168 cm",s:"32 / 24 / 34",e:"3 年",a:"电商与服饰品牌拍摄，效率高，风格百搭。",c1:"#ffe0ed",c2:"#ff6aa3",img:""},
  {n:"江澜",en:"Jiang Lan",c:"街拍",city:"广州",h:"174 cm",s:"34 / 24 / 35",e:"2 年",a:"潮流与运动品牌，擅长自然光与外景。",c1:"#ffa6cb",c2:"#ff4f90",img:""}
];
function art(m){
  var inner=m.img?'<img src="'+m.img+'" alt="'+m.n+'">':
  '<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="150" cy="140" r="52" fill="rgba(255,255,255,.55)"/><path d="M40 400c0-90 50-130 110-130s110 40 110 130z" fill="rgba(255,255,255,.4)"/><circle cx="235" cy="70" r="26" fill="rgba(255,255,255,.25)"/></svg>';
  return '<div class="portrait" style="--c1:'+m.c1+';--c2:'+m.c2+'" role="img" aria-label="'+m.n+' 的照片占位">'+inner+'</div>';
}
var grid=document.getElementById('grid');
models.forEach(function(m,i){
  var b=document.createElement('button');
  b.className='card glass';b.dataset.c=m.c;b.dataset.i=i;
  b.innerHTML=art(m)+'<div class="info"><h3>'+m.n+'</h3><span class="tag">'+m.c+'</span></div><div class="sub">'+m.city+'・'+m.h+'</div>';
  grid.appendChild(b);
});
var f=models[0];
document.getElementById('feature').innerHTML=art(f)+'<div class="cap"><div><strong>'+f.n+'</strong><br><small>'+f.en+'</small></div><small>本季主推・'+f.c+'</small></div>';

// 筛选
document.querySelectorAll('.filters button').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filters button').forEach(function(x){x.setAttribute('aria-pressed',x===btn)});
    var k=btn.dataset.f;
    grid.querySelectorAll('.card').forEach(function(c){c.hidden=!(k==='all'||c.dataset.c===k)});
  });
});

// 详情
var dlg=document.getElementById('dlg'),modal=document.getElementById('modal');
function open(i){
  var m=models[i];
  modal.innerHTML=art(m)+'<div class="body"><h3>'+m.n+'</h3><div class="cat">'+m.en+'・'+m.c+'</div><p>'+m.a+'</p>'+
  '<dl class="specs"><div><dt>城市</dt><dd>'+m.city+'</dd></div><div><dt>身高</dt><dd>'+m.h+'</dd></div><div><dt>三围</dt><dd>'+m.s+'</dd></div><div><dt>从业</dt><dd>'+m.e+'</dd></div></dl>'+
  '<a class="btn" href="mailto:hello@example.com?subject=预约 '+m.n+'">预约档期</a></div>';
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
}
grid.addEventListener('click',function(e){var c=e.target.closest('.card');if(c)open(+c.dataset.i)});
document.getElementById('feature').addEventListener('click',function(){open(0)});
document.getElementById('close').addEventListener('click',function(){dlg.close()});
dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
</script>
</body>
</html>
