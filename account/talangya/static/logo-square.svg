<svg width="200" height="200" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- 黑圆角方块底 -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="#000000"/>

  <!-- 白色遮阳棚（小卖铺标志），加两道黑线当条纹 -->
