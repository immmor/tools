<svg width="216" height="48" viewBox="0 0 216 48" xmlns="http://www.w3.org/2000/svg">
  <!-- 图标：黑圆角方块 + 白色 @，呼应“账号” -->
  <rect x="4" y="4" width="40" height="40" rx="9" fill="#000000"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">@</text>

  <!-- 文字标：账号小卖铺 -->
  <text x="56" y="32" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="700" fill="#000000" letter-spacing="1">账号小卖铺</text>

  <!-- 标题下的黑色短下划线，呼应 tab 选中态 -->
  <rect x="56" y="38" width="120" height="3" rx="1.5" fill="#000000"/>
</svg>
