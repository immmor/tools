<svg width="200" height="200" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- 黑圆角方块底（保持原样） -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="#000000"/>

  <!-- 白色遮阳棚：拆成三个四边形面板，依次明暗波动（无旋转）。面板间留黑即原条纹 -->
  <path d="M12 12 L20 12 L20 17 L15 17 Z" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" begin="0s" repeatCount="indefinite"/>
  </path>
  <path d="M20 12 L28 12 L28 17 L20 17 Z" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
  </path>
  <path d="M28 12 L36 12 L33 17 L28 17 Z" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </path>

  <!-- @ 招牌（账号，保持原样） -->
  <text x="24" y="37" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">@</text>
</svg>
