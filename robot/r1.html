<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBOTICS // SIMULATION ENVIRONMENT</title>
    <!-- 引入瑞士风格常用字体 Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* --------------------------------------------------
         * 1. 瑞士极简风格设计变量 (Swiss Design System)
         * -------------------------------------------------- */
        :root {
            --bg-color: #e5e5e5;
            --accent-color: #ff3b30; /* 瑞士红 */
            --text-main: #111111;
            --text-muted: #666666;
            
            /* 毛玻璃核心参数 */
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
            --blur-radius: 16px;
            
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --grid-unit: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: calc(var(--grid-unit) * 3);
            /* 网格背景，体现瑞士网格系统（Grid System） */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --------------------------------------------------
         * 2. 通用毛玻璃类 (Glassmorphism Utility)
         * -------------------------------------------------- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-radius));
            -webkit-backdrop-filter: blur(var(--blur-radius));
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--glass-shadow);
        }

        /* --------------------------------------------------
         * 3. 布局 (Layout System)
         * -------------------------------------------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: calc(var(--grid-unit) * 3);
            padding-bottom: calc(var(--grid-unit) * 2);
            border-bottom: 2px solid var(--text-main);
        }

        .header-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }

        .header-title p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .system-status {
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
        }

        /* 主网格容器：自适应大屏与移动端 */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 320px; /* 大屏：左侧画布，右侧控制台 */
            gap: calc(var(--grid-unit) * 3);
            flex: 1;
        }

        /* --------------------------------------------------
         * 4. 模拟视图 (Viewport Area)
         * -------------------------------------------------- */
        .viewport-section {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 400px;
        }

        .viewport-header {
            padding: 12px 16px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 350px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0 0 12px 12px;
        }

        /* --------------------------------------------------
         * 5. 控制面板 (Control Panel)
         * -------------------------------------------------- */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: calc(var(--grid-unit) * 2);
            padding: calc(var(--grid-unit) * 2.5);
        }

        .panel-group {
            display: flex;
            flex-direction: column;
            gap: calc(var(--grid-unit));
        }

        .panel-label {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* 数据指标网格 */
        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: calc(var(--grid-unit));
        }

        .data-card {
            background: rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .data-card .value {
            font-size: 1.2rem;
            font-weight: 600;
            font-family: monospace;
        }

        .data-card .unit {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* 控制按钮 */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .swiss-btn {
            background-color: var(--text-main);
            color: #fff;
            border: none;
            padding: 12px;
            font-family: var(--font-family);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .swiss-btn:hover {
            background-color: #333;
            transform: translateY(-1px);
        }

        .swiss-btn.accent {
            background-color: var(--accent-color);
        }

        .swiss-btn.accent:hover {
            background-color: #e03228;
        }

        .swiss-btn:active {
            transform: translateY(0);
        }

        /* --------------------------------------------------
         * 6. 响应式布局媒体查询 (Responsive Design)
         * -------------------------------------------------- */
        /* 平板及移动端适配 (< 868px) */
        @media (max-width: 868px) {
            body {
                padding: var(--grid-unit);
            }

            .main-container {
                grid-template-columns: 1fr; /* 切换为单列布局 */
            }

            header {
                margin-bottom: calc(var(--grid-unit) * 2);
            }

            .viewport-section {
                min-height: 300px;
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部 Header：瑞士风格大排版 -->
    <header>
        <div class="header-title">
            <p>Environment v1.0</p>
            <h1>Robot Sim</h1>
        </div>
        <div class="system-status">
            <span class="status-dot"></span>
            <span>SYSTEM ACTIVE</span>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="main-container">
        
        <!-- 左侧/上方：机器人模拟画布 -->
        <section class="glass-panel viewport-section">
            <div class="viewport-header">
                <span>// 2D Viewport</span>
                <span id="fps-counter">60 FPS</span>
            </div>
            <div class="canvas-container" id="canvas-wrapper">
                <canvas id="simCanvas"></canvas>
            </div>
        </section>

        <!-- 右侧/下方：控制与遥测面板 -->
        <aside class="glass-panel controls-section">
            
            <!-- 传感器与遥测数据 -->
            <div class="panel-group">
                <div class="panel-label">Telemetry Data</div>
                <div class="telemetry-grid">
                    <div class="data-card">
                        <div class="unit">POS X</div>
                        <div class="value" id="val-x">0.00</div>
                    </div>
                    <div class="data-card">
                        <div class="unit">POS Y</div>
                        <div class="value" id="val-y">0.00</div>
                    </div>
                    <div class="data-card">
                        <div class="unit">HEADING</div>
                        <div class="value" id="val-deg">0°</div>
                    </div>
                    <div class="data-card">
                        <div class="unit">SPEED</div>
                        <div class="value" id="val-speed">0.00</div>
                    </div>
                </div>
            </div>

            <!-- 操作指令 -->
            <div class="panel-group">
                <div class="panel-label">Controls</div>
                <div class="btn-group">
                    <button class="swiss-btn" id="btn-reset">Reset</button>
                    <button class="swiss-btn accent" id="btn-toggle">Pause</button>
                </div>
            </div>

            <div class="panel-group" style="margin-top: auto;">
                <div class="panel-label">Instructions</div>
                <p style="font-size: 0.75rem; color: var(--text-muted); line-height: 1.4;">
                    点击画布区域可设置机器人的目标位置。机器人将通过 PID 路径跟踪自动向目标移动。
                </p>
            </div>

        </aside>
    </main>

    <!-- --------------------------------------------------
     * 7. 机器人模拟逻辑 (Simulation Engine)
     * -------------------------------------------------- -->
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');

        // UI 元素引用
        const uiX = document.getElementById('val-x');
        const uiY = document.getElementById('val-y');
        const uiDeg = document.getElementById('val-deg');
        const uiSpeed = document.getElementById('val-speed');
        const btnReset = document.getElementById('btn-reset');
        const btnToggle = document.getElementById('btn-toggle');

        // 状态变量
        let isRunning = true;

        // 机器人对象属性
        const robot = {
            x: 100,
            y: 100,
            angle: 0, // 弧度
            radius: 16,
            speed: 0,
            maxSpeed: 3.5,
            targetX: 100,
            targetY: 100
        };

        // 自适应 Canvas 大小
        function resizeCanvas() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 设目标点 (点击事件)
        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            robot.targetX = e.clientX - rect.left;
            robot.targetY = e.clientY - rect.top;
        });

        // 重置机器人位置
        function resetSimulation() {
            robot.x = canvas.width / 2;
            robot.y = canvas.height / 2;
            robot.targetX = robot.x;
            robot.targetY = robot.y;
            robot.angle = 0;
            robot.speed = 0;
        }

        btnReset.addEventListener('click', resetSimulation);
        btnToggle.addEventListener('click', () => {
            isRunning = !isRunning;
            btnToggle.textContent = isRunning ? 'Pause' : 'Start';
        });

        // 物理更新逻辑
        function update() {
            if (!isRunning) return;

            const dx = robot.targetX - robot.x;
            const dy = robot.targetY - robot.y;
            const distance = Math.hypot(dx, dy);

            if (distance > 2) {
                // 计算转向角
                const targetAngle = Math.atan2(dy, dx);
                
                // 平滑旋转 (Angle Interpolation)
                let diff = targetAngle - robot.angle;
                // 规范化角度到 [-PI, PI]
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                
                robot.angle += diff * 0.1;

                // 靠近目标时减速
                robot.speed = Math.min(robot.maxSpeed, distance * 0.05);
                
                // 沿着当前朝向移动
                robot.x += Math.cos(robot.angle) * robot.speed;
                robot.y += Math.sin(robot.angle) * robot.speed;
            } else {
                robot.speed = 0;
            }

            // 更新 UI 仪表盘
            uiX.textContent = robot.x.toFixed(1);
            uiY.textContent = robot.y.toFixed(1);
            uiDeg.textContent = `${Math.round((robot.angle * 180 / Math.PI) % 360)}°`;
            uiSpeed.textContent = robot.speed.toFixed(2);
        }

        // 渲染函数
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 绘制网格背景线（内部 Canvas 网格）
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 2. 绘制目标点 (瑞士红十字标志)
            if (Math.hypot(robot.targetX - robot.x, robot.targetY - robot.y) > 2) {
                ctx.save();
                ctx.strokeStyle = '#ff3b30';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                // 绘制目标点准星
                const crossSize = 6;
                ctx.moveTo(robot.targetX - crossSize, robot.targetY);
                ctx.lineTo(robot.targetX + crossSize, robot.targetY);
                ctx.moveTo(robot.targetX, robot.targetY - crossSize);
                ctx.lineTo(robot.targetX, robot.targetY + crossSize);
                ctx.stroke();

                // 绘制连接虚线
                ctx.strokeStyle = 'rgba(255, 59, 48, 0.3)';
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(robot.x, robot.y);
                ctx.lineTo(robot.targetX, robot.targetY);
                ctx.stroke();
                ctx.restore();
            }

            // 3. 绘制机器人主体 (极简双色线条风)
            ctx.save();
            ctx.translate(robot.x, robot.y);
            ctx.rotate(robot.angle);

            // 外壳圆圈
            ctx.beginPath();
            ctx.arc(0, 0, robot.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#111111';
            ctx.stroke();

            // 朝向指示线
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(robot.radius + 6, 0);
            ctx.strokeStyle = '#ff3b30';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        // 主循环
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // 启动模拟
        resetSimulation();
        loop();
    </script>
</body>
</html>
