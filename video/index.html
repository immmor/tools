<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreezeEdit — 极简小清新视频剪辑</title>
    <!-- Google Fonts: 引入优雅无衬线字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==================== 1. 设计系统 & 柔和莫兰迪配色 ==================== */
        :root {
            --bg-main: #f8faf9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --primary: #7ea38b;         /* 柔和鼠尾草绿 */
            --primary-hover: #678872;
            --primary-light: #e8f0ec;
            --accent: #e09f87;          /* 温暖珊瑚粉 */
            --text-main: #2d3748;
            --text-muted: #8c9ba5;
            --border-color: #e2e8f0;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-soft: 0 10px 30px rgba(126, 163, 139, 0.08);
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ==================== 2. 顶部导航栏 ==================== */
        header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--primary-hover);
        }

        .logo i {
            font-size: 1.3rem;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            border: none;
            outline: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-main);
        }

        .btn-ghost:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(126, 163, 139, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* ==================== 3. 主界面布局 (Grid) ==================== */
        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: 1fr auto;
            gap: 20px;
            padding: 20px;
            flex: 1;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* 统一卡片样式 */
        .panel-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(8px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title i {
            color: var(--primary);
        }

        /* ==================== 4. 左侧：素材与工具选项卡 ==================== */
        .sidebar {
            grid-column: 1;
            grid-row: 1 / 3;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            background: var(--primary-light);
            padding: 4px;
            border-radius: var(--radius-md);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content.active {
            display: flex;
        }

        /* 素材拖拽区 */
        .upload-box {
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-md);
            padding: 24px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: var(--transition);
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .upload-box i {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .upload-box p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* 预置素材列表 */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .media-item {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            aspect-ratio: 16/9;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-item:hover {
            transform: scale(1.03);
            border-color: var(--primary);
        }

        .media-item .badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 文字/滤镜样式控件 */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .input-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            background: white;
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .range-slider {
            width: 100%;
            accent-color: var(--primary);
        }

        /* Filter Presets */
        .filter-presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .filter-btn {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: white;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        /* ==================== 5. 右侧上方：视频预览与播放器 ==================== */
        .main-stage {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #1e293b; /* 优雅的深色背景以突出视频 */
            border-radius: var(--radius-lg);
            overflow: hidden;
            min-height: 380px;
        }

        .video-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            max-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            border-radius: var(--radius-sm);
            object-fit: contain;
        }

        /* 滤镜实时渲染 css 类 */
        .filter-warm { filter: sepia(0.3) saturate(1.4) hue-rotate(-10deg); }
        .filter-cool { filter: saturate(1.2) hue-rotate(15deg) contrast(0.95); }
        .filter-fresh { filter: contrast(1.1) brightness(1.1) saturate(1.2); }
        .filter-bw { filter: grayscale(1); }

        /* 水印/动态文字叠加 */
        .text-overlay {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            pointer-events: none;
            padding: 8px 16px;
            text-align: center;
            transition: var(--transition);
        }

        /* 简易播放控制悬浮条 */
        .player-controls {
            position: absolute;
            bottom: 16px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }

        .player-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .player-btn:hover {
            color: var(--primary-light);
            transform: scale(1.15);
        }

        .time-display {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ==================== 6. 右侧下方：时间轴与轨迹 ==================== */
        .timeline-panel {
            grid-column: 2;
            grid-row: 2;
        }

        .timeline-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .tool-group {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        /* 滚动时间轴窗口 */
        .timeline-tracks-wrapper {
            position: relative;
            background: #f1f5f9;
            border-radius: var(--radius-md);
            padding: 12px;
            overflow-x: auto;
            margin-top: 8px;
        }

        /* 时间轴播放头指针 */
        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent);
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .playhead::before {
            content: '';
            position: absolute;
            top: 0;
            left: -4px;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 6px solid var(--accent);
        }

        /* 轨道 */
        .track {
            height: 42px;
            background: rgba(255,255,255,0.7);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 8px;
            border: 1px dashed #cbd5e1;
        }

        .track:last-child {
            margin-bottom: 0;
        }

        .track-label {
            position: sticky;
            left: 0;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            width: 50px;
            z-index: 5;
            background: rgba(255,255,255,0.9);
            padding: 2px 4px;
            border-radius: 4px;
        }

        /* 轨道上的剪辑块 Clip */
        .clip-block {
            position: absolute;
            left: 60px;
            height: 32px;
            background: var(--primary-light);
            border: 1px solid var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-hover);
            cursor: move;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            white-space: nowrap;
        }

        .clip-block.audio {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #b45309;
            left: 60px;
        }

        .clip-block.text {
            background: #fce7f3;
            border-color: #ec4899;
            color: #be185d;
            left: 100px;
        }

        /* ==================== 7. 响应式布局优化（大屏 vs 手机小屏） ==================== */
        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                padding: 12px;
                gap: 12px;
            }

            .sidebar {
                grid-column: 1;
                grid-row: 3; /* 小屏上把素材面板放最下方或折叠 */
            }

            .main-stage {
                grid-column: 1;
                grid-row: 1;
                min-height: 240px;
            }

            .timeline-panel {
                grid-column: 1;
                grid-row: 2;
            }

            .filter-presets {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* 模态框 Toast / Export */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--text-main);
            color: white;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>BreezeEdit</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-ghost" id="undoBtn" title="撤销"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="btn btn-primary" id="exportBtn">
                <i class="fa-solid fa-arrow-up-from-bracket"></i> 导出视频
            </button>
        </div>
    </header>

    <!-- 应用主区域 -->
    <main class="app-container">

        <!-- 左侧：工具与素材库 -->
        <aside class="panel-card sidebar">
            <!-- 选项卡切换 -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="media">素材库</button>
                <button class="tab-btn" data-tab="text">字幕文字</button>
                <button class="tab-btn" data-tab="filters">调色滤镜</button>
                <button class="tab-btn" data-tab="audio">背景音乐</button>
            </div>

            <!-- Tab 1: 素材上传与预置 -->
            <div class="tab-content active" id="tab-media">
                <div class="upload-box" id="uploadTrigger">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>点击或拖拽视频/图片素材至此</p>
                    <input type="file" id="fileInput" accept="video/*,image/*" hidden>
                </div>

                <div class="panel-title" style="margin-top: 10px;">
                    <i class="fa-regular fa-folder-open"></i> 示例清新素材
                </div>
                <div class="media-grid">
                    <div class="media-item" onclick="loadDemoVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', '森林风光')">
                        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=300&q=80" alt="素材">
                        <span class="badge">森林</span>
                    </div>
                    <div class="media-item" onclick="loadDemoVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', '海岸日落')">
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=300&q=80" alt="素材">
                        <span class="badge">大海</span>
                    </div>
                </div>
            </div>

            <!-- Tab 2: 文字 & 水印 -->
            <div class="tab-content" id="tab-text">
                <div class="form-group">
                    <label>字幕内容</label>
                    <input type="text" id="textInput" class="input-control" placeholder="输入视频文字..." value="Breeze Moment 🌱">
                </div>
                <div class="form-group">
                    <label>字号大小</label>
                    <input type="range" id="textSizeSlider" class="range-slider" min="16" max="48" value="24">
                </div>
                <div class="form-group">
                    <label>文字颜色</label>
                    <input type="color" id="textColorPicker" value="#ffffff" style="width: 100%; height: 36px; border: none; cursor: pointer; border-radius: 6px;">
                </div>
                <button class="btn btn-primary" onclick="applyText()" style="width:100%; justify-content:center; margin-top:8px;">
                    <i class="fa-solid fa-plus"></i> 添加字幕到画面
                </button>
            </div>

            <!-- Tab 3: 滤镜调色 -->
            <div class="tab-content" id="tab-filters">
                <div class="panel-title"><i class="fa-solid fa-sliders"></i> 预置清新滤镜</div>
                <div class="filter-presets">
                    <button class="filter-btn active" onclick="applyFilter('none', this)">原图</button>
                    <button class="filter-btn" onclick="applyFilter('fresh', this)">清新</button>
                    <button class="filter-btn" onclick="applyFilter('warm', this)">暖阳</button>
                    <button class="filter-btn" onclick="applyFilter('cool', this)">冷翠</button>
                    <button class="filter-btn" onclick="applyFilter('bw', this)">黑白</button>
                </div>

                <div class="form-group" style="margin-top: 10px;">
                    <label>亮度</label>
                    <input type="range" id="brightnessSlider" class="range-slider" min="50" max="150" value="100">
                </div>
                <div class="form-group">
                    <label>对比度</label>
                    <input type="range" id="contrastSlider" class="range-slider" min="50" max="150" value="100">
                </div>
            </div>

            <!-- Tab 4: 音频音乐 -->
            <div class="tab-content" id="tab-audio">
                <div class="panel-title"><i class="fa-solid fa-music"></i> 清新配乐推荐</div>
                <div class="form-group">
                    <button class="btn btn-ghost" style="justify-content: flex-start; border: 1px solid var(--border-color);" onclick="addAudioTrack('轻松木吉他.mp3')">
                        <i class="fa-solid fa-circle-play" style="color:var(--primary)"></i> 轻松木吉他 - BGM
                    </button>
                    <button class="btn btn-ghost" style="justify-content: flex-start; border: 1px solid var(--border-color);" onclick="addAudioTrack('夏日风铃.mp3')">
                        <i class="fa-solid fa-circle-play" style="color:var(--primary)"></i> 夏日风铃 - 环境音
                    </button>
                </div>
            </div>
        </aside>

        <!-- 右侧上方：视频预览画布 -->
        <section class="main-stage">
            <div class="video-viewport">
                <!-- 预设默认视频地址 -->
                <video id="mainVideo" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" playsinline></video>
                <!-- 叠加字幕 -->
                <div class="text-overlay" id="videoOverlay">Breeze Moment 🌱</div>
            </div>

            <!-- 浮动控制条 -->
            <div class="player-controls">
                <button class="player-btn" id="playBtn" title="播放/暂停"><i class="fa-solid fa-play"></i></button>
                <div class="time-display"><span id="currentTime">00:00</span> / <span id="duration">00:00</span></div>
                <button class="player-btn" id="muteBtn" title="静音"><i class="fa-solid fa-volume-high"></i></button>
            </div>
        </section>

        <!-- 右侧下方：多轨道时间轴 -->
        <section class="panel-card timeline-panel">
            <div class="timeline-toolbar">
                <div class="panel-title">
                    <i class="fa-solid fa-timeline"></i> 多轨时间轴
                </div>
                <div class="tool-group">
                    <button class="icon-btn" onclick="showToast('✂️ 已剪切当前指针位置视频')" title="裁剪"><i class="fa-solid fa-scissors"></i></button>
                    <button class="icon-btn" onclick="showToast('🗑️ 已删除选中片段')" title="删除片段"><i class="fa-regular fa-trash-can"></i></button>
                    <button class="icon-btn" onclick="zoomTimeline()" title="放大视口"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                </div>
            </div>

            <div class="timeline-tracks-wrapper" id="timelineWrapper">
                <div class="playhead" id="playhead"></div>

                <!-- 轨道 1: 视频轨 -->
                <div class="track">
                    <span class="track-label">视频</span>
                    <div class="clip-block" id="videoClip" style="width: 220px;">
                        <i class="fa-solid fa-film" style="margin-right:6px;"></i> <span id="clipName">森林风光.mp4</span>
                    </div>
                </div>

                <!-- 轨道 2: 音频轨 -->
                <div class="track">
                    <span class="track-label">音频</span>
                    <div class="clip-block audio" id="audioClip" style="width: 180px; display: none;">
                        <i class="fa-solid fa-music" style="margin-right:6px;"></i> <span id="audioClipName">背景音乐.mp3</span>
                    </div>
                </div>

                <!-- 轨道 3: 文字轨 -->
                <div class="track">
                    <span class="track-label">文字</span>
                    <div class="clip-block text" id="textClip" style="width: 140px;">
                        <i class="fa-solid fa-font" style="margin-right:6px;"></i> 字幕层
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 全局提示框 Toast -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: #4ade80;"></i>
        <span id="toastMsg">提示信息</span>
    </div>

    <!-- ==================== 8. JavaScript 功能核心交互 ==================== -->
    <script>
        // DOM 节点获取
        const video = document.getElementById('mainVideo');
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playhead = document.getElementById('playhead');
        const timelineWrapper = document.getElementById('timelineWrapper');
        const overlay = document.getElementById('videoOverlay');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        /* ------------------ Tab 选项卡切换 ------------------ */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                btn.classList.add('active');
                document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
            });
        });

        /* ------------------ 播放器控制 ------------------ */
        playBtn.addEventListener('click', togglePlay);

        function togglePlay() {
            if (video.paused) {
                video.play();
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                video.pause();
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            muteBtn.innerHTML = video.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
        });

        // 更新进度时间与时间轴游标
        video.addEventListener('timeupdate', () => {
            const current = video.currentTime;
            const total = video.duration || 1;
            
            currentTimeEl.textContent = formatTime(current);
            durationEl.textContent = formatTime(total);

            // 计算时间轴 Playhead 位置（假设轨道宽度对应视频比例）
            const progress = (current / total);
            const maxLeft = timelineWrapper.clientWidth - 40;
            playhead.style.left = (60 + progress * (maxLeft - 60)) + 'px';
        });

        video.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(video.duration);
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        /* ------------------ 素材加载与上传 ------------------ */
        const uploadTrigger = document.getElementById('uploadTrigger');
        const fileInput = document.getElementById('fileInput');

        uploadTrigger.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                video.src = url;
                document.getElementById('clipName').textContent = file.name;
                showToast(`已加载自定义素材: ${file.name}`);
                video.play();
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            }
        });

        function loadDemoVideo(url, name) {
            video.src = url;
            document.getElementById('clipName').textContent = name + '.mp4';
            showToast(`已切换素材: ${name}`);
            video.play();
            playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        }

        /* ------------------ 字幕实时调整 ------------------ */
        const textInput = document.getElementById('textInput');
        const textSizeSlider = document.getElementById('textSizeSlider');
        const textColorPicker = document.getElementById('textColorPicker');

        textInput.addEventListener('input', (e) => {
            overlay.textContent = e.target.value;
        });

        textSizeSlider.addEventListener('input', (e) => {
            overlay.style.fontSize = `${e.target.value}px`;
        });

        textColorPicker.addEventListener('input', (e) => {
            overlay.style.color = e.target.value;
        });

        function applyText() {
            showToast('✨ 字幕层已添加至视频中心');
        }

        /* ------------------ 滤镜与色彩调谐 ------------------ */
        function applyFilter(filterClass, btn) {
            // 清理滤镜类名
            video.className = '';
            if (filterClass !== 'none') {
                video.classList.add(`filter-${filterClass}`);
            }

            // 更新按钮状态
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            showToast(`已应用滤镜效果`);
        }

        // 亮度/对比度控制
        const brightnessSlider = document.getElementById('brightnessSlider');
        const contrastSlider = document.getElementById('contrastSlider');

        function updateCustomFilters() {
            const b = brightnessSlider.value;
            const c = contrastSlider.value;
            video.style.filter = `brightness(${b}%) contrast(${c}%)`;
        }

        brightnessSlider.addEventListener('input', updateCustomFilters);
        contrastSlider.addEventListener('input', updateCustomFilters);

        /* ------------------ 音频轨道控制 ------------------ */
        function addAudioTrack(name) {
            const audioClip = document.getElementById('audioClip');
            const audioClipName = document.getElementById('audioClipName');
            audioClip.style.display = 'flex';
            audioClipName.textContent = name;
            showToast(`🎵 背景音乐 [${name}] 已成功添加到音频轨`);
        }

        /* ------------------ 导出与提示系统 ------------------ */
        document.getElementById('exportBtn').addEventListener('click', () => {
            showToast('🚀 正在合成渲染视频，请稍候...');
            setTimeout(() => {
                showToast('🎉 视频渲染完成！已准备好下载');
            }, 2500);
        });

        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function zoomTimeline() {
            showToast('🔍 已放大时间轴视口');
        }
    </script>
</body>
</html>
