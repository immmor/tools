<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agnes 视频生成 · 文生视频</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      background: #0b0d10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
    }
    .card {
      background: #151a22;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
      padding: 2rem;
      max-width: 900px;
      width: 100%;
      color: #e9edf5;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0;
      margin-bottom: 2rem;
      color: #ffffff;
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
    }
    h1 span {
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
    }
    .form-grid {
      display: grid;
      gap: 1.4rem;
      margin-bottom: 2rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }
    label {
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #8b9bb5;
    }
    textarea, input, select {
      background: #0e1219;
      border: 1px solid #2d3748;
      border-radius: 1rem;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      color: #f1f5f9;
      transition: all 0.15s;
      outline: none;
      width: 100%;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.5;
    }
    textarea:focus, input:focus, select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
    }
    .api-key-input {
      display: flex;
      gap: 0.5rem;
    }
    .api-key-input input {
      flex: 1;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 2rem;
      padding: 0.85rem 1.8rem;
      font-weight: 500;
      font-size: 0.95rem;
      color: #f1f5f9;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .btn-primary {
      background: #3b82f6;
      border: 1px solid #2563eb;
      color: white;
      font-weight: 600;
      box-shadow: 0 8px 16px -4px rgba(59,130,246,0.3);
    }
    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      background: #1e293b;
      border-color: #334155;
      color: #6b7a93;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #2d3748;
    }
    .btn-secondary:hover {
      background: #2d3748;
    }
    .actions {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .status-panel {
      background: #0e1219;
      border-radius: 1.5rem;
      padding: 1.5rem;
      border: 1px solid #1f2937;
      margin-top: 1rem;
    }
    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .status-header h2 {
      font-size: 1.2rem;
      font-weight: 500;
      margin: 0;
      color: #94a3b8;
      letter-spacing: 0.01em;
    }
    .video-id {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #1a1f2b;
      padding: 0.35rem 1rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      color: #94a3b8;
      border: 1px solid #2d3748;
      word-break: break-all;
    }
    .video-id strong {
      color: #b9c7dd;
    }
    .progress-bar-container {
      background: #1f2937;
      height: 8px;
      border-radius: 8px;
      overflow: hidden;
      margin: 1rem 0 0.75rem;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #a855f7);
      border-radius: 8px;
      transition: width 0.4s ease;
    }
    .status-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #9aa9c0;
      margin-bottom: 0.4rem;
    }
    .result-video {
      margin-top: 1.5rem;
      background: #000;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid #2d3748;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result-video video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .result-video .placeholder {
      color: #4b5a73;
      font-size: 0.95rem;
      text-align: center;
      padding: 1rem;
    }
    .error-message {
      background: #4c1d2b;
      border-left: 4px solid #ef4444;
      padding: 1rem 1.2rem;
      border-radius: 0.75rem;
      color: #fca5a5;
      font-size: 0.9rem;
      margin-top: 1rem;
      word-break: break-word;
    }
    .hidden {
      display: none !important;
    }
    .note {
      font-size: 0.8rem;
      color: #6b7a93;
      margin-top: 0.5rem;
    }
    .loader {
      display: inline-block;
      width: 1.2rem;
      height: 1.2rem;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (max-width: 640px) {
      .card { padding: 1.5rem; }
      .field-row { grid-template-columns: 1fr; }
      .actions { justify-content: stretch; flex-direction: column; }
      .btn { width: 100%; }
      .api-key-input { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1><span>Agnes</span> 视频生成</h1>

  <!-- 全局 API 密钥 -->
  <div class="field" style="margin-bottom: 1.8rem;">
    <label>API 密钥 (Authorization Bearer)</label>
    <div class="api-key-input">
      <input type="password" id="apiKeyInput" placeholder="输入 AGNES_API_KEY" value="">
      <button class="btn btn-secondary" id="toggleApiKeyBtn" title="显示/隐藏密钥">👁️</button>
    </div>
    <div class="note">密钥仅保存在浏览器内存中，不会发送到第三方</div>
  </div>

  <!-- 表单区域 -->
  <div class="form-grid">
    <div class="field">
      <label>提示词 (prompt)</label>
      <textarea id="promptInput">雨后的未来城市街道，霓虹灯倒映在地面，一辆银色跑车缓慢驶过，电影级运镜，自然环境声</textarea>
    </div>

    <div class="field-row">
      <div class="field">
        <label>时长 (seconds)</label>
        <select id="secondsSelect">
          <option value="4">4 秒</option>
          <option value="5" selected>5 秒</option>
          <option value="6">6 秒</option>
          <option value="8">8 秒</option>
        </select>
      </div>
      <div class="field">
        <label>分辨率 (size)</label>
        <select id="sizeSelect">
          <option value="720P" selected>720P</option>
          <option value="1080P">1080P</option>
          <option value="480P">480P</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>宽高比 (aspect_ratio)</label>
        <select id="aspectRatioSelect">
          <option value="16:9" selected>16:9</option>
          <option value="9:16">9:16</option>
          <option value="1:1">1:1</option>
        </select>
      </div>
      <div class="field">
        <label>模式 (mode)</label>
        <select id="modeSelect">
          <option value="text" selected>text (文生视频)</option>
          <option value="image">image (图生视频)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="actions">
    <button class="btn btn-secondary" id="resetBtn">重置</button>
    <button class="btn btn-primary" id="generateBtn">
      <span>✨ 生成视频</span>
    </button>
  </div>

  <!-- 状态面板 -->
  <div class="status-panel" id="statusPanel">
    <div class="status-header">
      <h2>任务状态</h2>
      <div class="video-id" id="videoIdDisplay">
        <strong>ID:</strong> <span id="videoIdSpan">—</span>
      </div>
    </div>

    <div class="status-line">
      <span>进度</span>
      <span id="progressText">0%</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>

    <div class="status-line" style="margin-top: 0.8rem;">
      <span>状态</span>
      <span id="statusText">等待生成</span>
    </div>

    <!-- 错误展示 -->
    <div id="errorContainer" class="error-message hidden"></div>

    <!-- 视频结果 -->
    <div class="result-video" id="resultVideoContainer">
      <div class="placeholder" id="videoPlaceholder">生成的视频将在此展示</div>
      <video id="resultVideo" class="hidden" controls autoplay loop></video>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- 配置 ----------
    // 本地 CORS 代理：先运行 node video.js，再把 USE_PROXY 设为 true。
    // 浏览器受 CORS 限制无法直接访问 api.agnes-ai.cn，由本机代理转发即可绕开。
    const USE_PROXY = true;
    const PROXY_BASE = 'http://127.0.0.1:8787';   // video.js 监听地址
    const BACKEND_BASE = 'https://api.agnes-ai.cn';
    const BASE_URL = USE_PROXY ? PROXY_BASE : BACKEND_BASE;
    const VIDEO_CREATE_ENDPOINT = '/videos';
    const CREATE_URL = `${BASE_URL}/videos`;
    const QUERY_BASE = `${BASE_URL}/agnesapi`;

    // DOM 元素
    const apiKeyInput = document.getElementById('apiKeyInput');
    const toggleApiKeyBtn = document.getElementById('toggleApiKeyBtn');
    const promptInput = document.getElementById('promptInput');
    const secondsSelect = document.getElementById('secondsSelect');
    const sizeSelect = document.getElementById('sizeSelect');
    const aspectRatioSelect = document.getElementById('aspectRatioSelect');
    const modeSelect = document.getElementById('modeSelect');
    const resetBtn = document.getElementById('resetBtn');
    const generateBtn = document.getElementById('generateBtn');
    const videoIdSpan = document.getElementById('videoIdSpan');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const errorContainer = document.getElementById('errorContainer');
    const resultVideo = document.getElementById('resultVideo');
    const videoPlaceholder = document.getElementById('videoPlaceholder');

    // 状态变量
    let currentVideoId = null;
    let pollInterval = null;
    let isGenerating = false;   // 防止重复点击

    // ---------- 辅助函数 ----------
    function getApiKey() {
      return apiKeyInput.value.trim();
    }

    function showError(message) {
      errorContainer.textContent = message;
      errorContainer.classList.remove('hidden');
    }

    function clearError() {
      errorContainer.textContent = '';
      errorContainer.classList.add('hidden');
    }

    function setProgress(percent, statusLabel) {
      const rounded = Math.min(100, Math.max(0, percent));
      progressFill.style.width = rounded + '%';
      progressText.textContent = rounded + '%';
      if (statusLabel) statusText.textContent = statusLabel;
    }

    function resetVideoDisplay() {
      resultVideo.classList.add('hidden');
      resultVideo.removeAttribute('src');
      resultVideo.load();
      videoPlaceholder.classList.remove('hidden');
    }

    function displayVideo(url) {
      if (!url) {
        resetVideoDisplay();
        return;
      }
      videoPlaceholder.classList.add('hidden');
      resultVideo.src = url;
      resultVideo.classList.remove('hidden');
      resultVideo.load();
    }

    function stopPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }

    function setGeneratingState(active) {
      isGenerating = active;
      generateBtn.disabled = active;
      if (active) {
        generateBtn.innerHTML = '<span class="loader"></span> 生成中…';
      } else {
        generateBtn.innerHTML = '<span>✨ 生成视频</span>';
      }
    }

    // 重置所有状态（不包括API密钥）
    function resetAll() {
      stopPolling();
      setGeneratingState(false);
      currentVideoId = null;
      videoIdSpan.textContent = '—';
      setProgress(0, '等待生成');
      clearError();
      resetVideoDisplay();
      // 不清空表单，但可以恢复默认值？此处保留用户输入不变；也可以把prompt重置为默认
      // 但点击重置按钮时应该恢复默认提示词
      promptInput.value = '雨后的未来城市街道，霓虹灯倒映在地面，一辆银色跑车缓慢驶过，电影级运镜，自然环境声';
      secondsSelect.value = '5';
      sizeSelect.value = '720P';
      aspectRatioSelect.value = '16:9';
      modeSelect.value = 'text';
    }

    // ---------- 查询任务状态 ----------
    async function fetchVideoStatus(videoId, modelName = 'agnes-video-2.5-flash') {
      const apiKey = getApiKey();
      if (!apiKey) {
        throw new Error('API 密钥不能为空');
      }

      const url = `${QUERY_BASE}?video_id=${encodeURIComponent(videoId)}&model_name=${encodeURIComponent(modelName)}`;
      const response = await fetch(url, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${apiKey}`
        }
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(`查询失败 (${response.status}): ${text || response.statusText}`);
      }
      return await response.json();
    }

    // 轮询逻辑
    function startPolling(videoId) {
      stopPolling();
      // 立即查询一次
      (async () => {
        try {
          const data = await fetchVideoStatus(videoId);
          handleStatusResponse(data, videoId);
        } catch (err) {
          showError('轮询查询出错: ' + err.message);
          setGeneratingState(false);
          stopPolling();
        }
      })();

      pollInterval = setInterval(async () => {
        if (!currentVideoId) return;
        try {
          const data = await fetchVideoStatus(currentVideoId);
          handleStatusResponse(data, currentVideoId);
        } catch (err) {
          showError('轮询查询出错: ' + err.message);
          setGeneratingState(false);
          stopPolling();
        }
      }, 3000); // 3秒间隔
    }

    // 处理状态响应
    function handleStatusResponse(data, videoId) {
      // 如果任务ID变了，可能是新的任务，但一般不会
      if (data.id && data.id !== videoId) {
        // 忽略
      }

      // 更新进度
      const progress = typeof data.progress === 'number' ? data.progress : 0;
      const status = data.status || 'unknown';

      let statusLabel = status;
      if (status === 'pending') statusLabel = '排队中';
      else if (status === 'processing' || status === 'in_progress') statusLabel = '生成中';
      else if (status === 'completed') statusLabel = '已完成';
      else if (status === 'failed') statusLabel = '失败';

      setProgress(progress, statusLabel);

      // 错误处理
      if (data.error) {
        showError(typeof data.error === 'string' ? data.error : JSON.stringify(data.error));
      } else {
        clearError();
      }

      // 如果已完成
      if (status === 'completed' && data.url) {
        stopPolling();
        setGeneratingState(false);
        displayVideo(data.url);
        setProgress(100, '已完成');
        // 保持 videoId 显示
      } else if (status === 'failed') {
        stopPolling();
        setGeneratingState(false);
        showError('视频生成失败，请检查提示词或稍后重试。');
      } else {
        // 继续轮询，但确保 generating 状态为 true
        if (!isGenerating) {
          setGeneratingState(true);
        }
      }

      // 如果返回的id不同于当前，更新当前 videoId (适应某些接口可能变化)
      if (data.id && data.id !== currentVideoId) {
        currentVideoId = data.id;
        videoIdSpan.textContent = currentVideoId;
      }
    }

    // ---------- 生成视频 (POST) ----------
    async function generateVideo() {
      clearError();
      const apiKey = getApiKey();
      if (!apiKey) {
        showError('请输入 API 密钥');
        apiKeyInput.focus();
        return;
      }

      const prompt = promptInput.value.trim();
      if (!prompt) {
        showError('请输入提示词');
        promptInput.focus();
        return;
      }

      // 防止重复点击
      if (isGenerating) return;
      setGeneratingState(true);
      stopPolling();
      resetVideoDisplay();
      currentVideoId = null;
      videoIdSpan.textContent = '—';
      setProgress(0, '创建任务…');

      // 准备请求体
      const requestBody = {
        model: "agnes-video-2.5-flash",
        prompt: prompt,
        seconds: secondsSelect.value,
        mode: modeSelect.value,
        size: sizeSelect.value,
        aspect_ratio: aspectRatioSelect.value
      };

      try {
        const response = await fetch(CREATE_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`创建任务失败 (${response.status}): ${errorText || response.statusText}`);
        }

        const data = await response.json();
        // 假设返回包含 id 或 task_id
        const videoId = data.id || data.task_id || data.video_id;
        if (!videoId) {
          throw new Error('响应中未包含视频任务 ID: ' + JSON.stringify(data));
        }

        currentVideoId = videoId;
        videoIdSpan.textContent = videoId;
        setProgress(5, '任务已创建，等待处理');

        // 开始轮询
        startPolling(videoId);

      } catch (err) {
        showError(err.message);
        setGeneratingState(false);
        setProgress(0, '创建失败');
      }
    }

    // ---------- 事件监听 ----------
    generateBtn.addEventListener('click', generateVideo);

    resetBtn.addEventListener('click', () => {
      stopPolling();
      setGeneratingState(false);
      resetAll();
    });

    // 切换 API 密钥可见性
    toggleApiKeyBtn.addEventListener('click', () => {
      const type = apiKeyInput.type === 'password' ? 'text' : 'password';
      apiKeyInput.type = type;
      toggleApiKeyBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // 初始化清空错误、重置视频区域
    window.addEventListener('load', () => {
      resetVideoDisplay();
      setProgress(0, '等待生成');
      // 尝试自动填充 API 密钥？不自动填充，保留空
    });

    // 若视频ID已存在但页面刷新，不做处理。

    // 暴露给控制台便于调试 (可选)
  })();
</script>
</body>
</html>
