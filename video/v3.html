<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreezeEdit - 简约小清新视频剪辑</title>
  <style>
    :root {
      --bg-primary: #f7f9f7;
      --bg-card: #ffffff;
      --accent-color: #88b04b;
      --accent-light: #eaf3e6;
      --accent-hover: #78a03c;
      --text-main: #2c3e35;
      --text-muted: #7f9387;
      --border-color: #e2ebe4;
      --shadow-soft: 0 10px 30px rgba(136, 176, 75, 0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部导航 */
    header {
      height: 60px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--accent-light);
      border-color: var(--accent-color);
    }

    .btn-primary {
      background: var(--accent-color);
      color: white;
      border: none;
      box-shadow: 0 4px 12px rgba(136, 176, 75, 0.3);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 主布局区域 */
    .app-container {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      grid-template-rows: 1fr 240px;
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 60px);
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    /* 侧边面板 */
    .sidebar {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-item {
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-item.active {
      background: var(--accent-light);
      color: var(--accent-color);
      font-weight: 600;
    }

    .panel { display: flex; flex-direction: column; gap: 12px; }
    .panel.hidden { display: none; }

    .panel-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .asset-upload {
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      background: #fafcf9;
    }

    .asset-upload:hover {
      border-color: var(--accent-color);
      background: var(--accent-light);
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .media-card {
      aspect-ratio: 16/9;
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: 0.15s;
    }
    .media-card:hover { border-color: var(--accent-color); transform: translateY(-2px); }

    .media-card video, .media-card img, .media-card canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-tip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.55));
      color: #fff;
      font-size: 0.66rem;
      padding: 8px 6px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 中央播放器与预览 */
    .preview-section {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      gap: 12px;
    }

    .canvas-wrapper {
      width: 100%;
      height: 100%;
      max-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #111815;
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: aspect-ratio 0.3s ease;
    }

    .canvas-wrapper.ratio-16-9 { aspect-ratio: 16 / 9; width: auto; }
    .canvas-wrapper.ratio-9-16 { aspect-ratio: 9 / 16; height: 100%; width: auto; }
    .canvas-wrapper.ratio-1-1 { aspect-ratio: 1 / 1; height: 100%; width: auto; }

    #previewCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .preview-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-color);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: 0.2s;
    }
    .play-btn:hover { background: var(--accent-hover); }

    .ratio-selector {
      display: flex;
      gap: 6px;
      background: var(--bg-primary);
      padding: 4px;
      border-radius: 20px;
    }

    .ratio-btn {
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.75rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .ratio-btn.active {
      background: white;
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* 底部时间线 */
    .timeline-section {
      grid-column: 1 / -1;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .timeline-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      gap: 12px;
      flex-wrap: wrap;
    }

    .timeline-toolbar .tools { display: flex; gap: 12px; align-items: center; }
    .timeline-toolbar .tools span { cursor: pointer; user-select: none; }
    .timeline-toolbar .tools span:hover { color: var(--accent-color); }
    .zoom-group { display: flex; gap: 4px; align-items: center; }
    .zoom-btn {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-color);
      background: var(--bg-card); cursor: pointer; color: var(--text-main); font-size: 0.85rem;
    }
    .zoom-btn:hover { background: var(--accent-light); border-color: var(--accent-color); }

    .timeline-tracks {
      flex: 1;
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      position: relative;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .ruler {
      height: 22px;
      position: relative;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      flex: none;
      cursor: pointer;
    }
    .tick {
      position: absolute;
      top: 0;
      height: 100%;
      border-left: 1px solid var(--border-color);
      font-size: 10px;
      color: var(--text-muted);
      padding-left: 3px;
    }
    .tick span { display: inline-block; transform: translateY(2px); }

    .track {
      display: flex;
      align-items: stretch;
      height: 48px;
      flex: none;
    }
    .track-label {
      width: 46px;
      flex: none;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border-color);
      writing-mode: horizontal-tb;
      text-align: center;
      line-height: 1.1;
    }
    .lane {
      position: relative;
      flex: 1;
      background: rgba(255,255,255,0.7);
      border-radius: 6px;
      border: 1px dashed var(--border-color);
    }

    .track-clip {
      position: absolute;
      top: 8px;
      height: 32px;
      background: var(--accent-light);
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 0.72rem;
      color: var(--text-main);
      cursor: grab;
      overflow: hidden;
      white-space: nowrap;
      user-select: none;
    }
    .track-clip:active { cursor: grabbing; }
    .track-clip.selected {
      outline: 2px solid var(--accent-color);
      box-shadow: 0 0 0 2px rgba(136,176,75,0.3);
      z-index: 6;
    }
    .track-clip.audio-clip { background: #fef3e2; border-color: #f3d3a0; }
    .track-clip.text-clip { background: #eaf0fb; border-color: #9bb8ef; }

    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      background: #e8554e;
      z-index: 8;
      pointer-events: none;
    }
    .playhead::before {
      content: '';
      position: absolute;
      top: 0;
      left: -5px;
      width: 12px;
      height: 12px;
      background: #e8554e;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    /* 表单控件 */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.78rem; color: var(--text-muted); }
    .field input[type="text"], .field textarea, .field select {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
      color: var(--text-main);
      background: #fafcf9;
      resize: vertical;
    }
    .field input[type="range"] { width: 100%; accent-color: var(--accent-color); }
    .field input[type="color"] {
      width: 100%; height: 34px; border: 1px solid var(--border-color);
      border-radius: 8px; background: #fafcf9; cursor: pointer;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    .row > * { flex: 1; }
    .seg { display: flex; gap: 6px; }
    .seg label {
      flex: 1; text-align: center; font-size: 0.78rem; padding: 6px 0;
      border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; color: var(--text-muted);
    }
    .seg input { display: none; }
    .seg input:checked + span { color: var(--accent-color); font-weight: 600; }
    .seg label:has(input:checked) { border-color: var(--accent-color); background: var(--accent-light); }

    .small-btn {
      padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-card); color: var(--text-main); font-size: 0.8rem; cursor: pointer;
    }
    .small-btn:hover { background: var(--accent-light); border-color: var(--accent-color); }
    .small-btn.primary { background: var(--accent-color); color: #fff; border: none; }

    .hint { font-size: 0.72rem; color: var(--text-muted); line-height: 1.5; }
    .clip-list { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; }
    .clip-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 0.75rem; padding: 6px 8px; background: var(--bg-primary); border-radius: 6px;
    }
    .clip-item .del { color: #e8554e; cursor: pointer; }
    .filter-row { display: flex; align-items: center; gap: 10px; }
    .filter-row label { width: 64px; font-size: 0.76rem; color: var(--text-muted); }
    .filter-row span.val { width: 42px; text-align: right; font-size: 0.72rem; color: var(--text-main); }

    #hiddenMedia { position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none; }

    /* 📱 移动端小屏响应式适配 */
    @media (max-width: 768px) {
      body { overflow: auto; }
      .app-container {
        display: flex; flex-direction: column; height: auto; padding: 10px; gap: 12px;
      }
      .sidebar { order: 3; max-height: 300px; }
      .preview-section { order: 1; padding: 10px; }
      .timeline-section { order: 2; min-height: 200px; }
      .canvas-wrapper { max-height: 260px; }
    }
  </style>
</head>
<body>

  <!-- 顶部导航栏 -->
  <header>
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <span>BreezeEdit</span>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="triggerImport()">导入</button>
      <button class="btn" onclick="loadDemo(true)">示例</button>
      <button class="btn btn-primary" id="exportBtn" onclick="exportVideo()">导出视频</button>
    </div>
  </header>

  <!-- 主体工作区 -->
  <div class="app-container">

    <!-- 侧边素材与效果面板 -->
    <aside class="sidebar">
      <div class="nav-tabs">
        <div class="tab-item active" data-tab="media">媒体</div>
        <div class="tab-item" data-tab="text">文字</div>
        <div class="tab-item" data-tab="filter">滤镜</div>
        <div class="tab-item" data-tab="music">音乐</div>
      </div>

      <!-- 媒体面板 -->
      <div class="panel" id="panel-media">
        <div class="asset-upload" onclick="triggerImport()">
          <p style="font-size: 1.5rem; margin-bottom: 4px;">+</p>
          <p style="font-size: 0.85rem; color: var(--text-muted);">点击上传视频 / 图片 / 音频</p>
          <input type="file" id="fileInput" accept="video/*,image/*,audio/*" multiple style="display:none;" onchange="handleFileSelect(event)">
        </div>
        <div class="panel-title">素材库（点击添加到轨道）</div>
        <div class="media-grid" id="mediaGrid"></div>
        <p class="hint">提示：导入的音视频会按当前播放头位置加入时间线；可拖动片段调整位置。</p>
      </div>

      <!-- 文字面板 -->
      <div class="panel hidden" id="panel-text">
        <div class="panel-title">添加文字 / 字幕</div>
        <div class="field">
          <label>文字内容</label>
          <input type="text" id="textInput" value="BreezeEdit ✿ 小清新" placeholder="输入文字">
        </div>
        <div class="field">
          <label>字号：<span id="textSizeVal">48</span> px</label>
          <input type="range" id="textSize" min="16" max="120" value="48" oninput="document.getElementById('textSizeVal').textContent=this.value">
        </div>
        <div class="field">
          <label>颜色</label>
          <input type="color" id="textColor" value="#ffffff">
        </div>
        <div class="field">
          <label>位置</label>
          <div class="seg">
            <label><input type="radio" name="textPos" value="top"><span>上</span></label>
            <label><input type="radio" name="textPos" value="center" checked><span>中</span></label>
            <label><input type="radio" name="textPos" value="bottom"><span>下</span></label>
          </div>
        </div>
        <button class="small-btn primary" onclick="addTextClip()">+ 添加到时间线</button>
        <div class="panel-title" style="margin-top:6px;">已添加文字</div>
        <div class="clip-list" id="textList"></div>
      </div>

      <!-- 滤镜面板 -->
      <div class="panel hidden" id="panel-filter">
        <div class="panel-title">画面滤镜</div>
        <div class="filter-row"><label>亮度</label><input type="range" min="40" max="160" value="100" data-f="brightness" oninput="onFilter(this)"><span class="val" id="v-brightness">100%</span></div>
        <div class="filter-row"><label>对比度</label><input type="range" min="40" max="160" value="100" data-f="contrast" oninput="onFilter(this)"><span class="val" id="v-contrast">100%</span></div>
        <div class="filter-row"><label>饱和度</label><input type="range" min="0" max="200" value="100" data-f="saturate" oninput="onFilter(this)"><span class="val" id="v-saturate">100%</span></div>
        <div class="filter-row"><label>模糊</label><input type="range" min="0" max="12" value="0" data-f="blur" oninput="onFilter(this)"><span class="val" id="v-blur">0px</span></div>
        <div class="filter-row"><label>色相</label><input type="range" min="0" max="360" value="0" data-f="hue" oninput="onFilter(this)"><span class="val" id="v-hue">0°</span></div>
        <div class="filter-row"><label>怀旧</label><input type="range" min="0" max="100" value="0" data-f="sepia" oninput="onFilter(this)"><span class="val" id="v-sepia">0%</span></div>
        <div class="filter-row"><label>黑白</label><input type="range" min="0" max="100" value="0" data-f="grayscale" oninput="onFilter(this)"><span class="val" id="v-grayscale">0%</span></div>
        <button class="small-btn" onclick="resetFilters()">重置滤镜</button>
        <p class="hint">滤镜实时作用于预览，并会一起渲染进导出的视频。</p>
      </div>

      <!-- 音乐面板 -->
      <div class="panel hidden" id="panel-music">
        <div class="asset-upload" onclick="triggerAudioImport()" style="padding:14px 10px;">
          <p style="font-size: 1.2rem; margin-bottom: 2px;">🎵 +</p>
          <p style="font-size: 0.8rem; color: var(--text-muted);">导入本地音频</p>
          <input type="file" id="audioInput" accept="audio/*" multiple style="display:none;" onchange="handleFileSelect(event)">
        </div>
        <div class="panel-title">音乐库（点击添加到音轨）</div>
        <div class="clip-list" id="musicList"></div>
      </div>
    </aside>

    <!-- 中央视频预览区 -->
    <main class="preview-section">
      <div class="canvas-wrapper ratio-16-9" id="canvasWrapper">
        <canvas id="previewCanvas" width="1280" height="720"></canvas>
      </div>

      <div class="preview-controls">
        <span id="currentTime" style="font-size: 0.8rem; color: var(--text-muted); min-width: 42px;">00:00</span>
        <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
        <div class="ratio-selector">
          <button class="ratio-btn active" onclick="setRatio('16-9', this)">16:9</button>
          <button class="ratio-btn" onclick="setRatio('9-16', this)">9:16</button>
          <button class="ratio-btn" onclick="setRatio('1-1', this)">1:1</button>
        </div>
      </div>
    </main>

    <!-- 底部多轨道时间线 -->
    <section class="timeline-section">
      <div class="timeline-toolbar">
        <div>剪辑轨道 · 总时长 <span id="totalTime">00:00</span></div>
        <div class="tools">
          <span onclick="splitClip()">✂️ 剪切</span>
          <span onclick="deleteClip()">🗑️ 删除</span>
          <span id="zoomLabel">缩放</span>
          <div class="zoom-group">
            <button class="zoom-btn" onclick="zoom(-1)">−</button>
            <button class="zoom-btn" onclick="zoom(1)">＋</button>
          </div>
        </div>
      </div>

      <div class="timeline-tracks" id="timelineTracks">
        <div class="playhead" id="playhead"></div>
        <!-- 时间线动态生成 -->
      </div>
    </section>

  </div>

  <div id="hiddenMedia"></div>

  <script>
    /* ============ 全局状态 ============ */
    const state = {
      assets: [],
      tracks: { video: [], audio: [] },
      selectedClipId: null,
      ratio: '16-9',
      filters: { brightness: 100, contrast: 100, saturate: 100, blur: 0, hue: 0, sepia: 0, grayscale: 0 },
      isPlaying: false,
      currentTime: 0,
      duration: 10,
      pxPerSecond: 60,
      recording: false,
      recorder: null,
    };

    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const playBtn = document.getElementById('playBtn');
    const currentTimeText = document.getElementById('currentTime');
    const totalTimeText = document.getElementById('totalTime');
    const exportBtn = document.getElementById('exportBtn');

    const uid = () => Math.random().toString(36).slice(2, 9);
    const fmt = (s) => {
      s = Math.max(0, s);
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    };
    const ratioDims = (r) => r === '9-16' ? { w: 720, h: 1280 } : r === '1-1' ? { w: 1080, h: 1080 } : { w: 1280, h: 720 };
    const getAsset = (id) => state.assets.find(a => a.id === id);
    const getSelectedClip = () => {
      for (const t of ['video', 'audio']) {
        const c = state.tracks[t].find(c => c.id === state.selectedClipId);
        if (c) return c;
      }
      return null;
    };

    /* ============ 音频引擎 ============ */
    let audioCtx = null, masterGain = null;
    function ensureAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 1;
      masterGain.connect(audioCtx.destination);
    }
    function getAssetAudioNode(asset) {
      if (asset.audioNode) return asset.audioNode;
      const el = asset.audioEl || asset.el;
      if (!el) return null;
      const node = audioCtx.createMediaElementSource(el);
      const gain = audioCtx.createGain();
      node.connect(gain);
      gain.connect(masterGain);
      asset.audioNode = node;
      asset.audioGain = gain;
      return node;
    }

    /* ============ 示例素材生成 ============ */
    const genSea = (c, w, h, t) => {
      const g = c.createLinearGradient(0, 0, 0, h);
      const shift = (Math.sin(t * 0.5) + 1) / 2;
      g.addColorStop(0, `hsl(${200 + shift * 20}, 60%, ${72 - shift * 10}%)`);
      g.addColorStop(1, `hsl(${190}, 70%, ${45 + shift * 10}%)`);
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      c.fillStyle = 'rgba(255,240,200,0.9)';
      c.beginPath(); c.arc(w * 0.5, h * 0.35 + Math.sin(t) * 10, w * 0.08, 0, 7); c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = 3;
      for (let i = 0; i < 5; i++) {
        c.beginPath();
        for (let x = 0; x <= w; x += 10) {
          const y = h * 0.6 + i * 30 + Math.sin(x * 0.02 + t * 2 + i) * 12;
          if (x === 0) c.moveTo(x, y); else c.lineTo(x, y);
        }
        c.stroke();
      }
    };
    const genDusk = (c, w, h, t) => {
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#ff9a6c'); g.addColorStop(0.5, '#ff6f91'); g.addColorStop(1, '#845ec2');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      c.fillStyle = 'rgba(255,230,150,0.9)';
      c.beginPath(); c.arc(w * 0.5, h * 0.5 + Math.cos(t * 0.6) * 40, w * 0.1, 0, 7); c.fill();
      for (let i = 0; i < 30; i++) {
        const x = (i * 97.3 + t * 30) % w;
        const y = (i * 53.7 + t * 15) % h;
        c.fillStyle = 'rgba(255,255,255,0.5)';
        c.beginPath(); c.arc(x, y, 2 + (i % 3), 0, 7); c.fill();
      }
    };
    function makeSampleImage() {
      const c = document.createElement('canvas'); c.width = 1280; c.height = 720;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 1280, 720);
      g.addColorStop(0, '#a8e063'); g.addColorStop(1, '#56ab2f');
      x.fillStyle = g; x.fillRect(0, 0, 1280, 720);
      x.fillStyle = 'rgba(255,255,255,0.92)';
      x.font = 'bold 80px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('🌿 示例图片', 640, 360);
      return c.toDataURL('image/png');
    }
    function makeMusicWav() {
      const sr = 44100, sec = 12, len = sr * sec;
      const buf = new ArrayBuffer(44 + len * 2);
      const v = new DataView(buf);
      const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      ws(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      ws(36, 'data'); v.setUint32(40, len * 2, true);
      const scale = [261.63, 293.66, 329.63, 392.0, 440.0];
      const noteLen = 1.5;
      let off = 44;
      for (let i = 0; i < len; i++) {
        const t = i / sr;
        const n = scale[Math.floor(t / noteLen) % scale.length];
        const env = Math.pow(Math.max(0, 1 - (t % noteLen) / noteLen) * 0.6, 1);
        let s = Math.sin(2 * Math.PI * n * t) * env + 0.4 * Math.sin(2 * Math.PI * n * 2 * t) * env * 0.5;
        s *= 0.22;
        v.setInt16(off, Math.max(-1, Math.min(1, s)) * 32767, true); off += 2;
      }
      return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    }

    /* ============ 初始化 / 示例 ============ */
    function loadDemo(confirmFirst) {
      if (confirmFirst && state.assets.length && !confirm('重新加载示例将清空当前项目，确定吗？')) return;
      // 清空
      state.assets = []; state.tracks.video = []; state.tracks.audio = [];
      state.selectedClipId = null; state.currentTime = 0; state.filters = { brightness: 100, contrast: 100, saturate: 100, blur: 0, hue: 0, sepia: 0, grayscale: 0 };
      document.getElementById('hiddenMedia').innerHTML = '';

      // 示例视频（生成器）
      const v1 = { id: uid(), kind: 'generator', name: '晨海', draw: genSea };
      const v2 = { id: uid(), kind: 'generator', name: '黄昏', draw: genDusk };
      // 示例图片
      const imgUrl = makeSampleImage();
      const img = new Image(); img.src = imgUrl;
      const imgAsset = { id: uid(), kind: 'image', name: '示例图片', el: img, url: imgUrl };
      // 示例音乐
      const mUrl = makeMusicWav();
      const aEl = new Audio(mUrl); aEl.loop = true; aEl.preload = 'auto';
      const music = { id: uid(), kind: 'audio', name: '舒缓轻音乐', audioEl: aEl, duration: 12, url: mUrl };

      state.assets.push(v1, v2, imgAsset, music);

      // 预置一个演示项目
      state.tracks.video.push({ id: uid(), kind: 'clip', assetId: v1.id, name: '晨海', track: 'video', start: 0, inPoint: 0, duration: 6 });
      state.tracks.video.push({ id: uid(), kind: 'clip', assetId: imgAsset.id, name: '示例图片', track: 'video', start: 6, inPoint: 0, duration: 3 });
      state.tracks.video.push({ id: uid(), kind: 'clip', assetId: v2.id, name: '黄昏', track: 'video', start: 9, inPoint: 0, duration: 5 });
      state.tracks.video.push({ id: uid(), kind: 'text', name: '文字: 小清新', track: 'video', start: 0, duration: 14, text: 'BreezeEdit ✿ 小清新', fontSize: 56, color: '#ffffff', x: 0.5, y: 0.85 });
      state.tracks.audio.push({ id: uid(), kind: 'clip', assetId: music.id, name: '舒缓轻音乐', track: 'audio', start: 0, duration: 12, volume: 0.8 });

      resetFilterUI();
      renderMediaGrid(); renderMusicList(); renderTextList();
      recomputeDuration(); renderTimeline();
      renderAt(state.currentTime);
    }

    /* ============ 导入 ============ */
    function triggerImport() { document.getElementById('fileInput').click(); }
    function triggerAudioImport() { document.getElementById('audioInput').click(); }

    function handleFileSelect(e) {
      const files = e.target.files;
      for (const file of files) {
        const url = URL.createObjectURL(file);
        if (file.type.startsWith('video/')) {
          const el = document.createElement('video');
          el.src = url; el.muted = false; el.preload = 'auto'; el.playsInline = true;
          document.getElementById('hiddenMedia').appendChild(el);
          const asset = { id: uid(), kind: 'video', name: file.name, el, url, duration: 5 };
          el.addEventListener('loadedmetadata', () => {
            asset.duration = el.duration || 5;
            state.tracks.video.forEach(c => { if (c.assetId === asset.id) c.duration = asset.duration; });
            recomputeDuration(); renderTimeline();
          });
          state.assets.push(asset); addAssetToTimeline(asset);
        } else if (file.type.startsWith('image/')) {
          const img = new Image(); img.src = url;
          const asset = { id: uid(), kind: 'image', name: file.name, el: img, url };
          state.assets.push(asset); addAssetToTimeline(asset);
        } else if (file.type.startsWith('audio/')) {
          const ael = new Audio(url); ael.loop = true; ael.preload = 'auto';
          const asset = { id: uid(), kind: 'audio', name: file.name, audioEl: ael, duration: 10, url };
          ael.addEventListener('loadedmetadata', () => { asset.duration = ael.duration || 10; });
          state.assets.push(asset); addAssetToTimeline(asset);
        }
      }
      e.target.value = '';
      renderMediaGrid(); renderMusicList(); recomputeDuration(); renderTimeline();
    }

    function addAssetToTimeline(asset) {
      if (asset.kind === 'audio') {
        const dur = asset.duration || 10;
        state.tracks.audio.push({ id: uid(), kind: 'clip', assetId: asset.id, name: asset.name, track: 'audio', start: state.currentTime, duration: dur, volume: 0.8 });
      } else if (asset.kind === 'image') {
        state.tracks.video.push({ id: uid(), kind: 'clip', assetId: asset.id, name: asset.name, track: 'video', start: state.currentTime, inPoint: 0, duration: 4 });
      } else if (asset.kind === 'generator') {
        state.tracks.video.push({ id: uid(), kind: 'clip', assetId: asset.id, name: asset.name, track: 'video', start: state.currentTime, inPoint: 0, duration: 6 });
      } else {
        const dur = asset.duration || 5;
        state.tracks.video.push({ id: uid(), kind: 'clip', assetId: asset.id, name: asset.name, track: 'video', start: state.currentTime, inPoint: 0, duration: dur });
      }
      recomputeDuration(); renderTimeline();
    }

    /* ============ 播放 ============ */
    function togglePlay() {
      if (state.recording) return;
      if (!state.tracks.video.length && !state.tracks.audio.length) { alert('请先导入素材或加载示例'); return; }
      if (state.isPlaying) pause(); else play();
    }
    function play() {
      ensureAudio(); if (audioCtx.state === 'suspended') audioCtx.resume();
      if (state.currentTime >= state.duration) state.currentTime = 0;
      state.isPlaying = true; playBtn.textContent = '❚❚';
      lastTS = performance.now();
      requestAnimationFrame(loop);
    }
    function pause() {
      state.isPlaying = false; state.recording = false; playBtn.textContent = '▶';
      pauseMedia();
    }
    function pauseMedia() {
      for (const a of state.assets) {
        if (a.kind === 'video' && a.el && !a.el.paused) a.el.pause();
        if (a.kind === 'audio' && a.audioEl && !a.audioEl.paused) a.audioEl.pause();
      }
    }
    let lastTS = 0;
    function loop(ts) {
      if (!state.isPlaying && !state.recording) return;
      const dt = Math.min(0.05, (ts - lastTS) / 1000); lastTS = ts;
      state.currentTime += dt;
      if (state.currentTime >= state.duration) {
        state.currentTime = state.duration;
        renderAt(state.currentTime);
        state.isPlaying = false; state.recording = false; playBtn.textContent = '▶';
        if (state.recorder) { const r = state.recorder; state.recorder = null; r.stop(); }
        pauseMedia();
        return;
      }
      renderAt(state.currentTime);
      requestAnimationFrame(loop);
    }

    /* ============ 渲染合成 ============ */
    function renderAt(t) {
      updateMedia(t);
      drawFrame(t);
      updatePlayhead();
    }

    function updateMedia(t) {
      const activeVideos = new Set();
      for (const clip of state.tracks.video) {
        if (clip.kind === 'text') continue;
        const active = t >= clip.start && t < clip.start + clip.duration;
        if (!active) continue;
        const asset = getAsset(clip.assetId);
        if (!asset || asset.kind !== 'video') continue;
        activeVideos.add(asset);
        const local = (t - clip.start + clip.inPoint) % (asset.duration || 5);
        if (asset.el.paused) { asset.el.currentTime = local; asset.el.play().catch(() => {}); }
        const node = getAssetAudioNode(asset);
        if (node && asset.audioGain) asset.audioGain.gain.value = 1;
      }
      for (const a of state.assets) {
        if (a.kind === 'video' && !activeVideos.has(a) && a.el && !a.el.paused) a.el.pause();
      }
      // 音频轨
      for (const clip of state.tracks.audio) {
        const asset = getAsset(clip.assetId);
        if (!asset || !asset.audioEl) continue;
        const active = t >= clip.start && t < clip.start + clip.duration;
        if (active) {
          const off = (t - clip.start) % (asset.duration || 10);
          if (asset.audioEl.paused) {
            asset.audioEl.currentTime = off;
            asset.audioEl.play().catch(() => {});
            const node = getAssetAudioNode(asset);
            if (node && asset.audioGain) asset.audioGain.gain.value = clip.volume ?? 0.8;
          }
        } else if (!asset.audioEl.paused) {
          asset.audioEl.pause();
        }
      }
    }

    function drawFrame(t) {
      const { w, h } = ratioDims(state.ratio);
      if (previewCanvas.width !== w) { previewCanvas.width = w; previewCanvas.height = h; }
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#0c1410'; ctx.fillRect(0, 0, w, h);
      const f = state.filters;
      const filterStr = `brightness(${f.brightness}%) contrast(${f.contrast}%) saturate(${f.saturate}%) blur(${f.blur}px) hue-rotate(${f.hue}deg) sepia(${f.sepia}%) grayscale(${f.grayscale}%)`;
      for (const clip of state.tracks.video) {
        if (clip.kind === 'text') continue;
        if (t < clip.start || t >= clip.start + clip.duration) continue;
        const asset = getAsset(clip.assetId); if (!asset) continue;
        const local = t - clip.start + clip.inPoint;
        ctx.save();
        ctx.filter = filterStr;
        if (asset.kind === 'video') { if (asset.el && asset.el.readyState >= 2) ctx.drawImage(asset.el, 0, 0, w, h); }
        else if (asset.kind === 'image') { if (asset.el) ctx.drawImage(asset.el, 0, 0, w, h); }
        else if (asset.kind === 'generator') { asset.draw(ctx, w, h, local); }
        ctx.restore();
      }
      for (const clip of state.tracks.video) {
        if (clip.kind !== 'text') continue;
        if (t < clip.start || t >= clip.start + clip.duration) continue;
        drawTextClip(ctx, clip, w, h);
      }
    }

    function drawTextClip(c, clip, w, h) {
      c.save();
      c.font = `bold ${clip.fontSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = clip.color;
      c.shadowColor = 'rgba(0,0,0,0.4)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
      c.fillText(clip.text, clip.x * w, clip.y * h);
      c.restore();
    }

    function updatePlayhead() {
      const ph = document.getElementById('playhead');
      if (ph) ph.style.left = (state.currentTime * state.pxPerSecond) + 'px';
      currentTimeText.textContent = fmt(state.currentTime);
      totalTimeText.textContent = fmt(state.duration);
      const container = document.getElementById('timelineTracks');
      const need = state.currentTime * state.pxPerSecond;
      if (need > container.scrollLeft + container.clientWidth - 100) {
        container.scrollLeft = need - container.clientWidth + 100;
      }
    }

    /* ============ 时间线 ============ */
    function recomputeDuration() {
      let d = 0;
      for (const t of ['video', 'audio']) for (const c of state.tracks[t]) d = Math.max(d, c.start + c.duration);
      state.duration = Math.max(d, 1);
    }

    function renderTimeline() {
      const container = document.getElementById('timelineTracks');
      container.innerHTML = '';
      const playhead = document.createElement('div');
      playhead.className = 'playhead'; playhead.id = 'playhead';
      container.appendChild(playhead);

      const ruler = document.createElement('div');
      ruler.className = 'ruler';
      ruler.style.width = (state.duration * state.pxPerSecond) + 'px';
      for (let s = 0; s <= Math.ceil(state.duration); s++) {
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.style.left = (s * state.pxPerSecond) + 'px';
        tick.innerHTML = `<span>${s}s</span>`;
        ruler.appendChild(tick);
      }
      ruler.addEventListener('click', (e) => {
        const rect = ruler.getBoundingClientRect();
        state.currentTime = clamp((e.clientX - rect.left) / state.pxPerSecond);
        renderAt(state.currentTime);
      });
      container.appendChild(ruler);

      container.appendChild(makeTrack('video', '视频'));
      container.appendChild(makeTrack('audio', '音频'));
      updatePlayhead();
    }

    function makeTrack(type, label) {
      const track = document.createElement('div');
      track.className = 'track';
      const lab = document.createElement('div');
      lab.className = 'track-label'; lab.textContent = label;
      track.appendChild(lab);
      const lane = document.createElement('div');
      lane.className = 'lane';
      for (const clip of state.tracks[type]) lane.appendChild(makeClipEl(clip));
      lane.addEventListener('click', (e) => {
        if (e.target === lane) {
          const rect = lane.getBoundingClientRect();
          state.currentTime = clamp((e.clientX - rect.left) / state.pxPerSecond);
          renderAt(state.currentTime);
        }
      });
      track.appendChild(lane);
      return track;
    }

    function makeClipEl(clip) {
      const el = document.createElement('div');
      el.className = 'track-clip' + (clip.id === state.selectedClipId ? ' selected' : '');
      if (clip.track === 'audio') el.classList.add('audio-clip');
      if (clip.kind === 'text') el.classList.add('text-clip');
      el.style.left = (clip.start * state.pxPerSecond) + 'px';
      el.style.width = Math.max(20, clip.duration * state.pxPerSecond) + 'px';
      el.textContent = (clip.kind === 'text' ? '📝 ' : clip.track === 'audio' ? '🎵 ' : '📹 ') + (clip.name || '片段');
      el.dataset.id = clip.id;
      el.addEventListener('click', (e) => { e.stopPropagation(); selectClip(clip.id); });
      el.addEventListener('pointerdown', (e) => startDrag(e, clip, el));
      return el;
    }

    function startDrag(e, clip, el) {
      e.preventDefault();
      const startX = e.clientX;
      const orig = clip.start;
      const px = state.pxPerSecond;
      el.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const ns = Math.max(0, orig + (ev.clientX - startX) / px);
        clip.start = ns;
        el.style.left = (ns * px) + 'px';
      };
      const up = () => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        selectClip(clip.id);
        recomputeDuration(); renderTimeline();
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    }

    function selectClip(id) {
      state.selectedClipId = id;
      document.querySelectorAll('.track-clip').forEach(c => c.classList.toggle('selected', c.dataset.id === id));
      renderTextList();
    }

    function clamp(t) { return Math.max(0, Math.min(state.duration, t)); }

    function splitClip() {
      const clip = getSelectedClip();
      if (!clip) { alert('请先在时间线上选择一个片段'); return; }
      const t = state.currentTime;
      if (t <= clip.start + 0.1 || t >= clip.start + clip.duration - 0.1) { alert('播放头需位于片段内部才能剪切'); return; }
      const offset = t - clip.start;
      const second = { ...clip, id: uid(), start: t, duration: clip.duration - offset, inPoint: (clip.inPoint || 0) + offset };
      clip.duration = offset;
      const arr = state.tracks[clip.track];
      arr.splice(arr.indexOf(clip) + 1, 0, second);
      recomputeDuration(); renderTimeline();
    }

    function deleteClip() {
      const clip = getSelectedClip();
      if (!clip) { alert('请先选择要删除的片段'); return; }
      const arr = state.tracks[clip.track];
      const i = arr.indexOf(clip);
      if (i >= 0) arr.splice(i, 1);
      state.selectedClipId = null;
      recomputeDuration(); renderTimeline(); renderTextList();
    }

    function zoom(dir) {
      state.pxPerSecond = Math.max(20, Math.min(200, state.pxPerSecond + dir * 20));
      renderTimeline();
    }

    /* ============ 文字 ============ */
    function addTextClip() {
      const text = document.getElementById('textInput').value || '文字';
      const fontSize = +document.getElementById('textSize').value;
      const color = document.getElementById('textColor').value;
      const pos = document.querySelector('input[name="textPos"]:checked').value;
      const y = pos === 'top' ? 0.18 : pos === 'bottom' ? 0.82 : 0.5;
      state.tracks.video.push({
        id: uid(), kind: 'text', name: '文字: ' + text.slice(0, 6), track: 'video',
        start: state.currentTime, duration: 3, text, fontSize, color, x: 0.5, y
      });
      recomputeDuration(); renderTimeline(); renderTextList();
    }
    function renderTextList() {
      const box = document.getElementById('textList');
      box.innerHTML = '';
      state.tracks.video.filter(c => c.kind === 'text').forEach(c => {
        const item = document.createElement('div');
        item.className = 'clip-item';
        item.innerHTML = `<span>📝 ${c.text}</span><span class="del" data-id="${c.id}">删除</span>`;
        item.querySelector('.del').onclick = () => {
          const arr = state.tracks.video; arr.splice(arr.indexOf(c), 1);
          recomputeDuration(); renderTimeline(); renderTextList();
        };

      });

    /* ============ 滤镜 ============ */
    function onFilter(input) {
      const key = input.dataset.f;
      state.filters[key] = +input.value;
      document.getElementById('v-' + key).textContent = key === 'blur' ? input.value + 'px' : key === 'hue' ? input.value + '°' : input.value + '%';
      renderAt(state.currentTime);
    }
    function resetFilters() {
      state.filters = { brightness: 100, contrast: 100, saturate: 100, blur: 0, hue: 0, sepia: 0, grayscale: 0 };
      resetFilterUI();
      renderAt(state.currentTime);
    }
    function resetFilterUI() {
      document.querySelectorAll('#panel-filter input[data-f]').forEach(inp => {
        inp.value = state.filters[inp.dataset.f];
        document.getElementById('v-' + inp.dataset.f).textContent = inp.dataset.f === 'blur' ? inp.value + 'px' : inp.dataset.f === 'hue' ? inp.value + '°' : inp.value + '%';
      });
    }

    /* ============ 素材库 / 音乐库列表 ============ */
    function renderMediaGrid() {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '';
      state.assets.filter(a => a.kind !== 'audio').forEach(asset => {
        const card = document.createElement('div');
        card.className = 'media-card';
        if (asset.url) {
          card.innerHTML = asset.kind === 'video' ? `<video src="${asset.url}" muted></video>` : `<img src="${asset.url}">`;
        } else if (asset.kind === 'generator') {
          const c = document.createElement('canvas'); c.width = 160; c.height = 90;
          asset.draw(c.getContext('2d'), 160, 90, 1.0);
          c.style.width = '100%'; c.style.height = '100%'; c.style.objectFit = 'cover';
          card.appendChild(c);
        }
        const tip = document.createElement('div');
        tip.className = 'media-tip'; tip.textContent = asset.name;
        card.appendChild(tip);
        card.onclick = () => addAssetToTimeline(asset);
        grid.appendChild(card);
      });
    }

    function renderMusicList() {
      const box = document.getElementById('musicList');
      box.innerHTML = '';
      state.assets.filter(a => a.kind === 'audio').forEach(asset => {
        const item = document.createElement('div');
        item.className = 'clip-item';
        item.innerHTML = `<span>🎵 ${asset.name}</span><span class="add" style="color:var(--accent-color);cursor:pointer;">+ 添加</span>`;
        item.querySelector('.add').onclick = () => addAssetToTimeline(asset);
        box.appendChild(item);
      });
      if (!box.children.length) box.innerHTML = '<p class="hint">还没有音乐，点击上方导入本地音频。</p>';
    }

    /* ============ 画幅比例 ============ */
    function setRatio(ratio, btn) {
      document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.ratio = ratio;
      canvasWrapper.className = `canvas-wrapper ratio-${ratio}`;
      drawFrame(state.currentTime);
    }

    /* ============ 导出视频 ============ */
    async function exportVideo() {
      if (state.tracks.video.length === 0) { alert('请先添加视频或图片片段'); return; }
      if (state.recording) return;
      ensureAudio(); await audioCtx.resume();

      const stream = previewCanvas.captureStream(30);
      const dest = audioCtx.createMediaStreamDestination();
      masterGain.connect(dest);
      const combined = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);

      let mime = 'video/webm;codecs=vp9';
      if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8';
      if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

      const rec = new MediaRecorder(combined, { mimeType: mime });
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        try { masterGain.disconnect(dest); } catch (e) {}
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'breeze-edit-' + Date.now() + '.webm';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        alert('导出完成！已下载 .webm 视频（可用播放器打开，或用 ffmpeg 转码为 mp4）。');
        exportBtn.disabled = false; exportBtn.textContent = '导出视频';
      };

      rec.start();
      state.recorder = rec;
      state.recording = true;
      state.isPlaying = true;
      state.currentTime = 0;
      playBtn.textContent = '⏺';
      exportBtn.disabled = true; exportBtn.textContent = '导出中…';
      lastTS = performance.now();
      requestAnimationFrame(loop);
    }

    /* ============ 标签页切换 ============ */
    document.querySelectorAll('.tab-item').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const name = tab.dataset.tab;
        ['media', 'text', 'filter', 'music'].forEach(p => {
          document.getElementById('panel-' + p).classList.toggle('hidden', p !== name);
        });
      });
    });

    /* ============ 启动 ============ */
    loadDemo(false);
  </script>
</body>
</html>
