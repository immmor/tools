<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chain-of-Thought 思维链对比演示</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1f2733;
    --muted: #6b7686;
    --line: #e6eaf1;
    --no: #ef4444;
    --no-soft: #fef2f2;
    --yes: #16a34a;
    --yes-soft: #f0fdf4;
    --accent: #4f46e5;
    --shadow: 0 10px 30px rgba(31, 39, 51, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 20px 64px; }
  header.hero {
    text-align: center;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: var(--shadow);
  }
  header.hero h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: .5px; }
  header.hero p { margin: 0; opacity: .92; font-size: 15px; }

  .tabs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 28px 0 18px; }
  .tab {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all .18s ease;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .question {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
    font-size: 17px;
    font-weight: 600;
  }
  .question .q-label {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: #eef2ff;
    padding: 3px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .run-row { text-align: center; margin: 22px 0; }
  .run-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(79, 70, 229, .35);
    transition: transform .12s ease, opacity .2s ease;
  }
  .run-btn:hover { transform: translateY(-1px); }
  .run-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }

  .col {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    min-height: 360px;
    display: flex;
    flex-direction: column;
  }
  .col.no { border-top: 4px solid var(--no); }
  .col.yes { border-top: 4px solid var(--yes); }

  .col-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .col-head .badge {
    font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 8px;
  }
  .col.no .badge { background: var(--no-soft); color: var(--no); }
  .col.yes .badge { background: var(--yes-soft); color: var(--yes); }
  .col-desc { font-size: 13px; color: var(--muted); margin: 6px 0 16px; }

  .stage { flex: 1; display: flex; flex-direction: column; gap: 12px; }

  .placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #aab2bf; font-size: 14px; border: 2px dashed var(--line); border-radius: 12px;
    min-height: 240px;
  }

  .step {
    background: #f8fafc;
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    animation: fadeUp .45s ease both;
  }
  .step .s-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .step .s-body { font-size: 14px; color: #374151; }

  .answer {
    margin-top: 4px;
    border-radius: 12px;
    padding: 16px;
    font-weight: 700;
    font-size: 16px;
    animation: pop .35s ease both;
  }
  .col.no .answer { background: var(--no-soft); color: var(--no); }
  .col.yes .answer { background: var(--yes-soft); color: var(--yes); }
  .answer small { display: block; font-weight: 500; font-size: 13px; opacity: .85; margin-top: 4px; }

  .verdict {
    margin-top: 12px;
    text-align: center;
    font-weight: 800;
    font-size: 15px;
    padding: 10px;
    border-radius: 10px;
    animation: pop .35s ease both;
  }
  .verdict.bad { background: var(--no); color: #fff; }
  .verdict.good { background: var(--yes); color: #fff; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

  footer.note {
    margin-top: 32px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
  }
  footer.note code { background: #eef2ff; color: var(--accent); padding: 2px 6px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Chain-of-Thought 思维链对比演示</h1>
    <p>同一道数学题：左边「不写过程直接猜」往往翻车，右边「一步步推理」稳稳答对。</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="question">
    <span class="q-label">题目</span>
    <div id="q-text">—</div>
  </div>

  <div class="run-row">
    <button class="run-btn" id="runBtn">▶ 运行演示</button>
  </div>

  <div class="cols">
    <div class="col no">
      <div class="col-head">
        <span class="badge">🚫 无 CoT</span>
      </div>
      <div class="col-desc">直接输出最终答案，不展示任何思考过程 —— 快，但容易跳步出错。</div>
      <div class="stage" id="stageNo"><div class="placeholder">点击「运行演示」查看结果</div></div>
    </div>

    <div class="col yes">
      <div class="col-head">
        <span class="badge">✅ 有 CoT</span>
      </div>
      <div class="col-desc">引导模型逐步推理（Chain-of-Thought），展示完整思维链 —— 慢一点，但更可靠。</div>
      <div class="stage" id="stageYes"><div class="placeholder">点击「运行演示」查看结果</div></div>
    </div>
  </div>

  <footer class="note">
    <code>CoT</code>（Chain-of-Thought，思维链）通过让模型「把思考过程写出来」，显著提升数学、逻辑等复杂任务的准确率。<br/>
    本页面为纯前端模拟演示，推理步骤为预写脚本，不调用任何真实模型接口。
  </footer>
</div>

<script>
  const problems = [
    {
      title: "植树问题",
      question: "一条路长 100 米，每隔 10 米种一棵树，两端都种，一共要种多少棵？",
      noCoT: {
        text: "100 ÷ 10 = 10，所以种 10 棵。",
        answer: "10 棵"
      },
      coT: {
        steps: [
          { t: "① 算间隔数", d: "路长 100 米，每 10 米一个间隔：100 ÷ 10 = 10 个间隔。" },
          { t: "② 间隔与树的关系", d: "两端都种时，树比间隔多 1（起点一棵 + 每个间隔末端一棵）。" },
          { t: "③ 得出结果", d: "棵树 = 间隔数 + 1 = 10 + 1 = 11 棵。" }
        ],
        answer: "11 棵"
      }
    },
    {
      title: "合作工程",
      question: "甲单独做完要 6 小时，乙单独做完要 3 小时，两人合作需要几小时完成？",
      noCoT: {
        text: "(6 + 3) ÷ 2 = 4.5，所以合作要 4.5 小时。",
        answer: "4.5 小时"
      },
      coT: {
        steps: [
          { t: "① 甲的效率", d: "甲每小时完成总量的 1/6。" },
          { t: "② 乙的效率", d: "乙每小时完成总量的 1/3。" },
          { t: "③ 合作效率", d: "1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2（每小时完成一半）。" },
          { t: "④ 合作时间", d: "总量 ÷ 合作效率 = 1 ÷ (1/2) = 2 小时。" }
        ],
        answer: "2 小时"
      }
    },
    {
      title: "倍数运算",
      question: "小明有 5 个苹果，吃了 2 个，妈妈又买了「剩下数量的 3 倍」，现在小明有几个苹果？",
      noCoT: {
        text: "5 - 2 + 3 = 6，所以现在有 6 个。",
        answer: "6 个"
      },
      coT: {
        steps: [
          { t: "① 算剩下的", d: "吃了 2 个后还剩：5 - 2 = 3 个。" },
          { t: "② 算妈妈买的", d: "「剩下的 3 倍」= 3 × 3 = 9 个。" },
          { t: "③ 算总数", d: "现在总数 = 剩下的 + 妈妈买的 = 3 + 9 = 12 个。" }
        ],
        answer: "12 个"
      }
    }
  ];

  let current = 0;
  let timers = [];
  const tabsEl = document.getElementById("tabs");
  const qText = document.getElementById("q-text");
  const stageNo = document.getElementById("stageNo");
  const stageYes = document.getElementById("stageYes");
  const runBtn = document.getElementById("runBtn");

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function renderTabs() {
    tabsEl.innerHTML = "";
    problems.forEach((p, i) => {
      const b = document.createElement("button");
      b.className = "tab" + (i === current ? " active" : "");
      b.textContent = p.title;
      b.onclick = () => { current = i; selectProblem(); };
      tabsEl.appendChild(b);
    });
  }

  function selectProblem() {
    clearTimers();
    renderTabs();
    qText.textContent = problems[current].question;
    stageNo.innerHTML = '<div class="placeholder">点击「运行演示」查看结果</div>';
    stageYes.innerHTML = '<div class="placeholder">点击「运行演示」查看结果</div>';
    runBtn.textContent = "▶ 运行演示";
    runBtn.disabled = false;
  }

  function runDemo() {
    clearTimers();
    const p = problems[current];
    runBtn.disabled = true;
    runBtn.textContent = "● 演示中…";

    // 重置舞台
    stageNo.innerHTML = "";
    stageYes.innerHTML = "";

    // —— 左：无 CoT，快速蹦出错误答案 ——
    timers.push(setTimeout(() => {
      const a = document.createElement("div");
      a.className = "answer";
      a.innerHTML = p.noCoT.text + '<small>最终答案：' + p.noCoT.answer + '</small>';
      stageNo.appendChild(a);
      const v = document.createElement("div");
      v.className = "verdict bad";
      v.textContent = "✗ 错误 —— 跳步导致结果不对";
      stageNo.appendChild(v);
    }, 450));

    // —— 右：有 CoT，逐步淡入推理 ——
    const stepDelay = 650;
    p.coT.steps.forEach((s, i) => {
      timers.push(setTimeout(() => {
        const el = document.createElement("div");
        el.className = "step";
        el.innerHTML = '<div class="s-title">' + s.t + '</div><div class="s-body">' + s.d + '</div>';
        stageYes.appendChild(el);
      }, stepDelay * (i + 1)));
    });

    const afterSteps = stepDelay * (p.coT.steps.length + 1);
    timers.push(setTimeout(() => {
      const a = document.createElement("div");
      a.className = "answer";
      a.innerHTML = '逐步推导得出：' + p.coT.answer + '<small>最终答案：' + p.coT.answer + '</small>';
      stageYes.appendChild(a);
      const v = document.createElement("div");
      v.className = "verdict good";
      v.textContent = "✓ 正确 —— 思维链避免了跳步错误";
      stageYes.appendChild(v);

      runBtn.disabled = false;
      runBtn.textContent = "↻ 重播";
    }, afterSteps));
  }

  runBtn.onclick = runDemo;
  selectProblem();
</script>
</body>
</html>
