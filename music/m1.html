<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100 overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthwave Cyberpunk Music Video</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Smooth glowing effects */
        .glow-cyan {
            box-shadow: 0 0 30px rgba(5, 217, 232, 0.4);
        }
        .glow-pink {
            box-shadow: 0 0 35px rgba(255, 42, 109, 0.5);
        }
        /* Custom pulse animation */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.03); opacity: 1; }
        }
        .pulse-button {
            animation: pulse-subtle 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full w-full relative font-sans select-none bg-black overflow-hidden flex items-center justify-center">

    <!-- FULLSCREEN MUSIC VIDEO CANVAS -->
    <canvas id="music-video-canvas" class="absolute inset-0 w-full h-full block z-0 cursor-pointer"></canvas>

    <!-- MINIMAL OVERLAY UI -->
    <!-- Play Overlay Screen (Required for audio autoplay bypass) -->
    <div id="play-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-md transition-opacity duration-700">
        <div class="text-center p-8 max-w-lg mx-auto flex flex-col items-center">
            <!-- Icon Badge -->
            <div class="w-24 h-24 mb-6 rounded-full bg-gradient-to-tr from-pink-500/20 via-cyan-500/20 to-purple-500/20 border border-cyan-400/50 flex items-center justify-center text-cyan-300 shadow-[0_0_50px_rgba(5,217,232,0.3)]">
                <i data-lucide="disc-3" class="w-12 h-12 animate-spin" style="animation-duration: 8s;"></i>
            </div>
            
            <h1 class="text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-400 mb-2">NEON HORIZON</h1>
            <p class="text-slate-400 text-sm tracking-widest uppercase mb-8">Audio-Reactive Synthwave Music Video</p>

            <!-- Big Start Play Button -->
            <button id="btn-start" class="pulse-button py-4 px-10 rounded-full font-bold tracking-widest text-slate-950 bg-gradient-to-r from-cyan-400 via-teal-300 to-pink-500 hover:brightness-110 active:scale-95 transition-all duration-300 glow-cyan flex items-center gap-3 text-lg">
                <i data-lucide="play" class="w-6 h-6 fill-current"></i>
                <span>点击播放音乐视频</span>
            </button>
            
            <p class="text-xs text-slate-500 mt-6 tracking-wide">全程由浏览器 Web Audio API & HTML Canvas 实时合成与渲染</p>
        </div>
    </div>

    <!-- HUD Video Info Badge (Minimalistic top & bottom bars) -->
    <div id="video-hud" class="absolute inset-x-0 top-0 z-20 p-6 flex justify-between items-center bg-gradient-to-b from-black/80 via-black/30 to-transparent opacity-0 transition-opacity duration-1000 pointer-events-none">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></div>
            <div>
                <h2 class="text-xs font-bold tracking-widest text-slate-200 uppercase">NEON HORIZON - SYNTHWAVE</h2>
                <p id="section-title" class="text-[10px] font-mono text-cyan-400 tracking-wider">INTRO • 120 BPM</p>
            </div>
        </div>

        <div class="flex items-center gap-4 pointer-events-auto">
            <button id="btn-toggle-fullscreen" class="p-2.5 rounded-full bg-slate-900/60 border border-slate-700/60 text-slate-300 hover:text-white hover:border-cyan-400 transition backdrop-blur">
                <i data-lucide="maximize" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <div id="bottom-hud" class="absolute inset-x-0 bottom-0 z-20 p-6 flex justify-between items-end bg-gradient-to-t from-black/80 via-black/30 to-transparent opacity-0 transition-opacity duration-1000 pointer-events-none">
        <div class="font-mono text-xs text-slate-400 flex items-center gap-2">
            <i data-lucide="music" class="w-4 h-4 text-pink-500"></i>
            <span id="scene-name" class="text-slate-300">SCENE 1: RETRO HIGHWAY</span>
        </div>
        <div class="text-[11px] font-mono text-slate-500 tracking-widest">
            REALTIME SYNTH & VIDEO ENGINE
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Canvas & Context Setup
        const canvas = document.getElementById('music-video-canvas');
        const ctx = canvas.getContext('2d');

        // Web Audio Context & Nodes
        let audioCtx = null;
        let masterGain = null;
        let analyser = null;

        // Music Composition Parameters
        const BPM = 120;
        const SECONDS_PER_BEAT = 60 / BPM;
        const SECONDS_PER_STEP = SECONDS_PER_BEAT / 4; // 16th notes
        let currentStep = 0;
        let nextStepTime = 0;
        let isPlaying = false;
        let timerID = null;

        // Realtime Visual States (Driven by Audio Stems)
        let kickPulse = 0;
        let snarePulse = 0;
        let bassEnergy = 0;
        let leadPulse = 0;
        let cameraShake = 0;

        // Musical Arrangement Sections (Looping timeline)
        // 0: Intro (0-16 steps) -> 1: Verse (16-48) -> 2: Chorus/Drop (48-80) -> 3: Breakdown (80-96)
        let totalSteps = 0;
        let currentSceneIndex = 0;
        const SCENES = [
            '3D RETRO HIGHWAY',
            'CYBER STAR TUNNEL',
            'NEON CITY GRID',
            'FLOATING POLYHEDRA'
        ];

        // Musical Pitch Constants (Pentatonic / Minor Synthesizer Scale in C Minor)
        const C_MINOR_BASS = [32.70, 32.70, 38.89, 32.70, 43.65, 32.70, 38.89, 48.99]; // C1, D#1, F1, G1
        const CHORDS = [
            [130.81, 155.56, 196.00], // Cm (C3, Eb3, G3)
            [116.54, 146.83, 174.61], // Bb (Bb2, D3, F3)
            [103.83, 130.81, 155.56], // Ab (Ab2, C3, Eb3)
            [116.54, 146.83, 174.61]  // Bb
        ];
        const LEAD_MELODY = [
            261.63, 0, 311.13, 392.00, 0, 349.23, 311.13, 0,
            261.63, 392.00, 523.25, 0, 466.16, 392.00, 349.23, 311.13
        ];

        function initAudioEngine() {
            if (audioCtx) return;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.75, audioCtx.currentTime);

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;

            masterGain.connect(analyser);
            analyser.connect(audioCtx.destination);
        }

        // --- SYNTHESIZER INSTRUMENT STEMS ---
        
        // 1. Synthwave Kick Drum
        function playKick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(130, time);
            osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.25);

            gain.gain.setValueAtTime(1.0, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.25);

            osc.connect(gain);
            gain.connect(masterGain);

            osc.start(time);
            osc.stop(time + 0.25);

            kickPulse = 1.0;
            cameraShake = 0.8;
        }

        // 2. Electro Snare & Noise Layer
        function playSnare(time) {
            // White Noise Burst
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(800, time);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.7, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(masterGain);

            // Tonal Body
            const bodyOsc = audioCtx.createOscillator();
            const bodyGain = audioCtx.createGain();
            bodyOsc.type = 'triangle';
            bodyOsc.frequency.setValueAtTime(180, time);
            bodyOsc.frequency.exponentialRampToValueAtTime(45, time + 0.12);

            bodyGain.gain.setValueAtTime(0.6, time);
            bodyGain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);

            bodyOsc.connect(bodyGain);
            bodyGain.connect(masterGain);

            noise.start(time);
            bodyOsc.start(time);
            noise.stop(time + 0.2);
            bodyOsc.stop(time + 0.12);

            snarePulse = 1.0;
        }

        // 3. Hi-Hats
        function playHiHat(time, open = false) {
            const dur = open ? 0.15 : 0.05;
            const bufferSize = audioCtx.sampleRate * dur;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(7500, time);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(open ? 0.4 : 0.25, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            noise.start(time);
            noise.stop(time + dur);
        }

        // 4. Arpeggiated Bass
        function playBass(freq, time) {
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, time);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(500, time);
            filter.frequency.exponentialRampToValueAtTime(120, time + 0.2);

            gain.gain.setValueAtTime(0.85, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.22);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            osc.start(time);
            osc.stop(time + 0.22);

            bassEnergy = 0.9;
        }

        // 5. Polyphonic Chords Pad
        function playChordPad(chordFreqs, time, duration) {
            chordFreqs.forEach(freq => {
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc1.type = 'sawtooth';
                osc2.type = 'square';

                // Subtle detune for rich synth pad sound
                osc1.frequency.setValueAtTime(freq, time);
                osc2.frequency.setValueAtTime(freq * 1.004, time);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1200, time);

                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.18, time + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);

                osc1.start(time);
                osc2.start(time);
                osc1.stop(time + duration);
                osc2.stop(time + duration);
            });
        }

        // 6. Lead Synth Melody
        function playLeadSynth(freq, time) {
            if (freq === 0) return;

            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, time);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2800, time);
            filter.Q.setValueAtTime(4.0, time);

            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.35, time + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.35);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            osc.start(time);
            osc.stop(time + 0.35);

            leadPulse = 1.0;
        }

        // 7. Transition Sound Effects (Sweeps/Risers)
        function triggerRiserFX(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, time);
            osc.frequency.exponentialRampToValueAtTime(1200, time + 1.5);

            gain.gain.setValueAtTime(0.01, time);
            gain.gain.linearRampToValueAtTime(0.4, time + 1.4);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 1.5);

            osc.connect(gain);
            gain.connect(masterGain);

            osc.start(time);
            osc.stop(time + 1.5);
        }

        function scheduleMusicStep(step, time) {
            const stepInBar = step % 16;
            const currentBar = Math.floor(step / 16);
            const section = Math.floor(currentBar / 2) % 4; // 0: Intro, 1: Verse, 2: Chorus, 3: Drop

            // Update scene info text
            currentSceneIndex = section;
            const sectionNames = ["INTRO • RETRO HIGHWAY", "VERSE • STAR TUNNEL", "CHORUS • NEON CITY", "DROP • FLOATING POLYHEDRA"];
            document.getElementById('section-title').textContent = sectionNames[section] + ' • 120 BPM';
            document.getElementById('scene-name').textContent = `SCENE ${section + 1}: ${SCENES[section]}`;

            // Drums Pattern
            if (section >= 1) { // Drums start in Verse
                if (stepInBar % 4 === 0) playKick(time);
                if (stepInBar % 8 === 4) playSnare(time);
                if (stepInBar % 2 === 0) playHiHat(time, stepInBar % 4 === 2);
            } else if (stepInBar % 8 === 0) {
                playKick(time); // Sparse kick in intro
            }

            // Bassline (Plays in all sections)
            const bassNote = C_MINOR_BASS[stepInBar % C_MINOR_BASS.length];
            playBass(bassNote, time);

            // Chords Pad (Triggers on start of bar)
            if (stepInBar === 0) {
                const chordIdx = currentBar % CHORDS.length;
                playChordPad(CHORDS[chordIdx], time, SECONDS_PER_BEAT * 4);
            }

            // Lead Synth (Plays in Chorus & Drop)
            if (section === 2 || section === 3) {
                const leadNote = LEAD_MELODY[stepInBar % LEAD_MELODY.length];
                playLeadSynth(leadNote, time);
            }

            // Riser FX before Chorus & Drop
            if (stepInBar === 12 && (currentBar % 4 === 1 || currentBar % 4 === 3)) {
                triggerRiserFX(time);
            }
        }

        function musicScheduler() {
            while (nextStepTime < audioCtx.currentTime + 0.1) {
                scheduleMusicStep(currentStep, nextStepTime);
                nextStepTime += SECONDS_PER_STEP;
                currentStep = (currentStep + 1) % 128; // Loop after 128 steps (8 bars)
                totalSteps++;
            }
            if (isPlaying) {
                timerID = setTimeout(musicScheduler, 25);
            }
        }

        function startMusic() {
            initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            isPlaying = true;
            currentStep = 0;
            totalSteps = 0;
            nextStepTime = audioCtx.currentTime;
            musicScheduler();
        }

        // --- REALTIME AUDIO-REACTIVE CANVAS VISUAL ENGINE ---
        let gridZ = 0;
        let starfield = [];
        let particles = [];

        // Initialize Starfield
        for (let i = 0; i < 300; i++) {
            starfield.push({
                x: (Math.random() - 0.5) * 2000,
                y: (Math.random() - 0.5) * 2000,
                z: Math.random() * 1000 + 1
            });
        }

        // Initialize Floating Particles
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: (Math.random() - 0.5) * 800,
                y: (Math.random() - 0.5) * 400 - 100,
                z: Math.random() * 500,
                size: Math.random() * 4 + 2,
                color: Math.random() > 0.5 ? '#05d9e8' : '#ff2a6d'
            });
        }

        function renderMusicVideo() {
            requestAnimationFrame(renderMusicVideo);

            // Resize canvas if container size changes
            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // Decay audio pulse energies smoothly
            kickPulse *= 0.90;
            snarePulse *= 0.90;
            bassEnergy *= 0.92;
            leadPulse *= 0.88;
            cameraShake *= 0.85;

            // Camera shake offsets
            const shakeX = (Math.random() - 0.5) * cameraShake * 12;
            const shakeY = (Math.random() - 0.5) * cameraShake * 12;

            ctx.save();
            ctx.translate(shakeX, shakeY);

            // Clear Background
            ctx.fillStyle = '#010112';
            ctx.fillRect(-20, -20, w + 40, h + 40);

            // --- RENDER SCENE BASED ON CURRENT SECTION ---

            // SCENE 0 & 2: Retro Neon Highway & Sun
            if (currentSceneIndex === 0 || currentSceneIndex === 2) {
                
                // Synthwave Retro Sun
                const sunY = cy * 0.75;
                const sunRadius = 90 + kickPulse * 25;
                
                const sunGrd = ctx.createLinearGradient(0, sunY - sunRadius, 0, sunY + sunRadius);
                sunGrd.addColorStop(0, '#ff2a6d');
                sunGrd.addColorStop(0.5, '#ffb703');
                sunGrd.addColorStop(1, '#05d9e8');

                ctx.beginPath();
                ctx.arc(cx, sunY, sunRadius, 0, Math.PI * 2);
                ctx.fillStyle = sunGrd;
                ctx.shadowColor = '#ff2a6d';
                ctx.shadowBlur = 40 + kickPulse * 40;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Sun horizontal blinds slice effect
                ctx.fillStyle = '#010112';
                for (let i = 0; i < 7; i++) {
                    const sliceY = sunY + (i * 10) + 10;
                    const sliceHeight = 2 + i * 1.2;
                    ctx.fillRect(cx - sunRadius - 10, sliceY, sunRadius * 2 + 20, sliceHeight);
                }

                // Moving Perspective Grid Highway
                const horizonY = sunY + 10;
                gridZ = (gridZ + 4 + kickPulse * 15) % 40;

                ctx.strokeStyle = `rgba(5, 217, 232, ${0.5 + bassEnergy * 0.4})`;
                ctx.lineWidth = 1.5;

                // Perspective vanishing lines
                for (let x = -w; x <= w * 2; x += 60) {
                    ctx.beginPath();
                    ctx.moveTo(x, h);
                    ctx.lineTo(cx, horizonY);
                    ctx.stroke();
                }

                // Horizontal grid lines
                for (let z = horizonY; z <= h; z += 8 + (z - horizonY) * 0.12) {
                    const drawY = z + (gridZ * (z - horizonY) / 250);
                    if (drawY <= h) {
                        ctx.beginPath();
                        ctx.moveTo(0, drawY);
                        ctx.lineTo(w, drawY);
                        ctx.stroke();
                    }
                }
            }

            // SCENE 1: Cyber Star Tunnel Warp
            else if (currentSceneIndex === 1) {
                const speed = 10 + kickPulse * 35;

                ctx.fillStyle = leadPulse > 0.5 ? '#ff2a6d' : '#05d9e8';
                
                starfield.forEach(star => {
                    star.z -= speed;
                    if (star.z <= 0) {
                        star.z = 1000;
                        star.x = (Math.random() - 0.5) * 2000;
                        star.y = (Math.random() - 0.5) * 2000;
                    }

                    const k = 400 / star.z;
                    const px = star.x * k + cx;
                    const py = star.y * k + cy;

                    if (px >= 0 && px <= w && py >= 0 && py <= h) {
                        const size = Math.max(1, (1 - star.z / 1000) * (5 + kickPulse * 10));
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Central Audio-Reactive Core Ring
                ctx.beginPath();
                ctx.arc(cx, cy, 80 + leadPulse * 50, 0, Math.PI * 2);
                ctx.strokeStyle = '#05d9e8';
                ctx.lineWidth = 3 + kickPulse * 6;
                ctx.shadowColor = '#05d9e8';
                ctx.shadowBlur = 30;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // SCENE 3: Floating 3D Audio Polyhedra / Gems
            else if (currentSceneIndex === 3) {
                const time = Date.now() * 0.002;
                
                // Draw rotating floating neon octahedron geometry
                ctx.save();
                ctx.translate(cx, cy - 30);
                ctx.rotate(time);

                const polySize = 100 + kickPulse * 40;
                ctx.strokeStyle = '#ff2a6d';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#ff2a6d';
                ctx.shadowBlur = 25;

                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i * Math.PI) / 3;
                    const x = Math.cos(angle) * polySize;
                    const y = Math.sin(angle) * polySize;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();

                // Inner rotating star
                ctx.rotate(-time * 2);
                ctx.strokeStyle = '#05d9e8';
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI) / 2;
                    const x = Math.cos(angle) * (polySize * 0.6);
                    const y = Math.sin(angle) * (polySize * 0.6);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // --- GLOBAL PARTICLES OVERLAY ---
            particles.forEach(p => {
                p.y -= 0.8 + snarePulse * 3;
                if (p.y < -cy) p.y = cy;

                const k = 300 / (p.z || 300);
                const px = p.x * k + cx;
                const py = p.y * k + cy;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(px, py, p.size + leadPulse * 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Restore canvas shake matrix
            ctx.restore();
        }

        // UI & EVENT HANDLERS
        document.getElementById('btn-start').addEventListener('click', () => {
            startMusic();

            // Hide overlay
            const overlay = document.getElementById('play-overlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => overlay.remove(), 700);

            // Show HUD overlays
            document.getElementById('video-hud').classList.remove('opacity-0');
            document.getElementById('bottom-hud').classList.remove('opacity-0');

            // Start rendering visual canvas loop
            requestAnimationFrame(renderMusicVideo);
        });

        // Fullscreen Toggle
        document.getElementById('btn-toggle-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // Auto-show HUD on mouse movement, auto-hide after 3 seconds
        let hudTimeout = null;
        window.addEventListener('mousemove', () => {
            const topHud = document.getElementById('video-hud');
            const bottomHud = document.getElementById('bottom-hud');
            if (topHud && bottomHud && isPlaying) {
                topHud.classList.remove('opacity-0');
                bottomHud.classList.remove('opacity-0');
                clearTimeout(hudTimeout);
                hudTimeout = setTimeout(() => {
                    topHud.classList.add('opacity-0');
                    bottomHud.classList.add('opacity-0');
                }, 3500);
            }
        });
    </script>
