<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="接收短信验证码">
  <!-- 短信气泡 -->
  <rect x="50" y="24" width="140" height="76" rx="16" fill="#7C3AED"/>
  <path d="M78 98 l0 20 22 -20 z" fill="#7C3AED"/>
  <!-- 三个点：先播放两轮 -->
  <g fill="#fff">
    <circle cx="95" cy="62" r="7" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="2"/>
    </circle>
    <circle cx="120" cy="62" r="7" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.2s" repeatCount="2"/>
    </circle>
    <circle cx="145" cy="62" r="7" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.4s" repeatCount="2"/>
    </circle>
  </g>

  <!-- 验证码：三个点播完后，数字依次显示一次 -->
  <g font-family="'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">
    <text x="57" y="158" opacity="0">4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.03;0.045;1" begin="2.8s" dur="3.2s" fill="freeze"/></text>
    <text x="81" y="158" opacity="0">8<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.065;1" begin="2.8s" dur="3.2s" fill="freeze"/></text>
    <text x="105" y="158" opacity="0">2<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.07;0.085;1" begin="2.8s" dur="3.2s" fill="freeze"/></text>
    <text x="129" y="158" opacity="0">9<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.093;0.108;1" begin="2.8s" dur="3.2s" fill="freeze"/></text>
    <text x="153" y="158" opacity="0">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.135;1" begin="2.8s" dur="3.2s" fill="freeze"/></text>
    <text x="177" y="158" opacity="0">6<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.165;1" begin="2.8s" dur="3.2s" fill="freeze"/></text>
  </g>
</svg>
