<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="接收短信验证码">
  <!-- 短信气泡 -->
  <rect x="50" y="24" width="140" height="76" rx="16" fill="#7C3AED"/>
  <path d="M78 98 l0 20 22 -20 z" fill="#7C3AED"/>
  <!-- 三个点：正在接收 -->
  <g fill="#fff">
    <circle cx="95" cy="62" r="7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="62" r="7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="62" r="7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 验证码：一个一个数字依次显示（周期 6s，开屏期间只播一遍） -->
  <g font-family="'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">
    <text x="57" y="158" opacity="0">4<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.045;0.96;0.99;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="81" y="158" opacity="0">8<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.065;0.96;0.99;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="105" y="158" opacity="0">2<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.07;0.085;0.96;0.99;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="129" y="158" opacity="0">9<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.093;0.108;0.96;0.99;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="153" y="158" opacity="0">1<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.135;0.96;0.99;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="177" y="158" opacity="0">6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.165;0.96;0.99;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
</svg>
