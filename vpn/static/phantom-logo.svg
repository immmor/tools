<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#051525" />
      <stop offset="100%" stop-color="#010306" />
    </radialGradient>

    <!-- 主青色霓虹渐变 -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="70%" stop-color="#00bbee" />
      <stop offset="100%" stop-color="#0077aa" />
    </linearGradient>

    <!-- 底部装饰线渐变 -->
    <linearGradient id="lineLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="lineRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0" />
    </linearGradient>

    <!-- 核心霓虹发光滤镜 -->
    <filter id="neonGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 柔和发光滤镜 -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="920" height="300" fill="url(#bgGrad)" />

  <!-- 2. 左侧流光与粒子 -->
  <g filter="url(#neonGlow)" fill="url(#cyanGrad)">
    <rect x="120" y="75" width="60" height="6" rx="3" opacity="0.8" />
    <rect x="85" y="96" width="95" height="8" rx="4" opacity="0.9" />
    <rect x="50" y="120" width="130" height="10" rx="5" />
    <rect x="70" y="144" width="110" height="8" rx="4" opacity="0.85" />
    <rect x="40" y="168" width="140" height="10" rx="5" />
    <rect x="65" y="192" width="105" height="8" rx="4" opacity="0.8" />
    <rect x="100" y="214" width="60" height="6" rx="3" opacity="0.6" />

    <circle cx="100" cy="78" r="2.5" opacity="0.7" />
    <circle cx="60" cy="100" r="3.5" opacity="0.8" />
    <circle cx="35" cy="125" r="3" opacity="0.9" />
    <circle cx="50" cy="148" r="2.5" opacity="0.7" />
    <circle cx="25" cy="173" r="3.5" />
    <circle cx="48" cy="196" r="2.5" opacity="0.7" />
    <circle cx="85" cy="217" r="2" opacity="0.5" />
  </g>

  <!-- 3. 主 LOGO (P + 幽灵) -->
  <g filter="url(#neonGlow)">
    <!-- 完整的 P 字母本体 -->
    <path d="M 180 50 
             L 285 50 
             A 65 65 0 0 1 350 115 
             A 65 65 0 0 1 285 180 
             L 220 180 
             C 198 202, 175 228, 160 255 
             C 182 238, 202 210, 215 190 
             L 215 180 
             L 215 255
             L 180 255 
             Z" 
          fill="url(#cyanGrad)" />

    <!-- 幽灵剪影 (负空间) -->
    <path d="M 235 180
             C 218 165, 205 145, 208 128
             C 218 123, 222 112, 215 100
             C 225 98, 232 90, 235 78
             C 255 72, 288 78, 308 98
             C 328 118, 323 148, 303 168
             C 285 186, 255 186, 235 180 Z" 
          fill="#010306" />

    <!-- 幽灵眼睛 -->
    <g fill="#00ffff" filter="url(#eyeGlow)">
      <ellipse cx="258" cy="122" rx="5.5" ry="10" transform="rotate(-20, 258, 122)" />
      <ellipse cx="288" cy="120" rx="5.5" ry="10" transform="rotate(20, 288, 120)" />
    </g>
  </g>

  <!-- 4. 主文本 "H ∧ N T O M" -->
  <g filter="url(#neonGlow)" fill="url(#cyanGrad)">
    <!-- H -->
    <path d="M 375 115 H 397 V 141 H 423 V 115 H 445 V 185 H 423 V 159 H 397 V 185 H 375 Z" />
    <!-- A (∧) -->
    <path d="M 465 185 L 493 115 H 515 L 543 185 H 521 L 504 142 L 487 185 Z" />
    <!-- N -->
    <path d="M 560 115 H 581 L 606 158 V 115 H 626 V 185 H 606 L 581 142 V 185 H 560 Z" />
    <!-- T -->
    <path d="M 642 115 H 710 V 133 H 687 V 185 H 665 V 133 H 642 Z" />

    <!-- O -->
    <g transform="translate(22, 0)">
      <path d="M 765 150 
               A 35 35 0 1 0 695 150 
               A 35 35 0 1 0 765 150 Z" />
      <path d="M 730 142 
               A 5.5 5.5 0 1 0 730 153 
               L 733 161 
               H 727 
               L 730 153 Z" 
            fill="#010306" />
    </g>

    <!-- M -->
    <g transform="translate(26, 0)">
      <path d="M 782 115 H 802 L 820 152 L 838 115 H 858 V 185 H 838 V 145 L 824 175 H 816 L 802 145 V 185 H 782 Z" />
    </g>
  </g>

  <!-- 5. 底部装饰线与 "VPN" -->
  <g filter="url(#eyeGlow)">
    <rect x="375" y="235" width="150" height="1.8" fill="url(#lineLeftGrad)" />

    <text x="600" y="242" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="14" 
          fill="#00ffff" 
          text-anchor="middle">VPN</text>

    <rect x="650" y="235" width="150" height="1.8" fill="url(#lineRightGrad)" />
  </g>
</svg>
