<svg width="970" height="200" viewBox="0 0 970 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="970" height="200" rx="8" fill="#ffffff"/>

  <!-- 左侧品牌图标（账号小卖铺 logo：黑方块 + 遮阳棚 + @），纵向居中 -->
  <g transform="translate(44,47) scale(2.2)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#000000"/>
    <path d="M12 12 H36 L33 17 H15 Z" fill="#ffffff"/>
    <path d="M20 12 V17 M28 12 V17" stroke="#000000" stroke-width="1.4"/>
    <text x="24" y="37" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">@</text>
  </g>

  <!-- 右侧文字块 -->
  <!-- 主标题 -->
  <text x="170" y="76" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="48" font-weight="700" fill="#000000" letter-spacing="2">账号小卖铺</text>

  <!-- 标题下黑色短下划线（5字×48 + 字距≈248） -->
  <rect x="170" y="87" width="248" height="5" fill="#000000" rx="2.5"/>

  <!-- 口号 -->
  <text x="170" y="128" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="300" fill="#555555">卖各种好用的账号。
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- 卖哪些账号：分类清单（一行） -->
  <text x="170" y="163" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="400" fill="#444444" letter-spacing="1">邮箱 · 苹果 · Twitter/X · TikTok · AI · Telegram · Discord</text>
</svg>
