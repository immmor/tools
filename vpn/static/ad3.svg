<svg width="970" height="200" viewBox="0 0 970 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="970" height="200" rx="8" fill="#ffffff"/>

  <!-- 左侧品牌图标（账号小卖铺 logo：黑方块 + 遮阳棚 + @），纵向居中 (58–142, 中心100) -->
  <g transform="translate(56,58) scale(1.75)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#000000"/>
    <path d="M12 12 H36 L33 17 H15 Z" fill="#ffffff"/>
    <path d="M20 12 V17 M28 12 V17" stroke="#000000" stroke-width="1.4"/>
    <text x="24" y="37" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">@</text>
  </g>

  <!-- 右侧文字块：与 logo 等高居中，上下留白一致 -->
  <!-- 主标题 -->
  <text x="168" y="84" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="40" font-weight="700" fill="#000000" letter-spacing="2">账号小卖铺</text>

  <!-- 标题下黑色短下划线（与标题等宽：5字×40 + 字距≈208） -->
  <rect x="168" y="94" width="208" height="4" fill="#000000" rx="2"/>

  <!-- 口号（与标题组拉开间距） -->
  <text x="168" y="124" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="300" fill="#555555">卖各种好用的账号。
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- 卖哪些账号：分类清单（精简为常用 11 个，一行左对齐） -->
  <text x="168" y="148" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#444444" letter-spacing="1">邮箱 · 苹果 · Gmail · Facebook · Twitter/X · Instagram · TikTok · AI · Telegram · Discord · Amazon</text>
</svg>
