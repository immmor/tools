<svg width="970" height="200" viewBox="0 0 970 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 白底卡片，无黑边，呼应小卖铺极简黑白风 -->
  <rect width="970" height="200" rx="8" fill="#ffffff"/>

  <!-- 左侧竖排小标签，仿 tab 选中态 -->
  <rect x="60" y="70" width="6" height="60" fill="#000000" rx="3"/>
  <text x="84" y="92" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#000000">
    账号
  </text>
  <text x="84" y="120" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="400" fill="#000000">
    小卖铺
  </text>

  <!-- 主标题 -->
  <text x="560" y="96" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="56" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="2">
    账号小卖铺
  </text>

  <!-- 标题下黑色短下划线（呼应 tab 选中态 border-b-2 border-black） -->
  <rect x="470" y="110" width="180" height="4" fill="#000000" rx="2"/>

  <!-- 口号（来自首页：卖各种好用的账号。） -->
  <text x="560" y="158" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="300" fill="#555555" text-anchor="middle">
    卖各种好用的账号。
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
