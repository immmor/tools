<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- OKX Logo 中的 'X' 由三个正方形（黑/黑/黑）和两个小矩形（白/白，作为间隙/交叉感）在 3x3 栅格中构成 -->
  <!-- 这里采用纯矢量路径精准拼出 X 图形，自带 1:1 正方形 Canvas 居中布局 -->
  <g transform="translate(10, 10) scale(0.8)">
    <path fill="currentColor" fill-rule="evenodd" d="
      M 0 0 H 33.33 V 33.33 H 0 Z
      M 66.67 0 H 100 V 33.33 H 66.67 Z
      M 33.33 33.33 H 66.67 V 66.67 H 33.33 Z
      M 0 66.67 H 33.33 V 100 H 0 Z
      M 66.67 66.67 H 100 V 100 H 66.67 Z
    "/>
  </g>
</svg>
