<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <defs>
    <!-- 正方形背景渐变 -->
    <radialGradient id="iconBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#051525" />
      <stop offset="100%" stop-color="#010306" />
    </radialGradient>

    <!-- 主青色霓虹渐变 -->
    <linearGradient id="iconCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="70%" stop-color="#00bbee" />
      <stop offset="100%" stop-color="#0077aa" />
    </linearGradient>

    <!-- 强霓虹发光滤镜 -->
    <filter id="iconNeonGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 眼睛柔和发光滤镜 -->
    <filter id="iconEyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. 暗黑背景 (正方形) -->
  <rect width="360" height="360" rx="40" fill="url(#iconBgGrad)" />

  <!-- Icon 整体平衡容器 (向左微调平移以对齐左右留白) -->
  <g transform="translate(-8, 10)">
    <!-- 2. 左侧动态流光与粒子 -->
    <g filter="url(#iconNeonGlow)" fill="url(#iconCyanGrad)">
      <rect x="120" y="95" width="60" height="6" rx="3" opacity="0.8" />
      <rect x="85" y="116" width="95" height="8" rx="4" opacity="0.9" />
      <rect x="50" y="140" width="130" height="10" rx="5" />
      <rect x="70" y="164" width="110" height="8" rx="4" opacity="0.85" />
      <rect x="40" y="188" width="140" height="10" rx="5" />
      <rect x="65" y="212" width="105" height="8" rx="4" opacity="0.8" />
      <rect x="100" y="234" width="60" height="6" rx="3" opacity="0.6" />

      <circle cx="100" cy="98" r="2.5" opacity="0.7" />
      <circle cx="60" cy="120" r="3.5" opacity="0.8" />
      <circle cx="35" cy="145" r="3" opacity="0.9" />
      <circle cx="50" cy="168" r="2.5" opacity="0.7" />
      <circle cx="25" cy="193" r="3.5" />
      <circle cx="48" cy="216" r="2.5" opacity="0.7" />
      <circle cx="85" cy="237" r="2" opacity="0.5" />
    </g>

    <!-- 3. 主 P 字母 + 幽灵负空间 -->
    <g filter="url(#iconNeonGlow)">
      <!-- 完整 P 字母本体 -->
      <path d="M 180 70 
               L 285 70 
               A 65 65 0 0 1 350 135 
               A 65 65 0 0 1 285 200 
               L 220 200 
               C 198 222, 175 248, 160 275 
               C 182 258, 202 230, 215 210 
               L 215 200 
               L 215 275
               L 180 275 
               Z" 
            fill="url(#iconCyanGrad)" />

      <!-- 幽灵剪影 (黑洞负空间) -->
      <path d="M 235 200
               C 218 185, 205 165, 208 148
               C 218 143, 222 132, 215 120
               C 225 118, 232 110, 235 98
               C 255 92, 288 98, 308 118
               C 328 138, 323 168, 303 188
               C 285 206, 255 206, 235 200 Z" 
            fill="#010306" />

      <!-- 幽灵双眼 -->
      <g fill="#00ffff" filter="url(#iconEyeGlow)">
        <ellipse cx="258" cy="142" rx="5.5" ry="10" transform="rotate(-20, 258, 142)" />
        <ellipse cx="288" cy="140" rx="5.5" ry="10" transform="rotate(20, 288, 140)" />
      </g>
    </g>
  </g>
</svg>
