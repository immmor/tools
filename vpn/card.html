
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom · Global Network</title>
<style>
:root {
  --blue: #3478f6;
  --ink: #182943;
  --muted: #7d8ca3;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 56px 24px;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 4% 0%, #d5e8ff 0%, transparent 40%),
    radial-gradient(ellipse at 100% 95%, #e1e4ff 0%, transparent 35%),
    #f5f8fd;
}

.wrapper {
  max-width: 1120px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  margin-bottom: 38px;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;
}

.pulse {
  width: 7px;
  height: 7px;
  background: #36c99a;
  border-radius: 50%;
  box-shadow: 0 0 0 4px #36c99a22;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 5vw, 48px);
  font-weight: 750;
  letter-spacing: -2px;
}

.subtitle {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
}

.live {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border: 1px solid #e2e9f4;
  border-radius: 30px;
  background: #ffffffb8;
  color: #65758c;
  font-size: 12px;
  white-space: nowrap;
}

.grid {
  display: grid;
  grid-template-columns: 1.12fr 0.88fr;
  gap: 20px;
  align-items: stretch;
}

.column {
  display: grid;
  gap: 20px;
}

.node {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 220px;
  padding: 24px;
  border: 1px solid #ffffff;
  border-radius: 25px;
  background: #fff;
  box-shadow:
    0 12px 35px #243c6010,
    0 2px 5px #243c6008;
  transition: transform .3s ease, box-shadow .3s ease;
}

.node:hover {
  transform: translateY(-5px);
  box-shadow: 0 22px 45px #243c601a;
}

.node.large {
  min-height: 460px;
}

.flag {
  position: absolute;
  z-index: -2;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .20;
  filter: saturate(1.08);
  transition: transform .6s ease, opacity .4s ease;
}

.node:hover .flag {
  transform: scale(1.06);
  opacity: .28;
}

.wash {
  position: absolute;
  z-index: -1;
  inset: 0;
  background:
    linear-gradient(110deg, #fff 4%, #ffffffef 35%, #ffffff9c 100%),
    linear-gradient(0deg, #eaf2ff88, transparent 65%);
}

.node.large .wash {
  background:
    linear-gradient(110deg, #fff 0%, #ffffffeb 38%, #ffffff92 100%),
    linear-gradient(0deg, #dbeaffaa, transparent 70%);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.country {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 17px;
  font-weight: 700;
}

.flag-icon {
  width: 37px;
  height: 27px;
  object-fit: cover;
  border-radius: 6px;
  box-shadow: 0 2px 8px #17294320;
}

.region {
  color: #8a9ab0;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 1.7px;
}

.speed-block {
  position: absolute;
  left: 25px;
  right: 25px;
  bottom: 24px;
}

.speed-label {
  color: #7889a0;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 1.8px;
  text-transform: uppercase;
}

.speed {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 7px;
  white-space: nowrap;
}

.number {
  font-size: clamp(38px, 5vw, 57px);
  line-height: 1;
  font-weight: 760;
  letter-spacing: -2.5px;
  color: #1d3150;
  font-variant-numeric: tabular-nums;
}

.large .number {
  font-size: clamp(56px, 7vw, 78px);
}

.unit {
  color: #8292a8;
  font-size: 13px;
  font-weight: 600;
}

.speed-line {
  height: 4px;
  width: 100%;
  margin-top: 19px;
  overflow: hidden;
  border-radius: 10px;
  background: #dfe9f7;
}

.speed-line span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #70b7ff, #3478f6);
  animation: grow .9s ease both;
}

.large .speed-line {
  height: 5px;
  margin-top: 23px;
}

@keyframes grow {
  from { width: 0; }
}

.footer {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-top: 26px;
  color: #93a0b3;
  font-size: 11px;
}

.footer span:last-child {
  text-align: right;
}

@media (min-width: 850px) {
  .grid {
    grid-template-columns: 1.08fr .92fr;
  }
  .column.right {
    grid-template-rows: 1fr 1fr;
  }
  .column.left .node:not(.large) {
    min-height: 220px;
  }
}

@media (max-width: 650px) {
  body { padding: 32px 16px; }
  .header {
    align-items: flex-start;
    flex-direction: column;
    margin-bottom: 25px;
  }
  .grid { grid-template-columns: 1fr; gap: 14px; }
  .column { gap: 14px; }
  .node, .node.large { min-height: 220px; }
  .large .number { font-size: 55px; }
  .footer { line-height: 1.6; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<main class="wrapper">
  <header class="header">
    <div>
      <div class="eyebrow"><span class="pulse"></span> PHANTOM NETWORK</div>
      <h1>Find your fastest route.</h1>
      <div class="subtitle">全球节点 · 一眼找到适合你的连接</div>
    </div>
    <div class="live"><span class="pulse"></span> Global Network</div>
  </header>

  <section class="grid">
    <div class="column left">
      <article class="node large">
        <img class="flag" src="https://flagcdn.com/us.svg" alt="">
        <div class="wash"></div>
        <div class="top">
          <div class="country">
            <img class="flag-icon" src="https://flagcdn.com/w80/us.png" alt="美国国旗">
            <span>美国</span>
          </div>
          <span class="region">US · NORTH AMERICA</span>
        </div>
        <div class="speed-block">
          <div class="speed-label">Connection speed</div>
          <div class="speed">
            <span class="number" data-speed="298">298</span>
            <span class="unit">Mbps</span>
          </div>
          <div class="speed-line"><span style="width:94%"></span></div>
        </div>
      </article>

      <article class="node">
        <img class="flag" src="https://flagcdn.com/jp.svg" alt="">
        <div class="wash"></div>
        <div class="top">
          <div class="country">
            <img class="flag-icon" src="https://flagcdn.com/w80/jp.png" alt="日本国旗">
            <span>日本</span>
          </div>
          <span class="region">JP · ASIA</span>
        </div>
        <div class="speed-block">
          <div class="speed-label">Connection speed</div>
          <div class="speed">
            <span class="number" data-speed="235">235</span>
            <span class="unit">Mbps</span>
          </div>
          <div class="speed-line"><span style="width:74%"></span></div>
        </div>
      </article>
    </div>

    <div class="column right">
      <article class="node">
        <img class="flag" src="https://flagcdn.com/hk.svg" alt="">
        <div class="wash"></div>
        <div class="top">
          <div class="country">
            <img class="flag-icon" src="https://flagcdn.com/w80/hk.png" alt="中国香港区旗">
            <span>中国香港</span>
          </div>
          <span class="region">HK · ASIA</span>
        </div>
        <div class="speed-block">
          <div class="speed-label">Connection speed</div>
          <div class="speed">
            <span class="number" data-speed="267">267</span>
            <span class="unit">Mbps</span>
          </div>
          <div class="speed-line"><span style="width:84%"></span></div>
        </div>
      </article>

      <article class="node">
        <img class="flag" src="https://flagcdn.com/de.svg" alt="">
        <div class="wash"></div>
        <div class="top">
          <div class="country">
            <img class="flag-icon" src="https://flagcdn.com/w80/de.png" alt="德国国旗">
            <span>德国</span>
          </div>
          <span class="region">DE · EUROPE</span>
        </div>
        <div class="speed-block">
          <div class="speed-label">Connection speed</div>
          <div class="speed">
            <span class="number" data-speed="189">189</span>
            <span class="unit">Mbps</span>
          </div>
          <div class="speed-line"><span style="width:60%"></span></div>
        </div>
      </article>
    </div>
  </section>

  <footer class="footer">
    <span>PHANTOM · GLOBAL CONNECTION</span>
    <span>演示速度，仅供界面展示</span>
  </footer>
</main>
</body>
</html>
