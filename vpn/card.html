
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom · Global Network</title>
<style>
:root {
  --blue: #3478f6;
  --ink: #182943;
  --muted: #7d8ca3;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 56px 24px;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 4% 0%, #d5e8ff 0%, transparent 40%),
    radial-gradient(ellipse at 100% 95%, #e1e4ff 0%, transparent 35%),
    #f5f8fd;
}

.wrapper {
  max-width: 1120px;
  margin: auto;
}

.header {
  margin-bottom: 38px;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;
}

.pulse {
  width: 7px;
  height: 7px;
  background: #36c99a;
  border-radius: 50%;
  box-shadow: 0 0 0 4px #36c99a22;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 5vw, 48px);
  font-weight: 750;
  letter-spacing: -2px;
}

.subtitle {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
  align-items: stretch;
}

.node {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 150px;
  padding: 22px;
  border: 1px solid #ffffff;
  border-radius: 22px;
  background: #fff;
  box-shadow:
    0 12px 35px #243c6010,
    0 2px 5px #243c6008;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 18px;
  transition: transform .3s ease, box-shadow .3s ease;
}

.node:hover {
  transform: translateY(-5px);
  box-shadow: 0 22px 45px #243c601a;
}

.country {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* 国旗：方形，无圆角，带阴影 */
.flag {
  width: 44px;
  height: 30px;
  object-fit: cover;
  box-shadow: 0 2px 8px rgba(23, 41, 67, .25);
}

.name {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
}

.speed {
  display: flex;
  align-items: baseline;
  gap: 7px;
  white-space: nowrap;
}

.number {
  font-size: clamp(38px, 5vw, 52px);
  line-height: 1;
  font-weight: 760;
  letter-spacing: -2.5px;
  color: #1d3150;
  font-variant-numeric: tabular-nums;
}

.unit {
  color: #8292a8;
  font-size: 13px;
  font-weight: 600;
}

.footer {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-top: 26px;
  color: #93a0b3;
  font-size: 11px;
}

.footer span:last-child {
  text-align: right;
}

@media (max-width: 650px) {
  body { padding: 32px 16px; }
  .header { margin-bottom: 25px; }
  .footer { line-height: 1.6; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<main class="wrapper">
  <header class="header">
    <div class="eyebrow"><span class="pulse"></span> PHANTOM NETWORK</div>
    <h1>Find your fastest route.</h1>
    <div class="subtitle">全球节点 · 一眼找到适合你的连接</div>
  </header>

  <section class="grid">
    <article class="node">
      <div class="country">
        <img class="flag" src="https://flagcdn.com/w80/us.png" alt="美国国旗">
        <span class="name">美国</span>
      </div>
      <div class="speed">
        <span class="number">298</span>
        <span class="unit">Mbps</span>
      </div>
    </article>

    <article class="node">
      <div class="country">
        <img class="flag" src="https://flagcdn.com/w80/jp.png" alt="日本国旗">
        <span class="name">日本</span>
      </div>
      <div class="speed">
        <span class="number">235</span>
        <span class="unit">Mbps</span>
      </div>
    </article>

    <article class="node">
      <div class="country">
        <img class="flag" src="https://flagcdn.com/w80/hk.png" alt="中国香港区旗">
        <span class="name">中国香港</span>
      </div>
      <div class="speed">
        <span class="number">267</span>
        <span class="unit">Mbps</span>
      </div>
    </article>

    <article class="node">
      <div class="country">
        <img class="flag" src="https://flagcdn.com/w80/de.png" alt="德国国旗">
        <span class="name">德国</span>
      </div>
      <div class="speed">
        <span class="number">189</span>
        <span class="unit">Mbps</span>
      </div>
    </article>
  </section>

  <footer class="footer">
    <span>PHANTOM · GLOBAL CONNECTION</span>
    <span>演示速度，仅供界面展示</span>
  </footer>
</main>
</body>
</html>
