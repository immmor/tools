<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>客服回复台 · PHANTOM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f17; color: #e5e7eb; height: 100vh; overflow: hidden; }
  .hidden { display: none !important; }

  /* 登录 */
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 28%, #14233a 0%, #0b0f17 62%); z-index: 10; }
  .login-card { width: 320px; background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 32px 28px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .login-logo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #14321f; color: #22c55e; font-size: 24px; }
  .login-card h1 { margin: 0; font-size: 22px; letter-spacing: 3px; color: #fff; }
  .login-sub { margin: 6px 0 22px; font-size: 13px; color: #9ca3af; }
  .login-field { display: flex; align-items: center; gap: 8px; background: #0b0f17; border: 1px solid #374151; border-radius: 10px; padding: 0 12px; margin-bottom: 16px; }
  .login-field i { color: #6b7280; font-size: 14px; }
  .login-field input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #fff; padding: 12px 0; font-size: 15px; }
  .login-card > button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #22c55e; color: #04210f; font-weight: 700; font-size: 15px; letter-spacing: 2px; cursor: pointer; transition: filter .15s; }
  .login-card > button:hover { filter: brightness(1.08); }
  .login-card > button:disabled { opacity: .6; cursor: not-allowed; filter: none; }
  #loginErr { color: #f87171; font-size: 12px; margin-top: 8px; }

  /* 主界面 */
  #app { display: flex; height: 100vh; }
  #sidebar { width: 260px; background: #0e1420; border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
  .side-head { position: relative; padding: 12px 16px; border-bottom: 1px solid #1f2937; font-weight: 600; font-size: 16px; line-height: 1.5; color: #9ca3af; }
  .side-close { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: 0; color: #9ca3af; cursor: pointer; font-size: 16px; padding: 4px 8px; line-height: 1; }
  .side-close:hover { color: #e5e7eb; }
  body.theme-light .side-close { color: #6b7280; }
  body.theme-light .side-close:hover { color: #2b2823; }
  .tab-bar { display: flex; border-bottom: 1px solid #1f2937; }
  .tab-bar .tab { flex: 1; padding: 9px 0; background: transparent; border: 0; color: #9ca3af; font-size: 13px; font-family: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-bar .tab.active { color: #22c55e; border-bottom-color: #22c55e; }
  #userList { flex: 1; overflow-y: auto; }
  .user-item { padding: 10px 12px; border-bottom: 1px solid #161e2c; cursor: pointer; }
  .user-item:hover { background: #111827; }
  .user-item.active { background: #14321f; }
  .uname { font-weight: 600; font-size: 13px; }
  .uprev { font-size: 11px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #main { flex: 1; display: flex; flex-direction: column; }
  #convHead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #1f2937; font-weight: 600; line-height: 1; }
  #convHead button { background: transparent; color: #e5e7eb; border: 0; padding: 4px 8px; margin: 0; cursor: pointer; font-size: 16px; line-height: 1; display: inline-flex; align-items: center; }
  #convTitle { line-height: 1; }
  #sidebar { transition: width .2s ease, border-width .2s ease; overflow: hidden; }
  #sidebar.collapsed { width: 0; border-right: 0; }
  #thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { max-width: 75%; padding: 8px 12px; border-radius: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-start; background: #1f2937; }
  .agent { align-self: flex-end; background: #14532d; }
  .meta { font-size: 11px; opacity: .6; margin-top: 2px; }
  footer { padding: 12px 16px; border-top: 1px solid #1f2937; display: flex; gap: 8px; }
  footer textarea { flex: 1; resize: none; height: 44px; background: #111827; border: 1px solid #374151; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 22px; }
  footer textarea::placeholder { font-size: 14px; color: #6b7280; }
  footer button { background: #22c55e; color: #04210f; border: 0; padding: 0 16px; border-radius: 8px; font-weight: 700; font-size: 14px; font-family: inherit; cursor: pointer; }
  footer button:disabled { opacity: .5; cursor: not-allowed; }

  /* 白天模式 */
  body.theme-light { background: #f3f1ec; color: #2b2823; }
  body.theme-light #login { background: radial-gradient(circle at 50% 28%, #ffffff 0%, #e9e6df 62%); }
  body.theme-light .login-card { background: #ffffff; border-color: #e2dfd6; }
  body.theme-light .login-card h1 { color: #2b2823; }
  body.theme-light .login-sub { color: #6b7280; }
  body.theme-light .login-logo { background: #dcfce7; }
  body.theme-light .login-field { background: #f5f3ec; border-color: #d1d5db; }
  body.theme-light .login-field input { color: #2b2823; }
  body.theme-light #sidebar { background: #ffffff; border-right-color: #e2dfd6; }
  body.theme-light .side-head { color: #2b2823; border-bottom-color: #e2dfd6; }
  body.theme-light .tab-bar { border-bottom-color: #e2dfd6; }
  body.theme-light .tab-bar .tab { color: #6b7280; }
  body.theme-light .user-item { border-bottom-color: #eee; }
  body.theme-light .user-item:hover { background: #f3f1ec; }
  body.theme-light .user-item.active { background: #dcfce7; }
  body.theme-light .uprev { color: #6b7280; }
  body.theme-light #convHead { border-bottom-color: #e2dfd6; }
  body.theme-light #convHead button { color: #2b2823; }
  body.theme-light .row.user { background: #e5e7eb; }
  body.theme-light .row.agent { background: #22c55e; color: #04210f; }
  body.theme-light footer { border-top-color: #e2dfd6; }
  body.theme-light footer textarea { background: #ffffff; border-color: #d1d5db; color: #2b2823; }
  #convHead #toggleTheme { margin-left: auto; }

  /* 小屏幕：侧边栏展开时占满宽度（覆盖在对话区之上），对话区始终铺满在下方 */
  @media (max-width: 768px) {
    #app { position: relative; }
    #sidebar { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; z-index: 5; transition: transform .2s ease; }
    #sidebar.collapsed { transform: translateX(-100%); width: 100%; border-right: 0; }
    #main { width: 100%; }
  }

  /* 未选择会话：欢迎页 */
  .welcome { margin: auto; text-align: center; max-width: 380px; color: #9ca3af; }
  .welcome .w-logo { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #14321f; color: #22c55e; font-size: 28px; }
  .welcome .w-title { font-size: 18px; font-weight: 600; color: #e5e7eb; margin-bottom: 8px; }
  .welcome .w-sub { font-size: 13px; line-height: 1.7; }
  body.theme-light .welcome { color: #6b7280; }
  body.theme-light .welcome .w-title { color: #2b2823; }
  body.theme-light .welcome .w-logo { background: #dcfce7; }
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="login-logo"><i class="fas fa-headset"></i></div>
    <h1>PHANTOM</h1>
    <p class="login-sub">客服工作台 · 登录</p>
    <div class="login-field">
      <i class="fas fa-lock"></i>
      <input id="pwd" type="password" placeholder="请输入客服密码" autocomplete="current-password">
    </div>
    <button id="loginBtn">登 录</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="side-head">用户会话<button id="sideClose" class="side-close" title="折叠侧边栏"><i class="fas fa-times"></i></button></div>
    <div class="tab-bar">
      <button class="tab active" data-tab="supabase">实时</button>
      <button class="tab" data-tab="inbox">消息</button>
    </div>
    <div id="userList"></div>
  </aside>
  <main id="main">
    <header id="convHead">
      <button id="toggleSide" title="折叠/展开会话列表"><i class="fas fa-bars"></i></button>
      <span id="convTitle">未选择会话</span>
      <button id="toggleTheme" title="切换白天/黑夜模式"><i class="fas fa-moon"></i></button>
    </header>
    <div id="thread"></div>
    <footer id="composer">
      <textarea id="msg" placeholder="输入回复，Enter 发送…"></textarea>
      <button id="send" disabled>发送</button>
    </footer>
  </main>
</div>

<script>
// ===== 配置 =====
const SUPABASE_URL = 'https://imuopmivywtlzzlwgtmi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdW9wbWl2eXd0bHp6bHdndG1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxNzM0MjMsImV4cCI6MjA3NDc0OTQyM30.ItR-A59_dHmfM2eECU3ENeJxGpATPz_hnQaTwAoKQaM';
const API_BASE = 'https://api.funbua.uk';   // Worker 域名，登录走 /api/login

const $ = (id) => document.getElementById(id);
const users = new Map();          // username -> { last, time }
const rendered = new Set();
let sb = null, channel = null, currentUser = '', currentTab = 'supabase';

const fmt = (d) => new Date(d).toLocaleString();

// 从投诉内容解析发送者（格式：[投诉] 用户: NAME\n内容: ...）
function parseSender(content) {
  const m = (content || '').match(/用户:\s*([^\n]+)/);
  return m ? m[1].trim() : null;
}
// 去掉 [投诉] 用户: ...\n内容: 前缀，便于阅读
function stripPrefix(content) {
  const m = (content || '').match(/^\[投诉\][\s\S]*?内容:\s*/);
  return m ? content.slice(m[0].length) : content;
}

// 渲染一条消息；dir: 'user'=用户(左) / 'agent'=客服(右)
function renderMsg(row, dir) {
  if (row.id && rendered.has(row.id)) return;
  if (row.id) rendered.add(row.id);
  const div = document.createElement('div');
  div.className = 'row ' + (dir === 'agent' ? 'agent' : 'user');
  div.innerHTML = `<div></div><div class="meta">${dir === 'agent' ? '客服' : '用户'} · ${fmt(row.created_at)}</div>`;
  div.firstChild.textContent = stripPrefix(row.content);
  $('thread').appendChild(div);
  $('thread').scrollTop = $('thread').scrollHeight;
}

// 左侧用户列表（发送者 -> 最近消息预览）
function upsertUser(name, preview, time) {
  const prev = users.get(name);
  if (!prev || new Date(time) >= new Date(prev.time)) users.set(name, { last: preview, time });
  renderUserList();
}
function renderUserList() {
  const el = $('userList'); el.innerHTML = '';
  [...users.keys()]
    .sort((a, b) => new Date(users.get(b).time) - new Date(users.get(a).time))
    .forEach((name) => {
      const u = users.get(name);
      const d = document.createElement('div');
      d.className = 'user-item' + (name === currentUser ? ' active' : '');
      d.innerHTML = `<div class="uname"></div><div class="uprev"></div>`;
      d.querySelector('.uname').textContent = name;
      d.querySelector('.uprev').textContent = u.last || '';
      d.onclick = () => selectUser(name);
      el.appendChild(d);
    });
}

// 用户列表：按当前 Tab 取数据
//  - supabase：Supabase support_messages（默认），按真实用户名聚合
//  - inbox：D1 immmor 收件箱（用户发给 immmor 的投诉，排除系统通知）
async function loadUsers() {
  users.clear();
  if (currentTab === 'supabase') {
    if (!sb) { $('convTitle').textContent = '未配置 Supabase'; return; }
    const { data, error } = await sb.from('support_messages').select('username, content, created_at').order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    (data || []).forEach((r) => upsertUser(r.username, r.content, r.created_at));
  } else {
    try {
      const res = await fetch(`${API_BASE}/api/messages?username=immmor`);
      const data = await res.json();
      const list = (data && data.data && data.data.messages) || [];
      list.forEach((m) => {
        const sender = parseSender(m.content);
        if (!sender) return; // 跳过系统通知等非用户投诉消息
        const text = stripPrefix(m.content);
        const prev = users.get(sender);
        if (!prev || new Date(m.created_at) >= new Date(prev.time)) {
          users.set(sender, { last: text, time: m.created_at });
        }
      });
      renderUserList();
    } catch (e) { console.error(e); }
  }
}

// 未选择会话时的欢迎页
function showWelcome() {
  const t = $('thread');
  t.innerHTML = '';
  $('composer').style.display = 'none'; // 未选会话：隐藏输入框与发送按钮
  const div = document.createElement('div');
  div.className = 'welcome';
  div.innerHTML = `<div class="w-logo"><i class="fas fa-headset"></i></div>`
    + `<div class="w-title">欢迎使用 PHANTOM 客服工作台</div>`
    + `<div class="w-sub">从左侧选择一个会话开始回复 · 顶部可切换「实时 / 消息」与白天 / 黑夜模式</div>`;
  t.appendChild(div);
}

// 打开某用户会话：按当前 Tab 取对应数据源
async function selectUser(name) {
  currentUser = name;
  $('convTitle').textContent = '与 ' + name + ' 的会话';
  $('send').disabled = false;
  $('composer').style.display = '';
  $('thread').innerHTML = ''; rendered.clear();
  if (window.matchMedia('(max-width: 768px)').matches) $('sidebar').classList.add('collapsed'); // 小屏：选中会话后收起侧边栏以显示对话
  if (currentTab === 'supabase') {
    if (!sb) return;
    const { data, error } = await sb.from('support_messages').select('*').eq('username', name).order('created_at');
    if (!error) (data || []).forEach((r) => renderMsg(r, r.from_role === 'agent' ? 'agent' : 'user'));
  } else {
    // inbox：immmor 收件箱(用户发的) + 该用户收件箱(immmor 回复的) 合并
    try {
      const inbox = await (await fetch(`${API_BASE}/api/messages?username=immmor`)).json();
      const complaints = ((inbox.data && inbox.data.messages) || [])
        .filter((m) => parseSender(m.content) === name)
        .map((m) => ({ ...m, dir: 'user' }));
      const out = await (await fetch(`${API_BASE}/api/messages?username=${encodeURIComponent(name)}`)).json();
      const replies = ((out.data && out.data.messages) || []).map((m) => ({ ...m, dir: 'agent' }));
      complaints.concat(replies)
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
        .forEach((m) => renderMsg(m, m.dir));
    } catch (e) { console.error(e); }
  }
}

// 回复：写回 D1 用户收件箱（Worker 会同步镜像到 Supabase，用户端实时收到）
async function send() {
  const text = $('msg').value.trim();
  if (!text || !currentUser) return;
  $('send').disabled = true;
  try {
    const res = await fetch(`${API_BASE}/api/send-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text, target: 'single', username: currentUser })
    });
    const data = await res.json();
    if (data.code === 200) {
      $('msg').value = '';
      selectUser(currentUser); // 重新拉取，确保回复出现在会话里
    } else {
      alert(data.msg || '发送失败');
    }
  } catch (e) {
    alert('网络错误，请重试');
  } finally {
    $('send').disabled = false;
  }
}

// 数据源 B：保留 Supabase 订阅，仅用于感知「用户新消息」并刷新（客服回复由本地/接口保证，不重复渲染）
function setupRealtime() {
  if (!sb) return;
  channel = sb.channel('cs-global')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages' }, (p) => {
      const r = p.new;
      if (r.from_role !== 'user') return; // 只看用户发来的
      loadUsers();
      if (r.username === currentUser) renderMsg({ ...r, id: r.id }, 'user');
    })
    .subscribe();
}

function setCookie(name, value, days) {
  const d = new Date(Date.now() + days * 864e5);
  document.cookie = `${name}=${encodeURIComponent(value)}; expires=${d.toUTCString()}; path=/`;
}
function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

// 进入主界面（cookie 的过期由浏览器按 expires 判断，无需手动校验）
function enterApp() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    setupRealtime(); // 保留 Supabase 实时：感知用户新消息
  }
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  currentUser = '';
  showWelcome();
  if (window.matchMedia('(max-width: 768px)').matches) $('sidebar').classList.add('collapsed'); // 小屏默认收起侧边栏，直接显示欢迎页
  loadUsers(); // 默认加载 Supabase Tab 的用户列表（收件箱 Tab 在切换时加载）
  setInterval(() => { if (!document.hidden) loadUsers(); }, 20000); // 兜底刷新（收件箱 Tab 才打 D1；隐藏标签页时暂停）
}

async function doLogin() {
  const pwd = $('pwd').value;
  if (!pwd) { $('loginErr').textContent = '请输入密码'; return; }
  const btn = $('loginBtn');
  btn.disabled = true;
  btn.textContent = '正在登录';
  try {
    const res = await fetch(`${API_BASE}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'immmor', password: pwd })
    });
    const data = await res.json();
    if (!data.success) { $('loginErr').textContent = data.message || '登录失败'; btn.disabled = false; btn.textContent = '登 录'; return; }
    window.csUser = data.userInfo;
    setCookie('cs_auth', '1', 1); // 记住登录 1 天
    enterApp();
  } catch (e) {
    $('loginErr').textContent = '网络错误，请重试';
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (getCookie('cs_auth')) enterApp();   // 已有有效登录 cookie，直接进入，无需重复登录

  // 白天/黑夜模式（localStorage 记忆）
  const applyTheme = (light) => {
    document.body.classList.toggle('theme-light', light);
    $('toggleTheme').querySelector('i').className = light ? 'fas fa-sun' : 'fas fa-moon';
  };
  let themeLight = localStorage.getItem('csTheme') === 'light';
  applyTheme(themeLight);
  $('toggleTheme').addEventListener('click', () => {
    themeLight = !themeLight;
    localStorage.setItem('csTheme', themeLight ? 'light' : 'dark');
    applyTheme(themeLight);
  });

  // 用户列表两个 Tab：实时（默认，Supabase 实时） / 消息（D1 immmor 收件箱）
  document.querySelectorAll('.tab-bar .tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('active')) return;
      document.querySelectorAll('.tab-bar .tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      currentUser = '';
      showWelcome();
      $('send').disabled = true;
      $('convTitle').textContent = '未选择会话';
      loadUsers();
    });
  });

  $('loginBtn').addEventListener('click', doLogin);
  $('pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  $('toggleSide').addEventListener('click', () => $('sidebar').classList.toggle('collapsed'));
  $('sideClose').addEventListener('click', () => $('sidebar').classList.toggle('collapsed'));
  $('send').addEventListener('click', send);
  $('msg').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
});
</script>
</body>
</html>
