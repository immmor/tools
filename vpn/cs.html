<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>客服回复台 · PHANTOM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f17; color: #e5e7eb; height: 100vh; overflow: hidden; }
  .hidden { display: none !important; }

  /* 登录 */
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 28%, #14233a 0%, #0b0f17 62%); z-index: 10; }
  .login-card { width: 320px; background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 32px 28px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .login-logo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #14321f; color: #22c55e; font-size: 24px; }
  .login-card h1 { margin: 0; font-size: 22px; letter-spacing: 3px; color: #fff; }
  .login-sub { margin: 6px 0 22px; font-size: 13px; color: #9ca3af; }
  .login-field { display: flex; align-items: center; gap: 8px; background: #0b0f17; border: 1px solid #374151; border-radius: 10px; padding: 0 12px; margin-bottom: 16px; }
  .login-field i { color: #6b7280; font-size: 14px; }
  .login-field input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #fff; padding: 12px 0; font-size: 15px; }
  .login-card > button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #22c55e; color: #04210f; font-weight: 700; font-size: 15px; letter-spacing: 2px; cursor: pointer; transition: filter .15s; }
  .login-card > button:hover { filter: brightness(1.08); }
  #loginErr { color: #f87171; font-size: 12px; margin-top: 8px; }

  /* 主界面 */
  #app { display: flex; height: 100vh; }
  #sidebar { width: 260px; background: #0e1420; border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
  .side-head { padding: 12px 16px; border-bottom: 1px solid #1f2937; font-weight: 600; font-size: 16px; line-height: 1.5; color: #9ca3af; }
  #userList { flex: 1; overflow-y: auto; }
  .user-item { padding: 10px 12px; border-bottom: 1px solid #161e2c; cursor: pointer; }
  .user-item:hover { background: #111827; }
  .user-item.active { background: #14321f; }
  .uname { font-weight: 600; font-size: 13px; }
  .uprev { font-size: 11px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #main { flex: 1; display: flex; flex-direction: column; }
  #convHead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #1f2937; font-weight: 600; line-height: 1; }
  #convHead button { background: transparent; color: #e5e7eb; border: 0; padding: 4px 8px; margin: 0; cursor: pointer; font-size: 16px; line-height: 1; display: inline-flex; align-items: center; }
  #convTitle { line-height: 1; }
  #sidebar { transition: width .2s ease, border-width .2s ease; overflow: hidden; }
  #sidebar.collapsed { width: 0; border-right: 0; }
  #thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { max-width: 75%; padding: 8px 12px; border-radius: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-start; background: #1f2937; }
  .agent { align-self: flex-end; background: #14532d; }
  .meta { font-size: 11px; opacity: .6; margin-top: 2px; }
  footer { padding: 12px 16px; border-top: 1px solid #1f2937; display: flex; gap: 8px; }
  footer textarea { flex: 1; resize: none; height: 44px; background: #111827; border: 1px solid #374151; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 22px; }
  footer textarea::placeholder { font-size: 14px; color: #6b7280; }
  footer button { background: #22c55e; color: #04210f; border: 0; padding: 0 16px; border-radius: 8px; font-weight: 700; font-size: 14px; font-family: inherit; cursor: pointer; }
  footer button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="login-logo"><i class="fas fa-headset"></i></div>
    <h1>PHANTOM</h1>
    <p class="login-sub">客服工作台 · 登录</p>
    <div class="login-field">
      <i class="fas fa-lock"></i>
      <input id="pwd" type="password" placeholder="请输入客服密码" autocomplete="current-password">
    </div>
    <button id="loginBtn">登 录</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="side-head">用户会话</div>
    <div id="userList"></div>
  </aside>
  <main id="main">
    <header id="convHead">
      <button id="toggleSide" title="折叠/展开会话列表"><i class="fas fa-bars"></i></button>
      <span id="convTitle">未选择会话</span>
    </header>
    <div id="thread"></div>
    <footer>
      <textarea id="msg" placeholder="输入回复，Enter 发送…"></textarea>
      <button id="send" disabled>发送</button>
    </footer>
  </main>
</div>

<script>
// ===== 配置 =====
const SUPABASE_URL = 'https://imuopmivywtlzzlwgtmi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdW9wbWl2eXd0bHp6bHdndG1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxNzM0MjMsImV4cCI6MjA3NDc0OTQyM30.ItR-A59_dHmfM2eECU3ENeJxGpATPz_hnQaTwAoKQaM';
const CS_PASSWORD = 'pwd';   // ponytail: 客户端常量密码只是门禁，非真安全（见下方说明）

const $ = (id) => document.getElementById(id);
const users = new Map();          // username -> { last, time }
const rendered = new Set();
let sb = null, channel = null, currentUser = '';

const fmt = (d) => new Date(d).toLocaleString();

function render(row) {
  if (rendered.has(row.id)) return;
  rendered.add(row.id);
  const div = document.createElement('div');
  div.className = 'row ' + (row.from_role === 'agent' ? 'agent' : 'user');
  div.innerHTML = `<div></div><div class="meta">${row.from_role === 'agent' ? '客服' : '用户'} · ${fmt(row.created_at)}</div>`;
  div.firstChild.textContent = row.content;
  $('thread').appendChild(div);
  $('thread').scrollTop = $('thread').scrollHeight;
}

// 更新左侧用户列表（含新增用户、刷新最近消息预览）
function upsertUser(name, preview, time) {
  const prev = users.get(name);
  if (!prev || new Date(time) >= new Date(prev.time)) users.set(name, { last: preview, time });
  renderUserList();
}
function renderUserList() {
  const el = $('userList'); el.innerHTML = '';
  [...users.keys()]
    .sort((a, b) => new Date(users.get(b).time) - new Date(users.get(a).time))
    .forEach((name) => {
      const u = users.get(name);
      const d = document.createElement('div');
      d.className = 'user-item' + (name === currentUser ? ' active' : '');
      d.innerHTML = `<div class="uname"></div><div class="uprev"></div>`;
      d.querySelector('.uname').textContent = name;
      d.querySelector('.uprev').textContent = u.last || '';
      d.onclick = () => selectUser(name);
      el.appendChild(d);
    });
}

async function loadUsers() {
  const { data, error } = await sb.from('support_messages').select('username, content, created_at').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  users.clear();
  (data || []).forEach((r) => upsertUser(r.username, r.content, r.created_at));
}

async function selectUser(name) {
  currentUser = name;
  $('convTitle').textContent = '与 ' + name + ' 的会话';
  $('send').disabled = false;
  $('thread').innerHTML = ''; rendered.clear();
  const { data, error } = await sb.from('support_messages').select('*').eq('username', name).order('created_at');
  if (!error) (data || []).forEach(render);
}

async function send() {
  const text = $('msg').value.trim();
  if (!text || !sb || !currentUser) return;
  $('msg').value = '';
  const { error } = await sb.from('support_messages').insert({ username: currentUser, from_role: 'agent', content: text });
  if (error) console.error(error);
}

function setupRealtime() {
  channel = sb.channel('cs-global')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages' }, (p) => {
      const r = p.new;
      upsertUser(r.username, r.content, r.created_at); // 新用户自动进列表
      if (r.username === currentUser) render(r);        // 当前会话实时渲染
    })
    .subscribe();
}

function doLogin() {
  if ($('pwd').value !== CS_PASSWORD) { $('loginErr').textContent = '密码错误'; return; }
  if (SUPABASE_URL && SUPABASE_ANON_KEY) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  if (sb) { loadUsers(); setupRealtime(); }
  else $('convTitle').textContent = '未配置 Supabase';
}

window.addEventListener('DOMContentLoaded', () => {
  $('loginBtn').addEventListener('click', doLogin);
  $('pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  $('toggleSide').addEventListener('click', () => $('sidebar').classList.toggle('collapsed'));
  $('send').addEventListener('click', send);
  $('msg').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
});
</script>
</body>
</html>
