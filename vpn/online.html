<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户在线状态检测 (仅状态切换版)</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .box { padding: 30px; border: 1px solid #ccc; display: inline-block; border-radius: 8px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #status { font-weight: bold; color: green; }
        .tip { color: #666; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>用户在线状态监控面板</h2>
        <p>当前状态: <span id="status">在线 (Online)</span></p>
        <div class="tip">
            请打开浏览器 F12 控制台 (Console)，然后尝试：<br>
            1. 切换到其他标签页或最小化窗口 (模拟离开)<br>
            2. 切回当前标签页 (模拟回来)<br>
            3. 关闭网页或刷新 (模拟彻底下线)
        </div>
    </div>

    <script>
        const userId = "user_9527"; // 模拟当前用户ID

        // 模拟发送状态更改 (仅打印日志，不发请求，无心跳)
        function mockSendStatusUpdate(status) {
            const timeStr = new Date().toLocaleTimeString();
            console.log(
                `%c[状态变更] 📤 触发状态切换 -> 用户: ${userId} | 状态: ${status.toUpperCase()} | 时间: ${timeStr}`, 
                'color: blue; font-weight: bold; background: #e6f2ff; padding: 2px 5px; border-radius: 3px;'
            );
        }

        // --- 核心事件监听 ---

        // 监听页面可见性变化 (切标签页、最小化)
        document.addEventListener('visibilitychange', function() {
            const statusSpan = document.getElementById('status');
            const timeStr = new Date().toLocaleTimeString();
            
            if (document.visibilityState === 'hidden') {
                console.warn(`%c[事件触发] 👁️‍🗨️ visibilitychange -> 页面变为了隐藏 (HIDDEN) | 离开时间: ${timeStr}`, 'color: orange; font-weight: bold;');
                statusSpan.innerText = "离开/后台 (Away)";
                statusSpan.style.color = "orange";
                
                mockSendStatusUpdate('offline'); // 状态变更为离线
            } else {
                console.log(`%c[事件触发] 👀 visibilitychange -> 页面变为了可见 (VISIBLE) | 回来时间: ${timeStr}`, 'color: green; font-weight: bold;');
                statusSpan.innerText = "在线 (Online)";
                statusSpan.style.color = "green";
                
                mockSendStatusUpdate('online');  // 状态变更为在线
            }
        });

        // 监听页面彻底卸载 (关闭网页、刷新)
        window.addEventListener('pagehide', function(event) {
            const timeStr = new Date().toLocaleTimeString();
            console.error(`%c[事件触发] ❌ pagehide -> 页面即将卸载/关闭 | 时间: ${timeStr}`, 'color: red; font-weight: bold;');
            mockSendStatusUpdate('offline');
        });

        // --- 初始化 ---
        console.log("%c[初始化] 🚀 页面加载完毕，模拟初次上线", 'color: teal; font-weight: bold;');
        mockSendStatusUpdate('online');
    </script>
</body>
</html>
