<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品列表 - talangya</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6fa; color: #1a1a2e; padding: 24px;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px; flex-wrap: wrap;
  }
  h1 { font-size: 22px; font-weight: 700; }
  .toolbar { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  button {
    background: #4f46e5; color: #fff; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 14px; cursor: pointer; transition: .2s;
  }
  button:hover { background: #4338ca; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #status { font-size: 13px; color: #6b7280; }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); transition: .2s;
  }
  .card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.1); transform: translateY(-2px); }
  .card img {
    width: 100%; height: 160px; object-fit: cover;
    border-radius: 8px; background: #eee; margin-bottom: 12px;
  }
  .card .title { font-size: 15px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
  .card .meta { font-size: 13px; color: #6b7280; display: flex; justify-content: space-between; }
  .card .price { color: #e11d48; font-weight: 700; font-size: 16px; }
  .raw {
    margin-top: 28px; background: #1e1e2e; color: #cdd6f4;
    border-radius: 12px; padding: 16px; font-size: 13px;
    max-height: 420px; overflow: auto; white-space: pre; display: none;
  }
  .raw.show { display: block; }
</style>
</head>
<body>
  <header>
    <h1>商品列表</h1>
    <div class="toolbar">
      <span id="status">点击「加载数据」发起请求</span>
      <button id="loadBtn">加载数据</button>
      <button id="rawBtn" style="background:#6b7280">查看原始 JSON</button>
    </div>
  </header>

  <div id="grid" class="grid"></div>
  <pre id="raw" class="raw"></pre>

<script>
const API = 'https://api.immmor.com/api/talangya/commodity';
const HEADERS = {
  'accept': 'application/json, text/javascript, */*; q=0.01',
  'accept-language': 'zh-CN,zh;q=0.9'
};

const grid = document.getElementById('grid');
const status = document.getElementById('status');
const raw = document.getElementById('raw');
let lastData = null;

const STOCK_STATE = { 1: '缺货', 2: '紧张', 3: '充足', 4: '现货' };

function renderCards(data) {
  // 实际结构：{ code, msg, data: [ {商品...} ] }
  const list = (data && Array.isArray(data.data)) ? data.data : (Array.isArray(data) ? data : []);

  grid.innerHTML = '';
  list.forEach(item => {
    const title = item.name || '(无标题)';
    const img = item.cover ? 'https://talangya.com' + item.cover : '';
    const price = item.price;
    const stock = item.stock !== undefined ? item.stock : '-';
    const stockState = STOCK_STATE[item.stock_state] || ('状态' + item.stock_state);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${img ? `<img src="${img}" alt="" onerror="this.style.display='none'">` : ''}
      <div class="title">${escapeHtml(title)}</div>
      <div class="meta" style="margin:8px 0 4px">
        <span class="price">¥${price}</span>
        <span style="color:#16a34a">${stockState}</span>
      </div>
      <div class="meta">
        <span>库存: ${escapeHtml(String(stock))}</span>
        <span>ID: ${item.id}</span>
      </div>`;
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function load() {
  const btn = document.getElementById('loadBtn');
  btn.disabled = true;
  status.textContent = '请求中…';
  try {
    const resp = await fetch(API, { method: 'GET', headers: HEADERS });
    const text = await resp.text();
    lastData = JSON.parse(text);
    raw.textContent = JSON.stringify(lastData, null, 2);
    renderCards(lastData);
    status.textContent = `成功，共 ${countItems(lastData)} 项`;
  } catch (e) {
    status.textContent = '请求失败：' + e.message;
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

function countItems(d) {
  if (d && Array.isArray(d.data)) return d.data.length;
  if (Array.isArray(d)) return d.length;
  return '-';
}

document.getElementById('loadBtn').addEventListener('click', load);
document.getElementById('rawBtn').addEventListener('click', () => raw.classList.toggle('show'));
</script>
</body>
</html>
