<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幸运777 老虎机</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07030f;--gold:#ffd36a;--neon:#ff2e9a;--cyan:#33e6ff;--ink:#fff4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07030f}}
:root[data-theme="dark"]{--bg:#07030f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#4a1580 0,#1a0838 42%,var(--bg) 100%) fixed;color:var(--ink);font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;overflow-x:hidden}
.stage{min-height:100vh;display:grid;place-items:center;padding:16px 10px 28px}
.rig{position:relative;display:flex;align-items:flex-start;width:min(100%,560px)}
.cab{flex:1;min-width:0;border-radius:30px 30px 22px 22px;padding:9px;background:linear-gradient(145deg,#ffe9a8,#c78a22 28%,#6b3d08 52%,#e8b54a 78%,#8a5a12);box-shadow:0 0 0 2px #2a0b00,0 0 46px rgba(255,46,154,.5),0 30px 80px rgba(0,0,0,.75)}
.cab.shake{animation:shake .6s}
@keyframes shake{10%,50%,90%{transform:translate(-5px,2px)}30%,70%{transform:translate(5px,-2px)}}
.cab-in{border-radius:22px;background:linear-gradient(#1c0b36,#0d0620);padding:12px 12px 14px;box-shadow:inset 0 0 30px #000}
h1{margin:6px 0 8px;text-align:center;font:900 clamp(26px,8vw,40px)/1.1 'Orbitron','PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.06em;background:linear-gradient(#fff6c8,#ffc93c 55%,#c46a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,46,154,.8))}
.bulbs{display:flex;justify-content:space-between;padding:0 6px}
.bulbs i{width:9px;height:9px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px rgba(255,200,80,.9);animation:bl 1s steps(1) infinite}
.bulbs i:nth-child(2n){animation-delay:-.5s}
@keyframes bl{50%{background:#4a2a05;box-shadow:none}}
@keyframes blw{0%{background:#ff2e9a;box-shadow:0 0 10px 3px #ff2e9a}33%{background:#33e6ff;box-shadow:0 0 10px 3px #33e6ff}66%{background:#ffe9a8;box-shadow:0 0 10px 3px #ffc93c}}
.rig.win .bulbs i{animation:blw .3s steps(1) infinite}
.rig.win .bulbs i:nth-child(2n){animation-delay:-.15s}
.gl{--h:clamp(58px,16vw,104px);position:relative;display:flex;gap:6px;justify-content:center;margin:10px 0;padding:10px;border-radius:16px;background:#000;box-shadow:inset 0 0 0 2px #5b3a10,0 0 0 3px #e8b54a,0 0 24px rgba(51,230,255,.25)}
.reel{position:relative;width:calc(var(--h)*1.05);height:calc(var(--h)*3);overflow:hidden;border-radius:8px;background:linear-gradient(90deg,#c9bfa8,#fffaf0 18%,#fffdf6 50%,#fffaf0 82%,#bdb299)}
.reel::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(#000 0,rgba(0,0,0,.6) 12%,transparent 36%,transparent 64%,rgba(0,0,0,.6) 88%,#000 100%)}
.reel.hit{box-shadow:0 0 0 3px var(--gold),0 0 22px 6px var(--neon);animation:hit .4s ease-in-out infinite alternate}
@keyframes hit{to{box-shadow:0 0 0 3px #fff,0 0 34px 10px var(--cyan)}}
.strip{position:absolute;inset:0}
.row{position:absolute;left:0;right:0;top:0;height:var(--h);display:grid;place-items:center;font-size:calc(var(--h)*.58);line-height:1;will-change:transform}
.s7{font:900 calc(var(--h)*.72)/1 'Orbitron',Georgia,serif;color:#e0122f;text-shadow:1px 1px 0 #7a0016,0 0 14px rgba(255,40,70,.55)}
.pline{position:absolute;left:3px;right:3px;top:50%;height:3px;transform:translateY(-50%);background:var(--neon);box-shadow:0 0 12px var(--neon),0 0 3px #fff;opacity:.85;z-index:3;pointer-events:none}
.pline::before,.pline::after{content:'';position:absolute;top:-6px;border:7px solid transparent}
.pline::before{left:-3px;border-left-color:var(--neon)}
.pline::after{right:-3px;border-right-color:var(--neon)}
.glass{position:absolute;inset:0;border-radius:16px;pointer-events:none;z-index:4;background:linear-gradient(115deg,rgba(255,255,255,.2),rgba(255,255,255,0) 34%,rgba(255,255,255,0) 62%,rgba(255,255,255,.08))}
.hud{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px}
.led{background:#050208;border:1px solid #3b2a5c;border-radius:10px;padding:6px 6px 7px;text-align:center;box-shadow:inset 0 0 14px #000}
.led small{display:block;color:#a58fd1;font-size:12px;margin-bottom:2px}
.led b{font:700 clamp(17px,5vw,24px) 'Orbitron',monospace;color:#7dffb3;text-shadow:0 0 8px rgba(80,255,160,.7)}
.led.g b{color:var(--gold);text-shadow:0 0 8px rgba(255,200,60,.8)}
.bet{display:flex;align-items:center;justify-content:center;gap:6px}
.bet button{width:26px;height:26px;border-radius:50%;border:0;background:#3b2a5c;color:#fff;font-size:16px;cursor:pointer}
.bet button:active{background:var(--neon)}
.msg{min-height:24px;margin:10px 0 8px;text-align:center;font-size:15px;color:#ffd9f0;text-shadow:0 0 10px rgba(255,46,154,.7)}
.btns{display:flex;gap:8px;justify-content:center;align-items:center}
.spin{flex:1;max-width:260px;padding:12px 18px;border:0;border-radius:999px;font:700 17px 'PingFang SC','Microsoft YaHei',sans-serif;color:#fff;cursor:pointer;background:linear-gradient(#ff6ab9,#d4146f 55%,#8b0a49);box-shadow:0 5px 0 #5a0630,0 0 22px rgba(255,46,154,.6);transition:transform .08s,box-shadow .08s}
.spin:active{transform:translateY(4px);box-shadow:0 1px 0 #5a0630,0 0 22px rgba(255,46,154,.6)}
.spin:disabled{filter:grayscale(.6);cursor:not-allowed}
.mini{padding:10px 12px;border-radius:999px;border:1px solid #5b3a8a;background:#1c0b36;color:#fff;cursor:pointer;font-size:14px}
.hint{margin:10px 0 0;text-align:center;font-size:12px;color:#8f7ab8}
.lever{position:relative;flex:none;width:64px;height:260px;margin:96px 0 0 -3px;perspective:520px;touch-action:none;cursor:grab;user-select:none}
.lever.lock{cursor:not-allowed}
.lever:active{cursor:grabbing}
.plate{position:absolute;left:0;top:104px;width:20px;height:52px;border-radius:0 10px 10px 0;background:linear-gradient(#e8b54a,#7a4a0c);box-shadow:0 2px 6px #000}
.pivot{position:absolute;left:17px;top:115px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9a9aa8 45%,#3a3a48);box-shadow:0 2px 6px #000}
.arm{position:absolute;left:26px;top:25px;width:12px;height:105px;transform-origin:50% 100%;transform-style:preserve-3d;border-radius:6px;background:linear-gradient(90deg,#555,#fff 38%,#999 62%,#2a2a33);box-shadow:0 0 6px rgba(0,0,0,.6)}
.knob{position:absolute;left:-16px;top:-22px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#ff7a9a 14%,#e0122f 45%,#6a0016 100%);box-shadow:0 0 18px rgba(255,40,70,.8)}
.lever:not(.lock) .knob{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 30px 6px rgba(255,40,70,.9)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bulbs i,.reel.hit,.lever .knob{animation:none!important}}
</style>
</head>
<body>
<main class="stage">
<div class="rig" id="rig">
  <div class="cab" id="cab"><div class="cab-in">
    <div class="bulbs" id="b1"></div>
    <h1>幸运 777</h1>
    <div class="gl" id="gl"><div class="pline"></div><div class="glass"></div></div>
    <div class="bulbs" id="b2"></div>
    <div class="hud" style="margin-top:10px">
      <div class="led"><small>余额</small><b id="eBal">1000</b></div>
      <div class="led"><small>下注</small><div class="bet"><button id="bm" aria-label="减少下注">−</button><b id="eBet">10</b><button id="bp" aria-label="增加下注">+</button></div></div>
      <div class="led g"><small>赢得</small><b id="eWin">0</b></div>
    </div>
    <div class="msg" id="msg" aria-live="polite">向下拉动右侧拉杆开始</div>
    <div class="btns"><button class="spin" id="spin">拉杆开转</button><button class="mini" id="mute" aria-label="开关声音">🔊</button><button class="mini" id="topup" hidden>充值 1000</button></div>
    <p class="hint">拖动拉杆到底，或点击拉杆、按空格键</p>
  </div></div>
  <div class="lever" id="lever" aria-hidden="true"><div class="plate"></div><div class="pivot"></div><div class="arm" id="arm"><div class="knob" id="knob"></div></div></div>
</div>
</main>
<canvas id="fx"></canvas>
<script>
const SYM=['7','🍒','🔔','🍋','💎','🍀','⭐','🍒','🔔','🍋'],L=SYM.length;
const PAY={'7':50,'💎':20,'⭐':15,'🔔':10,'🍀':8,'🍋':5,'🍒':3};
const W={'7':1,'💎':2,'⭐':3,'🔔':5,'🍀':6,'🍋':8,'🍒':10};
const BETS=[10,20,50,100,200],VMAX=26,A=.22;
const $=s=>document.querySelector(s),mod=(a,n)=>((a%n)+n)%n,rnd=n=>Math.floor(Math.random()*n);
let bal=1000,bi=0,bet=10,cur=10,spinning=false,muted=false,H=100;
const rig=$('#rig'),eBal=$('#eBal'),eBet=$('#eBet'),eWin=$('#eWin'),msg=$('#msg');

/* bulbs */
['#b1','#b2'].forEach(s=>{$(s).innerHTML='<i></i>'.repeat(15)});

/* audio */
let ac;
function tone(f,d=.08,type='sine',v=.08,f2){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
let lastTick=0;
const tick=()=>{const n=performance.now();if(n-lastTick>28){lastTick=n;tone(900+Math.random()*250,.03,'square',.02)}};
const thump=()=>{tone(140,.16,'sine',.22,50);tone(1900,.02,'square',.04)};
const clunk=()=>{tone(90,.22,'triangle',.28,40);tone(220,.6,'sawtooth',.025,700)};
const jingle=()=>[523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>tone(f,.28,'triangle',.1),i*95));

/* reels: pos is a float in symbol units; the centre row shows SYM[floor(pos) mod L] */
const html=s=>s==='7'?'<b class="s7">7</b>':s;
const reels=[0,1,2].map(i=>{
  const el=document.createElement('div');el.className='reel';
  const strip=document.createElement('div');strip.className='strip';el.appendChild(strip);
  const rows=[];for(let k=0;k<6;k++){const r=document.createElement('div');r.className='row';strip.appendChild(r);rows.push({r,s:-1})}
  $('#gl').insertBefore(el,$('.pline'));
  return{el,strip,rows,pos:[2,5,8][i],v:0,mode:'idle',last:0};
});
function measure(){H=reels[0].el.clientHeight/3}
function draw(R){
  const base=Math.floor(R.pos),f=R.pos-base,sp=Math.abs(R.v);
  R.strip.style.filter=sp>4?`blur(${Math.min(5,sp*.2).toFixed(1)}px)`:'';
  R.rows.forEach((o,k)=>{
    const d=k-2,a=(d+f)*.5;
    const si=mod(base-d,L);
    if(o.s!==si){o.s=si;o.r.innerHTML=html(SYM[si])}
    o.r.style.visibility=Math.abs(a)>1.35?'hidden':'visible';
    o.r.style.transform=`translateY(${H*1.5+H*2*Math.sin(a)-H/2}px) scaleY(${Math.cos(a)})`;
  });
  if(base!==R.last){R.last=base;if(sp>8)tick()}
}
function step(R,dt,t){
  if(R.mode==='spin'){R.v=Math.min(VMAX,R.v+95*dt);R.pos+=R.v*dt}
  else if(R.mode==='stopA'){
    const k=Math.min(1,(t-R.t0)/R.dur),D=R.to+A-R.from,e=1-Math.pow(1-k,3);
    R.v=D*3*Math.pow(1-k,2)/(R.dur/1000);R.pos=R.from+D*e;
    if(k>=1){R.mode='stopB';R.t0=t;thump()}
  }else if(R.mode==='stopB'){
    const s=(t-R.t0)/1000;R.v=0;R.pos=R.to+A*Math.exp(-7*s)*Math.cos(14*s);
    if(s>.7){R.pos=R.to;R.mode='idle';R.done&&R.done()}
  }
}
function stopReel(R,idx){
  const n0=Math.ceil(R.pos+5),to=n0+mod(idx-n0,L),D=to+A-R.pos;
  R.from=R.pos;R.to=to;R.dur=3000*D/VMAX;R.t0=performance.now();R.mode='stopA';
}

/* particles */
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);measure()}
function coins(n,rain){
  const r=$('#gl').getBoundingClientRect();
  for(let i=0;i<n;i++)P.push(rain?{x:Math.random()*innerWidth,y:-20-Math.random()*400,vx:(Math.random()-.5)*80,vy:100+Math.random()*200,r:8+Math.random()*7,ph:Math.random()*6,w:8+Math.random()*8}
  :{x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*700,vy:-Math.random()*900-250,r:8+Math.random()*7,ph:Math.random()*6,w:8+Math.random()*8});
  for(let i=0;i<4;i++)setTimeout(()=>tone(1800+i*300,.12,'triangle',.05),i*70);
}
function fx(dt){
  cx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.y<innerHeight+30);
  P.forEach(p=>{
    p.vy+=1800*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.ph+=p.w*dt;
    const sx=Math.abs(Math.cos(p.ph))*p.r+1.5;
    cx.beginPath();cx.ellipse(p.x,p.y,sx,p.r,0,0,7);cx.fillStyle='#ffc93c';cx.fill();cx.lineWidth=2;cx.strokeStyle='#9a5a0a';cx.stroke();
    cx.beginPath();cx.ellipse(p.x,p.y,sx*.6,p.r*.6,0,0,7);cx.strokeStyle='rgba(255,255,255,.65)';cx.lineWidth=1.5;cx.stroke();
  });
}

/* main loop */
let pt=performance.now();
function loop(t){const dt=Math.min(.05,(t-pt)/1000);pt=t;reels.forEach(R=>{step(R,dt,t);draw(R)});fx(dt);requestAnimationFrame(loop)}

/* game */
function countTo(el,a,b){const t0=performance.now(),d=Math.min(900,200+Math.abs(b-a)*2);(function f(n){const k=Math.min(1,(n-t0)/d);el.textContent=Math.round(a+(b-a)*k);if(k<1)requestAnimationFrame(f)})(t0)}
function roll(){
  const r=Math.random(),tot=Object.values(W).reduce((a,b)=>a+b);
  const pick=()=>{let x=Math.random()*tot;for(const k in W){if((x-=W[k])<0)return k}};
  const idxOf=s=>{const a=[];SYM.forEach((v,i)=>v===s&&a.push(i));return a[rnd(a.length)]};
  if(r<.12){const s=pick();return[0,1,2].map(()=>idxOf(s))}
  if(r<.36){const s=pick();let o;do{o=rnd(L)}while(SYM[o]===s);return[idxOf(s),idxOf(s),o]}
  return[rnd(L),rnd(L),rnd(L)];
}
async function spin(){
  if(spinning)return false;
  if(bal<bet){msg.textContent='余额不足，请降低下注或充值';$('#cab').classList.remove('shake');void $('#cab').offsetWidth;$('#cab').classList.add('shake');return false}
  spinning=true;cur=bet;$('#lever').classList.add('lock');$('#spin').disabled=true;
  countTo(eBal,bal,bal-cur);bal-=cur;eWin.textContent=0;msg.textContent='转动中…';
  rig.classList.remove('win');reels.forEach(R=>R.el.classList.remove('hit'));
  const res=roll();
  reels.forEach((R,i)=>setTimeout(()=>{R.mode='spin';R.v=-5},i*130));
  const stops=[1300,1950,2650];
  await Promise.all(reels.map((R,i)=>new Promise(ok=>setTimeout(()=>{R.done=ok;stopReel(R,res[i])},stops[i]))));
  settle(res);
}
function settle(res){
  const s=res.map(i=>SYM[i]);let w=0,m=0;msg.textContent='没中，再试一次';
  if(s[0]===s[1]&&s[1]===s[2]){m=PAY[s[0]];w=cur*m;msg.textContent=`三连 ${s[0]}，×${m}，赢得 ${w}`;reels.forEach(R=>R.el.classList.add('hit'))}
  else if(s[0]===s[1]){w=cur;msg.textContent='两连，返还本金';reels[0].el.classList.add('hit');reels[1].el.classList.add('hit')}
  if(w){countTo(eWin,0,w);countTo(eBal,bal,bal+w);bal+=w}
  if(m){rig.classList.add('win');jingle();coins(m>=20?130:60);if(m>=20){coins(90,true);$('#cab').classList.add('shake')}setTimeout(()=>{rig.classList.remove('win');$('#cab').classList.remove('shake')},3800)}
  spinning=false;$('#lever').classList.remove('lock');$('#spin').disabled=false;
  $('#topup').hidden=bal>=10;
}

/* lever */
const arm=$('#arm'),knob=$('#knob'),zone=$('#lever');
let th=0,drag=false,fired=false,sy=0,moved=0,raf=0;
function setL(t){th=t;arm.style.transform=`rotateX(${-t}deg)`;knob.style.transform=`rotateX(${t}deg)`}
function back(from){cancelAnimationFrame(raf);const t0=performance.now();(function f(n){const s=(n-t0)/1000;if(s<.9){setL(from*Math.exp(-9*s)*Math.cos(9*s));raf=requestAnimationFrame(f)}else setL(0)})(t0)}
function fire(){clunk();spin()}
function autoPull(){
  if(spinning)return;cancelAnimationFrame(raf);const t0=performance.now();
  (function f(n){const k=Math.min(1,(n-t0)/300);setL(176*k*k);if(k<1)raf=requestAnimationFrame(f);else{fire();back(176)}})(t0);
}
zone.addEventListener('pointerdown',e=>{if(spinning||drag)return;drag=true;fired=false;moved=0;sy=e.clientY;zone.setPointerCapture(e.pointerId);cancelAnimationFrame(raf)});
zone.addEventListener('pointermove',e=>{
  if(!drag)return;const dy=e.clientY-sy;moved=Math.max(moved,Math.abs(dy));
  setL(Math.max(0,Math.min(176,dy/.85)));
  if(!fired&&th>=150){fired=true;fire()}
});
const up=()=>{if(!drag)return;drag=false;if(moved<6&&!fired)autoPull();else back(th)};
zone.addEventListener('pointerup',up);zone.addEventListener('pointercancel',up);

/* controls */
$('#spin').onclick=autoPull;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();if(!e.repeat)autoPull()}});
function setBet(d){if(spinning)return;bi=Math.max(0,Math.min(BETS.length-1,bi+d));bet=BETS[bi];eBet.textContent=bet}
$('#bm').onclick=()=>setBet(-1);$('#bp').onclick=()=>setBet(1);
$('#mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊'};
$('#topup').onclick=e=>{countTo(eBal,bal,bal+1000);bal+=1000;e.currentTarget.hidden=true;msg.textContent='已充值 1000，继续拉杆'};
addEventListener('resize',fit);
fit();setL(0);requestAnimationFrame(loop);
</script>
</body>
</html>
