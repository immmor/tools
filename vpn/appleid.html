<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple ID 商品列表</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
  padding: 20px;
}
.container { max-width: 1200px; margin: 0 auto; }
h1 { font-size: 24px; margin-bottom: 20px; }
.header-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
}
.stats { font-size: 14px; color: #666; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  padding: 6px 16px; border: 1px solid #d2d2d7; border-radius: 20px;
  background: #fff; cursor: pointer; font-size: 13px; transition: all .2s;
}
.filters button:hover { border-color: #0071e3; color: #0071e3; }
.filters button.active { background: #0071e3; color: #fff; border-color: #0071e3; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.card {
  background: #fff; border-radius: 12px; overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.08); transition: box-shadow .2s;
}
.card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.card-img {
  width: 100%; height: 180px; object-fit: contain; background: #fafafa;
  display: block; padding: 16px;
}
.card-body { padding: 14px; }
.card-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.price { font-size: 20px; font-weight: 700; color: #e63e2d; }
.price small { font-size: 13px; font-weight: 400; color: #666; }
.stock-badge {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: 12px; font-weight: 500;
}
.stock-in { background: #e8f5e9; color: #2e7d32; }
.stock-out { background: #fce4ec; color: #c62828; }
.wholesale { font-size: 12px; color: #666; margin-top: 6px; padding-top: 8px; border-top: 1px solid #eee; }
.wholesale span { display: inline-block; margin-right: 10px; }
.category-tag { font-size: 11px; color: #999; margin-bottom: 4px; }
.pagination {
  display: flex; justify-content: center; gap: 8px; margin-top: 24px;
}
.pagination span {
  padding: 6px 14px; border: 1px solid #d2d2d7; border-radius: 8px;
  font-size: 13px; color: #666;
}
.loading { text-align: center; padding: 60px; font-size: 16px; color: #999; }
.error { text-align: center; padding: 40px; color: #c62828; }
</style>
</head>
<body>
<div class="container">
  <div class="header-bar">
    <div>
      <h1>Apple ID 商品列表</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pagination"></div>
</div>
<script>
async function loadData() {
  const grid = document.getElementById('grid');
  const stats = document.getElementById('stats');
  const filters = document.getElementById('filters');
  const pagination = document.getElementById('pagination');
  grid.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const res = await fetch('appleid.json');
    const json = await res.json();
    if (json.status_code !== 0) {
      grid.innerHTML = '<div class="error">数据加载失败</div>';
      return;
    }
    const products = json.data;
    const total = json.pagination.total;
    stats.textContent = `共 ${total} 件商品`;

    // 提取分类
    const catMap = new Map();
    products.forEach(p => {
      if (p.category) catMap.set(p.category.id, p.category.name['zh-CN'] || p.category.name['en-US'] || '未分类');
    });
    const cats = [['all', '全部'], ...catMap.entries()];
    filters.innerHTML = cats.map(([id, name]) =>
      `<button class="${id === 'all' ? 'active' : ''}" data-cat="${id}">${name}</button>`
    ).join('');
    filters.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      filters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.cat === 'all' ? products : products.filter(p => p.category && p.category.id == btn.dataset.cat));
    });

    render(products);
    pagination.innerHTML = `<span>第 ${json.pagination.page}/${json.pagination.total_page} 页</span>`;
  } catch (e) {
    grid.innerHTML = '<div class="error">加载失败: ' + e.message + '</div>';
  }
}

function render(list) {
  const grid = document.getElementById('grid');
  if (list.length === 0) {
    grid.innerHTML = '<div class="loading">暂无匹配商品</div>';
    return;
  }
  grid.innerHTML = list.map(p => {
    const title = p.title['zh-CN'] || p.title['en-US'] || '未命名';
    const price = p.price_amount || '0.00';
    const inStock = p.stock_status === 'in_stock';
    const stockQty = p.auto_stock_available || 0;
    const img = p.images && p.images[0] ? 'https://pifaid.com' + p.images[0] : '';
    const catName = p.category ? (p.category.name['zh-CN'] || p.category.name['en-US'] || '') : '';
    const wholesale = p.wholesale_prices && p.wholesale_prices.length > 0
      ? p.wholesale_prices.map(w => `${w.min_quantity}件起 ¥${w.unit_price}`).join(' / ')
      : '';
    return `<div class="card">
      ${img ? `<img class="card-img" src="${img}" alt="${title}" loading="lazy" onerror="this.style.display='none'">` : '<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#ccc;font-size:40px;">🍎</div>'}
      <div class="card-body">
        <div class="category-tag">${catName}</div>
        <div class="card-title">${title}</div>
        <div class="card-meta">
          <span class="price">¥${price} <small>/个</small></span>
          <span class="stock-badge ${inStock ? 'stock-in' : 'stock-out'}">${inStock ? '有货 (' + stockQty + ')' : '缺货'}</span>
        </div>
        ${wholesale ? `<div class="wholesale">批发: <span>${wholesale}</span></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

loadData();
</script>
</body>
</html>
