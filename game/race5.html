<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER RUSH - 12选5极速赛车</title>
    <style>
        :root {
            --bg-dark: #06050e;
            --panel-bg: rgba(16, 12, 34, 0.85);
            --border-glow: rgba(0, 240, 255, 0.4);
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-orange: #ff6600;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 127, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 50%),
                linear-gradient(180deg, #06050e 0%, #0d0920 100%);
            overflow-x: hidden;
        }

        /* 12辆赛车专属颜色 */
        .c-1  { --car-color: #ff2a4b; }
        .c-2  { --car-color: #00f0ff; }
        .c-3  { --car-color: #ffe600; }
        .c-4  { --car-color: #00ff66; }
        .c-5  { --car-color: #ff00ea; }
        .c-6  { --car-color: #aa00ff; }
        .c-7  { --car-color: #ff6600; }
        .c-8  { --car-color: #00ffff; }
        .c-9  { --car-color: #ff007f; }
        .c-10 { --car-color: #ffffff; }
        .c-11 { --car-color: #2979ff; }
        .c-12 { --car-[#ccff00]; --car-color: #ccff00; }

        .container {
            width: 100%;
            max-width: 1240px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 顶部 Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 15px 25px;
            box-shadow: 0 0 25px rgba(0,240,255,0.15), inset 0 0 15px rgba(0,240,255,0.05);
            backdrop-filter: blur(12px);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-title {
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wallet-panel {
            display: flex;
            align-items: center;
            gap: 25px;
            background: rgba(0,0,0,0.6);
            padding: 8px 25px;
            border-radius: 40px;
            border: 1px solid rgba(0,240,255,0.3);
            box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,240,255,0.1);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #a0a0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-val {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.5);
        }

        /* 赛道区域 */
        .track-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8);
        }

        .track-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .lane {
            display: flex;
            align-items: center;
            height: 42px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            position: relative;
            border-left: 4px solid var(--car-color);
            overflow: visible; /* 允许喷火超出一些框线 */
        }

        .lane-id {
            width: 38px;
            text-align: center;
            font-weight: 900;
            font-size: 1rem;
            color: var(--car-color);
            z-index: 5;
            text-shadow: 0 0 8px var(--car-color);
        }

        .track-line {
            flex-grow: 1;
            height: 100%;
            position: relative;
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 25px, transparent 25px, transparent 50px);
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }

        .finish-line {
            position: absolute;
            right: 15px;
            top: 0;
            bottom: 0;
            width: 14px;
            background: repeating-linear-gradient(45deg, #fff, #fff 5px, #000 5px, #000 10px);
            z-index: 2;
            box-shadow: 0 0 12px rgba(255,255,255,0.8);
        }

        /* 赛车及跑动容器 */
        .car-runner {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 85px; /* 留出后方尾气空间 */
            height: 32px;
            transition: left 0.1s linear;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        /* 火焰喷气特效 */
        .flame-container {
            position: absolute;
            right: 50px; /* 紧贴车尾 */
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
            width: 40px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        /* 比赛进行中激发的喷火状态 */
        .car-runner.racing .flame-container {
            opacity: 1;
        }

        .flame-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 6px #ff4500) drop-shadow(0 0 12px #ffe600);
            animation: flameFlicker 0.08s infinite alternate ease-in-out;
        }

        @keyframes flameFlicker {
            0% { transform: scale(0.85, 0.8) translateY(-1px); opacity: 0.8; }
            100% { transform: scale(1.15, 1.1) translateY(1px); opacity: 1; }
        }

        .car-svg {
            width: 58px;
            height: 28px;
            filter: drop-shadow(0 0 6px var(--car-color));
            z-index: 2;
        }

        /* 操控与竞猜面板 */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1.1fr;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--neon-cyan);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .cars-selector {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }

        /* 炫酷赛车卡片 */
        .car-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .car-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: var(--car-color);
            box-shadow: 0 0 10px var(--car-color);
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .car-card:hover {
            background: rgba(0, 240, 255, 0.12);
            border-color: var(--neon-cyan);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 240, 255, 0.25);
        }

        .car-card:hover::before {
            opacity: 1;
        }

        .car-card.selected {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25) 0%, rgba(255, 0, 127, 0.15) 100%);
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.5), inset 0 0 10px rgba(0, 240, 255, 0.3);
            transform: translateY(-2px);
        }

        .car-card.selected::before {
            opacity: 1;
            height: 4px;
        }

        .car-card .num {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--car-color);
            text-shadow: 0 0 6px var(--car-color);
        }

        .car-card .svg-icon {
            width: 48px;
            height: 24px;
            margin: 6px 0;
            filter: drop-shadow(0 0 4px var(--car-color));
        }

        .car-card .odds {
            font-size: 0.75rem;
            color: #b0b0d0;
            font-weight: 600;
        }

        /* 炫酷按钮样式库 */
        /* 随机选车按钮 */
        .btn-neon-outline {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
            text-transform: uppercase;
        }

        .btn-neon-outline:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.8);
            transform: scale(1.05);
        }

        /* 筹码选择组 */
        .bet-controls {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chip-group {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .chip-btn {
            background: linear-gradient(145deg, #181436, #0b081e);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.2);
            position: relative;
        }

        .chip-btn::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.3);
        }

        .chip-btn:hover {
            transform: translateY(-3px) scale(1.08);
            border-color: var(--neon-magenta);
            color: var(--neon-magenta);
            box-shadow: 0 6px 15px rgba(255, 0, 127, 0.4);
        }

        .chip-btn.active {
            background: linear-gradient(135deg, var(--neon-magenta), #9d00ff);
            border-color: #ff66cc;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.7);
            transform: translateY(-2px) scale(1.05);
        }

        .chip-btn.active::after {
            border-color: rgba(255,255,255,0.8);
        }

        /* 核心行动按钮：极光赛车按钮 */
        .btn-cyber-action {
            position: relative;
            background: linear-gradient(90deg, #ff007f, #7928ca, #00f0ff);
            background-size: 200% 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), 0 0 40px rgba(0, 240, 255, 0.2);
            text-transform: uppercase;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-cyber-action:hover {
            background-position: 100% 0;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8), 0 0 50px rgba(255, 0, 127, 0.5);
            transform: scale(1.02);
        }

        .btn-cyber-action:active {
            transform: scale(0.98);
        }

        .btn-cyber-action:disabled {
            background: #201c38;
            color: #555170;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 结果展示板 */
        .results-board {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            min-height: 50px;
            align-items: center;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .res-badge {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1rem;
            background: var(--car-color);
            color: #000;
            box-shadow: 0 0 12px var(--car-color);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* 结算 Modal 弹窗 */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(4, 3, 10, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,240,255,0.4), inset 0 0 20px rgba(0,240,255,0.1);
            transform: scale(0.8) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal h2 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-yellow);
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.6);
        }

        .modal p {
            margin: 18px 0;
            font-size: 1.15rem;
            color: #ddd;
            line-height: 1.6;
        }

        /* 响应式调整 */
        @media (max-width: 960px) {
            .dashboard { grid-template-columns: 1fr; }
            .cars-selector { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 600px) {
            .cars-selector { grid-template-columns: repeat(3, 1fr); }
            .logo-title { font-size: 1.3rem; }
            header { padding: 12px 15px; }
            .car-runner { width: 68px; height: 24px; }
            .flame-container { right: 38px; width: 30px; height: 16px; }
            .car-svg { width: 44px; height: 22px; }
            .lane { height: 36px; }
            .chip-btn { width: 44px; height: 44px; font-size: 0.85rem; }
            .btn-cyber-action { font-size: 1.05rem; padding: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 LOGO 与 钱包 -->
    <header>
        <div class="logo-title">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="url(#logo-grad)" stroke-width="2.2" stroke-linecap="round">
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f0ff" />
                        <stop offset="100%" stop-color="#ff007f" />
                    </linearGradient>
                </defs>
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 1 12.5V16c0 .6.4 1 1 1h2"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
            </svg>
            CYBER RUSH 12-5
        </div>
        <div class="wallet-panel">
            <div class="stat-item">
                <span class="stat-label">账户筹码</span>
                <span class="stat-val" id="balance-val">1000</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">本次下注</span>
                <span class="stat-val" style="color:var(--neon-cyan)" id="total-bet-val">0</span>
            </div>
        </div>
    </header>

    <!-- 赛道区域 -->
    <div class="track-container">
        <div class="finish-line"></div>
        <div class="track-grid" id="track-grid">
            <!-- 12条赛道动态渲染 -->
        </div>
    </div>

    <!-- 竞猜下注操控面板 -->
    <div class="dashboard">
        <!-- 车辆选择区域 -->
        <div class="panel">
            <div class="panel-title">
                <span>选择参赛车 (已选 <span id="selected-count" style="color:var(--neon-yellow)">0</span>/5)</span>
                <button class="btn-neon-outline" id="btn-quick-select">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                    机甲随机5连抽
                </button>
            </div>
            <div class="cars-selector" id="cars-selector">
                <!-- 12个炫酷选择卡片 -->
            </div>
        </div>

        <!-- 筹码与行动区域 -->
        <div class="panel bet-controls">
            <div class="panel-title">竞猜筹码设置</div>
            <div class="chip-group">
                <div class="chip-btn active" data-val="10">10</div>
                <div class="chip-btn" data-val="50">50</div>
                <div class="chip-btn" data-val="100">100</div>
                <div class="chip-btn" data-val="500">500</div>
            </div>

            <button class="btn-cyber-action" id="btn-start">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                氮气喷射 · 开启竞速
            </button>
            
            <div style="margin-top:2px;">
                <span class="stat-label">最新前5名冲线榜:</span>
                <div class="results-board" id="results-board">
                    <span style="color:#555170; font-size:0.85rem;" id="result-placeholder">等待比赛引擎发令...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 结算 Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title">冲线结算</h2>
        <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="var(--neon-yellow)" stroke-width="1.8" style="margin:10px 0; filter:drop-shadow(0 0 10px var(--neon-yellow))">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
        </svg>
        <p id="modal-msg">结算结果计算中...</p>
        <button class="btn-cyber-action" id="btn-modal-close" style="width:100%; margin-top:15px; font-size:1.05rem;">开启下一局竞速</button>
    </div>
</div>

<script>
    // 1. 生成超炫酷矢量赛车 SVG 结构
    function createCarSVG() {
        return `
        <svg class="car-svg" viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- 车身流线型底座 -->
            <path d="M12 40 L25 20 L55 15 L85 25 L112 32 L118 42 L105 48 L15 48 Z" fill="var(--car-color)" />
            <!-- 驾驶舱黑雾风挡 -->
            <path d="M30 22 L52 18 L68 25 L30 25 Z" fill="#06050e" opacity="0.8"/>
            <path d="M70 25 L88 27 L105 33 L70 33 Z" fill="#06050e" opacity="0.7"/>
            <!-- 炫酷发光轮毂 -->
            <circle cx="30" cy="46" r="10" fill="#111" stroke="var(--car-color)" stroke-width="2.5"/>
            <circle cx="30" cy="46" r="4" fill="#fff"/>
            <circle cx="90" cy="46" r="10" fill="#111" stroke="var(--car-color)" stroke-width="2.5"/>
            <circle cx="90" cy="46" r="4" fill="#fff"/>
            <!-- 尾翼与尾灯 -->
            <path d="M8 30 L20 32 L15 40 L5 40 Z" fill="var(--car-color)"/>
            <path d="M2 38 L8 38 L8 42 L2 42 Z" fill="#ff0055" filter="drop-shadow(-2px 0 6px #ff0055)"/>
            <!-- 前高能氙气大灯 -->
            <path d="M112 35 L117 37 L112 39 Z" fill="#00f0ff" filter="drop-shadow(4px 0 6px #00f0ff)"/>
        </svg>`;
    }

    // 2. 动态火焰喷射 SVG 结构
    function createFlameSVG() {
        return `
        <div class="flame-container">
            <svg class="flame-svg" viewBox="0 0 100 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 外层炽热红焰 -->
                <path d="M0 20 Q 25 5, 50 12 T 100 20 Q 75 28, 50 28 T 0 20 Z" fill="url(#flame-outer)"/>
                <!-- 中层耀眼金焰 -->
                <path d="M0 20 Q 20 10, 40 15 T 80 20 Q 60 25, 40 25 T 0 20 Z" fill="url(#flame-inner)"/>
                <!-- 核心极白高能核心 -->
                <path d="M0 20 Q 15 15, 30 18 T 50 20 Q 35 22, 25 22 T 0 20 Z" fill="#ffffff"/>
                
                <defs>
                    <linearGradient id="flame-outer" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ff0055"/>
                        <stop offset="50%" stop-color="#ff6600"/>
                        <stop offset="100%" stop-color="transparent"/>
                    </linearGradient>
                    <linearGradient id="flame-inner" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffe600"/>
                        <stop offset="70%" stop-color="#ff3300"/>
                        <stop offset="100%" stop-color="transparent"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>`;
    }

    // 全局数据状态
    const TOTAL_CARS = 12;
    const SELECT_COUNT = 5;
    let balance = 1000;
    let currentChip = 10;
    let selectedCars = new Set();
    let isRacing = false;

    // DOM 引用
    const trackGrid = document.getElementById('track-grid');
    const carsSelector = document.getElementById('cars-selector');
    const balanceVal = document.getElementById('balance-val');
    const totalBetVal = document.getElementById('total-bet-val');
    const selectedCountVal = document.getElementById('selected-count');
    const btnStart = document.getElementById('btn-start');
    const btnQuickSelect = document.getElementById('btn-quick-select');
    const resultsBoard = document.getElementById('results-board');
    const modalOverlay = document.getElementById('modal-overlay');

    // 初始化画面 UI
    function initUI() {
        trackGrid.innerHTML = '';
        carsSelector.innerHTML = '';

        for (let i = 1; i <= TOTAL_CARS; i++) {
            // 1. 生成赛道与喷火容器
            const lane = document.createElement('div');
            lane.className = `lane c-${i}`;
            lane.innerHTML = `
                <div class="lane-id">${i}</div>
                <div class="track-line">
                    <div class="car-runner" id="runner-${i}">
                        ${createFlameSVG()}
                        ${createCarSVG()}
                    </div>
                </div>
            `;
            trackGrid.appendChild(lane);

            // 2. 生成竞猜卡片
            const card = document.createElement('div');
            card.className = `car-card c-${i}`;
            card.dataset.id = i;
            card.innerHTML = `
                <span class="num">${i}号</span>
                ${createCarSVG()}
                <span class="odds">赔率 x3.5</span>
            `;
            card.addEventListener('click', () => toggleCarSelection(i));
            carsSelector.appendChild(card);
        }
    }

    // 选择/取消选择车辆
    function toggleCarSelection(id) {
        if (isRacing) return;

        if (selectedCars.has(id)) {
            selectedCars.delete(id);
        } else {
            if (selectedCars.size >= SELECT_COUNT) return;
            selectedCars.add(id);
        }
        updateSelectionUI();
    }

    // 实时更新选择面板状态
    function updateSelectionUI() {
        document.querySelectorAll('.car-card').forEach(card => {
            const id = parseInt(card.dataset.id);
            if (selectedCars.has(id)) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });

        selectedCountVal.textContent = selectedCars.size;
        const totalBet = selectedCars.size * currentChip;
        totalBetVal.textContent = totalBet;

        // 按钮使能状态控制
        btnStart.disabled = !(selectedCars.size === SELECT_COUNT && balance >= totalBet && totalBet > 0);
    }

    // 筹码按钮切换
    document.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (isRacing) return;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentChip = parseInt(e.target.dataset.val);
            updateSelectionUI();
        });
    });

    // 机甲一键随机选5辆
    btnQuickSelect.addEventListener('click', () => {
        if (isRacing) return;
        selectedCars.clear();
        while (selectedCars.size < SELECT_COUNT) {
            const randomId = Math.floor(Math.random() * TOTAL_CARS) + 1;
            selectedCars.add(randomId);
        }
        updateSelectionUI();
    });

    // 开启比赛逻辑
    btnStart.addEventListener('click', () => {
        const totalBet = selectedCars.size * currentChip;
        if (balance < totalBet || selectedCars.size !== SELECT_COUNT || isRacing) return;

        balance -= totalBet;
        balanceVal.textContent = balance;
        isRacing = true;
        btnStart.disabled = true;
        btnQuickSelect.disabled = true;

        // 清空此前开奖结果，添加车辆喷火动画样式
        document.getElementById('result-placeholder')?.remove();
        resultsBoard.innerHTML = '';
        
        for (let i = 1; i <= TOTAL_CARS; i++) {
            document.getElementById(`runner-${i}`).classList.add('racing');
        }

        const progress = new Array(TOTAL_CARS).fill(0);
        const finishedCars = [];

        // 极速冲击定时动画
        const raceInterval = setInterval(() => {
            let allFinished = true;

            for (let i = 1; i <= TOTAL_CARS; i++) {
                if (progress[i - 1] < 92) {
                    allFinished = false;
                    // 加入随机极速爆发算法
                    const boost = Math.random() > 0.8 ? 1.8 : 1.0;
                    progress[i - 1] += (Math.random() * 2.1 + 0.4) * boost;

                    if (progress[i - 1] >= 92) {
                        progress[i - 1] = 92;
                        if (!finishedCars.includes(i)) {
                            finishedCars.push(i);
                            // 冲线后关闭该车的火焰效果
                            document.getElementById(`runner-${i}`).classList.remove('racing');
                        }
                    }
                    const runner = document.getElementById(`runner-${i}`);
                    runner.style.left = `${progress[i - 1]}%`;
                }
            }

            if (allFinished) {
                clearInterval(raceInterval);
                handleRaceFinish(finishedCars);
            }
        }, 45);
    });

    // 比赛终点结算
    function handleRaceFinish(rankings) {
        const top5 = rankings.slice(0, 5);

        // 挨个弹出前5名开奖图标
        top5.forEach((carId, index) => {
            setTimeout(() => {
                const badge = document.createElement('div');
                badge.className = `res-badge c-${carId}`;
                badge.textContent = carId;
                resultsBoard.appendChild(badge);
            }, index * 160);
        });

        // 统计命中数量
        let matchCount = 0;
        selectedCars.forEach(carId => {
            if (top5.includes(carId)) matchCount++;
        });

        // 奖励规则：猜中越多赔率越高
        let winAmount = 0;
        const totalBet = SELECT_COUNT * currentChip;
        
        if (matchCount === 5) winAmount = totalBet * 10;
        else if (matchCount === 4) winAmount = Math.floor(totalBet * 3.5);
        else if (matchCount === 3) winAmount = Math.floor(totalBet * 1.5);

        balance += winAmount;

        setTimeout(() => {
            balanceVal.textContent = balance;
            const modalMsg = document.getElementById('modal-msg');
            const modalTitle = document.getElementById('modal-title');

            if (winAmount > 0) {
                modalTitle.textContent = "竞猜大捷！";
                modalTitle.style.color = "var(--neon-yellow)";
                modalMsg.innerHTML = `您选择的赛车中有 <b style="color:var(--neon-green);font-size:1.5rem;">${matchCount}</b> 辆勇夺前5名！<br>斩获奖励筹码：<b style="color:var(--neon-yellow);font-size:1.6rem;">+${winAmount}</b>`;
            } else {
                modalTitle.textContent = "竞猜未命中";
                modalTitle.style.color = "#ff2a4b";
                modalMsg.innerHTML = `您选择的赛车仅有 <b style="color:var(--neon-magenta);font-size:1.5rem;">${matchCount}</b> 辆冲入前5名。<br>差一点点就中奖，调整策略再来一局！`;
            }

            modalOverlay.classList.add('active');
        }, 1100);
    }

    // 关闭 Modal，重置赛道状态
    document.getElementById('btn-modal-close').addEventListener('click', () => {
        modalOverlay.classList.remove('active');

        // 复位赛车位置与喷火
        for (let i = 1; i <= TOTAL_CARS; i++) {
            const runner = document.getElementById(`runner-${i}`);
            runner.classList.remove('racing');
            runner.style.transition = 'none';
            runner.style.left = '0%';
            setTimeout(() => runner.style.transition = 'left 0.1s linear', 50);
        }

        isRacing = false;
        btnQuickSelect.disabled = false;
        updateSelectionUI();
    });

    // 启动初始化
    initUI();
    updateSelectionUI();
</script>
</body>
</html>
