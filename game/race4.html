<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER RUSH - 12选5极速赛车</title>
    <style>
        :root {
            --bg-dark: #080711;
            --panel-bg: rgba(18, 16, 38, 0.75);
            --border-glow: rgba(0, 240, 255, 0.3);
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --card-hover: rgba(0, 240, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 127, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 50%);
            overflow-x: hidden;
        }

        /* 赛车场色彩配置 */
        .c-1 { --car-color: #ff3344; }
        .c-2 { --car-color: #00f0ff; }
        .c-3 { --car-color: #ffe600; }
        .c-4 { --car-color: #00ff66; }
        .c-5 { --car-color: #ff007f; }
        .c-6 { --car-color: #9d00ff; }
        .c-7 { --car-color: #ff7700; }
        .c-8 { --car-color: #00ffff; }
        .c-9 { --car-color: #ff00cc; }
        .c-10 { --car-color: #ffffff; }
        .c-11 { --car-color: #3388ff; }
        .c-12 { --car-color: #aaff00; }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header UI */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 15px 25px;
            box-shadow: 0 0 20px rgba(0,240,255,0.1);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-title {
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wallet-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #8a8a9e;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-yellow);
        }

        /* Track Area */
        .track-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .track-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .lane {
            display: flex;
            align-items: center;
            height: 38px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            position: relative;
            border-left: 4px solid var(--car-color);
            overflow: hidden;
        }

        .lane-id {
            width: 35px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--car-color);
            z-index: 2;
        }

        .track-line {
            flex-grow: 1;
            height: 100%;
            position: relative;
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 20px, transparent 20px, transparent 40px);
        }

        .finish-line {
            position: absolute;
            right: 10px;
            top: 0;
            bottom: 0;
            width: 12px;
            background: repeating-linear-gradient(45deg, #fff, #fff 4px, #000 4px, #000 8px);
            z-index: 1;
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .car-runner {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 26px;
            transition: left 0.1s linear;
            z-index: 3;
            filter: drop-shadow(0 0 5px var(--car-color));
        }

        /* Control & Betting Area */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--neon-cyan);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cars-selector {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        .car-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .car-card:hover {
            background: var(--card-hover);
            border-color: var(--neon-cyan);
            transform: translateY(-2px);
        }

        .car-card.selected {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .car-card .num {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--car-color);
        }

        .car-card .svg-icon {
            width: 40px;
            height: 20px;
            margin: 5px 0;
            filter: drop-shadow(0 0 3px var(--car-color));
        }

        .car-card .odds {
            font-size: 0.75rem;
            color: #aaa;
        }

        /* Bet Controls */
        .bet-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chip-group {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }

        .chip-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 8px 0;
            flex: 1;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .chip-btn:hover, .chip-btn.active {
            background: var(--neon-magenta);
            border-color: #ff66cc;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .action-btn {
            background: linear-gradient(45deg, var(--neon-cyan), #0088ff);
            border: none;
            border-radius: 8px;
            padding: 15px;
            color: #000;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            text-transform: uppercase;
        }

        .action-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
        }

        .action-btn:disabled {
            background: #333;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Panel */
        .results-board {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            min-height: 45px;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .res-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            background: var(--car-color);
            color: #000;
            box-shadow: 0 0 8px var(--car-color);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Custom Modal */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,240,255,0.3);
            transform: scale(0.8);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 2rem;
            color: var(--neon-yellow);
            margin-bottom: 10px;
        }

        .modal p {
            margin: 15px 0;
            font-size: 1.1rem;
            color: #ddd;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .cars-selector {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 550px) {
            .cars-selector {
                grid-template-columns: repeat(3, 1fr);
            }
            .logo-title {
                font-size: 1.3rem;
            }
            header {
                padding: 10px 15px;
            }
            .car-runner {
                width: 38px;
                height: 20px;
            }
            .lane {
                height: 32px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-title">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="url(#logo-grad)" stroke-width="2">
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f0ff" />
                        <stop offset="100%" stop-color="#ff007f" />
                    </linearGradient>
                </defs>
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 1 12.5V16c0 .6.4 1 1 1h2"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
            </svg>
            CYBER RUSH 12-5
        </div>
        <div class="wallet-panel">
            <div class="stat-item">
                <span class="stat-label">账户筹码</span>
                <span class="stat-val" id="balance-val">1000</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">当前下注</span>
                <span class="stat-val" style="color:var(--neon-cyan)" id="total-bet-val">0</span>
            </div>
        </div>
    </header>

    <!-- 赛道区域 -->
    <div class="track-container">
        <div class="finish-line"></div>
        <div class="track-grid" id="track-grid">
            <!-- 12条赛道动态生成 -->
        </div>
    </div>

    <!-- 操控面板 -->
    <div class="dashboard">
        <div class="panel">
            <div class="panel-title">
                <span>选择赛车 (已选 <span id="selected-count" style="color:var(--neon-yellow)">0</span>/5)</span>
                <button id="btn-quick-select" style="background:none; border:1px solid var(--neon-cyan); color:var(--neon-cyan); padding:2px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">随机选5辆</button>
            </div>
            <div class="cars-selector" id="cars-selector">
                <!-- 12个赛车选择卡片 -->
            </div>
        </div>

        <div class="panel bet-controls">
            <div class="panel-title">下注控制</div>
            <div class="chip-group">
                <div class="chip-btn active" data-val="10">10</div>
                <div class="chip-btn" data-val="50">50</div>
                <div class="chip-btn" data-val="100">100</div>
                <div class="chip-btn" data-val="500">500</div>
            </div>
            <button class="action-btn" id="btn-start">开始冲刺</button>
            
            <div style="margin-top:5px;">
                <span class="stat-label">最新前5名开奖结果:</span>
                <div class="results-board" id="results-board">
                    <span style="color:#666; font-size:0.85rem;" id="result-placeholder">等待比赛开始...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 结算弹窗 -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title">比赛结束</h2>
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--neon-yellow)" stroke-width="1.5" style="margin:10px 0;">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
        </svg>
        <p id="modal-msg">中奖信息</p>
        <button class="action-btn" id="btn-modal-close" style="width:100%; margin-top:15px;">继续竞猜</button>
    </div>
</div>

<script>
    // 矢量赛车SVG模板生成函数
    function createCarSVG(className = "") {
        return `
        <svg class="svg-icon ${className}" viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 40 L25 20 L55 15 L85 25 L112 32 L118 42 L105 48 L15 48 Z" fill="var(--car-color)" />
            <path d="M30 22 L52 18 L68 25 L30 25 Z" fill="#080711" opacity="0.7"/>
            <path d="M70 25 L88 27 L105 33 L70 33 Z" fill="#080711" opacity="0.6"/>
            <!-- 轮毂 -->
            <circle cx="30" cy="46" r="10" fill="#111" stroke="var(--car-color)" stroke-width="2"/>
            <circle cx="30" cy="46" r="4" fill="#fff"/>
            <circle cx="90" cy="46" r="10" fill="#111" stroke="var(--car-color)" stroke-width="2"/>
            <circle cx="90" cy="46" r="4" fill="#fff"/>
            <!-- 尾翼 & 尾光 -->
            <path d="M8 30 L20 32 L15 40 L5 40 Z" fill="var(--car-color)"/>
            <path d="M2 38 L8 38 L8 42 L2 42 Z" fill="#ff0055" filter="drop-shadow(-2px 0 4px #ff0055)"/>
            <!-- 前大灯 -->
            <path d="M112 35 L117 37 L112 39 Z" fill="#00f0ff" filter="drop-shadow(3px 0 4px #00f0ff)"/>
        </svg>`;
    }

    // 游戏核心状态
    const TOTAL_CARS = 12;
    const SELECT_COUNT = 5;
    let balance = 1000;
    let currentChip = 10;
    let selectedCars = new Set();
    let isRacing = false;

    // DOM 元素
    const trackGrid = document.getElementById('track-grid');
    const carsSelector = document.getElementById('cars-selector');
    const balanceVal = document.getElementById('balance-val');
    const totalBetVal = document.getElementById('total-bet-val');
    const selectedCountVal = document.getElementById('selected-count');
    const btnStart = document.getElementById('btn-start');
    const btnQuickSelect = document.getElementById('btn-quick-select');
    const resultsBoard = document.getElementById('results-board');
    const modalOverlay = document.getElementById('modal-overlay');

    // 初始化页面UI
    function initUI() {
        trackGrid.innerHTML = '';
        carsSelector.innerHTML = '';

        for (let i = 1; i <= TOTAL_CARS; i++) {
            // 1. 生成赛道
            const lane = document.createElement('div');
            lane.className = `lane c-${i}`;
            lane.innerHTML = `
                <div class="lane-id">${i}</div>
                <div class="track-line">
                    <div class="car-runner" id="runner-${i}">
                        ${createCarSVG()}
                    </div>
                </div>
            `;
            trackGrid.appendChild(lane);

            // 2. 生成下注选择卡片
            const card = document.createElement('div');
            card.className = `car-card c-${i}`;
            card.dataset.id = i;
            card.innerHTML = `
                <span class="num">${i}号车</span>
                ${createCarSVG()}
                <span class="odds">赔率 x3.5</span>
            `;
            card.addEventListener('click', () => toggleCarSelection(i));
            carsSelector.appendChild(card);
        }
    }

    // 切换赛车选择状态
    function toggleCarSelection(id) {
        if (isRacing) return;

        if (selectedCars.has(id)) {
            selectedCars.delete(id);
        } else {
            if (selectedCars.size >= SELECT_COUNT) {
                // 超过5辆，提示或替换
                return;
            }
            selectedCars.add(id);
        }
        updateSelectionUI();
    }

    // 更新选择UI
    function updateSelectionUI() {
        document.querySelectorAll('.car-card').forEach(card => {
            const id = parseInt(card.dataset.id);
            if (selectedCars.has(id)) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });

        selectedCountVal.textContent = selectedCars.size;
        const totalBet = selectedCars.size * currentChip;
        totalBetVal.textContent = totalBet;

        // 验证开始按钮状态
        btnStart.disabled = !(selectedCars.size === SELECT_COUNT && balance >= totalBet && totalBet > 0);
    }

    // 筹码选择事件
    document.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (isRacing) return;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentChip = parseInt(e.target.dataset.val);
            updateSelectionUI();
        });
    });

    // 随机选择5辆车
    btnQuickSelect.addEventListener('click', () => {
        if (isRacing) return;
        selectedCars.clear();
        while (selectedCars.size < SELECT_COUNT) {
            const randomId = Math.floor(Math.random() * TOTAL_CARS) + 1;
            selectedCars.add(randomId);
        }
        updateSelectionUI();
    });

    // 开始比赛控制
    btnStart.addEventListener('click', () => {
        const totalBet = selectedCars.size * currentChip;
        if (balance < totalBet || selectedCars.size !== SELECT_COUNT || isRacing) return;

        // 扣除筹码
        balance -= totalBet;
        balanceVal.textContent = balance;
        isRacing = true;
        btnStart.disabled = true;
        btnQuickSelect.disabled = true;

        // 重置比赛结果面板及赛车位置
        document.getElementById('result-placeholder')?.remove();
        resultsBoard.innerHTML = '';
        
        const progress = new Array(TOTAL_CARS).fill(0);
        const finishedCars = [];

        // 比赛动画逻辑
        const raceInterval = setInterval(() => {
            let allFinished = true;

            for (let i = 1; i <= TOTAL_CARS; i++) {
                if (progress[i - 1] < 92) { // 92%到达终点
                    allFinished = false;
                    // 随机推进速度，增加随机性
                    progress[i - 1] += Math.random() * 2.2 + 0.3;
                    if (progress[i - 1] >= 92) {
                        progress[i - 1] = 92;
                        if (!finishedCars.includes(i)) {
                            finishedCars.push(i);
                        }
                    }
                    const runner = document.getElementById(`runner-${i}`);
                    runner.style.left = `${progress[i - 1]}%`;
                }
            }

            if (allFinished) {
                clearInterval(raceInterval);
                handleRaceFinish(finishedCars);
            }
        }, 50);
    });

    // 比赛结束处理
    function handleRaceFinish(rankings) {
        const top5 = rankings.slice(0, 5);

        // 显示前5名图标
        top5.forEach((carId, index) => {
            setTimeout(() => {
                const badge = document.createElement('div');
                badge.className = `res-badge c-${carId}`;
                badge.textContent = carId;
                resultsBoard.appendChild(badge);
            }, index * 150);
        });

        // 计算中奖结果：玩家选择的5辆车中，有多少辆进入了前5名
        let matchCount = 0;
        selectedCars.forEach(carId => {
            if (top5.includes(carId)) {
                matchCount++;
            }
        });

        // 计算收益法则：猜中越多倍率越高
        let winAmount = 0;
        const totalBet = SELECT_COUNT * currentChip;
        
        if (matchCount === 5) winAmount = totalBet * 10;      // 全中 10倍
        else if (matchCount === 4) winAmount = totalBet * 3;  // 中4个 3倍
        else if (matchCount === 3) winAmount = totalBet * 1.5;// 中3个 1.5倍

        balance += winAmount;

        // 延时弹出结算窗口
        setTimeout(() => {
            balanceVal.textContent = balance;
            
            const modalMsg = document.getElementById('modal-msg');
            const modalTitle = document.getElementById('modal-title');
            
            if (winAmount > 0) {
                modalTitle.textContent = "恭喜中奖！";
                modalTitle.style.color = "var(--neon-yellow)";
                modalMsg.innerHTML = `您选中的赛车中有 <b style="color:var(--neon-green);font-size:1.4rem;">${matchCount}</b> 辆击败对手闯入前5名！<br>获得奖励：<b style="color:var(--neon-yellow);font-size:1.4rem;">${winAmount}</b> 筹码`;
            } else {
                modalTitle.textContent = "遗憾未中奖";
                modalTitle.style.color = "#ff4444";
                modalMsg.innerHTML = `您选中的赛车仅有 <b style="color:var(--neon-magenta);font-size:1.4rem;">${matchCount}</b> 辆进入前5名。<br>再接再厉！`;
            }
            
            modalOverlay.classList.add('active');
        }, 1200);
    }

    // 关闭弹窗并重置赛道
    document.getElementById('btn-modal-close').addEventListener('click', () => {
        modalOverlay.classList.remove('active');
        
        // 重置车辆位置
        for (let i = 1; i <= TOTAL_CARS; i++) {
            const runner = document.getElementById(`runner-${i}`);
            runner.style.transition = 'none';
            runner.style.left = '0%';
            setTimeout(() => runner.style.transition = 'left 0.1s linear', 50);
        }

        isRacing = false;
        btnQuickSelect.disabled = false;
        updateSelectionUI();
    });

    // 初始化启动
    initUI();
    updateSelectionUI();
</script>
</body>
</html>
