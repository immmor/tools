<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER RUSH 10-3 - 狂暴极速竞速</title>
    <style>
        :root {
            --bg-dark: #030208;
            --panel-bg: rgba(12, 8, 28, 0.9);
            --border-glow: #00f0ff;
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff0055;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-purple: #b000ff;
            --neon-orange: #ff5500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Segoe UI Black', Arial Black, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 90%, rgba(0, 240, 255, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, #030208 0%, #0c051a 100%);
            overflow-x: hidden;
        }

        /* 10辆狂暴赛车专属色彩 */
        .c-1  { --car-color: #ff0055; }
        .c-2  { --car-color: #00f0ff; }
        .c-3  { --car-color: #ffe600; }
        .c-4  { --car-color: #00ff66; }
        .c-5  { --car-color: #ff00ea; }
        .c-6  { --car-color: #b000ff; }
        .c-7  { --car-color: #ff5500; }
        .c-8  { --car-color: #00ffff; }
        .c-9  { --car-color: #ffffff; }
        .c-10 { --car-color: #aaff00; }

        .container {
            width: 100%;
            max-width: 1280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 头部 Dashboard Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 12px 20px;
            box-shadow: 0 0 25px rgba(0,240,255,0.4), inset 0 0 15px rgba(0,240,255,0.2);
            backdrop-filter: blur(12px);
            flex-wrap: wrap;
            gap: 12px;
            transform: skew(-2deg);
        }

        .logo-title {
            font-size: 2.2rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffe600, #ff0055, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: skew(-5deg);
        }

        .wallet-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.8);
            padding: 8px 20px;
            border-radius: 8px;
            border: 2px solid var(--neon-magenta);
            box-shadow: 0 0 15px rgba(255,0,85,0.4);
            transform: skew(-5deg);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #a0a0c0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.8);
        }

        /* 赛道区域 */
        .track-container {
            background: var(--panel-bg);
            border: 2px solid var(--neon-magenta);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255,0,85,0.3);
            transform: skew(-1deg);
        }

        .track-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .lane {
            display: flex;
            align-items: center;
            height: 44px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            position: relative;
            border-left: 5px solid var(--car-color);
            overflow: visible;
        }

        .lane-id {
            width: 36px;
            text-align: center;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--car-color);
            z-index: 5;
            text-shadow: 0 0 10px var(--car-color);
            font-style: italic;
        }

        .track-line {
            flex-grow: 1;
            height: 100%;
            position: relative;
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 30px, transparent 30px, transparent 60px);
            border-bottom: 1px dashed rgba(255,255,255,0.08);
        }

        .finish-line {
            position: absolute;
            right: 15px;
            top: 0;
            bottom: 0;
            width: 16px;
            background: repeating-linear-gradient(45deg, #fff, #fff 6px, #000 6px, #000 12px);
            z-index: 2;
            box-shadow: 0 0 15px rgba(255,255,255,0.9);
        }

        /* 赛车及跑动容器 */
        .car-runner {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 140px; /* 留出超长大喷火空间 */
            height: 38px;
            transition: left 0.1s linear;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        /* 狂暴火焰喷射容器 */
        .flame-container {
            position: absolute;
            right: 52px; /* 紧贴车尾 */
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
            width: 90px;
            height: 36px;
            opacity: 0;
            transition: opacity 0.15s;
            pointer-events: none;
            z-index: 1;
        }

        .car-runner.racing .flame-container {
            opacity: 1;
        }

        .flame-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 8px #ff0055) drop-shadow(0 0 18px #ffaa00) drop-shadow(0 0 25px #00f0ff);
            animation: violentFlame 0.05s infinite alternate ease-in-out;
        }

        @keyframes violentFlame {
            0% { transform: scale(0.8, 0.7) translateY(-2px) skewX(-5deg); opacity: 0.85; }
            50% { transform: scale(1.1, 1.2) translateY(1px) skewX(5deg); opacity: 1; }
            100% { transform: scale(1.4, 0.9) translateY(0px) skewX(-2deg); opacity: 0.95; }
        }

        .car-svg {
            width: 58px;
            height: 28px;
            filter: drop-shadow(0 0 8px var(--car-color));
            z-index: 2;
        }

        /* 操控与竞猜面板 */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }

        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0,240,255,0.2);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--neon-cyan);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
            font-style: italic;
        }

        .cars-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        /* 狂暴赛车卡片 */
        .car-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 100%);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease-out;
            position: relative;
            transform: skew(-3deg);
        }

        .car-card:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--neon-cyan);
            transform: skew(-3deg) scale(1.05) translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }

        .car-card.selected {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.4) 0%, rgba(0, 240, 255, 0.3) 100%);
            border: 2px solid var(--neon-yellow);
            box-shadow: 0 0 22px rgba(255, 230, 0, 0.8), inset 0 0 10px rgba(255, 230, 0, 0.4);
            transform: skew(-3deg) scale(1.03);
        }

        .car-card .num {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--car-color);
            text-shadow: 0 0 8px var(--car-color);
            font-style: italic;
        }

        .car-card .odds {
            font-size: 0.75rem;
            color: #fff;
            font-weight: 900;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        /* 突兀狂暴按钮样式 */
        /* 随机选车按钮 */
        .btn-neon-outline {
            background: linear-gradient(90deg, #ff0055, #ff5500);
            border: 2px solid #ffe600;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
            text-transform: uppercase;
            transform: skew(-8deg);
            font-style: italic;
        }

        .btn-neon-outline:hover {
            transform: skew(-8deg) scale(1.1) rotate(-1deg);
            box-shadow: 0 0 25px rgba(255, 230, 0, 1);
            background: linear-gradient(90deg, #ff5500, #ffe600);
            color: #000;
        }

        /* 筹码控制面板 */
        .bet-controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-color: var(--neon-magenta);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
        }

        .chip-group {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }

        .chip-btn {
            background: #100a26;
            border: 2px solid var(--neon-cyan);
            border-radius: 6px;
            flex: 1;
            padding: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            transform: skew(-6deg);
            font-style: italic;
        }

        .chip-btn:hover {
            transform: skew(-6deg) scale(1.1) translateY(-2px);
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
            box-shadow: 0 0 20px rgba(255, 230, 0, 0.8);
        }

        .chip-btn.active {
            background: linear-gradient(135deg, var(--neon-magenta), var(--neon-purple));
            border-color: #fff;
            color: #ffe600;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.9);
            transform: skew(-6deg) scale(1.08);
            text-shadow: 0 0 8px #ffe600;
        }

        /* 核心超级狂暴发射按钮 */
        .btn-cyber-action {
            position: relative;
            background: linear-gradient(90deg, #ffe600 0%, #ff0055 50%, #b000ff 100%);
            background-size: 200% 100%;
            border: 3px solid #00f0ff;
            border-radius: 8px;
            padding: 16px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.8), 0 0 50px rgba(0, 240, 255, 0.5);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transform: skew(-8deg);
            font-style: italic;
            text-shadow: 0 0 10px #000, 2px 2px 0px #000;
            animation: pulseGlow 1s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 25px rgba(255, 0, 85, 0.8), 0 0 40px rgba(0, 240, 255, 0.4); }
            100% { box-shadow: 0 0 45px rgba(255, 230, 0, 1), 0 0 70px rgba(255, 0, 85, 0.9); }
        }

        .btn-cyber-action:hover {
            background-position: 100% 0;
            transform: skew(-8deg) scale(1.05) rotate(-1deg);
            box-shadow: 0 0 60px rgba(0, 240, 255, 1), 0 0 90px rgba(255, 0, 85, 1);
            color: #ffe600;
        }

        .btn-cyber-action:disabled {
            background: #1c182e;
            border-color: #444;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: skew(-8deg);
            animation: none;
            text-shadow: none;
        }

        /* 结果展示板 */
        .results-board {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            min-height: 52px;
            align-items: center;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--neon-cyan);
        }

        .res-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            background: var(--car-color);
            color: #000;
            box-shadow: 0 0 15px var(--car-color);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-style: italic;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* 结算 Modal 弹窗 */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(3, 2, 8, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            backdrop-filter: blur(10px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--panel-bg);
            border: 3px solid var(--neon-yellow);
            border-radius: 16px;
            padding: 35px 30px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(255,230,0,0.5), inset 0 0 30px rgba(255,0,85,0.3);
            transform: scale(0.7) skew(-4deg);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal {
            transform: scale(1) skew(-4deg);
        }

        .modal h2 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--neon-yellow);
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(255, 230, 0, 0.9);
            font-style: italic;
        }

        .modal p {
            margin: 18px 0;
            font-size: 1.2rem;
            color: #ddd;
            line-height: 1.6;
            font-family: sans-serif;
        }

        /* 响应式尺寸适配 */
        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .cars-selector { grid-template-columns: repeat(5, 1fr); }
        }

        @media (max-width: 600px) {
            .cars-selector { grid-template-columns: repeat(5, 1fr); }
            .logo-title { font-size: 1.4rem; }
            header { padding: 10px 12px; }
            .car-runner { width: 110px; height: 30px; }
            .flame-container { right: 42px; width: 65px; height: 26px; }
            .car-svg { width: 46px; height: 24px; }
            .lane { height: 38px; }
            .btn-cyber-action { font-size: 1.2rem; padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header 头部 -->
    <header>
        <div class="logo-title">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round">
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffe600" />
                        <stop offset="50%" stop-color="#ff0055" />
                        <stop offset="100%" stop-color="#00f0ff" />
                    </linearGradient>
                </defs>
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 1 12.5V16c0 .6.4 1 1 1h2"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
            </svg>
            CYBER RUSH 10-3
        </div>
        <div class="wallet-panel">
            <div class="stat-item">
                <span class="stat-label">账户筹码</span>
                <span class="stat-val" id="balance-val">1000</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">本次下注</span>
                <span class="stat-val" style="color:var(--neon-cyan)" id="total-bet-val">0</span>
            </div>
        </div>
    </header>

    <!-- 赛道区域 -->
    <div class="track-container">
        <div class="finish-line"></div>
        <div class="track-grid" id="track-grid">
            <!-- 10条赛道动态渲染 -->
        </div>
    </div>

    <!-- 竞猜下注操控面板 -->
    <div class="dashboard">
        <!-- 车辆选择区域 -->
        <div class="panel">
            <div class="panel-title">
                <span>选择3辆战车 (已选 <span id="selected-count" style="color:var(--neon-yellow)">0</span>/3)</span>
                <button class="btn-neon-outline" id="btn-quick-select">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    狂暴随机3连抽
                </button>
            </div>
            <div class="cars-selector" id="cars-selector">
                <!-- 10个炫酷选择卡片 -->
            </div>
        </div>

        <!-- 筹码与行动区域 -->
        <div class="panel bet-controls">
            <div class="panel-title">竞猜筹码设置</div>
            <div class="chip-group">
                <div class="chip-btn active" data-val="10">10</div>
                <div class="chip-btn" data-val="50">50</div>
                <div class="chip-btn" data-val="100">100</div>
                <div class="chip-btn" data-val="500">500</div>
            </div>

            <button class="btn-cyber-action" id="btn-start">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                极速爆气 · 启动
            </button>
            
            <div style="margin-top:2px;">
                <span class="stat-label">前3名终点冲线榜:</span>
                <div class="results-board" id="results-board">
                    <span style="color:#666180; font-size:0.85rem;" id="result-placeholder">等待比赛发令...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 结算 Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title">冲线结算</h2>
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--neon-yellow)" stroke-width="2" style="margin:10px 0; filter:drop-shadow(0 0 15px var(--neon-yellow))">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
        </svg>
        <p id="modal-msg">结算中...</p>
        <button class="btn-cyber-action" id="btn-modal-close" style="width:100%; margin-top:15px; font-size:1.2rem;">开启下一局狂暴竞速</button>
    </div>
</div>

<script>
    // 1. 生成超炫酷矢量赛车 SVG 结构
    function createCarSVG() {
        return `
        <svg class="car-svg" viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 40 L25 20 L55 15 L85 25 L112 32 L118 42 L105 48 L15 48 Z" fill="var(--car-color)" />
            <path d="M30 22 L52 18 L68 25 L30 25 Z" fill="#030208" opacity="0.8"/>
            <path d="M70 25 L88 27 L105 33 L70 33 Z" fill="#030208" opacity="0.7"/>
            <circle cx="30" cy="46" r="10" fill="#111" stroke="var(--car-color)" stroke-width="2.5"/>
            <circle cx="30" cy="46" r="4" fill="#fff"/>
            <circle cx="90" cy="46" r="10" fill="#111" stroke="var(--car-color)" stroke-width="2.5"/>
            <circle cx="90" cy="46" r="4" fill="#fff"/>
            <path d="M8 30 L20 32 L15 40 L5 40 Z" fill="var(--car-color)"/>
            <path d="M2 38 L8 38 L8 42 L2 42 Z" fill="#ff0055" filter="drop-shadow(-2px 0 6px #ff0055)"/>
            <path d="M112 35 L117 37 L112 39 Z" fill="#00f0ff" filter="drop-shadow(4px 0 6px #00f0ff)"/>
        </svg>`;
    }

    // 2. 超级狂暴火焰喷气 SVG 结构（多层火焰粒子与高能电弧效果）
    function createFlameSVG() {
        return `
        <div class="flame-container">
            <svg class="flame-svg" viewBox="0 0 160 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 0. 最外层高能电弧/气浪 -->
                <path d="M0 25 Q 40 0, 80 15 T 160 25 Q 120 45, 80 35 T 0 25 Z" fill="url(#flame-shockwave)" opacity="0.6"/>
                <!-- 1. 外层爆裂红焰 -->
                <path d="M0 25 Q 35 2, 70 12 T 140 25 Q 105 40, 70 38 T 0 25 Z" fill="url(#flame-outer)"/>
                <!-- 2. 中层高能橙黄火焰 -->
                <path d="M0 25 Q 30 8, 55 15 T 110 25 Q 85 33, 55 30 T 0 25 Z" fill="url(#flame-inner)"/>
                <!-- 3. 内核极白等离子光束 -->
                <path d="M0 25 Q 20 14, 40 18 T 80 25 Q 55 28, 40 28 T 0 25 Z" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)"/>
                <!-- 4. 喷射飞溅粒子 -->
                <circle cx="120" cy="18" r="3" fill="#ffe600"/>
                <circle cx="145" cy="28" r="2" fill="#ff0055"/>
                <circle cx="105" cy="34" r="2.5" fill="#00f0ff"/>
                <circle cx="130" cy="12" r="1.5" fill="#ffffff"/>

                <defs>
                    <linearGradient id="flame-shockwave" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00f0ff"/>
                        <stop offset="60%" stop-color="#b000ff"/>
                        <stop offset="100%" stop-color="transparent"/>
                    </linearGradient>
                    <linearGradient id="flame-outer" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ff0055"/>
                        <stop offset="50%" stop-color="#ff5500"/>
                        <stop offset="100%" stop-color="transparent"/>
                    </linearGradient>
                    <linearGradient id="flame-inner" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffe600"/>
                        <stop offset="70%" stop-color="#ffaa00"/>
                        <stop offset="100%" stop-color="transparent"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>`;
    }

    // 全局数据状态：10选3
    const TOTAL_CARS = 10;
    const SELECT_COUNT = 3;
    let balance = 1000;
    let currentChip = 10;
    let selectedCars = new Set();
    let isRacing = false;

    // DOM 引用
    const trackGrid = document.getElementById('track-grid');
    const carsSelector = document.getElementById('cars-selector');
    const balanceVal = document.getElementById('balance-val');
    const totalBetVal = document.getElementById('total-bet-val');
    const selectedCountVal = document.getElementById('selected-count');
    const btnStart = document.getElementById('btn-start');
    const btnQuickSelect = document.getElementById('btn-quick-select');
    const resultsBoard = document.getElementById('results-board');
    const modalOverlay = document.getElementById('modal-overlay');

    // 初始化画面 UI
    function initUI() {
        trackGrid.innerHTML = '';
        carsSelector.innerHTML = '';

        for (let i = 1; i <= TOTAL_CARS; i++) {
            // 1. 生成赛道与喷火容器
            const lane = document.createElement('div');
            lane.className = `lane c-${i}`;
            lane.innerHTML = `
                <div class="lane-id">${i}</div>
                <div class="track-line">
                    <div class="car-runner" id="runner-${i}">
                        ${createFlameSVG()}
                        ${createCarSVG()}
                    </div>
                </div>
            `;
            trackGrid.appendChild(lane);

            // 2. 生成竞猜卡片
            const card = document.createElement('div');
            card.className = `car-card c-${i}`;
            card.dataset.id = i;
            card.innerHTML = `
                <span class="num">${i}号</span>
                ${createCarSVG()}
                <span class="odds">赔率 x5.0</span>
            `;
            card.addEventListener('click', () => toggleCarSelection(i));
            carsSelector.appendChild(card);
        }
    }

    // 选择/取消选择车辆
    function toggleCarSelection(id) {
        if (isRacing) return;

        if (selectedCars.has(id)) {
            selectedCars.delete(id);
        } else {
            if (selectedCars.size >= SELECT_COUNT) return;
            selectedCars.add(id);
        }
        updateSelectionUI();
    }

    // 实时更新选择面板状态
    function updateSelectionUI() {
        document.querySelectorAll('.car-card').forEach(card => {
            const id = parseInt(card.dataset.id);
            if (selectedCars.has(id)) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });

        selectedCountVal.textContent = selectedCars.size;
        const totalBet = selectedCars.size * currentChip;
        totalBetVal.textContent = totalBet;

        // 按钮使能状态控制
        btnStart.disabled = !(selectedCars.size === SELECT_COUNT && balance >= totalBet && totalBet > 0);
    }

    // 筹码按钮切换
    document.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (isRacing) return;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentChip = parseInt(e.target.dataset.val);
            updateSelectionUI();
        });
    });

    // 狂暴随机选3辆
    btnQuickSelect.addEventListener('click', () => {
        if (isRacing) return;
        selectedCars.clear();
        while (selectedCars.size < SELECT_COUNT) {
            const randomId = Math.floor(Math.random() * TOTAL_CARS) + 1;
            selectedCars.add(randomId);
        }
        updateSelectionUI();
    });

    // 开启比赛逻辑
    btnStart.addEventListener('click', () => {
        const totalBet = selectedCars.size * currentChip;
        if (balance < totalBet || selectedCars.size !== SELECT_COUNT || isRacing) return;

        balance -= totalBet;
        balanceVal.textContent = balance;
        isRacing = true;
        btnStart.disabled = true;
        btnQuickSelect.disabled = true;

        // 清空此前开奖结果，添加车辆喷火动画样式
        document.getElementById('result-placeholder')?.remove();
        resultsBoard.innerHTML = '';
        
        for (let i = 1; i <= TOTAL_CARS; i++) {
            document.getElementById(`runner-${i}`).classList.add('racing');
        }

        const progress = new Array(TOTAL_CARS).fill(0);
        const finishedCars = [];

        // 极速冲击定时动画
        const raceInterval = setInterval(() => {
            let allFinished = true;

            for (let i = 1; i <= TOTAL_CARS; i++) {
                if (progress[i - 1] < 88) {
                    allFinished = false;
                    // 超级狂暴加速算法，含超频氮气爆发
                    const nitroBoost = Math.random() > 0.82 ? 2.3 : 1.0;
                    progress[i - 1] += (Math.random() * 2.4 + 0.5) * nitroBoost;

                    if (progress[i - 1] >= 88) {
                        progress[i - 1] = 88;
                        if (!finishedCars.includes(i)) {
                            finishedCars.push(i);
                            // 冲线后熄灭火焰
                            document.getElementById(`runner-${i}`).classList.remove('racing');
                        }
                    }
                    const runner = document.getElementById(`runner-${i}`);
                    runner.style.left = `${progress[i - 1]}%`;
                }
            }

            if (allFinished) {
                clearInterval(raceInterval);
                handleRaceFinish(finishedCars);
            }
        }, 40);
    });

    // 比赛终点结算：10选3，只取前3名
    function handleRaceFinish(rankings) {
        const top3 = rankings.slice(0, 3);

        // 挨个弹出前3名开奖图标
        top3.forEach((carId, index) => {
            setTimeout(() => {
                const badge = document.createElement('div');
                badge.className = `res-badge c-${carId}`;
                badge.textContent = carId;
                resultsBoard.appendChild(badge);
            }, index * 180);
        });

        // 统计命中数量
        let matchCount = 0;
        selectedCars.forEach(carId => {
            if (top3.includes(carId)) matchCount++;
        });

        // 10选3高额赔率计算法则
        let winAmount = 0;
        const totalBet = SELECT_COUNT * currentChip;
        
        if (matchCount === 3) winAmount = totalBet * 8;      // 3辆全中 8倍
        else if (matchCount === 2) winAmount = totalBet * 3.5;// 中2辆 3.5倍
        else if (matchCount === 1) winAmount = totalBet * 1.2;// 中1辆 1.2倍

        winAmount = Math.floor(winAmount);
        balance += winAmount;

        setTimeout(() => {
            balanceVal.textContent = balance;
            const modalMsg = document.getElementById('modal-msg');
            const modalTitle = document.getElementById('modal-title');

            if (winAmount > 0) {
                modalTitle.textContent = "狂暴大捷！";
                modalTitle.style.color = "var(--neon-yellow)";
                modalMsg.innerHTML = `您选择的战车中有 <b style="color:var(--neon-green);font-size:1.8rem;">${matchCount}</b> 辆狂暴杀入前3名！<br>斩获高额筹码：<b style="color:var(--neon-yellow);font-size:1.8rem;">+${winAmount}</b>`;
            } else {
                modalTitle.textContent = "竞猜未命中";
                modalTitle.style.color = "#ff0055";
                modalMsg.innerHTML = `非常遗憾！您选择的战车无一进入前3名。<br>调整策略，爆气再战！`;
            }

            modalOverlay.classList.add('active');
        }, 1000);
    }

    // 关闭 Modal，重置赛道状态
    document.getElementById('btn-modal-close').addEventListener('click', () => {
        modalOverlay.classList.remove('active');

        // 复位赛车位置与喷火
        for (let i = 1; i <= TOTAL_CARS; i++) {
            const runner = document.getElementById(`runner-${i}`);
            runner.classList.remove('racing');
            runner.style.transition = 'none';
            runner.style.left = '0%';
            setTimeout(() => runner.style.transition = 'left 0.1s linear', 50);
        }

        isRacing = false;
        btnQuickSelect.disabled = false;
        updateSelectionUI();
    });

    // 启动初始化
    initUI();
    updateSelectionUI();
</script>
</body>
</html>
