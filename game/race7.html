<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER RUSH 10-3 - 疯狂竞速极速版</title>
    <style>
        :root {
            --bg-dark: #020005;
            --panel-bg: rgba(10, 4, 25, 0.95);
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff0055;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-purple: #b000ff;
            --neon-orange: #ff5500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Segoe UI Black', Arial Black, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.35) 0%, transparent 70%),
                radial-gradient(circle at 80% 90%, rgba(0, 240, 255, 0.25) 0%, transparent 60%),
                linear-gradient(180deg, #020005 0%, #0d021f 100%);
            overflow-x: hidden;
        }

        /* 10辆狂暴赛车专属专属配色定义 */
        .c-1  { --car-color: #ff0055; --glow-color: #ff0055; }
        .c-2  { --car-color: #00f0ff; --glow-color: #00f0ff; }
        .c-3  { --car-color: #ffe600; --glow-color: #ffe600; }
        .c-4  { --car-color: #00ff66; --glow-color: #00ff66; }
        .c-5  { --car-color: #ff00ea; --glow-color: #ff00ea; }
        .c-6  { --car-color: #b000ff; --glow-color: #b000ff; }
        .c-7  { --car-color: #ff5500; --glow-color: #ff5500; }
        .c-8  { --car-color: #00ffff; --glow-color: #00ffff; }
        .c-9  { --car-color: #ffffff; --glow-color: #ffffff; }
        .c-10 { --car-color: #aaff00; --glow-color: #aaff00; }

        .container {
            width: 100%;
            max-width: 1380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Header 头部 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 3px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 10px 20px;
            box-shadow: 0 0 30px rgba(0,240,255,0.6), inset 0 0 15px rgba(0,240,255,0.3);
            backdrop-filter: blur(12px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-title {
            font-size: 2.5rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffe600, #ff0055, #00f0ff, #ffe600);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.9);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: textFlow 3s linear infinite;
        }

        @keyframes textFlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .wallet-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.85);
            padding: 8px 22px;
            border-radius: 8px;
            border: 3px solid var(--neon-magenta);
            box-shadow: 0 0 20px rgba(255,0,85,0.6);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #a0a0c0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .stat-val {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 12px rgba(255, 230, 0, 0.9);
        }

        /* 赛道区域 */
        .track-container {
            background: var(--panel-bg);
            border: 3px solid var(--neon-magenta);
            border-radius: 12px;
            padding: 12px 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(255,0,85,0.4);
        }

        .track-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .lane {
            display: flex;
            align-items: center;
            height: 62px; /* 增大赛道高 */
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            position: relative;
            border-left: 6px solid var(--car-color);
            overflow: visible;
        }

        .lane-id {
            width: 44px;
            text-align: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--car-color);
            z-index: 5;
            text-shadow: 0 0 12px var(--car-color);
            font-style: italic;
        }

        /* 前三名赛车道高亮流光动画 */
        .lane.win {
            overflow: hidden;
            border-left-width: 6px;
            animation: laneWin 1.4s ease-in-out infinite alternate;
        }

        /* 前置能量流光（斜向滚动） */
        .lane.win::before {
            content: '';
            position: absolute;
            inset: 0;
            right: 8%; /* 高亮止于终点线，不遮挡车头（自适应屏幕） */
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(115deg,
                transparent 0%,
                var(--metal) 0%,
                transparent 18%,
                transparent 32%,
                var(--metal) 50%,
                transparent 68%,
                transparent 82%,
                var(--metal) 100%);
            background-size: 220% 100%;
            opacity: 0.22;
            animation: energyFlow 2.4s linear infinite;
        }

        /* 双向交叉扫描光带 */
        .lane.win::after {
            content: '';
            position: absolute;
            inset: 0;
            right: 8%; /* 高亮止于终点线，不遮挡车头（自适应屏幕） */
            pointer-events: none;
            z-index: 3;
            background:
                linear-gradient(100deg, transparent 0%, rgba(255,255,255,0) 44%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 56%, transparent 100%),
                linear-gradient(100deg, transparent 0%, var(--metal) 0%, transparent 30%, transparent 70%, var(--metal) 100%);
            background-size: 250% 100%, 250% 100%;
            animation: scanLight 1.1s linear infinite;
        }

        @keyframes scanLight {
            0% { background-position: 160% 0, -160% 0; }
            100% { background-position: -160% 0, 160% 0; }
        }

        @keyframes energyFlow {
            0% { background-position: 0% 0; }
            100% { background-position: 220% 0; }
        }

        @keyframes laneWin {
            0% {
                background: color-mix(in srgb, var(--metal) 6%, transparent);
                box-shadow: inset 0 0 22px color-mix(in srgb, var(--metal) 35%, transparent),
                            0 0 10px color-mix(in srgb, var(--metal) 40%, transparent);
            }
            100% {
                background: color-mix(in srgb, var(--metal) 22%, transparent);
                box-shadow: inset 0 0 55px color-mix(in srgb, var(--metal) 90%, transparent),
                            0 0 32px color-mix(in srgb, var(--metal) 75%, transparent);
            }
        }

        /* 前三名名次徽章（金/银/铜） */
        .rank-badge {
            position: absolute;
            right: 10%; /* 紧挨终点线（8%）左侧，自适应屏幕 */
            top: 50%;
            transform: translateY(-50%);
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            font-weight: 900;
            font-style: italic;
            z-index: 6;
            border: 3px solid #fff;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.6), 2px 2px 0 #000;
            animation: rankPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275), rankGlow 0.8s infinite alternate;
        }

        /* 徽章旋转光环 */
        .rank-badge::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 3px solid var(--metal, #ffd700);
            border-top-color: transparent;
            border-bottom-color: transparent;
            opacity: 0.9;
            box-shadow: 0 0 16px var(--metal, #ffd700);
            animation: badgeSpin 1.6s linear infinite;
        }

        @keyframes badgeSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .lane.rank-1 { --metal: #ffd700; border-left-color: #ffd700; }
        .lane.rank-2 { --metal: #d8d8e8; border-left-color: #d8d8e8; }
        .lane.rank-3 { --metal: #cd7f32; border-left-color: #cd7f32; }

        .lane.rank-1 .rank-badge {
            background: radial-gradient(circle at 35% 30%, #fffbe6, #ffd700 55%, #b8860b);
            color: #5a3b00;
            box-shadow: 0 0 35px #ffd700, inset 0 0 14px #fff6c0;
        }

        .lane.rank-2 .rank-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #d8d8e8 55%, #9a9ab0);
            color: #2b2b3e;
            box-shadow: 0 0 35px #d8d8e8, inset 0 0 14px #ffffff;
        }

        .lane.rank-3 .rank-badge {
            background: radial-gradient(circle at 35% 30%, #ffe2c0, #cd7f32 55%, #8a5320);
            color: #3a1d00;
            box-shadow: 0 0 35px #cd7f32, inset 0 0 14px #ffe2c0;
        }

        @keyframes rankPop {
            0% { transform: translateY(-50%) scale(0) rotate(-220deg); opacity: 0; }
            100% { transform: translateY(-50%) scale(1) rotate(0); opacity: 1; }
        }

        @keyframes rankGlow {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.5); }
        }

        /* 明确的起点线（位于每条赛道 track-line 内，紧贴车头正前方） */
        .start-line {
            position: absolute;
            left: 100px; /* 车头在 x≈95px（车身95px贴左），起跑线紧贴车头前方 */
            top: 0;
            bottom: 0;
            width: 8px;
            background: repeating-linear-gradient(0deg, #ffe600, #ffe600 10px, #000 10px, #000 20px);
            z-index: 2;
            box-shadow: 0 0 10px #ffe600;
        }

        .track-line {
            flex-grow: 1;
            height: 100%;
            position: relative;
            margin-left: 0; /* 紧贴道号，车紧挨数字 */
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 40px, transparent 40px, transparent 80px);
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        .finish-line {
            position: absolute;
            right: 8%; /* 自适应：终点线距右边界比例，确保各尺寸下赛车都能冲过线 */
            top: 0;
            bottom: 0;
            width: 20px;
            background: repeating-linear-gradient(45deg, #fff, #fff 8px, #000 8px, #000 16px);
            z-index: 2;
            box-shadow: 0 0 20px rgba(255,255,255,0.9);
        }

        /* 赛车及跑动容器 - 完美对齐起点线 */
        .car-runner {
            position: absolute;
            left: 0%; /* 从 0% 绝对起点出发 */
            top: 50%;
            transform: translateY(-50%);
            width: 210px; /* 宽大尺寸容纳大车与超长喷火 */
            height: 58px;
            transition: left 0.1s linear;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* 车尾贴左，紧挨数字；尾焰向左喷出（在车后方，不遮挡数字） */
        }

        /* 暴躁大尺寸 SVG 赛车 */
        .car-svg {
            width: 95px; /* 车身加大！ */
            height: 48px;
            filter: drop-shadow(0 0 12px var(--car-color)) drop-shadow(0 0 20px var(--car-color));
            z-index: 2;
            flex-shrink: 0;
        }

        /* 疯狂特效火焰喷射容器（从车尾向左喷出，位于车后方） */
        .flame-container {
            position: absolute;
            left: -118px; /* 车尾紧贴数字，尾焰向左喷出到车后方 */
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
            width: 120px; /* 超长爆炸喷火 */
            height: 52px;
            opacity: 0;
            transition: opacity 0.15s;
            pointer-events: none;
            z-index: 1;
        }

        .car-runner.racing .flame-container {
            opacity: 1;
        }

        .flame-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 10px #ff0055) drop-shadow(0 0 22px #ffaa00) drop-shadow(0 0 30px #00f0ff);
            animation: crazyFlame 0.04s infinite alternate ease-in-out;
        }

        @keyframes crazyFlame {
            0% { transform: scale(0.9, 0.7) translateY(-3px); opacity: 0.85; }
            50% { transform: scale(1.3, 1.4) translateY(2px); opacity: 1; }
            100% { transform: scale(1.6, 0.8) translateY(0px); opacity: 0.95; }
        }

        /* 操控与竞猜面板 */
        .dashboard {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 12px;
        }

        .panel {
            background: var(--panel-bg);
            border: 3px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 14px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0,240,255,0.3);
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--neon-cyan);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.9);
            font-style: italic;
        }

        .cars-selector {
            flex: 1; /* 占满左侧面板剩余高度 */
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-auto-rows: 1fr; /* 两行等分高度，卡片被拉高放大 */
            gap: 12px;
            min-height: 0;
        }

        /* 暴躁选择卡片 */
        .car-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.6) 100%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly; /* 卡片拉高后内容上下分散放大 */
            min-height: 0;
            cursor: pointer;
            transition: all 0.15s ease-out;
            position: relative;
            overflow: hidden;
        }

        .car-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.3s;
        }

        .car-card:hover::before {
            left: 100%;
        }

        .car-card:hover {
            background: rgba(0, 240, 255, 0.25);
            border-color: var(--neon-yellow);
            transform: scale(1.08) translateY(-4px);
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.8);
        }

        .car-card.selected {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.6) 0%, rgba(176, 0, 255, 0.5) 100%);
            border: 3px solid var(--neon-yellow);
            box-shadow: 0 0 30px rgba(255, 230, 0, 1), inset 0 0 15px rgba(255, 230, 0, 0.6);
            transform: scale(1.05);
            animation: cardGlow 0.8s infinite alternate;
        }

        @keyframes cardGlow {
            0% { border-color: var(--neon-yellow); box-shadow: 0 0 20px var(--neon-yellow); }
            100% { border-color: var(--neon-magenta); box-shadow: 0 0 35px var(--neon-magenta); }
        }

        .car-card .num {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--car-color);
            text-shadow: 0 0 10px var(--car-color);
            font-style: italic;
        }

        .car-card .odds {
            font-size: 0.8rem;
            color: #fff;
            font-weight: 900;
            text-shadow: 0 0 6px var(--neon-cyan);
            margin-top: 2px;
        }

        /* 疯狂爆裂按钮设计 */
        .btn-crazy-random {
            background: linear-gradient(135deg, #ff0055 0%, #ff5500 50%, #ffe600 100%);
            border: 3px solid #00f0ff;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.9);
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 0 0 6px #000, 2px 2px 0px #000;
            animation: pulseRandom 1.2s infinite alternate;
        }

        @keyframes pulseRandom {
            0% { transform: scale(1); box-shadow: 0 0 15px #ff0055; }
            100% { transform: scale(1.05); box-shadow: 0 0 30px #ffe600; }
        }

        .btn-crazy-random:hover {
            transform: scale(1.15);
            box-shadow: 0 0 35px rgba(255, 230, 0, 1), 0 0 50px rgba(0, 240, 255, 1);
            color: #ffe600;
        }

        /* 筹码控制面板 */
        .bet-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-color: var(--neon-magenta);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
        }

        .chip-group {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }

        /* 疯狂筹码按钮 */
        .chip-btn {
            background: linear-gradient(180deg, #180933 0%, #080214 100%);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            flex: 1;
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            font-style: italic;
            position: relative;
            overflow: hidden;
        }

        .chip-btn:hover {
            transform: scale(1.12) translateY(-3px);
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.9);
        }

        .chip-btn.active {
            background: linear-gradient(135deg, var(--neon-magenta) 0%, var(--neon-purple) 100%);
            border: 3px solid var(--neon-yellow);
            color: #ffe600;
            box-shadow: 0 0 30px rgba(255, 0, 85, 1), inset 0 0 10px #ffe600;
            transform: scale(1.1);
            text-shadow: 0 0 10px #ffe600, 2px 2px 0 #000;
        }

        /* 超强发射行动按钮 */
        .btn-cyber-action {
            position: relative;
            background: linear-gradient(90deg, #ffe600 0%, #ff0055 40%, #b000ff 80%, #00f0ff 100%);
            background-size: 300% 100%;
            border: 4px solid #ffe600;
            border-radius: 10px;
            padding: 18px;
            color: #fff;
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.9), 0 0 60px rgba(0, 240, 255, 0.6);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-style: italic;
            text-shadow: 0 0 12px #000, 3px 3px 0px #000;
            animation: launchFlow 2s linear infinite, launchGlow 0.8s infinite alternate;
        }

        @keyframes launchFlow {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        @keyframes launchGlow {
            0% { box-shadow: 0 0 30px rgba(255, 0, 85, 0.9), 0 0 50px rgba(0, 240, 255, 0.5); }
            100% { box-shadow: 0 0 60px rgba(255, 230, 0, 1), 0 0 90px rgba(255, 0, 85, 1); }
        }

        .btn-cyber-action:hover {
            transform: scale(1.06);
            box-shadow: 0 0 70px rgba(0, 240, 255, 1), 0 0 100px rgba(255, 0, 85, 1);
            color: #ffe600;
            border-color: #00f0ff;
        }

        .btn-cyber-action:disabled {
            background: #1a162b;
            border-color: #444;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            animation: none;
            text-shadow: none;
        }

        /* 结果展示板 */
        .results-board {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            min-height: 60px; /* 预留容纳三个44px徽章的固定高度，避免徽章出现/消失导致高度跳动 */
            height: 60px;
            align-items: center;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 8px;
            border: 2px solid var(--neon-cyan);
            box-shadow: inset 0 0 10px rgba(0,240,255,0.3);
            overflow: hidden;
        }

        .res-badge {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.4rem;
            background: var(--car-color);
            color: #000;
            box-shadow: 0 0 20px var(--car-color);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-style: italic;
            border: 2px solid #fff;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* 结算 Modal 弹窗（无黑色遮罩，透明背景浮层） */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            backdrop-filter: none;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: none; /* 不拦截页面操作 */
        }

        .modal {
            background: var(--panel-bg);
            border: 4px solid var(--neon-yellow);
            border-radius: 16px;
            padding: 35px 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 80px rgba(255,230,0,0.6), inset 0 0 40px rgba(255,0,85,0.4);
            transform: scale(0.7);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--neon-yellow);
            margin-bottom: 12px;
            text-shadow: 0 0 25px rgba(255, 230, 0, 1);
            font-style: italic;
        }

        .modal p {
            margin: 18px 0;
            font-size: 1.25rem;
            color: #ddd;
            line-height: 1.6;
            font-family: sans-serif;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .cars-selector { grid-template-columns: repeat(5, 1fr); }
            .car-runner { width: 170px; height: 48px; }
            .car-svg { width: 75px; height: 38px; }
            .flame-container { right: 70px; width: 95px; height: 42px; }
            .lane { height: 52px; }
            .start-line { left: 80px; } /* 小屏车身宽75px，起跑线紧贴车头前方 */
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header 头部 -->
    <header>
        <div class="logo-title">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="url(#logo-grad)" stroke-width="3" stroke-linecap="round">
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffe600" />
                        <stop offset="50%" stop-color="#ff0055" />
                        <stop offset="100%" stop-color="#00f0ff" />
                    </linearGradient>
                </defs>
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
            CYBER RUSH 10-3
        </div>
        <div class="wallet-panel">
            <div class="stat-item">
                <span class="stat-label">账户筹码</span>
                <span class="stat-val" id="balance-val">1000</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">本次下注</span>
                <span class="stat-val" style="color:var(--neon-cyan)" id="total-bet-val">0</span>
            </div>
        </div>
    </header>

    <!-- 赛道区域 -->
    <div class="track-container">
        <div class="finish-line"></div>
        <div class="track-grid" id="track-grid">
            <!-- 10条赛道与10辆差异化战车 -->
        </div>
    </div>

    <!-- 竞猜操控面板 -->
    <div class="dashboard">
        <!-- 车辆选择区域 -->
        <div class="panel">
            <div class="panel-title">
                <span>选择3辆战车 (已选 <span id="selected-count" style="color:var(--neon-yellow)">0</span>/3)</span>
                <button class="btn-crazy-random" id="btn-quick-select">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    疯狂随机3连抽
                </button>
            </div>
            <div class="cars-selector" id="cars-selector">
                <!-- 10个车辆卡片 -->
            </div>
        </div>

        <!-- 筹码与行动区域 -->
        <div class="panel bet-controls">
            <div class="panel-title">竞猜筹码设置</div>
            <div class="chip-group">
                <div class="chip-btn active" data-val="10">10</div>
                <div class="chip-btn" data-val="50">50</div>
                <div class="chip-btn" data-val="100">100</div>
                <div class="chip-btn" data-val="500">500</div>
            </div>

            <button class="btn-cyber-action" id="btn-start">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                极速爆气 · 启动
            </button>
            
            <div style="margin-top:2px;">
                <span class="stat-label">前3名冲线排行榜:</span>
                <div class="results-board" id="results-board">
                    <span style="color:#666180; font-size:0.85rem;" id="result-placeholder">等待比赛发令...</span>
                </div>
            </div>

            <button class="btn-cyber-action" id="btn-next-round" style="margin-top:12px; font-size:1.3rem; width:100%;" disabled>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                开启下一局狂暴竞速
            </button>
        </div>
    </div>
</div>

<!-- 结算 Modal（自动消失） -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title">冲线结算</h2>
        <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="var(--neon-yellow)" stroke-width="2.5" style="margin:10px 0; filter:drop-shadow(0 0 20px var(--neon-yellow))">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
        </svg>
        <p id="modal-msg">结算中...</p>
    </div>
</div>

<script>
    // 1. 生成10种造型完全迥异的暴躁赛车 SVG
    function createUniqueCarSVG(id) {
        const carStyles = {
            1: `<path d="M10 38 L25 15 L65 12 L95 22 L115 30 L118 42 L10 42 Z" fill="var(--car-color)" /><path d="M80 12 L110 15 L105 24 Z" fill="var(--car-color)"/><path d="M28 17 L58 15 L68 24 L28 24 Z" fill="#000" opacity="0.85"/>`, // 强力尾翼超跑
            2: `<path d="M5 38 L15 28 L50 20 L80 22 L118 35 L118 44 L5 44 Z" fill="var(--car-color)" /><path d="M10 20 L30 20 L20 28 Z" fill="var(--car-color)"/><path d="M55 22 L75 24 L72 32 L50 32 Z" fill="#000" opacity="0.85"/>`, // 前突装甲车
            3: `<path d="M15 42 L30 10 L70 10 L110 32 L118 42 Z" fill="var(--car-color)" /><path d="M35 12 L65 12 L80 28 L30 28 Z" fill="#000" opacity="0.9"/>`, // 经典高顶战车
            4: `<path d="M8 40 L40 18 L75 18 L115 28 L115 42 Z" fill="var(--car-color)" /><path d="M5 25 L25 25 L15 40 Z" fill="var(--car-color)"/><circle cx="60" cy="28" r="8" fill="#000"/>`, // 疯狂怪兽车
            5: `<path d="M12 42 L20 22 L85 16 L118 38 L118 44 Z" fill="var(--car-color)" /><path d="M25 24 L75 20 L82 28 L25 28 Z" fill="#000" opacity="0.8"/>`, // 低扎子弹头
            6: `<path d="M10 40 L35 14 L60 14 L80 25 L115 25 L118 42 Z" fill="var(--car-color)" /><path d="M80 15 L115 15 L115 25 Z" fill="var(--car-color)"/>`, // 巨型双尾翼
            7: `<path d="M5 42 L25 30 L55 12 L90 28 L118 32 L118 44 Z" fill="var(--car-color)" /><path d="M60 16 L85 28 L55 28 Z" fill="#000" opacity="0.85"/>`, // 极速流线型
            8: `<path d="M15 42 L15 20 L50 15 L95 20 L118 42 Z" fill="var(--car-color)" /><path d="M20 22 L48 18 L48 28 L20 28 Z" fill="#000" opacity="0.85"/>`, // 装甲箱型车
            9: `<path d="M8 38 L28 12 L78 12 L118 38 L118 44 Z" fill="var(--car-color)" /><path d="M32 15 L72 15 L90 32 L20 32 Z" fill="#000" opacity="0.9"/>`, // 肌肉跑车
            10: `<path d="M12 42 L18 25 L45 25 L65 15 L105 28 L118 42 Z" fill="var(--car-color)" /><path d="M68 18 L98 28 L60 28 Z" fill="#000" opacity="0.85"/>` // 异形赛车
        };

        return `
        <svg class="car-svg" viewBox="0 0 120 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            ${carStyles[id] || carStyles[1]}
            <!-- 车轮底盘 -->
            <circle cx="28" cy="42" r="9" fill="#05030a" stroke="var(--car-color)" stroke-width="3"/>
            <circle cx="28" cy="42" r="4" fill="#fff"/>
            <circle cx="92" cy="42" r="9" fill="#05030a" stroke="var(--car-color)" stroke-width="3"/>
            <circle cx="92" cy="42" r="4" fill="#fff"/>
            <!-- 前大灯与车尾灯 -->
            <path d="M112 32 L118 34 L112 36 Z" fill="#00f0ff" filter="drop-shadow(5px 0 8px #00f0ff)"/>
            <path d="M8 32 L2 32 L2 38 L8 38 Z" fill="#ff0055" filter="drop-shadow(-4px 0 8px #ff0055)"/>
        </svg>`;
    }

    // 2. 疯狂多层爆炸火焰喷气 SVG
    function createFlameSVG() {
        return `
        <div class="flame-container">
            <svg class="flame-svg" viewBox="0 0 180 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 30 Q 45 0, 90 20 T 180 30 Q 135 55, 90 40 T 0 30 Z" fill="url(#flame-shockwave)" opacity="0.7"/>
                <path d="M0 30 Q 40 2, 80 15 T 160 30 Q 120 48, 80 42 T 0 30 Z" fill="url(#flame-outer)"/>
                <path d="M0 30 Q 30 8, 60 18 T 120 30 Q 90 38, 60 35 T 0 30 Z" fill="url(#flame-inner)"/>
                <path d="M0 30 Q 20 16, 40 20 T 90 30 Q 60 34, 40 32 T 0 30 Z" fill="#ffffff" filter="drop-shadow(0 0 10px #ffffff)"/>
                <circle cx="130" cy="20" r="3.5" fill="#ffe600"/>
                <circle cx="160" cy="34" r="2.5" fill="#ff0055"/>
                <circle cx="110" cy="40" r="3" fill="#00f0ff"/>
                <circle cx="145" cy="14" r="2" fill="#ffffff"/>

                <defs>
                    <linearGradient id="flame-shockwave" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00f0ff"/>
                        <stop offset="60%" stop-color="#b000ff"/>
                        <stop offset="100%" stop-color="transparent"/>
                    </linearGradient>
                    <linearGradient id="flame-outer" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ff0055"/>
                        <stop offset="50%" stop-color="#ff5500"/>
                        <stop offset="100%" stop-color="transparent"/>
                    </linearGradient>
                    <linearGradient id="flame-inner" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffe600"/>
                        <stop offset="70%" stop-color="#ffaa00"/>
                        <stop offset="100%" stop-color="transparent"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>`;
    }

    // 全局数据状态：10选3
    const TOTAL_CARS = 10;
    const SELECT_COUNT = 3;
    let balance = 1000;
    let currentChip = 10;
    let selectedCars = new Set();
    let isRacing = false;

    // DOM 引用
    const trackGrid = document.getElementById('track-grid');
    const carsSelector = document.getElementById('cars-selector');
    const balanceVal = document.getElementById('balance-val');
    const totalBetVal = document.getElementById('total-bet-val');
    const selectedCountVal = document.getElementById('selected-count');
    const btnStart = document.getElementById('btn-start');
    const btnQuickSelect = document.getElementById('btn-quick-select');
    const btnNextRound = document.getElementById('btn-next-round');
    const resultsBoard = document.getElementById('results-board');
    const modalOverlay = document.getElementById('modal-overlay');

    // 初始化画面 UI
    function initUI() {
        trackGrid.innerHTML = '';
        carsSelector.innerHTML = '';

        for (let i = 1; i <= TOTAL_CARS; i++) {
            // 1. 生成赛道与喷火容器
            const lane = document.createElement('div');
            lane.className = `lane c-${i}`;
            lane.innerHTML = `
                <div class="lane-id">${i}</div>
                <div class="track-line">
                    <div class="start-line"></div>
                    <div class="car-runner" id="runner-${i}" style="left: 0px;">
                        ${createFlameSVG()}
                        ${createUniqueCarSVG(i)}
                    </div>
                </div>
            `;
            trackGrid.appendChild(lane);

            // 2. 生成竞猜卡片
            const card = document.createElement('div');
            card.className = `car-card c-${i}`;
            card.dataset.id = i;
            card.innerHTML = `
                <span class="num">${i}号</span>
                ${createUniqueCarSVG(i)}
                <span class="odds">赔率 x5.0</span>
            `;
            card.addEventListener('click', () => toggleCarSelection(i));
            carsSelector.appendChild(card);
        }
    }

    // 选择/取消选择车辆
    function toggleCarSelection(id) {
        if (isRacing) return;

        if (selectedCars.has(id)) {
            selectedCars.delete(id);
        } else {
            if (selectedCars.size >= SELECT_COUNT) return;
            selectedCars.add(id);
        }
        updateSelectionUI();
    }

    // 实时更新选择面板状态
    function updateSelectionUI() {
        document.querySelectorAll('.car-card').forEach(card => {
            const id = parseInt(card.dataset.id);
            if (selectedCars.has(id)) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });

        selectedCountVal.textContent = selectedCars.size;
        const totalBet = selectedCars.size * currentChip;
        totalBetVal.textContent = totalBet;

        btnStart.disabled = !(selectedCars.size === SELECT_COUNT && balance >= totalBet && totalBet > 0);
    }

    // 筹码按钮切换
    document.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (isRacing) return;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentChip = parseInt(e.target.dataset.val);
            updateSelectionUI();
        });
    });

    // 疯狂随机选3辆
    btnQuickSelect.addEventListener('click', () => {
        if (isRacing) return;
        selectedCars.clear();
        while (selectedCars.size < SELECT_COUNT) {
            const randomId = Math.floor(Math.random() * TOTAL_CARS) + 1;
            selectedCars.add(randomId);
        }
        updateSelectionUI();
    });

    // 开启比赛逻辑
    btnStart.addEventListener('click', () => {
        const totalBet = selectedCars.size * currentChip;
        if (balance < totalBet || selectedCars.size !== SELECT_COUNT || isRacing) return;

        balance -= totalBet;
        balanceVal.textContent = balance;
        isRacing = true;
        btnStart.disabled = true;
        btnQuickSelect.disabled = true;
        btnNextRound.disabled = true;

        document.getElementById('result-placeholder')?.remove();
        resultsBoard.innerHTML = '';
        
        for (let i = 1; i <= TOTAL_CARS; i++) {
            document.getElementById(`runner-${i}`).classList.add('racing');
        }

        const progress = new Array(TOTAL_CARS).fill(0);
        const finishedCars = [];

        // 极速冲击定时动画
        const raceInterval = setInterval(() => {
            let allFinished = true;

            for (let i = 1; i <= TOTAL_CARS; i++) {
                if (progress[i - 1] < 93) {
                    allFinished = false;
                    // 超级狂暴加速算法
                    const nitroBoost = Math.random() > 0.8 ? 2.5 : 1.0;
                    progress[i - 1] += (Math.random() * 2.5 + 0.6) * nitroBoost;

                    if (progress[i - 1] >= 93) {
                        progress[i - 1] = 93;
                        if (!finishedCars.includes(i)) {
                            finishedCars.push(i);
                            document.getElementById(`runner-${i}`).classList.remove('racing');
                        }
                    }
                    const runner = document.getElementById(`runner-${i}`);
                    runner.style.left = `${progress[i - 1]}%`;
                }
            }

            if (allFinished) {
                clearInterval(raceInterval);
                handleRaceFinish(finishedCars);
            }
        }, 35);
    });

    // 终点结算
    function handleRaceFinish(rankings) {
        const top3 = rankings.slice(0, 3);

        // 高亮前三名赛车道 + 标注名次徽章
        top3.forEach((carId, idx) => {
            const runner = document.getElementById(`runner-${carId}`);
            const lane = runner.closest('.lane');
            if (!lane) return;
            lane.classList.add('win', `rank-${idx + 1}`);
            const badge = document.createElement('div');
            badge.className = 'rank-badge';
            badge.textContent = idx + 1;
            lane.appendChild(badge);
        });

        top3.forEach((carId, index) => {
            setTimeout(() => {
                const badge = document.createElement('div');
                badge.className = `res-badge c-${carId}`;
                badge.textContent = carId;
                resultsBoard.appendChild(badge);
            }, index * 180);
        });

        let matchCount = 0;
        selectedCars.forEach(carId => {
            if (top3.includes(carId)) matchCount++;
        });

        let winAmount = 0;
        const totalBet = SELECT_COUNT * currentChip;
        
        if (matchCount === 3) winAmount = totalBet * 8;
        else if (matchCount === 2) winAmount = totalBet * 3.5;
        else if (matchCount === 1) winAmount = totalBet * 1.2;

        winAmount = Math.floor(winAmount);
        balance += winAmount;

        setTimeout(() => {
            balanceVal.textContent = balance;
            const modalMsg = document.getElementById('modal-msg');
            const modalTitle = document.getElementById('modal-title');

            if (winAmount > 0) {
                modalTitle.textContent = "狂暴大捷！";
                modalTitle.style.color = "var(--neon-yellow)";
                modalMsg.innerHTML = `您选择的战车中有 <b style="color:var(--neon-green);font-size:1.8rem;">${matchCount}</b> 辆狂暴杀入前3名！<br>斩获高额筹码：<b style="color:var(--neon-yellow);font-size:1.8rem;">+${winAmount}</b>`;
            } else {
                modalTitle.textContent = "竞猜未命中";
                modalTitle.style.color = "#ff0055";
                modalMsg.innerHTML = `非常遗憾！您选择的战车无一进入前3名。<br>调整策略，爆气再战！`;
            }

            modalOverlay.classList.add('active');
            btnNextRound.disabled = false; // 结算后启用"下一局"按钮
            // 结算界面自动消失（仅关闭弹窗，不重置赛道）
            setTimeout(() => {
                closeModal();
            }, 3500);
        }, 1000);
    }

    // 仅关闭结算弹窗（不重置赛道）
    function closeModal() {
        modalOverlay.classList.remove('active');
    }

    // 关闭 Modal 并重置赛道状态至起点（供"下一局"按钮调用）
    function resetAfterRace() {
        closeModal();

        for (let i = 1; i <= TOTAL_CARS; i++) {
            const runner = document.getElementById(`runner-${i}`);
            runner.classList.remove('racing');
            runner.style.transition = 'none';
            runner.style.left = '0px'; /* 归位到紧挨数字（道号）处 */
            setTimeout(() => runner.style.transition = 'left 0.1s linear', 50);
            // 清除上一局前三名赛道高亮与名次徽章
            const lane = runner.closest('.lane');
            if (lane) {
                lane.classList.remove('win', 'rank-1', 'rank-2', 'rank-3');
                const badge = lane.querySelector('.rank-badge');
                if (badge) badge.remove();
            }
        }

        isRacing = false;
        btnQuickSelect.disabled = false;
        btnNextRound.disabled = true;
        updateSelectionUI();
    }

    document.getElementById('btn-next-round').addEventListener('click', () => {
        resetAfterRace();
    });

    initUI();
    updateSelectionUI();
</script>
</body>
</html>
