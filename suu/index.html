<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suuful</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FBCFE8'/%3E%3Cstop offset='0.5' stop-color='%23FDA4AF'/%3E%3Cstop offset='1' stop-color='%23FDBA74'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='16' r='8' fill='%23FFF6E9' opacity='0.5'/%3E%3Ccircle cx='20' cy='16' r='8' fill='%23FFF6E9' opacity='0.5'/%3E%3Cpath d='M16 11 Q17 14 21 16 Q17 18 16 21 Q15 18 11 16 Q15 14 16 11 Z' fill='white'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef2f2 50%, #f0f9ff 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
        }

        .nav-item-active {
            color: #3b82f6;
            position: relative;
        }

        .nav-item-active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: #3b82f6;
            border-radius: 50%;
        }

        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .planet-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            transition: all 0.3s ease;
        }

        .planet-glow:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
        }

        .ptab {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.7);
            color: #4b5563;
        }
        .ptab.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
            font-weight: 500;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 16px;
            text-align: left;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .settings-row:hover { background: rgba(255,255,255,0.4); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background: #cbd5e1; transition: .2s; border-radius: 999px; }
        .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: #fff; transition: .2s; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
        .switch input:checked + .slider { background: #3b82f6; }
        .switch input:checked + .slider:before { transform: translateX(20px); }

        .view-fade {
            animation: fadeIn 0.35s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .like-pop { animation: likePop 0.4s ease; }
        @keyframes likePop {
            0% { transform: scale(1); }
            40% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }

        .chat-bubble-me {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
        }
        .chat-bubble-them {
            background: rgba(255,255,255,0.85);
            color: #374151;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.45);
            backdrop-filter: blur(4px);
            z-index: 60;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .modal-overlay { align-items: center; }
        }
        .sheet {
            width: 100%;
            max-width: 32rem;
            max-height: 85vh;
            animation: slideUp 0.3s ease;
        }
        @media (min-width: 768px) {
            .sheet { border-radius: 24px; animation: popIn 0.25s ease; }
        }
        /* 搜索弹窗在所有屏幕尺寸下都使用居中弹出样式，与大屏一致 */
        #search-modal { align-items: center; }
        #search-modal .sheet {
            width: calc(100% - 2rem);
            min-width: 0;
            max-width: 32rem;
            border-radius: 24px;
            animation: popIn 0.25s ease;
        }
        /* 评论弹窗小屏也保持左右边距，与搜索一致 */
        #comment-modal .sheet {
            width: calc(100% - 2rem);
            min-width: 0;
            max-width: 32rem;
        }
        /* 首页 feed 大屏瀑布流：高度随内容自然变化，不再每行等高 */
        #feed { column-count: 1; column-gap: 1.5rem; }
        @media (min-width: 768px) { #feed { column-count: 2; } }
        @media (min-width: 1024px) { #feed { column-count: 3; } }
        #feed > .glass-card {
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            margin-bottom: 1.5rem;
            width: 100%;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 语音波形动画（仅播放时） */
        .wave-bar { transform-origin: bottom; }
        .playing .wave-bar { animation: wave 1.2s ease-in-out infinite; }
        @keyframes wave {
            0%,100% { transform: scaleY(0.35); }
            50% { transform: scaleY(1); }
        }

        /* 搜索定位到帖子时的高亮 */
        .post-highlight { animation: postPulse 1.6s ease; }
        @keyframes postPulse {
            0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.55); }
            100% { box-shadow: 0 0 0 14px rgba(59,130,246,0); }
        }

        /* 开屏动画 */
        #splash { transition: opacity 0.6s ease; }
        #splash.splash-hide { opacity: 0; pointer-events: none; }
        #splash-logo { animation: splashPop 0.85s cubic-bezier(0.22,1,0.36,1) both; }
        #splash-title { animation: splashFade 0.6s ease 0.45s both; }
        @keyframes splashPop {
            from { transform: scale(0.4); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes splashFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }
    </style>
</head>
<body class="pb-16 md:pb-0 md:pl-20">

    <nav class="fixed bottom-0 left-0 w-full h-16 md:h-full md:w-20 glass-card rounded-none border-t md:border-t-0 md:border-r z-50 flex md:flex-col items-center justify-around md:justify-center gap-8 md:py-8">
        <div class="hidden md:block mb-auto">
            <div class="w-10 h-10 bg-gradient-to-br from-amber-200 via-rose-300 to-orange-300 rounded-2xl flex items-center justify-center shadow-lg">
                <svg viewBox="0 0 24 24" fill="none" class="w-7 h-7">
                    <circle cx="9" cy="12" r="6" fill="#FFF6E9" opacity="0.5"/>
                    <circle cx="15" cy="12" r="6" fill="#FFF6E9" opacity="0.5"/>
                    <path d="M12 8.5 Q12.8 11.2 15.5 12 Q12.8 12.8 12 15.5 Q11.2 12.8 8.5 12 Q11.2 11.2 12 8.5 Z" fill="#FFFFFF"/>
                </svg>
            </div>
        </div>
        <a href="#" class="nav-item-active text-gray-400 hover:text-blue-500 transition-colors flex flex-col items-center" data-tab="home">
            <i data-lucide="home"></i>
            <span class="hidden md:block text-[10px] leading-none mt-1">首页</span>
        </a>
        <a href="#" class="text-gray-500 hover:text-blue-500 transition-colors flex flex-col items-center" data-tab="planet">
            <i data-lucide="globe"></i>
            <span class="hidden md:block text-[10px] leading-none mt-1">星球</span>
        </a>
        <a href="#" class="text-gray-400 hover:text-blue-500 transition-colors relative flex flex-col items-center" data-tab="message">
            <i data-lucide="message-circle"></i>
            <span id="msg-badge" class="hidden absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] leading-none min-w-[1rem] h-4 px-1 rounded-full flex items-center justify-center">0</span>
            <span class="hidden md:block text-[10px] leading-none mt-1">消息</span>
        </a>
        <a href="#" class="text-gray-400 hover:text-blue-500 transition-colors flex flex-col items-center" data-tab="profile">
            <i data-lucide="user"></i>
            <span class="hidden md:block text-[10px] leading-none mt-1">我的</span>
        </a>
        <div id="settings-btn" class="hidden md:block mt-auto text-gray-400 cursor-pointer hover:text-blue-500 transition-colors">
            <i data-lucide="settings"></i>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 md:p-8">

        <!-- ============ HOME ============ -->
        <div id="home-content">
            <header class="flex justify-between items-center mb-3">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Suuful</h1>
                    <p class="text-sm text-gray-500">发现有趣的灵魂</p>
                </div>
                <button id="search-btn" class="p-2 glass-card rounded-full hover:bg-white transition-all">
                    <i data-lucide="search" class="w-5 h-5 text-gray-600"></i>
                </button>
            </header>

            <div id="home-cats" class="flex gap-4 mb-4 overflow-x-auto no-scrollbar py-2">
                <button class="ptab active px-6 py-2 rounded-full whitespace-nowrap" data-cat="recommend">推荐</button>
                <button class="ptab px-6 py-2 rounded-full whitespace-nowrap" data-cat="planet">拟态星球</button>
                <button class="ptab px-6 py-2 rounded-full whitespace-nowrap" data-cat="nearby">同城</button>
                <button class="ptab px-6 py-2 rounded-full whitespace-nowrap" data-cat="voice">语音匹配</button>
            </div>

            <div id="feed"></div>
            <p id="feed-empty" class="hidden text-center text-gray-400 py-10">这个分类还没有动态哦～</p>
        </div>

        <!-- ============ PLANET LIST ============ -->
        <div id="planet-content" class="hidden">
            <header class="flex justify-between items-center mb-5">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">星球</h1>
                    <p class="text-sm text-gray-500">发现有趣的星球</p>
                </div>
            </header>
            <div id="planet-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- ============ PLANET DETAIL ============ -->
        <div id="planet-detail-content" class="hidden">
            <header class="flex items-center mb-5">
                <button class="planet-back-btn p-2 rounded-full hover:bg-gray-100 transition-colors mr-3">
                    <i data-lucide="chevron-left" class="w-6 h-6 text-gray-600"></i>
                </button>
                <div>
                    <h1 id="pd-name" class="text-2xl font-bold text-gray-800">星球</h1>
                    <p id="pd-desc" class="text-sm text-gray-500">发现有趣的星球</p>
                </div>
            </header>
            <div id="planet-posts" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <!-- ============ MESSAGE LIST ============ -->
        <div id="message-content" class="hidden">
            <header class="flex justify-between items-center mb-5">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">消息</h1>
                    <p class="text-sm text-gray-500">与灵魂对话</p>
                </div>
            </header>
            <div id="message-list" class="space-y-4"></div>
        </div>

        <!-- ============ CHAT ============ -->
        <div id="chat-content" class="hidden flex flex-col h-[calc(100dvh-6rem)] md:h-[calc(100vh-4rem)]">
            <header class="flex items-center mb-4 flex-shrink-0">
                <button class="chat-back-btn p-2 rounded-full hover:bg-gray-100 transition-colors mr-3">
                    <i data-lucide="chevron-left" class="w-6 h-6 text-gray-600"></i>
                </button>
                <img id="chat-avatar" src="" class="w-10 h-10 rounded-full bg-blue-100">
                <div class="ml-3">
                    <h1 id="chat-name" class="font-bold text-gray-800 text-base"></h1>
                    <p id="chat-status" class="text-xs text-green-500"></p>
                </div>
            </header>
            <div id="chat-box" class="glass-card p-4 rounded-2xl space-y-3 flex-1 min-h-0 overflow-y-auto no-scrollbar mb-4"></div>
            <div class="flex items-center gap-2 glass-card p-2 rounded-full">
                <button class="p-2 text-gray-500 hover:text-blue-500 transition-colors flex-shrink-0" id="chat-voice-btn">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                </button>
                <input id="chat-input" type="text" placeholder="说点什么..." class="flex-1 min-w-0 bg-transparent px-3 py-2 text-sm text-gray-700 placeholder-gray-400 focus:outline-none">
                <button id="chat-send" class="p-2.5 bg-blue-500 text-white rounded-full hover:bg-blue-600 transition-colors flex items-center justify-center flex-shrink-0">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- ============ PROFILE ============ -->
        <div id="profile-content" class="hidden">
            <div class="flex flex-col items-center mb-5">
                <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-blue-400 to-purple-500 p-1 mb-4">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="Avatar" class="w-full h-full rounded-full border-4 border-white object-cover">
                </div>
                <h2 class="text-2xl font-bold text-gray-800">此间少年</h2>
                <p class="text-gray-500">艺术家星球 · <span id="follower-count">2.4k</span> 关注者</p>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-8">
                <div class="glass-card p-4 rounded-2xl text-center">
                    <div id="profile-posts-count" class="text-xl font-bold text-gray-800">0</div>
                    <div class="text-xs text-gray-500">帖子</div>
                </div>
                <div class="glass-card p-4 rounded-2xl text-center">
                    <div class="text-xl font-bold text-gray-800">2.4k</div>
                    <div class="text-xs text-gray-500">关注者</div>
                </div>
                <div class="glass-card p-4 rounded-2xl text-center">
                    <div class="text-xl font-bold text-gray-800">156</div>
                    <div class="text-xs text-gray-500">关注</div>
                </div>
            </div>

            <div id="profile-cats" class="flex gap-4 mb-8 overflow-x-auto no-scrollbar">
                <button class="ptab active px-6 py-2 rounded-full whitespace-nowrap" data-pcat="posts">我的帖子</button>
                <button class="ptab px-6 py-2 rounded-full whitespace-nowrap" data-pcat="fav">收藏</button>
                <button class="ptab px-6 py-2 rounded-full whitespace-nowrap" data-pcat="album">相册</button>
            </div>

            <div id="profile-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>

            <button id="logout-btn" class="w-full mt-2 py-3 glass-card text-gray-500 hover:bg-white hover:text-red-500 transition-all rounded-2xl text-sm font-medium">退出登录</button>
        </div>

        <!-- ============ SETTINGS ============ -->
        <div id="settings-content" class="hidden">
            <header class="flex items-center mb-6">
                <button id="settings-back-btn" class="p-2 rounded-full hover:bg-gray-100 transition-colors mr-4">
                    <i data-lucide="chevron-left" class="w-6 h-6 text-gray-600"></i>
                </button>
                <h1 class="text-xl font-bold text-gray-800">设置</h1>
            </header>

            <section class="glass-card rounded-2xl p-2 mb-4">
                <div class="settings-row">
                    <div>
                        <div class="font-medium text-gray-800">推送通知</div>
                        <div class="text-xs text-gray-500">接收新消息与互动提醒</div>
                    </div>
                    <label class="switch"><input type="checkbox" id="set-push"><span class="slider"></span></label>
                </div>
                <div class="settings-row border-t border-gray-100">
                    <div>
                        <div class="font-medium text-gray-800">声音提示</div>
                        <div class="text-xs text-gray-500">消息到达时播放提示音</div>
                    </div>
                    <label class="switch"><input type="checkbox" id="set-sound"><span class="slider"></span></label>
                </div>
                <div class="settings-row border-t border-gray-100">
                    <div>
                        <div class="font-medium text-gray-800">振动</div>
                        <div class="text-xs text-gray-500">手机端消息振动</div>
                    </div>
                    <label class="switch"><input type="checkbox" id="set-vibrate"><span class="slider"></span></label>
                </div>
            </section>

            <section class="glass-card rounded-2xl p-2 mb-4">
                <div class="settings-row">
                    <div>
                        <div class="font-medium text-gray-800">显示在线状态</div>
                        <div class="text-xs text-gray-500">让好友看到你当前在线</div>
                    </div>
                    <label class="switch"><input type="checkbox" id="set-online"><span class="slider"></span></label>
                </div>
                <div class="settings-row border-t border-gray-100">
                    <div>
                        <div class="font-medium text-gray-800">允许陌生人私信</div>
                        <div class="text-xs text-gray-500">关闭后仅好友可发起聊天</div>
                    </div>
                    <label class="switch"><input type="checkbox" id="set-stranger"><span class="slider"></span></label>
                </div>
            </section>

            <section class="glass-card rounded-2xl p-2 mb-4">
                <button class="settings-row" id="set-edit">
                    <div class="font-medium text-gray-800">编辑资料</div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>

                <button class="settings-row border-t border-gray-100" id="set-pwd">

                </button>

                    <div class="font-medium text-gray-800">关于 Suuful</div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                </button>
            </section>

            <button id="settings-logout-btn" class="w-full py-3 glass-card text-gray-500 hover:bg-white hover:text-red-500 transition-all rounded-2xl text-sm font-medium">退出登录</button>
            <p class="text-center text-xs text-gray-400 mt-6">Suuful v1.0.0</p>
        </div>

        <!-- ============ POST DETAIL ============ -->
        <div id="post-detail-content" class="hidden">
            <header class="flex items-center mb-5">
                <button id="post-detail-back" class="p-2 rounded-full hover:bg-gray-100 transition-colors mr-4">
                    <i data-lucide="chevron-left" class="w-6 h-6 text-gray-600"></i>
                </button>

            </div>

        <!-- ============ ADD POST ============ -->
        <div id="add-post-content" class="hidden">
            <header class="flex items-center mb-6">

            <div class="glass-card p-6 rounded-2xl mb-6">

                <div id="post-images-preview" class="grid grid-cols-3 gap-2 mb-3"></div>

                <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-200">

                        <button id="img-btn" class="p-2 text-gray-500 hover:text-blue-500 transition-colors" title="添加图片">

                        </button>
                        <button id="camera-btn" class="p-2 text-gray-500 hover:text-blue-500 transition-colors" title="拍照">

                            <i data-lucide="mic" class="w-5 h-5"></i>

                    <div id="post-char-count" class="text-xs text-gray-400">0 字</div>

        const ME = '此间少年';

        // ============================================================
        // 工具函数
        // ============================================================
        const $ = sel => document.querySelector(sel);
        const $$ = sel => Array.from(document.querySelectorAll(sel));
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function toast(msg) {
            const t = $('#toast');

            t.classList.remove('hidden');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.add('hidden'), 1800);
        }

        function refreshIcons() { lucide.createIcons(); }

        function postMatchesCat(p, cat) {
            if (cat === 'recommend') return true;
            if (cat === 'planet') return !!p.tag;
            if (cat === 'nearby') return !!p.location;
            if (cat === 'voice') return !!p.audio;
            return true;
        }

        // ============================================================
        // 渲染：首页 feed
        // ============================================================
        function renderFeed() {
            stopCurrentAudio();
            const feed = $('#feed');
            const list = posts.filter(p => postMatchesCat(p, currentCat));
            $('#feed-empty').classList.toggle('hidden', list.length > 0);

            refreshIcons();

        function postCardHTML(p) {
            const imgHTML = p.images && p.images.length
                ? `<div class="grid ${p.images.length>1?'grid-cols-2':'grid-cols-1'} gap-2">${p.images.map(src =>

            const audioHTML = p.audio
                ? `<div class="bg-blue-50/50 p-4 rounded-2xl flex items-center gap-4 border border-blue-100 cursor-pointer hover:bg-blue-50 transition-all" data-audio>

            return `

        function bindPostEvents() {
            $$('#feed [data-post-id], #planet-posts [data-post-id]').forEach(card => {
                const id = +card.dataset.postId;

                    e.stopPropagation();
                    p.liked = !p.liked;
                    p.likes += p.liked ? 1 : -1;
                    const btn = e.currentTarget;

        // ============================================================
        // 语音播放（Web Audio 生成轻音乐，无外部资源）

        let currentAudio = null;

        function getCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function setAudioIcon(btn, playing) {
            if (!btn) return;
            btn.innerHTML = `<i data-lucide="${playing ? 'pause' : 'play'}" class="w-5 h-5 fill-current"></i>`;
            if (window.lucide) lucide.createIcons();
        }
        function stopCurrentAudio() {
            if (currentAudio) {
                try { currentAudio.stop(); } catch (_) {}
                const c = currentAudio.container;
                const pb = c && c.querySelector('.audio-play-btn');
                if (pb) setAudioIcon(pb, false);
                currentAudio = null;
            }
        }
        function bindAudioBlock(audio, p) {
            if (!audio || !p.audio) return;
            audio.addEventListener('click', e => {
                e.stopPropagation();
                const playBtn = audio.querySelector('.audio-play-btn');
                if (currentAudio && currentAudio.container === audio) { stopCurrentAudio(); return; }
                stopCurrentAudio();
                currentAudio = playMelody(audio, p.audio.duration, playBtn);
                currentAudio.container = audio;
                setAudioIcon(playBtn, true);
            });
        }
        function playMelody(container, duration, playBtn) {
            const ctx = getCtx();
            const now = ctx.currentTime;
            const notes = [523.25, 587.33, 659.25, 783.99, 880.0, 783.99, 659.25, 587.33]; // 五声音阶
            const noteDur = 0.35;
            const master = ctx.createGain();
            master.gain.value = 0.12;
            master.connect(ctx.destination);
            const oscs = [];
            let t = 0;
            while (t < duration) {
                const freq = notes[Math.floor(t / noteDur) % notes.length];
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                const g = ctx.createGain();
                const start = now + t;
                g.gain.setValueAtTime(0, start);
                g.gain.linearRampToValueAtTime(0.6, start + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, start + noteDur * 0.9);
                osc.connect(g); g.connect(master);
                osc.start(start);
                osc.stop(start + noteDur);
                oscs.push(osc);
                t += noteDur;
            }
            container.classList.add('playing');
            let stopped = false;
            const stop = () => {
                if (stopped) return; stopped = true;
                container.classList.remove('playing');
                if (playBtn) setAudioIcon(playBtn, false);
                oscs.forEach(o => { try { o.stop(); } catch (_) {} });
            };
            const timer = setTimeout(stop, duration * 1000);
            return { stop: () => { clearTimeout(timer); stop(); } };
        }

            const audioHTML = p.audio

                               <div class="w-1 bg-blue-300 h-2 rounded-full wave-bar"></div>
                               <div class="w-1 bg-blue-400 h-4 rounded-full wave-bar" style="animation-delay:.1s"></div>
                               <div class="w-1 bg-blue-300 h-3 rounded-full wave-bar" style="animation-delay:.2s"></div>
                               <div class="w-1 bg-blue-500 h-2 rounded-full wave-bar" style="animation-delay:.3s"></div>
                               <div class="w-1 bg-blue-200 h-4 rounded-full wave-bar" style="animation-delay:.15s"></div>
                           </div>
                           <p class="text-xs text-blue-600 font-medium">${p.audio.duration}"</p>
                       </div>
                   </div>`
                : '';
            return `
                <div class="glass-card p-6 flex flex-col">
                    <div class="flex items-center gap-3 mb-3">
                        <img src="${p.avatar}" class="w-11 h-11 rounded-full bg-blue-100">
                        <div><h3 class="font-bold text-gray-800">${esc(p.user)}</h3><p class="text-xs text-gray-400">${p.time}</p></div>
                    </div>
                    ${p.content ? `<p class="text-gray-600 text-sm leading-relaxed mb-4">${esc(p.content)}</p>` : ''}
                    ${imgHTML}${audioHTML}
                    <div class="flex items-center gap-6 pt-3 border-t border-gray-100">
                        <button data-act="like" class="flex items-center gap-1 hover:text-pink-500 transition-colors ${p.liked?'text-pink-500':''}">
                            <i data-lucide="heart" class="w-4 h-4 ${p.liked?'fill-current':''}"></i> <span class="text-xs like-count">${fmtCount(p.likes)}</span>
                        </button>
                        <button data-act="comment" class="flex items-center gap-1 hover:text-blue-500 transition-colors">
                            <i data-lucide="message-square" class="w-4 h-4"></i> <span class="text-xs">${p.comments.length}</span>
                        </button>
                        <button data-act="share" class="flex items-center gap-1 hover:text-gray-600 transition-colors">
                            <i data-lucide="share-2" class="w-4 h-4"></i> <span class="text-xs">${fmtCount(p.shares)}</span>
                        </button>
                    </div>
                </div>`;
        }

        function openPostDetail(id) {
            const p = posts.find(x => x.id === id);
            if (!p) return;
            postDetailReturn = currentView() || 'home-content';
            commentTargetId = id;
            stopCurrentAudio();
            $('#post-detail-body').innerHTML = postDetailHTML(p);
            bindAudioBlock($('#post-detail-body').querySelector('[data-audio]'), p);
            const body = $('#post-detail-body');
            body.querySelector('[data-act="like"]').addEventListener('click', e => {
                e.stopPropagation();
                p.liked = !p.liked; p.likes += p.liked ? 1 : -1;
                const btn = e.currentTarget;
                btn.classList.toggle('text-pink-500', p.liked);
                btn.classList.toggle('text-gray-400', !p.liked);
                const icon = btn.querySelector('svg');
                icon.classList.toggle('fill-current', p.liked);
                btn.querySelector('.like-count').textContent = fmtCount(p.likes);
                if (currentPostPlanet) renderPlanetPosts();
            });
            body.querySelector('[data-act="share"]').addEventListener('click', e => { e.stopPropagation(); p.shares++; toast('已分享给好友'); });
            body.querySelector('[data-act="comment"]').addEventListener('click', e => { e.stopPropagation(); document.getElementById('detail-comment-input').focus(); });
            renderDetailComments();
            showView('post-detail-content');
            refreshIcons();
        }

        function sendDetailComment() {
            const input = document.getElementById('detail-comment-input');
            const text = input.value.trim();
            if (!text) return;
            const p = posts.find(x => x.id === commentTargetId);
            if (!p) return;
            p.comments.push({ user:ME, avatar:AV('User'), text, time:'刚刚' });
            input.value = '';
            renderDetailComments();
            if (currentPostPlanet) renderPlanetPosts();
        }

        // ============================================================
        // 评论弹窗（保留，未在主流程调用）
        // ============================================================
        function openComment(postId) {
            commentTargetId = postId;
            const p = posts.find(x => x.id === postId);
            $('#comment-total').textContent = `(${p.comments.length})`;
            renderComments();
            $('#comment-modal').classList.remove('hidden');
        }

        function commentListHTML(p) {
            if (!p.comments.length) return `<p class="text-center text-gray-400 text-sm py-8">还没有评论，来抢沙发吧～</p>`;
            return p.comments.map((c, i) => `
                <div class="flex items-start gap-3">
                    <img src="${c.avatar}" class="w-9 h-9 rounded-full bg-blue-100 flex-shrink-0">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <h4 class="text-sm font-medium text-gray-800 truncate">${esc(c.user)}</h4>
                            <span class="text-xs text-gray-400 flex-shrink-0">${esc(c.time)}</span>
                        </div>
                        <p class="text-sm text-gray-600 mt-0.5">${esc(c.text)}</p>
                    </div>
                    <button class="comment-like-btn ${c.liked?'text-pink-400':'text-gray-300'} hover:text-pink-400 transition-colors flex-shrink-0" data-ci="${i}"><i data-lucide="heart" class="w-4 h-4 ${c.liked?'fill-current':''}"></i></button>
                </div>`).join('');
        }
        function renderComments() {
            const p = posts.find(x => x.id === commentTargetId);
            $('#comment-total').textContent = `(${p.comments.length})`;
            $('#comment-list').innerHTML = commentListHTML(p);
            refreshIcons();
        }
        function renderDetailComments() {
            const p = posts.find(x => x.id === commentTargetId);
            const total = document.getElementById('detail-comment-total');
            if (total) total.textContent = `(${p.comments.length})`;
            document.getElementById('detail-comment-list').innerHTML = commentListHTML(p);
            refreshIcons();
        }

        function sendComment() {
            const input = $('#comment-input');
            const text = input.value.trim();
            if (!text) return;
            const p = posts.find(x => x.id === commentTargetId);
            p.comments.push({ user:ME, avatar:AV('User'), text, time:'刚刚' });
            input.value = '';
            renderComments();
            // 同步卡片上的评论数
            const card = document.querySelector(`[data-post-id="${commentTargetId}"]`);
            if (card) card.querySelector('[data-act="comment"] .text-xs').textContent = p.comments.length;
            if (currentPostPlanet) renderPlanetPosts();
        }

        // ============================================================
        // 星球列表 & 详情
        // ============================================================
        function renderPlanets() {
            $('#planet-grid').innerHTML = PLANETS.map(pl => `
                <div class="glass-card p-6 rounded-2xl hover:shadow-lg transition-all cursor-pointer planet-card" data-planet-id="${pl.id}">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${pl.grad} flex items-center justify-center planet-glow">
                            <i data-lucide="${pl.icon}" class="w-8 h-8 text-white"></i>
                        </div>
                        <span class="text-xs font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full">${fmtCount(pl.online)} 人在聊</span>
                    </div>
                    <h3 class="font-bold text-gray-800 text-lg mb-1">${pl.name}</h3>
                    <p class="text-sm text-gray-500 mb-4">${pl.desc}</p>
                    <button class="w-full py-2.5 bg-gradient-to-r ${pl.grad} text-white rounded-xl hover:shadow-md transition-all text-sm font-medium">进入星球</button>
                </div>`).join('');
            $$('.planet-card').forEach(card => {
                card.addEventListener('click', () => openPlanet(card.dataset.planetId));
            });
            refreshIcons();
        }

        function openPlanet(planetId) {
            const pl = PLANETS.find(x => x.id === planetId);
            $('#pd-name').textContent = pl.name;
            $('#pd-desc').textContent = pl.desc;
            currentPostPlanet = planetId;
            showView('planet-detail-content');
            renderPlanetPosts();
        }

        function renderPlanetPosts() {
            stopCurrentAudio();
            const pl = PLANETS.find(x => x.id === currentPostPlanet);
            const list = posts.filter(p => p.tag === pl.name);
            $('#planet-posts').innerHTML = list.length
                ? list.map(postCardHTML).join('')
                : `<p class="text-center text-gray-400 py-10 col-span-full">星球里还没有动态，去发布第一条吧！</p>`;
            bindPostEvents();
            refreshIcons();
        }

        // ============================================================
        // 消息列表 & 聊天
        // ============================================================
        function renderMessages() {
            const total = messages.reduce((s,m) => s + m.unread, 0);
            const badge = $('#msg-badge');
            if (total > 0) { badge.textContent = total; badge.classList.remove('hidden'); }
            else badge.classList.add('hidden');

            $('#message-list').innerHTML = messages.map(m => `
                <div class="flex items-start gap-4 glass-card p-4 rounded-2xl hover:bg-white/50 transition-all cursor-pointer msg-item" data-msg-id="${m.id}">
                    <div class="relative flex-shrink-0">
                        <img src="${m.avatar}" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-blue-100">
                        ${m.online ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></div>' : ''}
                        ${m.unread ? `<div class="absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] leading-none min-w-[1.25rem] h-5 px-1 rounded-full flex items-center justify-center">${m.unread}</div>` : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-gray-800 text-sm sm:text-base truncate">${m.name}</h3>
                            <span class="text-xs text-gray-400 flex-shrink-0 ml-2">${m.time}</span>
                        </div>
                        <p class="text-sm text-gray-500 truncate">${esc(m.last)}</p>
                    </div>
                </div>`).join('');
            $$('.msg-item').forEach(el => el.addEventListener('click', () => openChat(+el.dataset.msgId)));
            refreshIcons();
        }

        function openChat(msgId) {
            const m = messages.find(x => x.id === msgId);
            activeChatId = msgId;
            m.unread = 0;
            $('#chat-avatar').src = m.avatar;
            $('#chat-name').textContent = m.name;
            $('#chat-status').textContent = m.online ? '在线' : '离线';
            renderChat(m);
            showView('chat-content');
            renderMessages();
        }

        function renderChat(m) {
            const box = $('#chat-box');
            box.innerHTML = m.history.map(h => {
                const mine = h.from === 'me';
                return `<div class="flex ${mine?'justify-end':'justify-start'}">
                    <div class="max-w-[75%] px-4 py-2.5 rounded-2xl text-sm ${mine?'chat-bubble-me rounded-br-md':'chat-bubble-them rounded-bl-md'}">
                        ${esc(h.text)}
                        <div class="text-[10px] ${mine?'text-blue-100 text-right':'text-gray-400 text-left'} mt-1">${h.time}</div>
                    </div>
                </div>`;
            }).join('');
            box.scrollTop = box.scrollHeight;
        }

        function sendChat() {
            const input = $('#chat-input');
            const text = input.value.trim();
            if (!text) return;
            const m = messages.find(x => x.id === activeChatId);
            const now = new Date();
            const t = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
            m.history.push({ from:'me', text, time:t });
            m.last = text;
            m.time = t;
            input.value = '';
            renderChat(m);
            // 模拟对方自动回复
            setTimeout(() => {
                const replies = ['哈哈说得对～','我也是这么想的😊','下次一起呀！','收到～','太有意思了'];
                const r = replies[Math.floor(Math.random()*replies.length)];
                m.history.push({ from:'them', text:r, time:`${new Date().getHours()}:${String(new Date().getMinutes()).padStart(2,'0')}` });
                m.last = r;
                renderChat(m);
                if (currentView() !== 'chat-content') { m.unread++; renderMessages(); }
            }, 900);
        }

        // ============================================================
        // 个人主页
        // ============================================================
        function renderProfile() {
            const myPosts = posts.filter(p => p.mine);
            $('#profile-posts-count').textContent = myPosts.length;
            setProfileTab('posts');
        }

        function setProfileTab(tab) {
            const grid = $('#profile-grid');
            if (tab === 'posts') {
                const myPosts = posts.filter(p => p.mine);
                grid.innerHTML = myPosts.length
                    ? myPosts.map(p => profilePostHTML(p)).join('')
                    : `<p class="text-center text-gray-400 py-10 col-span-full">还没有发布帖子，点击右下角 + 试试～</p>`;
            } else if (tab === 'fav') {
                const fav = posts.filter(p => p.liked && !p.mine);
                grid.innerHTML = fav.length
                    ? fav.map(p => profilePostHTML(p)).join('')
                    : `<p class="text-center text-gray-400 py-10 col-span-full">还没有收藏任何内容</p>`;
            } else if (tab === 'album') {
                const imgs = posts.flatMap(p => (p.images||[]));
                grid.innerHTML = imgs.length
                    ? imgs.map(src => `<div class="aspect-square rounded-2xl bg-cover bg-center hover:scale-105 transition-transform cursor-pointer" style="background-image:url('${src}')"></div>`).join('')
                    : `<p class="text-center text-gray-400 py-10 col-span-full">相册还是空的</p>`;
            }
            refreshIcons();
        }

        function profilePostHTML(p) {
            const cover = (p.images && p.images[0]) || PIC.a;
            return `<div class="glass-card p-3 rounded-2xl flex flex-col gap-2 cursor-pointer hover:bg-white/60 transition-all" data-goto="${p.id}">
                <img src="${cover}" class="w-full h-28 object-cover rounded-xl">
                <p class="text-xs text-gray-600 line-clamp-2">${esc(p.content || (p.audio ? '🎵 语音动态' : ''))}</p>
                <p class="text-[10px] text-gray-400">${fmtCount(p.likes)} 赞 · ${p.comments.length} 评论</p>
            </div>`;
        }

        // ============================================================
        // 发布帖子
        // ============================================================
        let draftImages = [];
        let draftAudio = null;

        function renderPostPlanets() {
            $('#post-planet-grid').innerHTML = PLANETS.map(pl => `
                <div class="flex flex-col items-center gap-2 cursor-pointer hover:bg-gray-50 p-3 rounded-xl transition-colors post-planet" data-pid="${pl.id}">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${pl.grad} flex items-center justify-center">
                        <i data-lucide="${pl.icon}" class="w-6 h-6 text-white"></i>
                    </div>
                    <span class="text-xs text-gray-600">${pl.name}</span>
                </div>`).join('');
            $$('.post-planet').forEach(el => el.addEventListener('click', () => {
                const already = el.classList.contains('ring-2');
                $$('.post-planet').forEach(x => x.classList.remove('ring-2','ring-blue-400'));
                if (!already) { el.classList.add('ring-2','ring-blue-400'); currentPostPlanet = el.dataset.pid; }
                else currentPostPlanet = null;
                validatePublish();
            }));
            refreshIcons();
        }

        function renderDraftImages() {
            $('#post-images-preview').innerHTML = draftImages.map((src,i) => `
                <div class="relative">
                    <img src="${src}" class="w-full h-24 object-cover rounded-xl">
                    <button class="absolute -top-1 -right-1 bg-gray-800/70 text-white w-5 h-5 rounded-full text-xs" data-rm-img="${i}">×</button>
                </div>`).join('');
            $$('[data-rm-img]').forEach(b => b.addEventListener('click', () => {
                draftImages.splice(+b.dataset.rmImg,1); renderDraftImages();
            }));
        }

        function validatePublish() {
            const text = $('#post-content-input').value.trim();
            const ok = text.length > 0 || draftImages.length || draftAudio;
            $('#publish-btn').disabled = !ok;
        }

        function publishPost() {
            const text = $('#post-content-input').value.trim();
            if (!text && !draftImages.length && !draftAudio) return;
            const pl = currentPostPlanet ? PLANETS.find(x => x.id === currentPostPlanet) : null;
            const newPost = {
                id: Date.now(), user:ME, avatar:AV('User'),
                planet: pl ? pl.name : '', tag: pl ? pl.name : '',
                time:'刚刚', location:'',
                content:text, images:[...draftImages], audio:draftAudio,
                likes:0, comments:[], shares:0, liked:false,
                cat:['recommend','planet','nearby','voice'], mine:true
            };
            posts.unshift(newPost);
            // 重置草稿
            $('#post-content-input').value = '';
            draftImages = []; draftAudio = null; currentPostPlanet = null;
            renderDraftImages();
            $$('.post-planet').forEach(x => x.classList.remove('ring-2','ring-blue-400'));
            $('#post-char-count').textContent = '0 字';
            validatePublish();
            toast('发布成功 🎉');
            showView('home-content');
            setNav('home');
            renderFeed();
            renderProfile();
        }

        // ============================================================
        // 视图切换
        // ============================================================
        const VIEW_IDS = ['home-content','planet-content','planet-detail-content','message-content','chat-content','profile-content','settings-content','post-detail-content','add-post-content'];
        function currentView() { return VIEW_IDS.find(id => !$('#'+id).classList.contains('hidden')); }
        let returnView = 'profile-content';

        function showView(id) {
            VIEW_IDS.forEach(v => $('#'+v).classList.add('hidden'));
            $('#'+id).classList.remove('hidden');
            $('#'+id).classList.add('view-fade');
            syncFab();
            window.scrollTo({ top:0, behavior:'smooth' });
        }

        // 加号发布按钮只在主页显示
        function syncFab() {
            const onHome = currentView() === 'home-content';
            $('#add-post-btn').classList.toggle('hidden', !onHome);
        }

        function setNav(tab) {
            $$('[data-tab]').forEach(t => t.classList.remove('nav-item-active','text-blue-500'));
            const el = $(`[data-tab="${tab}"]`);
            if (el) el.classList.add('nav-item-active','text-blue-500');
        }

        function goTab(tab) {
            if (tab === 'home') { currentCat = 'recommend'; syncHomeCat(); renderFeed(); showView('home-content'); }
            else if (tab === 'planet') { renderPlanets(); showView('planet-content'); }
            else if (tab === 'message') { renderMessages(); showView('message-content'); }
            else if (tab === 'profile') { renderProfile(); showView('profile-content'); }
            setNav(tab);
        }

        function syncHomeCat() {
            $$('#home-cats [data-cat]').forEach(b => b.classList.toggle('active', b.dataset.cat === currentCat));
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        $$('[data-tab]').forEach(tab => tab.addEventListener('click', e => {
            e.preventDefault();
            goTab(tab.dataset.tab);
        }));

        // 首页分类
        $$('#home-cats [data-cat]').forEach(btn => btn.addEventListener('click', () => {
            currentCat = btn.dataset.cat;
            syncHomeCat();
            renderFeed();
        }));

        // 发布 FAB
        $('#add-post-btn').addEventListener('click', () => {
            renderPostPlanets();
            validatePublish();
            showView('add-post-content');
        });
        $('#back-home-btn').addEventListener('click', () => { goTab('home'); });
        $('#publish-btn').addEventListener('click', publishPost);

        // 发布：图片/相机/语音/字数
        $('#img-btn').addEventListener('click', () => {
            const pool = [PIC.a,PIC.b,PIC.c,PIC.d];
            if (draftImages.length < 9) { draftImages.push(pool[Math.floor(Math.random()*pool.length)]); renderDraftImages(); validatePublish(); }
        });
        $('#camera-btn').addEventListener('click', () => toast('📷 调用相机（演示）'));
        $('#voice-rec-btn').addEventListener('click', () => {
            draftAudio = draftAudio ? null : { duration: 8 + Math.floor(Math.random()*15) };
            toast(draftAudio ? `🎤 已录制 ${draftAudio.duration}" 语音` : '已取消语音');
            validatePublish();
        });
        $('#post-content-input').addEventListener('input', e => {
            $('#post-char-count').textContent = e.target.value.length + ' 字';
            validatePublish();
        });

        // 星球详情返回
        $$('.planet-back-btn').forEach(b => b.addEventListener('click', () => { currentPostPlanet = null; goTab('planet'); }));
        // 聊天返回
        $$('.chat-back-btn').forEach(b => b.addEventListener('click', () => { goTab('message'); }));

        // 评论弹窗
        $('#comment-close').addEventListener('click', () => $('#comment-modal').classList.add('hidden'));
        $('#comment-modal').addEventListener('click', e => { if (e.target.id === 'comment-modal') $('#comment-modal').classList.add('hidden'); });
        $('#comment-send').addEventListener('click', sendComment);
        $('#comment-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendComment(); });
        // 评论内的爱心：点击切换为实心（事件委托，重渲染后依然有效）
        $('#comment-list').addEventListener('click', e => {
            const btn = e.target.closest('.comment-like-btn');
            if (!btn) return;
            const i = +btn.dataset.ci;
            const p = posts.find(x => x.id === commentTargetId);
            const c = p.comments[i];
            if (!c) return;
            c.liked = !c.liked;
            btn.classList.toggle('text-pink-400', c.liked);
            btn.classList.toggle('text-gray-300', !c.liked);
            const icon = btn.querySelector('svg') || btn.querySelector('i');
            if (icon) icon.classList.toggle('fill-current', c.liked);
        });

        // 帖子详情页
        $('#post-detail-back').addEventListener('click', () => showView(postDetailReturn));
        $('#detail-comment-send').addEventListener('click', sendDetailComment);
        $('#detail-comment-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendDetailComment(); });
        $('#detail-comment-list').addEventListener('click', e => {
            const btn = e.target.closest('.comment-like-btn');
            if (!btn) return;
            const i = +btn.dataset.ci;
            const p = posts.find(x => x.id === commentTargetId);
            const c = p.comments[i];
            if (!c) return;
            c.liked = !c.liked;
            btn.classList.toggle('text-pink-400', c.liked);
            btn.classList.toggle('text-gray-300', !c.liked);
            const icon = btn.querySelector('svg') || btn.querySelector('i');
            if (icon) icon.classList.toggle('fill-current', c.liked);
        });

        // 聊天发送
        $('#chat-send').addEventListener('click', sendChat);
        $('#chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
        $('#chat-voice-btn').addEventListener('click', () => toast('🎤 按住说话（演示）'));

        // 个人主页分类
        $$('#profile-cats [data-pcat]').forEach(btn => btn.addEventListener('click', () => {
            $$('#profile-cats [data-pcat]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            setProfileTab(btn.dataset.pcat);
        }));
        // 个人主页帖子点击 -> 评论
        $('#profile-grid').addEventListener('click', e => {
            const card = e.target.closest('[data-goto]');
            if (card) openComment(+card.dataset.goto);
        });

        // 从搜索结果进入帖子：切到所在分类、滚动并高亮定位
        function gotoPost(id) {
            const p = posts.find(x => x.id === id);
            if (p) { currentCat = (p.cat && p.cat.length) ? p.cat[0] : 'recommend'; syncHomeCat(); }
            renderFeed();
            showView('home-content');
            const card = document.querySelector(`[data-post-id="${id}"]`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('post-highlight');
                setTimeout(() => card.classList.remove('post-highlight'), 1600);
            }
        }

        // 搜索
        $('#search-btn').addEventListener('click', () => {
            $('#search-input').value = '';
            $('#search-results').innerHTML = `<p class="text-center text-gray-400 text-sm py-8">输入关键词开始搜索</p>`;
            $('#search-modal').classList.remove('hidden');
            setTimeout(() => $('#search-input').focus(), 100);
        });
        $('#search-modal').addEventListener('click', e => { if (e.target.id === 'search-modal') $('#search-modal').classList.add('hidden'); });
        $('#search-input').addEventListener('input', e => {
            const q = e.target.value.trim().toLowerCase();
            if (!q) { $('#search-results').innerHTML = `<p class="text-center text-gray-400 text-sm py-8">输入关键词开始搜索</p>`; return; }
            const users = [...posts.map(p=>p.user), ...messages.map(m=>m.name)];
            const uniqUsers = [...new Set(users)].filter(u => u.toLowerCase().includes(q));
            const planetHits = PLANETS.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
            const postHits = posts.filter(p => (p.content||'').toLowerCase().includes(q));
            let html = '';
            if (planetHits.length) html += `<p class="text-xs text-gray-400 px-1 mt-2">星球</p>` + planetHits.map(pl =>
                `<div class="flex items-center gap-3 glass-card p-3 rounded-xl cursor-pointer" data-search-planet="${pl.id}">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${pl.grad} flex items-center justify-center"><i data-lucide="${pl.icon}" class="w-5 h-5 text-white"></i></div>
                    <div><h4 class="text-sm font-medium text-gray-800">${pl.name}</h4><p class="text-xs text-gray-500">${pl.desc}</p></div>
                </div>`).join('');
            if (uniqUsers.length) html += `<p class="text-xs text-gray-400 px-1 mt-2">用户</p>` + uniqUsers.map(u =>
                `<div class="flex items-center gap-3 glass-card p-3 rounded-xl"><img src="${AV(u)}" class="w-10 h-10 rounded-full bg-blue-100"><div><h4 class="text-sm font-medium text-gray-800">${u}</h4><p class="text-xs text-gray-500">用户</p></div></div>`).join('');
            if (postHits.length) html += `<p class="text-xs text-gray-400 px-1 mt-2">帖子</p>` + postHits.map(p =>
                `<div class="flex items-center gap-3 glass-card p-3 rounded-xl cursor-pointer" data-search-post="${p.id}">
                    <img src="${p.avatar}" class="w-10 h-10 rounded-full bg-blue-100">
                    <div class="min-w-0"><h4 class="text-sm font-medium text-gray-800 truncate">${esc(p.user)}</h4><p class="text-xs text-gray-500 truncate">${esc(p.content||'')}</p></div>
                </div>`).join('');
            $('#search-results').innerHTML = html || `<p class="text-center text-gray-400 text-sm py-8">未找到「${esc(q)}」相关结果</p>`;
            $$('[data-search-planet]').forEach(el => el.addEventListener('click', () => { $('#search-modal').classList.add('hidden'); openPlanet(el.dataset.searchPlanet); }));
            $$('[data-search-post]').forEach(el => el.addEventListener('click', () => { $('#search-modal').classList.add('hidden'); gotoPost(+el.dataset.searchPost); }));
            refreshIcons();
        });

        // ============================================================
        // 设置页
        // ============================================================
        function openSettings() {
            returnView = currentView() || 'profile-content';
            showView('settings-content');
        }
        function loadSettings() {
            let s = {};
            try { s = JSON.parse(localStorage.getItem('suuful_settings') || '{}'); } catch (_) {}
            const map = { 'set-push':'push', 'set-sound':'sound', 'set-vibrate':'vibrate', 'set-online':'online', 'set-stranger':'stranger' };
            Object.entries(map).forEach(([id, key]) => {
                const el = document.getElementById(id);
                if (el) el.checked = !!s[key];
            });
        }
        function bindSettingsToggle() {
            const map = { 'set-push':'push', 'set-sound':'sound', 'set-vibrate':'vibrate', 'set-online':'online', 'set-stranger':'stranger' };
            Object.entries(map).forEach(([id, key]) => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('change', () => {
                    let s = {};
                    try { s = JSON.parse(localStorage.getItem('suuful_settings') || '{}'); } catch (_) {}
                    s[key] = el.checked;
                    localStorage.setItem('suuful_settings', JSON.stringify(s));
                    if (key === 'sound' && el.checked) toast('🔔 已开启声音提示');
                });
            });
        }

        $('#settings-btn').addEventListener('click', openSettings);
        $('#profile-settings-btn').addEventListener('click', openSettings);
        $('#settings-back-btn').addEventListener('click', () => showView(returnView));
        $('#settings-logout-btn').addEventListener('click', logout);
        $('#set-edit').addEventListener('click', () => toast('✏️ 编辑资料（演示）'));
        $('#set-pwd').addEventListener('click', () => toast('🔑 修改密码（演示）'));
        $('#set-about').addEventListener('click', () => toast('Suuful v1.0.0 · 一个温柔的社交星球'));
        bindSettingsToggle();
        loadSettings();

        // ESC 关闭弹窗
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { $('#comment-modal').classList.add('hidden'); $('#search-modal').classList.add('hidden'); }
        });

        // ============================================================
        // 初始化
        // ============================================================
        // ============================================================
        // 登录（最简版，对接 api.immmor.com / worker.js）
        // 真实接口：POST {base}/api/login  body: { username(=邮箱), password }
        // 返回：{ success:true, userInfo:{ ..., p_token, username }, ... }
        // 注册暂未接入（需邮箱验证码流程），后续再加。
        // ============================================================
        const AUTH_BASE = 'https://api.immmor.com';
        const authOverlay = document.getElementById('auth-overlay');
        let authMode = 'login';

        async function apiCall(path, body) {
            const res = await fetch(AUTH_BASE + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            let data = null;
            try { data = await res.json(); } catch (_) {}
            if (!res.ok || (data && data.success === false)) throw new Error((data && (data.message || data.error)) || '请求失败');
            return data;
        }

        function saveSession(data) {
            const user = (data && data.userInfo) || (data && data.user);
            const token = (data && data.userInfo && data.userInfo.p_token) || (data && data.token);
            if (token) localStorage.setItem('suuful_token', token);
            if (user) localStorage.setItem('suuful_user', JSON.stringify(user));
        }

        function showAuthErr(msg) {
            const el = document.getElementById('auth-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function setAuthMode(mode) {
            authMode = mode;
            const login = mode === 'login';
            document.getElementById('auth-tab-login').className = 'flex-1 py-2 rounded-full text-sm font-medium ' + (login ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500');
            document.getElementById('auth-tab-register').className = 'flex-1 py-2 rounded-full text-sm font-medium ' + (login ? 'text-gray-500' : 'bg-white shadow-sm text-blue-600');
            document.getElementById('auth-username').classList.toggle('hidden', login);
            document.getElementById('auth-submit').textContent = login ? '登录' : '注册';
            document.getElementById('auth-error').classList.add('hidden');
        }

        function applyUser() {
            try {
                const raw = localStorage.getItem('suuful_user');
                if (!raw) return;
                const u = JSON.parse(raw);
                const h2 = document.querySelector('#profile-content h2');
                if (u.username && h2) h2.textContent = u.username;
                const img = document.querySelector('#profile-content .w-24 img');
                if (img) img.src = u.avatar || ('https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(u.username || 'User'));
            } catch (_) {}
        }

        document.getElementById('auth-tab-login').addEventListener('click', () => setAuthMode('login'));
        document.getElementById('auth-tab-register').addEventListener('click', () => setAuthMode('register'));

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const btn = document.getElementById('auth-submit');
            if (authMode === 'register') { showAuthErr('注册功能暂未开放'); return; }
            if (!email || !password) { showAuthErr('请输入邮箱和密码'); return; }
            btn.disabled = true; btn.textContent = '登录中…';
            try {
                // 真实后端：账号字段名为 username（即邮箱）
                const data = await apiCall('/api/login', { username: email, password });
                saveSession(data);
                authOverlay.classList.add('hidden');
                applyUser();
                toast('欢迎来到 Suuful 🎉');
            } catch (err) {
                showAuthErr(err.message || '登录失败，请重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        });

        function logout() {
            localStorage.removeItem('suuful_token');
            localStorage.removeItem('suuful_user');
            const h2 = document.querySelector('#profile-content h2');
            if (h2) h2.textContent = '此间少年';
            const img = document.querySelector('#profile-content .w-24 img');
            if (img) img.src = 'https://api.dicebear.com/7.x/avataaars/svg?seed=User';
            toast('已退出登录');
            authOverlay.classList.remove('hidden');
        }
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) logoutBtn.addEventListener('click', logout);

        renderFeed();
        renderMessages();
        renderProfile();
        syncFab();
        refreshIcons();

        // 未登录则展示登录浮层
        if (!localStorage.getItem('suuful_token')) {
            authOverlay.classList.remove('hidden');
        } else {
            applyUser();
        }

        // 开屏动画：1.7s 后淡出并移除
        const splash = document.getElementById('splash');
        if (splash) {
            setTimeout(() => {
                splash.classList.add('splash-hide');
                setTimeout(() => splash.remove(), 650);
            }, 1700);
        }
    </script>
</body>
</html>
