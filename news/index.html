<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>头条资讯</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #fff;
      --ink: #162033;
      --muted: #6b7689;
      --line: #e7ebf2;
      --accent: #e6533c;
      --shadow: 0 12px 30px rgba(22, 32, 51, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -.5px;
    }

    h1 span { color: var(--accent); }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .count {
      flex: none;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tabs button {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .tabs button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .list {
      display: grid;
      gap: 16px;
    }

    .card {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 22px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(22, 32, 51, .1);
    }

    .card:first-child {
      grid-template-columns: 1fr 260px;
      background: linear-gradient(120deg, #fff 70%, #fff5f2);
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e9edf5;
      object-fit: cover;
    }

    .source {
      color: var(--ink);
      font-weight: 600;
    }

    .title {
      margin: 12px 0 8px;
      font-size: 20px;
      line-height: 1.45;
      font-weight: 700;
    }

    .card:first-child .title { font-size: 25px; }

    .abstract {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .stats {
      margin-top: 16px;
      color: #8a94a5;
      font-size: 12px;
    }

    .stats i {
      font-style: normal;
      margin-right: 14px;
    }

    .thumb {
      width: 100%;
      height: 120px;
      border-radius: 12px;
      background: #e9edf5;
      object-fit: cover;
    }

    .card:first-child .thumb { height: 165px; }

    .fallback {
      display: none;
      padding: 36px;
      border: 1px dashed #cbd4e3;
      border-radius: 16px;
      background: #fff;
      text-align: center;
    }

    .fallback p { margin: 0; color: var(--muted); }

    @media (max-width: 640px) {
      .wrap { padding: 28px 14px 60px; }
      h1 { font-size: 26px; }
      .card, .card:first-child {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 18px;
      }
      .thumb { height: 190px; }
      .card:first-child .thumb { height: 220px; }
      .card:first-child .title { font-size: 21px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>今日<span>头条</span></h1>
        <p class="sub">来源：今日头条 · 选择频道查看资讯</p>
      </div>
      <div class="count" id="count">加载中…</div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <div class="fallback" id="fallback">
      <p id="error"></p>
    </div>

    <section class="list" id="list"></section>
  </main>

  <script src="./tou.js"></script>
  <script>
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    const tabs = document.getElementById('tabs');
    const fallback = document.getElementById('fallback');
    const error = document.getElementById('error');

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);

    const safeUrl = (v) => {
      try {
        const url = new URL(v, location.href);
        return /^https?:$/.test(url.protocol) ? url.href : '';
      } catch { return ''; }
    };

    const imgUrl = (item) => safeUrl(
      item.share_large_image?.url || item.image_list?.[0]?.url || item.user_info?.avatar_url
    );

    const prettyCount = (n) => n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + '万' : String(n ?? 0);

    const date = (ts) => ts
      ? new Intl.DateTimeFormat('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(ts * 1000))
      : '';

    function card(item) {
      const link = safeUrl(item.article_url || item.url || item.share_url);
      const image = imgUrl(item);
      const title = item.title || item.Abstract || '未命名资讯';
      const source = item.source || item.user_info?.name || '未知来源';
      const avatar = safeUrl(item.user_info?.avatar_url);
      const stats = [
        item.read_count ? `阅读 ${prettyCount(item.read_count)}` : '',
        item.comment_count ? `评论 ${prettyCount(item.comment_count)}` : '',
        item.digg_count ? `点赞 ${prettyCount(item.digg_count)}` : '',
        date(item.publish_time || item.behot_time)
      ].filter(Boolean).map(esc).join('<i>·</i>');

      return `
        <a class="card" ${link ? `href="${esc(link)}" target="_blank" rel="noopener"` : ''}>
          <div>
            <div class="meta">
              ${avatar ? `<img class="avatar" src="${esc(avatar)}" alt="">` : ''}
              <span class="source">${esc(source)}</span>
            </div>
            <h2 class="title">${esc(title)}</h2>
            ${item.Abstract && item.Abstract !== title ? `<p class="abstract">${esc(item.Abstract)}</p>` : ''}
            <div class="stats">${stats}</div>
          </div>
          ${image ? `<img class="thumb" src="${esc(image)}" alt="" loading="lazy">` : ''}
        </a>`;
    }

    function render(data) {
      const items = Array.isArray(data?.data) ? data.data : [];
      count.textContent = `${tou.channels[currentKey].label} · ${items.length} 条`;
      list.innerHTML = items.length ? items.map(card).join('') : '<p>没有资讯</p>';
    }

    async function load(key) {
      currentKey = key;
      location.hash = key;
      tabs.querySelectorAll('button').forEach((btn) => btn.classList.toggle('active', btn.dataset.key === key));
      fallback.style.display = 'none';
      count.textContent = `${tou.channels[key].label} · 加载中…`;

      try {
        render(await tou.get(key));
      } catch (err) {
        count.textContent = `${tou.channels[key].label} · 加载失败`;
        error.textContent = `请求失败：${err.message || err}。请先运行 node tou.js 启动接口。`;
        fallback.style.display = 'block';
      }
    }

    for (const [key, { label }] of Object.entries(tou.channels)) {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.dataset.key = key;
      btn.onclick = () => load(key);
      tabs.append(btn);
    }

    const initial = tou.channels[location.hash.slice(1)] ? location.hash.slice(1) : 'econ';
    let currentKey = initial;
    load(initial);
  </script>
</body>
</html>
