<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIGC 热榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
:root{
  --bg:#EEF1F7;--surface:#FFFFFF;--ink:#14161F;--sub:#5B6075;--line:#D8DDEA;
  --blue:#2433E8;--blue-ink:#FFFFFF;--gold:#FFD23F;--up:#0E8F5B;--down:#D23B3B;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1220;--surface:#191D31;--ink:#EEF0FA;--sub:#9AA0BB;--line:#2A2F4A;--blue:#6C79FF;--blue-ink:#0F1220;--up:#3DD598;--down:#FF7A7A}
}
:root[data-theme="dark"]{--bg:#0F1220;--surface:#191D31;--ink:#EEF0FA;--sub:#9AA0BB;--line:#2A2F4A;--blue:#6C79FF;--blue-ink:#0F1220;--up:#3DD598;--down:#FF7A7A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}

/* 顶部 */
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font:900 clamp(34px,6vw,56px)/1.05 var(--serif);letter-spacing:.02em}
h1 span{background:var(--gold);color:#14161F;padding:0 .18em}
.date{color:var(--sub);font-size:13px;margin:6px 0 0}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 18px;border-radius:999px;color:var(--sub);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.tabs button{font-weight:700}
.search{margin-left:auto;display:flex}
.search input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;width:220px}
.search input::placeholder{color:var(--sub)}

/* 前三名 */
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:end;margin-bottom:34px}
.card{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:9/14;color:#fff;border:0;text-align:left;padding:0;display:block;width:100%;isolation:isolate}
.card.r1{order:2;aspect-ratio:9/16}
.card.r2{order:1}.card.r3{order:3}
.card .art{position:absolute;inset:0;z-index:-1}
.card .ghost{position:absolute;right:-6%;top:6%;font:900 clamp(120px,22vw,230px)/1 var(--serif);opacity:.16;z-index:-1;pointer-events:none}
.card .rank{position:absolute;left:14px;top:6px;font:900 clamp(64px,11vw,110px)/1 var(--serif);color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:48px 16px 16px;background:linear-gradient(transparent,rgba(8,10,25,.82))}
.card h3{margin:0 0 4px;font:900 clamp(18px,2.4vw,24px)/1.25 var(--serif)}
.card p{margin:0;font-size:13px;opacity:.88}
.card .heat{display:inline-block;margin-top:8px;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 12px;font-weight:700}
.card .play{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.card .play::after{content:"";border-left:11px solid #14161F;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.card.av .ghost{display:none}

/* 列表 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rowbtn{display:grid;grid-template-columns:44px 52px 1fr 110px 96px 64px;gap:14px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:14px 18px}
.rowbtn:hover{background:var(--bg)}
.no{font:900 24px/1 var(--serif);text-align:center}
.th{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;color:#fff;font:900 22px var(--serif)}
.th.round{border-radius:50%}
.t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hv{font-weight:700;text-align:right}
.hv small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.mv{font-weight:700;font-size:14px;text-align:right}
.mv.up{color:var(--up)}.mv.down{color:var(--down)}.mv.flat{color:var(--sub)}
svg.spark{width:110px;height:34px;display:block}
.detail{display:none;padding:0 18px 18px 126px;color:var(--sub);font-size:14px}
.row.open .detail{display:block}
.detail b{color:var(--ink)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tags span{border:1px solid var(--line);border-radius:6px;padding:1px 10px;font-size:12px}
.empty{padding:40px;text-align:center;color:var(--sub)}
.note{color:var(--sub);font-size:12px;margin-top:18px}

@media (max-width:760px){
  .top{grid-template-columns:1fr 1fr}
  .card.r1{grid-column:1/-1;order:0;aspect-ratio:16/11}
  .card.r2{order:1}.card.r3{order:2}
  .search{margin-left:0;width:100%}.search input{width:100%}
  .rowbtn{grid-template-columns:32px 44px 1fr 64px;gap:10px;padding:12px 14px}
  .th{width:44px;height:44px}
  .spark,.hv small,.mv{display:none}
  .hv{grid-column:4}
  .detail{padding-left:14px}
}
@media (prefers-reduced-motion:no-preference){
  .top .card{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .top .card.r1{animation-delay:.05s}.top .card.r2{animation-delay:.2s}.top .card.r3{animation-delay:.3s}
  @keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AIGC <span>热榜</span></h1>
      <p class="date" id="date"></p>
    </div>
    <div class="seg tabs" role="group" aria-label="榜单类型" id="tabs">
      <button aria-pressed="true" data-k="drama">短剧榜</button>
      <button aria-pressed="false" data-k="video">视频榜</button>
      <button aria-pressed="false" data-k="author">作者榜</button>
    </div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="统计周期" id="periods">
      <button aria-pressed="false" data-p="0">日榜</button>
      <button aria-pressed="true" data-p="1">周榜</button>
      <button aria-pressed="false" data-p="2">月榜</button>
    </div>
    <label class="search"><span hidden>搜索</span><input id="q" type="search" placeholder="搜索名称、作者或工具"></label>
  </div>

  <section class="top" id="top" aria-label="前三名"></section>
  <section class="list" id="list" aria-label="完整榜单"></section>
  <p class="note">页面内的作品、作者与数据均为示例，接入真实数据后替换 DATA 即可。</p>
</div>

<script>
// 示例数据：h = [日, 周, 月] 热度（万），m = [日, 周, 月] 名次变化，tr = 近 7 天走势
const DATA={
drama:[
 {n:"重生之我在AI片场",a:"墨染工作室",tool:["可灵","即梦"],h:[820,5200,19800],m:[2,0,3],tr:[40,52,48,66,70,88,96],c:228,d:"80 集竖屏爽剧，全程 AI 生成画面，主角面部一致性稳定。"},
 {n:"赛博长安：夜行人",a:"七号机位",tool:["Vidu","海螺"],h:[760,5480,17400],m:[-1,2,1],tr:[60,58,72,80,84,90,92],c:268,d:"唐风赛博朋克悬疑，单集 90 秒，追更率高。"},
 {n:"山海经纪人",a:"星河小分队",tool:["即梦"],h:[690,4100,16100],m:[1,-1,0],tr:[30,44,50,60,58,70,82],c:162,d:"神兽签约娱乐公司的职场喜剧，台词原创度高。"},
 {n:"她的数字分身",a:"阿澈 Prompt",tool:["可灵"],h:[610,3900,12800],m:[0,1,-2],tr:[50,48,56,60,66,64,70],c:332,d:"都市情感题材，用分身讲述孤独与陪伴。"},
 {n:"末日便利店",a:"猫爷 AI",tool:["海螺","Vidu"],h:[540,3400,11900],m:[3,2,2],tr:[20,30,45,52,60,72,78],c:24,d:"末世背景下的暖心群像，每集一个顾客故事。"},
 {n:"龙王赘婿 2099",a:"墨染工作室",tool:["可灵"],h:[480,3100,10400],m:[-2,-1,1],tr:[70,66,62,58,60,56,58],c:200,d:"经典逆袭题材的未来改编，节奏紧凑。"},
 {n:"会说话的猫探长",a:"猫爷 AI",tool:["即梦"],h:[430,2700,9300],m:[0,0,0],tr:[40,44,42,46,48,50,52],c:42,d:"猫咪侦探系列，适合全年龄观看。"},
 {n:"回到 2008 开 AI 工作室",a:"阿澈 Prompt",tool:["Vidu"],h:[390,2400,8800],m:[1,3,-1],tr:[22,30,34,40,48,52,60],c:140,d:"怀旧穿越题材，用老物件还原年代感。"},
 {n:"锦衣卫与机器人",a:"七号机位",tool:["海螺"],h:[350,2100,7600],m:[-1,0,2],tr:[48,50,46,44,48,46,44],c:300,d:"古装与机甲混搭，动作场面是亮点。"},
 {n:"月球快递员",a:"星河小分队",tool:["可灵","即梦"],h:[310,1800,6900],m:[2,1,1],tr:[18,24,30,34,40,46,50],c:190,d:"轻科幻短剧，单集 60 秒，适合通勤观看。"}],
video:[
 {n:"一镜到底：纸城",a:"折纸实验室",tool:["可灵"],h:[1300,8800,31000],m:[1,0,2],tr:[50,64,70,78,90,98,104],c:36,d:"一镜到底穿越折纸城市，转场流畅。"},
 {n:"AI 复原 1998 年的上海",a:"老街影像",tool:["Vidu","即梦"],h:[1180,9300,28600],m:[0,1,0],tr:[80,82,86,88,92,90,96],c:210,d:"用老照片生成动态影像，评论区充满回忆。"},
 {n:"水墨动物园",a:"墨染工作室",tool:["即梦"],h:[990,7400,24100],m:[2,-1,1],tr:[40,50,58,62,70,76,84],c:160,d:"水墨风格的动物动画合集。"},
 {n:"机甲少女日常",a:"七号机位",tool:["海螺"],h:[880,6100,20800],m:[-1,2,3],tr:[56,60,58,64,66,72,76],c:290,d:"日系机甲日常短片，画风统一。"},
 {n:"三分钟看懂量子计算",a:"阿澈 Prompt",tool:["可灵"],h:[760,5600,18200],m:[3,1,-1],tr:[28,36,44,52,60,70,74],c:250,d:"科普类视频，用比喻和动画解释抽象概念。"},
 {n:"深海来信",a:"星河小分队",tool:["Vidu"],h:[690,4900,15700],m:[0,0,1],tr:[50,52,50,54,52,56,58],c:196,d:"深海题材的氛围短片，配乐原创。"},
 {n:"十二生肖宇航员",a:"猫爷 AI",tool:["即梦","可灵"],h:[610,4300,13900],m:[1,-2,0],tr:[44,40,46,50,52,50,54],c:12,d:"生肖拟人化的太空冒险。"},
 {n:"雨天的第七个站台",a:"折纸实验室",tool:["海螺"],h:[540,3800,12100],m:[-2,1,2],tr:[60,58,52,50,54,52,50],c:278,d:"治愈系公路短片。"}],
author:[
 {n:"墨染工作室",a:"短剧 · 视频",tool:["可灵","即梦"],h:[2400,16800,61000],m:[0,0,1],tr:[60,66,72,78,86,92,100],c:228,d:"12 部作品上榜，擅长长篇连续剧。粉丝 286 万。"},
 {n:"七号机位",a:"短剧 · 动画",tool:["Vidu","海螺"],h:[2100,15200,55400],m:[1,1,0],tr:[56,60,66,70,76,80,90],c:268,d:"古装与科幻混搭风格，视觉辨识度强。粉丝 214 万。"},
 {n:"星河小分队",a:"短剧 · 轻科幻",tool:["即梦","可灵"],h:[1700,12100,43800],m:[-1,0,2],tr:[44,50,52,58,60,66,72],c:162,d:"团队 6 人，日更两条。粉丝 168 万。"},
 {n:"阿澈 Prompt",a:"教程 · 视频",tool:["可灵"],h:[1500,10900,39000],m:[2,2,-1],tr:[30,38,46,54,60,68,76],c:332,d:"以 Prompt 教学起家，转型叙事短片。粉丝 152 万。"},
 {n:"猫爷 AI",a:"短剧 · 儿童",tool:["海螺","即梦"],h:[1200,8800,30900],m:[0,-1,1],tr:[40,42,44,46,48,50,52],c:24,d:"萌宠与亲子题材。粉丝 131 万。"},
 {n:"折纸实验室",a:"视频 · 实验",tool:["可灵","海螺"],h:[980,7300,25700],m:[3,1,2],tr:[20,28,36,44,52,60,70],c:36,d:"强调镜头创意的个人工作室。粉丝 97 万。"},
 {n:"老街影像",a:"视频 · 纪实",tool:["Vidu"],h:[860,6400,22100],m:[-1,0,0],tr:[50,52,50,54,52,54,56],c:210,d:"老照片修复与动态化。粉丝 88 万。"}]
};
const state={k:"drama",p:1,q:""};
const $=s=>document.querySelector(s);
const fmt=v=>v>=10000?(v/10000).toFixed(1).replace(/\.0$/,"")+" 亿":v+" 万";
const art=c=>`linear-gradient(160deg,hsl(${c} 80% 46%),hsl(${(c+50)%360} 70% 22%))`;
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function spark(tr,c){
  const mx=Math.max(...tr),mn=Math.min(...tr),w=110,h=34;
  const pts=tr.map((v,i)=>[i*(w/(tr.length-1)),h-3-((v-mn)/(mx-mn||1))*(h-6)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="hsl(${c} 75% 50%)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}"/></svg>`;
}
function mv(m){return m>0?`<span class="mv up">↑ ${m}</span>`:m<0?`<span class="mv down">↓ ${-m}</span>`:`<span class="mv flat">持平</span>`}
function render(){
  const isA=state.k==="author";
  let rows=DATA[state.k].slice().sort((x,y)=>y.h[state.p]-x.h[state.p]).map((r,i)=>({...r,rank:i+1}));
  const q=state.q.trim().toLowerCase();
  if(q)rows=rows.filter(r=>(r.n+r.a+r.tool.join("")).toLowerCase().includes(q));
  const top=q?[]:rows.slice(0,3), rest=q?rows:rows.slice(3);
  $("#top").innerHTML=top.map(r=>`
    <button class="card r${r.rank}${isA?" av":""}" data-i="${r.rank}" aria-label="第 ${r.rank} 名 ${esc(r.n)}">
      <div class="art" style="background:${art(r.c)}"></div>
      <div class="ghost">${esc(r.n[0])}</div>
      <div class="rank">${r.rank}</div>
      <div class="info"><h3>${esc(r.n)}</h3><p>${esc(r.a)}　${r.tool.join(" / ")}</p><span class="heat">热度 ${fmt(r.h[state.p])}</span></div>
      ${isA?"":'<span class="play"></span>'}
    </button>`).join("");
  $("#list").innerHTML=rest.length?rest.map(r=>`
    <div class="row" id="r${r.rank}">
      <button class="rowbtn" aria-expanded="false">
        <span class="no">${r.rank}</span>
        <span class="th${isA?" round":""}" style="background:${art(r.c)}">${esc(r.n[0])}</span>
        <span style="min-width:0"><div class="t">${esc(r.n)}</div><div class="s">${esc(r.a)}</div></span>
        ${spark(r.tr,r.c)}
        <span class="hv">${fmt(r.h[state.p])}<small>热度</small></span>
        ${mv(r.m[state.p])}
      </button>
      <div class="detail"><b>${esc(r.n)}</b>：${esc(r.d)}<div class="tags">${r.tool.map(t=>`<span>${t}</span>`).join("")}</div></div>
    </div>`).join(""):`<div class="empty">没有找到“${esc(state.q)}”相关的结果，换个关键词试试。</div>`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("#tabs button");
  if(t){state.k=t.dataset.k;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b===t));render();return}
  const p=e.target.closest("#periods button");
  if(p){state.p=+p.dataset.p;document.querySelectorAll("#periods button").forEach(b=>b.setAttribute("aria-pressed",b===p));render();return}
  const rb=e.target.closest(".rowbtn");
  if(rb){const row=rb.parentElement,o=row.classList.toggle("open");rb.setAttribute("aria-expanded",o);return}
  const c=e.target.closest(".card");
  if(c){const el=document.getElementById("r"+(+c.dataset.i));if(!el){$("#list").scrollIntoView({behavior:"smooth"})}}
});
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
const d=new Date();$("#date").textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日更新，共收录 ${Object.values(DATA).reduce((a,b)=>a+b.length,0)} 个上榜对象`;
render();
</script>
</body>
</html>
