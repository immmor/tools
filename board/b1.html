<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 短剧与视频生成基准榜单 · 2026.11</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       设计系统 Token：Film Inspection Lab（胶片检片室）
       ========================================================================== */
    :root {
      --bg-canvas: #F7F8FA;       /* 高亮度冷调检片台白 */
      --bg-surface: #FFFFFF;      /* 纯白数据切片与折叠抽屉底色 */
      --bg-recessed: #EEF0F4;     /* 微凹胶片槽 / 标签背景 */
      --ink-primary: #0F1216;     /* 碳素黑核心排印文字 */
      --ink-secondary: #475467;   /* 工业板岩灰辅助数据与短剧工艺注释 */
      --ink-muted: #7A869A;       /* 淡铅灰表头与次要时间戳 */
      --rule-hairline: #D8DEE6;   /* 1px 精密检片台刻度分割线 */
      --accent-signal: #0047FF;   /* 国际克莱因 / 信号蓝 */
      --accent-emerald: #0A7B3E;  /* 正增长排名上升与高保真达标标记 */
      --accent-crimson: #C92A2A;  /* 排名下滑或高崩坏预警标记 */

      --row-hover: #F2F5FA;
      --row-active: #F4F7FF;

      --font-sans: 'PingFang SC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      --ease-film: cubic-bezier(0.19, 1, 0.22, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0 !important; /* 胶片检片台严格直角几何 */
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent-signal);
      outline-offset: -2px;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1, "zero" 1;
    }

    /* 主检片台容器 */
    .inspection-desk {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 24px 136px;
    }

    /* ==========================================================================
       1. 顶部检片室头栏（单行紧凑结构 + 专项筛选）
       ========================================================================== */
    .desk-header {
      background: var(--bg-surface);
      border: 1px solid var(--ink-primary);
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      justify-content: space-between;
    }

    .desk-brand {
      padding: 12px 18px;
      border-right: 1px solid var(--ink-primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 310px;
    }

    .desk-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink-primary);
      line-height: 1.3;
    }

    .desk-subtitle {
      margin-top: 3px;
      font-size: 12px;
      color: var(--ink-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timecode-chip {
      background: var(--bg-recessed);
      color: var(--ink-primary);
      padding: 0 5px;
      font-size: 11px;
      border: 1px solid var(--rule-hairline);
    }

    .desk-filters {
      display: flex;
      flex: 1;
      flex-wrap: wrap;
      align-items: stretch;
      justify-content: flex-end;
    }

    /* 短剧生产专项赛道标签 */
    .track-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      border-right: 1px solid var(--ink-primary);
    }

    .track-btn {
      appearance: none;
      background: transparent;
      border: none;
      border-right: 1px solid var(--rule-hairline);
      padding: 0 14px;
      min-height: 52px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 0.14s ease, color 0.14s ease;
    }

    .track-btn:last-child {
      border-right: none;
    }

    .track-btn:hover {
      background: var(--bg-canvas);
    }

    .track-btn[aria-selected="true"] {
      background: var(--accent-signal);
      color: #FFFFFF;
    }

    .track-count {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      opacity: 0.72;
    }

    /* 输出画幅 / 时长过滤快速切换 */
    .spec-filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-surface);
    }

    .spec-filter-label {
      font-size: 11px;
      color: var(--ink-muted);
      margin-right: 2px;
      white-space: nowrap;
    }

    .spec-pill {
      appearance: none;
      border: 1px solid var(--rule-hairline);
      background: var(--bg-recessed);
      color: var(--ink-secondary);
      padding: 4px 9px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.14s ease, background-color 0.14s ease, color 0.14s ease;
    }

    .spec-pill:hover {
      border-color: var(--ink-primary);
      color: var(--ink-primary);
    }

    .spec-pill[aria-pressed="true"] {
      border-color: var(--accent-signal);
      background: var(--accent-signal);
      color: #FFFFFF;
    }

    /* ==========================================================================
       2. Hero 核心视觉：动态 ELO 检片标尺（Optical Film Gauge）
       ========================================================================== */
    .film-gauge-panel {
      background: var(--bg-surface);
      border-left: 1px solid var(--ink-primary);
      border-right: 1px solid var(--ink-primary);
      border-bottom: 1px solid var(--ink-primary);
      padding: 12px 18px 14px;
    }

    .gauge-topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .gauge-caption {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gauge-indicator-sq {
      width: 8px;
      height: 8px;
      background: var(--accent-signal);
      display: inline-block;
    }

    .gauge-readout {
      font-size: 12px;
      color: var(--ink-secondary);
    }

    .gauge-readout strong {
      color: var(--ink-primary);
      font-weight: 600;
    }

    /* 检片标尺视窗：含顶部胶片齿孔隐喻与 1100–1450 ELO 精密刻度 */
    .gauge-viewport {
      position: relative;
      height: 86px;
      border-top: 1px solid var(--ink-primary);
      border-bottom: 1px solid var(--rule-hairline);
      background-color: var(--bg-canvas);
      /* 顶部胶片齿孔细微隐喻刻度 */
      background-image:
        repeating-linear-gradient(
          to right,
          var(--rule-hairline) 0,
          var(--rule-hairline) 4px,
          transparent 4px,
          transparent 14px
        );
      background-size: 100% 4px;
      background-position: 0 2px;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    .gauge-scale-layer,
    .gauge-cursors-layer {
      position: absolute;
      inset: 0;
    }

    /* 2 分微刻度与 10 分主刻度 */
    .gauge-tick-minor {
      position: absolute;
      top: 8px;
      width: 1px;
      height: 6px;
      background: var(--rule-hairline);
    }

    .gauge-tick-major {
      position: absolute;
      top: 8px;
      width: 1px;
      height: 14px;
      background: var(--ink-primary);
    }

    .gauge-tick-label {
      position: absolute;
      top: 23px;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      color: var(--ink-muted);
      user-select: none;
    }

    /* 垂直刻度游标（前 6 名模型） */
    .gauge-cursor {
      position: absolute;
      bottom: 0;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 3;
      transition: transform 0.22s var(--ease-film);
    }

    .cursor-tag {
      background: var(--bg-surface);
      border: 1px solid var(--ink-primary);
      padding: 2px 6px;
      font-size: 11px;
      line-height: 1.25;
      white-space: nowrap;
      color: var(--ink-primary);
      transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .cursor-needle {
      width: 1px;
      background: var(--ink-primary);
      margin-top: 1px;
      transition: background-color 0.14s ease, width 0.14s ease;
    }

    .gauge-cursor.is-lead .cursor-tag {
      border-color: var(--accent-signal);
      color: var(--accent-signal);
      font-weight: 600;
    }

    .gauge-cursor.is-lead .cursor-needle,
    .gauge-cursor.is-expanded .cursor-needle,
    .gauge-cursor:hover .cursor-needle {
      background: var(--accent-signal);
      width: 2px;
    }

    .gauge-cursor.is-expanded .cursor-tag,
    .gauge-cursor:hover .cursor-tag {
      background: var(--accent-signal);
      border-color: var(--accent-signal);
      color: #FFFFFF;
    }

    /* 游标悬停浮窗（显示模型名、总分与短剧核心强项） */
    .gauge-tooltip {
      position: fixed;
      pointer-events: none;
      background: var(--ink-primary);
      color: #FFFFFF;
      border-left: 3px solid var(--accent-signal);
      padding: 7px 10px;
      font-size: 11px;
      line-height: 1.45;
      z-index: 80;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
      max-width: 280px;
    }

    .gauge-tooltip.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .gauge-tooltip-head {
      font-weight: 600;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .gauge-tooltip-sub {
      color: #D0D5DD;
    }

    /* ==========================================================================
       3. 高密度短剧视频模型主榜单
       ========================================================================== */
    .ledger-wrapper {
      background: var(--bg-surface);
      border-left: 1px solid var(--ink-primary);
      border-right: 1px solid var(--ink-primary);
      border-bottom: 1px solid var(--ink-primary);
      overflow-x: auto;
    }

    .ledger-table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .ledger-table thead th {
      height: 40px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      border-bottom: 1px solid var(--ink-primary);
      background: var(--bg-surface);
      text-align: left;
      user-select: none;
      white-space: nowrap;
    }

    .ledger-table thead th.align-right {
      text-align: right;
    }

    .ledger-table thead th.align-center {
      text-align: center;
    }

    .sort-btn {
      appearance: none;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .sort-btn:hover {
      color: var(--ink-primary);
    }

    .sort-btn[aria-sort="descending"],
    .sort-btn[aria-sort="ascending"] {
      color: var(--accent-signal);
      font-weight: 600;
    }

    /* 主数据行 */
    .film-row {
      height: 52px;
      border-bottom: 1px solid var(--rule-hairline);
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .film-row:hover {
      background-color: var(--row-hover);
    }

    .film-row.is-expanded {
      background-color: var(--row-active);
      border-bottom-color: var(--accent-signal);
    }

    .film-row.is-cursor-focus {
      outline: 2px solid var(--accent-signal);
      outline-offset: -2px;
    }

    .film-row td {
      padding: 0 12px;
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .film-row td.align-right {
      text-align: right;
    }

    .film-row td.align-center {
      text-align: center;
    }

    /* 列 1：排名 / 变动 */
    .rank-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .rank-index {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-primary);
      min-width: 22px;
    }

    .rank-shift {
      font-size: 11px;
      min-width: 28px;
    }

    .shift-up {
      color: var(--accent-emerald);
      font-weight: 500;
    }

    .shift-down {
      color: var(--accent-crimson);
      font-weight: 500;
    }

    .shift-flat {
      color: var(--ink-muted);
    }

    .shift-new {
      color: var(--accent-signal);
      font-weight: 600;
    }

    /* 列 2：模型与开发商 + 原生规格标签 */
    .model-cell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .model-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-width: 0;
      overflow: hidden;
    }

    .model-title {
      font-weight: 600;
      color: var(--ink-primary);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .model-vendor {
      font-size: 12px;
      color: var(--ink-secondary);
      flex-shrink: 0;
    }

    .model-badges {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .spec-chip {
      background: var(--bg-recessed);
      border: 1px solid var(--rule-hairline);
      color: var(--ink-secondary);
      font-size: 11px;
      padding: 1px 6px;
    }

    .row-arrow {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-muted);
      transition: transform 0.18s var(--ease-film), color 0.14s ease;
    }

    .film-row.is-expanded .row-arrow {
      color: var(--accent-signal);
      transform: rotate(90deg);
    }

    /* 列 3：综合 ELO（含 ±95% CI） */
    .elo-group {
      display: inline-flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 6px;
    }

    .elo-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .elo-ci {
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* 列 4, 5, 6：单项评分条 + 数值 */
    .score-meter {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .meter-track {
      width: 54px;
      height: 5px;
      background: var(--bg-recessed);
      border: 1px solid var(--rule-hairline);
      flex-shrink: 0;
    }

    .meter-bar {
      height: 100%;
      background: var(--ink-primary);
    }

    .meter-bar.is-high {
      background: var(--accent-emerald);
    }

    .meter-bar.is-warn {
      background: var(--accent-crimson);
    }

    .score-num {
      font-size: 12px;
      font-weight: 500;
      min-width: 34px;
      text-align: right;
      color: var(--ink-primary);
    }

    .score-num.is-high {
      color: var(--accent-emerald);
      font-weight: 600;
    }

    .score-num.is-warn {
      color: var(--accent-crimson);
    }

    /* 列 7：单分钟成片成本 / 生成耗时 */
    .cost-cell {
      font-size: 12px;
      color: var(--ink-primary);
    }

    .cost-sep {
      color: var(--ink-muted);
      margin: 0 3px;
    }

    .cost-time {
      color: var(--ink-secondary);
    }

    /* 列 8：对比勾选 */
    .compare-box {
      appearance: none;
      width: 15px;
      height: 15px;
      border: 1px solid var(--ink-primary);
      background: var(--bg-surface);
      cursor: pointer;
      display: inline-grid;
      place-content: center;
      margin: 0;
      vertical-align: middle;
    }

    .compare-box:checked {
      background: var(--accent-signal);
      border-color: var(--accent-signal);
    }

    .compare-box:checked::after {
      content: "";
      width: 7px;
      height: 7px;
      background: #FFFFFF;
    }

    /* ==========================================================================
       4. 原地短剧分镜评估抽屉（Inline Storyboard Inspection Drawer）
       ========================================================================== */
    .storyboard-drawer-row td {
      padding: 0;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--ink-primary);
    }

    .storyboard-drawer {
      display: grid;
      grid-template-columns: 1.05fr 1.45fr 260px;
      border-top: 1px solid var(--rule-hairline);
      background: var(--bg-surface);
      animation: drawerSlide 0.2s var(--ease-film);
    }

    @keyframes drawerSlide {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .drawer-pane {
      padding: 16px 18px;
      border-right: 1px solid var(--rule-hairline);
      white-space: normal;
    }

    .drawer-pane:last-child {
      border-right: none;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pane-heading {
      margin: 0 0 12px 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pane-heading-note {
      font-weight: 400;
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* 左侧：四维短剧工业化指标条 */
    .ind-metric-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ind-metric-row {
      display: grid;
      grid-template-columns: 118px 1fr 40px;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .ind-metric-name {
      color: var(--ink-secondary);
    }

    .ind-metric-track {
      height: 7px;
      background: var(--bg-recessed);
      border: 1px solid var(--rule-hairline);
    }

    .ind-metric-fill {
      height: 100%;
      background: var(--accent-signal);
    }

    .ind-metric-val {
      text-align: right;
      font-weight: 500;
      color: var(--ink-primary);
    }

    /* 中间：标准短剧盲测剧本 Prompt 与分镜缺陷/高光记录 */
    .script-slate {
      background: var(--bg-canvas);
      border: 1px solid var(--rule-hairline);
      border-left: 3px solid var(--ink-primary);
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .script-meta-line {
      font-size: 11px;
      color: var(--ink-muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .script-prompt-body {
      margin: 0;
      font-size: 12px;
      color: var(--ink-primary);
      line-height: 1.55;
    }

    .inspection-log {
      margin: 0;
      font-size: 12px;
      color: var(--ink-secondary);
      line-height: 1.6;
    }

    .inspection-log strong {
      color: var(--ink-primary);
    }

    /* 右侧：短剧制片选型建议 */
    .producer-specs {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 12px;
    }

    .producer-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--rule-hairline);
    }

    .producer-row span:first-child {
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .producer-row span:last-child {
      color: var(--ink-primary);
      text-align: right;
    }

    .producer-fit-note {
      margin: 10px 0 12px;
      font-size: 12px;
      color: var(--ink-secondary);
      line-height: 1.5;
    }

    .btn-bench-toggle {
      appearance: none;
      width: 100%;
      padding: 9px 12px;
      background: var(--accent-signal);
      border: 1px solid var(--accent-signal);
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.14s ease;
    }

    .btn-bench-toggle:hover {
      background: #0038CC;
    }

    .btn-bench-toggle.is-added {
      background: var(--bg-surface);
      color: var(--accent-signal);
    }

    /* 空状态 */
    .ledger-empty {
      padding: 44px 20px;
      text-align: center;
      color: var(--ink-secondary);
    }

    .ledger-empty p {
      margin: 0 0 12px;
    }

    .btn-reset-filters {
      appearance: none;
      background: var(--bg-surface);
      border: 1px solid var(--ink-primary);
      color: var(--ink-primary);
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-reset-filters:hover {
      background: var(--ink-primary);
      color: #FFFFFF;
    }

    /* ==========================================================================
       5. 底部固定双模型对比工作台（A/B Cut Comparison Bench）
       ========================================================================== */
    .ab-cut-bench {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-surface);
      border-top: 2px solid var(--ink-primary);
      box-shadow: 0 -6px 22px rgba(15, 18, 22, 0.08);
      z-index: 60;
      transform: translateY(100%);
      transition: transform 0.24s var(--ease-film);
    }

    .ab-cut-bench.is-open {
      transform: translateY(0);
    }

    .ab-bench-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 24px;
      display: grid;
      grid-template-columns: 176px 1fr auto;
      align-items: center;
      gap: 18px;
    }

    .ab-bench-head {
      border-right: 1px solid var(--rule-hairline);
      padding-right: 14px;
    }

    .ab-bench-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .ab-bench-count {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .ab-bench-body {
      display: grid;
      grid-template-columns: 1fr auto 1fr 1.35fr;
      align-items: center;
      gap: 14px;
    }

    .cut-slot {
      border: 1px solid var(--ink-primary);
      background: var(--bg-canvas);
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 48px;
    }

    .cut-slot.is-vacant {
      border-style: dashed;
      border-color: var(--ink-muted);
      background: var(--bg-surface);
      color: var(--ink-muted);
      font-size: 12px;
    }

    .cut-slot-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .cut-slot-meta {
      font-size: 11px;
      color: var(--ink-secondary);
    }

    .btn-slot-drop {
      appearance: none;
      background: var(--bg-surface);
      border: 1px solid var(--rule-hairline);
      color: var(--ink-secondary);
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
    }

    .btn-slot-drop:hover {
      border-color: var(--ink-primary);
      color: var(--ink-primary);
    }

    /* 四项核心差值读数 */
    .ab-diff-matrix {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 3px 12px;
      font-size: 11px;
      color: var(--ink-secondary);
      padding: 0 4px;
    }

    .ab-diff-item {
      white-space: nowrap;
    }

    .ab-diff-item strong {
      color: var(--accent-signal);
      font-weight: 600;
    }

    /* 导演/制片选型结论 */
    .producer-verdict {
      border-left: 2px solid var(--accent-signal);
      padding-left: 12px;
      font-size: 12px;
      color: var(--ink-primary);
      line-height: 1.48;
    }

    .btn-bench-clear {
      appearance: none;
      border: 1px solid var(--ink-primary);
      background: var(--bg-surface);
      color: var(--ink-primary);
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-bench-clear:hover {
      background: var(--ink-primary);
      color: #FFFFFF;
    }

    /* 检片室提示条 */
    .desk-toast {
      position: fixed;
      top: 16px;
      right: 24px;
      background: var(--ink-primary);
      color: #FFFFFF;
      border-left: 3px solid var(--accent-signal);
      padding: 9px 14px;
      font-size: 12px;
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .desk-toast.is-active {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       响应式折叠适配
       ========================================================================== */
    @media (max-width: 1120px) {
      .storyboard-drawer {
        grid-template-columns: 1fr;
      }
      .drawer-pane {
        border-right: none;
        border-bottom: 1px solid var(--rule-hairline);
      }
      .ab-bench-inner {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .ab-bench-head {
        border-right: none;
        border-bottom: 1px solid var(--rule-hairline);
        padding-bottom: 6px;
      }
      .ab-bench-body {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    @media (max-width: 720px) {
      .inspection-desk {
        padding: 12px 12px 180px;
      }
      .desk-brand {
        border-right: none;
        border-bottom: 1px solid var(--ink-primary);
        width: 100%;
      }
      .track-tabs {
        border-right: none;
        border-bottom: 1px solid var(--ink-primary);
        width: 100%;
      }
      .track-btn {
        flex: 1 1 auto;
        justify-content: center;
        min-height: 42px;
        padding: 0 10px;
      }
      .spec-filter-group {
        width: 100%;
        flex-wrap: wrap;
      }
    }

      const state = {

      const ledgerBody = document.getElementById("ledgerBody");
      const ledgerEmpty = document.getElementById("ledgerEmpty");
      const trackBtns = Array.from(document.querySelectorAll(".track-btn"));
      const specPills = Array.from(document.querySelectorAll(".spec-pill"));
      const sortBtns = Array.from(document.querySelectorAll(".sort-btn"));

      const gaugeScaleLayer = document.getElementById("gaugeScaleLayer");
      const gaugeCursorsLayer = document.getElementById("gaugeCursorsLayer");

      const abBenchCount = document.getElementById("abBenchCount");
      const abBenchBody = document.getElementById("abBenchBody");
      const clearBenchBtn = document.getElementById("clearBenchBtn");
      const deskToast = document.getElementById("deskToast");

      let toastTimer = null;

      /* ========================================================================
         4. 工具函数
         ======================================================================== */
      function showToast(msg) {
        deskToast.textContent = msg;
        deskToast.classList.add("is-active");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          deskToast.classList.remove("is-active");
        }, 2600);
      }

      function esc(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // 获取当前筛选条件下的模型集合与视图排序结果
      function getFilteredDataset() {
        const filtered = VIDEO_MODELS.filter((m) => {
          const matchTrack = state.track === "all" || m.track === state.track;
          const matchSpec =
            state.spec === "all" ||
            (state.spec === "long15" && m.maxDurationSec >= 15) ||
            (state.spec === "native916" && m.native916);
          return matchTrack && matchSpec;
        });

        // 按 ELO 确定当前筛选池中的基准名次
        const eloRanked = [...filtered]
          .sort((a, b) => b.elo - a.elo)
          .map((item, idx) => ({ ...item, currentRank: idx + 1 }));

        // 按用户选择的指标列排序
        const sorted = [...eloRanked].sort((a, b) => {
          let va, vb;
          if (state.sortBy === "elo") {
            va = a.elo;
            vb = b.elo;
          } else if (state.sortBy === "consistency") {
            va = a.consistency;
            vb = b.consistency;
          } else if (state.sortBy === "lipsync") {
            va = a.lipsync;
            vb = b.lipsync;
          } else if (state.sortBy === "physics") {
            va = a.physics;
            vb = b.physics;
          } else {
            va = a.costPerMin;
            vb = b.costPerMin;
          }
          return state.sortDir === "desc" ? vb - va : va - vb;
        });

        return { sorted, eloRanked };
      }

      /* ========================================================================
         5. Hero 动态 ELO 检片标尺（1100 – 1450 ELO 胶片刻度）
         ======================================================================== */
      function renderFilmGauge(eloRanked) {
        gaugeScaleLayer.innerHTML = "";
        gaugeCursorsLayer.innerHTML = "";

        const MIN_ELO = 1100;
        const MAX_ELO = 1450;
        const SPAN = MAX_ELO - MIN_ELO;

        // 绘制 2 分微刻度与 10 分主刻度（每 50 分标注数字）
        for (let val = MIN_ELO; val <= MAX_ELO; val += 2) {
          const pct = ((val - MIN_ELO) / SPAN) * 100;
          if (val % 10 === 0) {
            const major = document.createElement("div");
            major.className = "gauge-tick-major";
            major.style.left = `${pct}%`;
            gaugeScaleLayer.appendChild(major);

            if (val % 50 === 0) {
              const lbl = document.createElement("div");
              lbl.className = "gauge-tick-label";
              lbl.style.left = `${pct}%`;
              lbl.textContent = val;
              gaugeScaleLayer.appendChild(lbl);
            }
          } else if (val % 4 === 0) {
            const minor = document.createElement("div");
            minor.className = "gauge-tick-minor";
            minor.style.left = `${pct}%`;
            gaugeScaleLayer.appendChild(minor);
          }
        }

        if (!eloRanked.length) {
          gaugeReadout.innerHTML = "当前赛道头名：<strong>无匹配模型</strong>";
          return;
        }

        const topSix = eloRanked.slice(0, 6);
        const leader = topSix[0];
        gaugeReadout.innerHTML = `当前赛道头名：<strong>${esc(leader.name)} (${leader.elo} ±${leader.ci})</strong> · 短剧强项：${esc(leader.strengthShort)}`;

        // 垂直游标智能阶梯防重叠映射
        const placedX = [];
        topSix.forEach((m, idx) => {
          const pct = Math.max(3, Math.min(97, ((m.elo - MIN_ELO) / SPAN) * 100));

          // 检查左侧相邻游标距离，防止标签遮挡
          let tier = 0;
          for (let i = placedX.length - 1; i >= 0; i--) {
            if (Math.abs(pct - placedX[i].pct) < 9.5) {
              tier = (placedX[i].tier + 1) % 3;
              break;
            }
          }
          placedX.push({ pct, tier });

          const needleHeights = [10, 26, 42];
          const cursor = document.createElement("div");
          cursor.className =
            "gauge-cursor" +
            (idx === 0 ? " is-lead" : "") +
            (state.expandedId === m.id ? " is-expanded" : "");
          cursor.style.left = `${pct}%`;
          cursor.setAttribute("role", "button");
          cursor.setAttribute("tabindex", "0");
          cursor.setAttribute("aria-label", `${m.name}，综合 ${m.elo} ELO，点击展开分镜报告`);

          cursor.innerHTML = `
            <span class="cursor-tag mono">${esc(m.name)} · ${m.elo}</span>
            <span class="cursor-needle" style="height:${needleHeights[tier]}px;"></span>
          `;

          // 悬停显示浮窗（模型名、总分与短剧核心强项）
          cursor.addEventListener("mouseenter", (e) => {
            gaugeTooltip.innerHTML = `
              <div class="gauge-tooltip-head">
                <span>${esc(m.name)} (${esc(m.vendor)})</span>
                <span class="mono">${m.elo} ELO</span>
              </div>
              <div class="gauge-tooltip-sub">${esc(m.strengthShort)}</div>
            `;
            gaugeTooltip.classList.add("is-visible");
            positionTooltip(e);
          });

          cursor.addEventListener("mousemove", positionTooltip);

          cursor.addEventListener("mouseleave", () => {
            gaugeTooltip.classList.remove("is-visible");
          });

          // 点击游标直接定位并展开对应模型的分镜评测抽屉
          cursor.addEventListener("click", () => {
            gaugeTooltip.classList.remove("is-visible");
            state.expandedId = m.id;
            renderAll();
            const rowEl = ledgerBody.querySelector(`tr.film-row[data-id="${m.id}"]`);
            if (rowEl) {
              rowEl.scrollIntoView({ behavior: "smooth", block: "center" });
              rowEl.focus({ preventScroll: true });
            }
          });

          gaugeCursorsLayer.appendChild(cursor);
        });
      }

      function positionTooltip(e) {
        const pad = 12;
        const rect = gaugeTooltip.getBoundingClientRect();
        let left = e.clientX + pad;
        let top = e.clientY + pad;
        if (left + rect.width > window.innerWidth - 12) {
          left = e.clientX - rect.width - pad;
        }
        if (top + rect.height > window.innerHeight - 12) {
          top = e.clientY - rect.height - pad;
        }
        gaugeTooltip.style.left = `${left}px`;
        gaugeTooltip.style.top = `${top}px`;
      }

      /* ========================================================================
         6. 主榜单与原地短剧分镜评估抽屉渲染
         ======================================================================== */
      function formatRankShift(delta) {
        if (delta > 0) {
          return `<span class="rank-shift shift-up">▲${delta}</span>`;
        }
        if (delta < 0) {
          return `<span class="rank-shift shift-down">▼${Math.abs(delta)}</span>`;
        }
        return `<span class="rank-shift shift-flat">—</span>`;
      }

      function renderScoreMeter(score) {
        const cls = score >= 95 ? "is-high" : score < 86 ? "is-warn" : "";
        return `
          <div class="score-meter">
            <div class="meter-track" aria-hidden="true">
              <div class="meter-bar ${cls}" style="width:${score}%"></div>
            </div>
            <span class="score-num mono ${cls}">${score.toFixed(1)}</span>
          </div>
        `;
      }

              />

                  <!-- 左侧：四维短剧工业化指标条 -->
                  <div class="drawer-pane">
                    <h2 class="pane-heading">四维短剧工业化指标 <span class="pane-heading-note">百分制实测</span></h2>
                    <div class="ind-metric-list">
                      <div class="ind-metric-row">
                        <span class="ind-metric-name">角色五官锁定率</span>
                        <div class="ind-metric-track"><div class="ind-metric-fill" style="width:${m.subMetrics.faceLock}%"></div></div>
                        <span class="ind-metric-val mono">${m.subMetrics.faceLock.toFixed(1)}</span>
                      </div>
                      <div class="ind-metric-row">
                        <span class="ind-metric-name">中文唇形同步度</span>
                        <div class="ind-metric-track"><div class="ind-metric-fill" style="width:${m.subMetrics.chineseLipSync}%"></div></div>
                        <span class="ind-metric-val mono">${m.subMetrics.chineseLipSync.toFixed(1)}</span>
                      </div>
                      <div class="ind-metric-row">
                        <span class="ind-metric-name">复杂运镜推拉执行</span>
                        <div class="ind-metric-track"><div class="ind-metric-fill" style="width:${m.subMetrics.cameraControl}%"></div></div>
                        <span class="ind-metric-val mono">${m.subMetrics.cameraControl.toFixed(1)}</span>
                      </div>
                      <div class="ind-metric-row">
                        <span class="ind-metric-name">手部道具防畸变率</span>
                        <div class="ind-metric-track"><div class="ind-metric-fill" style="width:${m.subMetrics.handPropStability}%"></div></div>
                        <span class="ind-metric-val mono">${m.subMetrics.handPropStability.toFixed(1)}</span>
                      </div>
                    </div>
                  </div>

                  <!-- 中间：标准短剧盲测剧本 Prompt 与成片缺陷/高光记录 -->
                  <div class="drawer-pane">
                    <h2 class="pane-heading">标准短剧盲测剧本与检片记录 <span class="pane-heading-note mono">${esc(m.scriptTag)}</span></h2>
                    <div class="script-slate">
                      <div class="script-meta-line">
                        <span>场记板测试分镜 Prompt</span>
                        <span class="mono">主赛道：${esc(m.track)}</span>
                      </div>
                      <p class="script-prompt-body">${esc(m.scriptPrompt)}</p>
                    </div>
                    <p class="inspection-log"><strong>检片室高光/缺陷记录：</strong>${esc(m.inspectionRecord)}</p>
                  </div>

                  <!-- 右侧：短剧制片选型建议 -->
                  <div class="drawer-pane">
                    <div>
                      <h2 class="pane-heading">短剧制片选型建议</h2>
                      <div class="producer-specs">
                        <div class="producer-row">
                          <span>单镜头上限</span>
                          <span class="mono">${m.maxDurationSec}s (${m.native916 ? "原生 9:16" : "需裁切竖屏"})</span>
                        </div>
                        <div class="producer-row">
                          <span>首尾帧控制</span>
                          <span>${esc(m.frameControl)}</span>
                        </div>
                        <div class="producer-row">
                          <span>成片成本效率</span>
                          <span class="mono">¥${m.costPerMin.toFixed(1)} / 分钟 (${m.genSecondsPerMin}s)</span>
                        </div>
                      </div>
                      <p class="producer-fit-note"><strong>适配题材：</strong>${esc(m.recommendedGenre)}</p>
                    </div>

                    <button
                      type="button"
                      class="btn-bench-toggle ${isCompared ? "is-added" : ""}"
                      data-drawer-bench="${m.id}"
                    >
                      ${isCompared ? "移出底部对比工作台" : "加入底部对比工作台"}
                    </button>
                  </div>
                </div>
              </td>
            `;

            const benchBtn = drawerRow.querySelector("[data-drawer-bench]");
            benchBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              toggleCompareSelection(m.id, !isCompared);
            });

            ledgerBody.appendChild(drawerRow);
          }
        });
      }

      /* ========================================================================
         7. 底部固定双模型对比工作台（A/B Cut Comparison Bench）
         ======================================================================== */
      function toggleCompareSelection(modelId, add) {
        const existsIdx = state.compareIds.indexOf(modelId);
        if (add && existsIdx === -1) {
          if (state.compareIds.length >= 2) {
            const dropped = VIDEO_MODELS.find((x) => x.id === state.compareIds[0]);
            state.compareIds.shift();
            state.compareIds.push(modelId);
            showToast(`对比台已满，已替换原样本 ${dropped ? dropped.name : ""}`);
          } else {
            state.compareIds.push(modelId);
          }
        } else if (!add && existsIdx !== -1) {
          state.compareIds.splice(existsIdx, 1);
        }
        renderAll();
      }

      function generateProducerVerdict(a, b) {
        const eloDiff = a.elo - b.elo;
        const consDiff = a.consistency - b.consistency;
        const lipDiff = a.lipsync - b.lipsync;
        const physDiff = a.physics - b.physics;
        const cheaper = a.costPerMin <= b.costPerMin ? a : b;
        const pricier = a.costPerMin <= b.costPerMin ? b : a;
        const costSavePct = Math.round(((pricier.costPerMin - cheaper.costPerMin) / pricier.costPerMin) * 100);

        const lipLeader = lipDiff >= 0 ? a : b;
        const physLeader = physDiff >= 0 ? a : b;
        const consLeader = consDiff >= 0 ? a : b;

        if (cheaper.id === lipLeader.id && costSavePct >= 15) {
          return `预算敏感型日更爽剧推荐 ${cheaper.name}，单分钟成本低 ${costSavePct}% 且中文口型领先 ${Math.abs(lipDiff).toFixed(1)} 分；高难度特效场景可选 ${physLeader.name}（物理连贯性高出 ${Math.abs(physDiff).toFixed(1)} 分）。`;
        }
        if (Math.abs(physDiff) >= 4.0) {
          return `古风仙侠与武打动作剧优先选用 ${physLeader.name}（物理与武打连贯性高出 ${Math.abs(physDiff).toFixed(1)} 分）；强台词竖屏情感剧推荐 ${lipLeader.name}（中文口型与微表情领先 ${Math.abs(lipDiff).toFixed(1)} 分）。`;
        }
        if (Math.abs(consDiff) >= 2.5) {
          return `多镜头连续剧优先选用 ${consLeader.name}（角色跨镜一致性领先 ${Math.abs(consDiff).toFixed(1)} 分）；追求更低制片单价可选 ${cheaper.name}（单分钟节省 ¥${(pricier.costPerMin - cheaper.costPerMin).toFixed(1)}）。`;
        }
        const overallLeader = eloDiff >= 0 ? a : b;
        return `综合盲测表现 ${overallLeader.name} 领先 ${Math.abs(eloDiff)} ELO；若需控制单集预算，${cheaper.name} 单分钟成片成本更具优势（¥${cheaper.costPerMin.toFixed(1)}/分钟）。`;
      }

      function renderAbCutBench() {
        const count = state.compareIds.length;
        abBenchCount.textContent = `已锁定 ${count} / 2 个成片样本`;

        if (count === 0) {
          abCutBench.classList.remove("is-open");
          abCutBench.setAttribute("aria-hidden", "true");
          return;
        }

        abCutBench.classList.add("is-open");
        abCutBench.setAttribute("aria-hidden", "false");

        const modelA = VIDEO_MODELS.find((m) => m.id === state.compareIds[0]);
        const modelB = state.compareIds[1] ? VIDEO_MODELS.find((m) => m.id === state.compareIds[1]) : null;

        const slotAHtml = `
          <div class="cut-slot">
            <div>
              <div class="cut-slot-name">A 轨 · ${esc(modelA.name)}</div>
              <div class="cut-slot-meta mono">${modelA.elo} ELO · 一致性 ${modelA.consistency} · 口型 ${modelA.lipsync} · ¥${modelA.costPerMin.toFixed(1)}/m</div>
            </div>
            <button type="button" class="btn-slot-drop" data-drop-id="${modelA.id}">移除</button>
          </div>
        `;

        if (!modelB) {
          abBenchBody.innerHTML =
            slotAHtml +
            `<div class="ab-diff-matrix"><span class="ab-diff-item">等待 B 轨样本</span></div>` +
            `<div class="cut-slot is-vacant">请在上方榜单勾选第二个模型，启动 A/B 分镜参数对照</div>` +
            `<div class="producer-verdict">已锁定 <strong>${esc(modelA.name)}</strong>（${esc(modelA.recommendedGenre)}）。再选一个模型即可生成制片选型对照。</div>`;
        } else {
          const eloDiff = modelA.elo - modelB.elo;
          const consDiff = modelA.consistency - modelB.consistency;
          const lipDiff = modelA.lipsync - modelB.lipsync;
          const costDiff = modelA.costPerMin - modelB.costPerMin;

          const fmt = (n, digits = 0) => (n > 0 ? `+${n.toFixed(digits)}` : n.toFixed(digits));

          const diffHtml = `
            <div class="ab-diff-matrix mono">
              <span class="ab-diff-item">ELO 差 <strong>${fmt(eloDiff, 0)}</strong></span>
              <span class="ab-diff-item">一致性 <strong>${fmt(consDiff, 1)}</strong></span>
              <span class="ab-diff-item">口型差 <strong>${fmt(lipDiff, 1)}</strong></span>
              <span class="ab-diff-item">成本差 <strong>${costDiff > 0 ? "+¥" + costDiff.toFixed(1) : "-¥" + Math.abs(costDiff).toFixed(1)}</strong></span>
            </div>
          `;

          const slotBHtml = `
            <div class="cut-slot">
              <div>
                <div class="cut-slot-name">B 轨 · ${esc(modelB.name)}</div>
                <div class="cut-slot-meta mono">${modelB.elo} ELO · 一致性 ${modelB.consistency} · 口型 ${modelB.lipsync} · ¥${modelB.costPerMin.toFixed(1)}/m</div>
              </div>
              <button type="button" class="btn-slot-drop" data-drop-id="${modelB.id}">移除</button>
            </div>
          `;

          const verdictHtml = `<div class="producer-verdict">${esc(generateProducerVerdict(modelA, modelB))}</div>`;

          abBenchBody.innerHTML = slotAHtml + diffHtml + slotBHtml + verdictHtml;
        }

        abBenchBody.querySelectorAll("[data-drop-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            toggleCompareSelection(btn.dataset.dropId, false);
          });
        });
      }

      /* ========================================================================
         8. 总体渲染调度与交互事件绑定
         ======================================================================== */
      function renderAll() {
        const { sorted, eloRanked } = getFilteredDataset();

        if (state.focusedIdx >= sorted.length) {
          state.focusedIdx = Math.max(0, sorted.length - 1);
        }

        // 更新表头排序激活指示
        sortBtns.forEach((btn) => {
          if (btn.dataset.sort === state.sortBy) {
            btn.setAttribute("aria-sort", state.sortDir === "desc" ? "descending" : "ascending");
          } else {
            btn.removeAttribute("aria-sort");
          }
        });

        renderFilmGauge(eloRanked);
        renderLedgerTable(sorted);
        renderAbCutBench();
      }

      // 短剧生产专项赛道切换
      trackBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          trackBtns.forEach((b) => b.setAttribute("aria-selected", "false"));
          btn.setAttribute("aria-selected", "true");
          state.track = btn.dataset.track;
          state.focusedIdx = 0;

          const { eloRanked } = getFilteredDataset();
          state.expandedId = eloRanked.length ? eloRanked[0].id : null;
          renderAll();
        });
      });

      // 输出画幅 / 时长过滤快速切换
      specPills.forEach((pill) => {
        pill.addEventListener("click", () => {
          specPills.forEach((p) => p.setAttribute("aria-pressed", "false"));
          pill.setAttribute("aria-pressed", "true");
          state.spec = pill.dataset.spec;
          state.focusedIdx = 0;

          const { eloRanked } = getFilteredDataset();
          state.expandedId = eloRanked.length ? eloRanked[0].id : null;
          renderAll();
        });
      });

      // 重置筛选条件
      resetFiltersBtn.addEventListener("click", () => {
        state.track = "all";
        state.spec = "all";
        trackBtns.forEach((b) => b.setAttribute("aria-selected", b.dataset.track === "all" ? "true" : "false"));
        specPills.forEach((p) => p.setAttribute("aria-pressed", p.dataset.spec === "all" ? "true" : "false"));
        state.expandedId = "seedance-2-pro";
        renderAll();
      });

      // 列头排序切换
      sortBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.sort;
          if (state.sortBy === key) {
            state.sortDir = state.sortDir === "desc" ? "asc" : "desc";
          } else {
            state.sortBy = key;
            // 单分钟成本默认升序（越便宜越靠前），其余能力指标默认降序
            state.sortDir = key === "cost" ? "asc" : "desc";
          }
          renderAll();
        });
      });

      // 清空对比工作台
      clearBenchBtn.addEventListener("click", () => {
        state.compareIds = [];
        renderAll();
      });

      // 键盘无障碍导航：↑/↓ 移动光标，Enter 展开/收起分镜抽屉
      document.addEventListener("keydown", (e) => {
        const { sorted } = getFilteredDataset();
        if (!sorted.length) return;

        if (e.key === "ArrowDown") {
          e.preventDefault();
          state.focusedIdx = (state.focusedIdx + 1) % sorted.length;
          renderAll();
          const row = ledgerBody.querySelector(`tr.film-row[data-idx="${state.focusedIdx}"]`);
          if (row) row.focus();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          state.focusedIdx = (state.focusedIdx - 1 + sorted.length) % sorted.length;
          renderAll();
          const row = ledgerBody.querySelector(`tr.film-row[data-idx="${state.focusedIdx}"]`);
          if (row) row.focus();
        } else if (e.key === "Enter" && document.activeElement && document.activeElement.classList.contains("film-row")) {
          e.preventDefault();
          const id = document.activeElement.dataset.id;
          state.expandedId = state.expandedId === id ? null : id;
          renderAll();
          const row = ledgerBody.querySelector(`tr.film-row[data-id="${id}"]`);
          if (row) row.focus();
        }
      });

      // 初始化检片台
      renderAll();
    })();
  </script>
</body>
</html>
