<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新影像排片室 · AI 短剧与创作者双榜（2026年第47周）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       设计系统 Token：当代影展选片指南与流媒体排片室
       ========================================================================== */
    :root {
      --bg-canvas: #EFECE6;      /* 质感粗棉影展节目单纸面底色 */
      --bg-surface: #F7F5F0;     /* 高光卡片与展开抽屉底色 */
      --bg-recessed: #E5E1D8;    /* 凹陷排片栏与标签底色 */
      --ink-primary: #16181D;    /* 深渊炭黑主文字与 1.5px 结构线框 */
      --ink-secondary: #585D68;  /* 次级说明与数据脚注灰 */
      --accent-primary: #1F3A93; /* 电影拷贝钴蓝 */
      --accent-signal: #C84B31;  /* 放映机朱砂红 */

      --font-serif: 'Noto Serif SC', 'Songti SC', 'STSong', Georgia, serif;
      --font-sans: 'Noto Sans SC', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

      --border-heavy: 1.5px solid var(--ink-primary);
      --border-hair: 1px solid rgba(22, 24, 29, 0.22);
      --ease-curatorial: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 2px;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: -2px;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1, "zero" 1;
    }

    .serif {
      font-family: var(--font-serif);
    }

    /* 主容器 */
    .screening-room {
      max-width: 1420px;
      margin: 0 auto;
      padding: 20px 24px 140px;
    }

    /* ==========================================================================
       1. 影展刊头栏（Masthead）
       ========================================================================== */
    .masthead {
      background: var(--bg-surface);
      border: var(--border-heavy);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: stretch;
    }

    .masthead-main {
      padding: 18px 22px;
      border-right: var(--border-heavy);
    }

    .masthead-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink-primary);
      line-height: 1.25;
    }

    .masthead-desc {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--ink-secondary);
      max-width: 68ch;
    }

    .masthead-meta {
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      min-width: 280px;
    }

    .issue-tag {
      display: inline-block;
      border: var(--border-heavy);
      background: var(--bg-canvas);
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-primary);
    }

    .saved-counter-btn {
      appearance: none;
      background: var(--bg-surface);
      border: var(--border-heavy);
      color: var(--ink-primary);
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .saved-counter-btn:hover {
      background: var(--bg-recessed);
    }

    .saved-counter-btn.has-items {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* ==========================================================================
       2. Hero 核心视觉：双榜切换与本周现象级样本放映条（Screening Reel Strip）
       ========================================================================== */
    .reel-hero {
      background: var(--bg-surface);
      border-left: var(--border-heavy);
      border-right: var(--border-heavy);
      border-bottom: var(--border-heavy);
      display: grid;
      grid-template-columns: 360px 1fr;
    }

    /* 左侧：双模式硬核切换开关 */
    .mode-switch-column {
      padding: 16px 18px;
      border-right: var(--border-heavy);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-canvas);
    }

    .mode-switch-caption {
      font-size: 12px;
      color: var(--ink-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mode-toggle-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mode-btn {
      appearance: none;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      background: var(--bg-surface);
      border: var(--border-heavy);
      color: var(--ink-primary);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .mode-btn:hover {
      background: var(--bg-recessed);
    }

    .mode-btn[aria-selected="true"] {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #F7F5F0;
    }

    .mode-btn-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      display: block;
    }

    .mode-btn-sub {
      font-size: 12px;
      opacity: 0.82;
      display: block;
      margin-top: 2px;
    }

    .mode-btn-count {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 2px 7px;
      border: 1px solid currentColor;
    }

    /* 右侧：本周现象级前三名样本放映条 */
    .reel-strip-column {
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .reel-strip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--ink-secondary);
    }

    .reel-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .reel-card {
      border: var(--border-heavy);
      background: var(--bg-canvas);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      text-align: left;
      padding: 0;
      color: var(--ink-primary);
      overflow: hidden;
    }

    .reel-card:hover {
      border-color: var(--accent-primary);
    }

    .reel-card.is-active {
      border-color: var(--accent-signal);
    }

    .reel-frame-box {
      position: relative;
      height: 92px;
      background: #16181D;
      border-bottom: var(--border-heavy);
      overflow: hidden;
    }

    .reel-frame-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .reel-rank-badge {
      position: absolute;
      top: 7px;
      left: 7px;
      padding: 1px 6px;
      font-size: 11px;
      font-weight: 600;
      background: var(--bg-surface);
      color: var(--ink-primary);
      border: 1px solid var(--ink-primary);
    }

    .reel-rank-badge.is-top1 {
      background: var(--accent-signal);
      color: #F7F5F0;
      border-color: var(--accent-signal);
    }

    .reel-preview-pill {
      position: absolute;
      bottom: 7px;
      right: 7px;
      padding: 2px 7px;
      font-size: 11px;
      background: rgba(22, 24, 29, 0.88);
      color: #F7F5F0;
      border: 1px solid rgba(247, 245, 240, 0.45);
    }

    .reel-card:hover .reel-preview-pill {
      background: var(--accent-signal);
      border-color: var(--accent-signal);
    }

    .reel-card-body {
      padding: 8px 10px;
    }

    .reel-card-title {
      font-family: var(--font-serif);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reel-card-meta {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--ink-secondary);
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    /* ==========================================================================
       3. 筛选与检索引擎栏
       ========================================================================== */
    .filter-toolbar {
      background: var(--bg-surface);
      border-left: var(--border-heavy);
      border-right: var(--border-heavy);
      border-bottom: var(--border-heavy);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-groups {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .filter-cluster {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .filter-label {
      font-size: 12px;
      color: var(--ink-secondary);
      margin-right: 4px;
      font-weight: 500;
    }

    .pill-btn {
      appearance: none;
      background: var(--bg-canvas);
      border: var(--border-hair);
      color: var(--ink-primary);
      padding: 4px 10px;
      font-family: var(--font-sans);
      font-size: 12px;
      cursor: pointer;
    }

    .pill-btn:hover {
      border-color: var(--ink-primary);
    }

    .pill-btn[aria-pressed="true"] {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #F7F5F0;
      font-weight: 500;
    }

    .search-box-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-input {
      width: 240px;
      padding: 5px 10px;
      background: var(--bg-canvas);
      border: var(--border-heavy);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 12.5px;
    }

    .search-input::placeholder {
      color: var(--ink-secondary);
    }

    /* ==========================================================================
       4. 主排片榜单表格
       ========================================================================== */
    .ledger-container {
      background: var(--bg-surface);
      border-left: var(--border-heavy);
      border-right: var(--border-heavy);
      border-bottom: var(--border-heavy);
      overflow-x: auto;
    }

    .ledger-table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .ledger-table thead th {
      padding: 10px 12px;
      background: var(--bg-recessed);
      border-bottom: var(--border-heavy);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-primary);
      text-align: left;
      user-select: none;
      white-space: nowrap;
    }

    .ledger-table thead th.align-right {
      text-align: right;
    }

    .ledger-table thead th.align-center {
      text-align: center;
    }

    .sort-trigger {
      appearance: none;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .sort-trigger:hover {
      color: var(--accent-primary);
    }

    .sort-trigger[aria-sort="descending"],
    .sort-trigger[aria-sort="ascending"] {
      color: var(--accent-primary);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* 主行样式（无上浮、无阴影） */
    .entry-row {
      border-bottom: var(--border-hair);
      cursor: pointer;
      background: var(--bg-surface);
    }

    .entry-row:hover {
      background: var(--bg-canvas);
    }

    .entry-row.is-expanded {
      background: var(--bg-canvas);
      border-bottom: var(--border-heavy);
    }

    .entry-row.is-key-focus {
      outline: 2px solid var(--accent-primary);
      outline-offset: -2px;
    }

    .entry-row td {
      padding: 12px 12px;
      vertical-align: middle;
    }

    .entry-row td.align-right {
      text-align: right;
    }

    .entry-row td.align-center {
      text-align: center;
    }

    /* 排名与名次变动 */
    .rank-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rank-num {
      font-size: 14px;
      font-weight: 600;
      min-width: 20px;
      color: var(--ink-primary);
    }

    .rank-num.is-top1 {
      color: var(--accent-signal);
    }

    .rank-delta {
      font-size: 11px;
      font-weight: 500;
    }

    .delta-up {
      color: var(--accent-signal);
    }

    .delta-down {
      color: var(--ink-secondary);
    }

    .delta-new {
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      padding: 0 4px;
    }

    .delta-flat {
      color: var(--ink-secondary);
    }

    /* 剧目 / 作者主标题列 */
    .primary-title {
      font-family: var(--font-serif);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink-primary);
      display: block;
    }

    .primary-sub {
      font-size: 12px;
      color: var(--ink-secondary);
      margin-top: 2px;
      display: block;
    }

    .vendor-name {
      font-weight: 500;
      color: var(--ink-primary);
      display: block;
    }

    .vendor-sub {
      font-size: 11.5px;
      color: var(--ink-secondary);
      display: block;
      margin-top: 1px;
    }

    /* 纯文本小框标签 */
    .tag-box {
      display: inline-block;
      border: var(--border-hair);
      background: var(--bg-canvas);
      padding: 2px 7px;
      font-size: 11.5px;
      color: var(--ink-primary);
      white-space: nowrap;
    }

    /* 数值与进度刻度 */
    .metric-strong {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .metric-strong.is-cobalt {
      color: var(--accent-primary);
    }

    .index-pill {
      display: inline-block;
      padding: 2px 8px;
      border: var(--border-heavy);
      background: var(--bg-canvas);
      font-weight: 600;
      font-size: 13px;
      color: var(--ink-primary);
    }

    .index-pill.is-top {
      background: var(--accent-signal);
      border-color: var(--accent-signal);
      color: #F7F5F0;
    }

    /* 对比复选框 */
    .folio-check {
      appearance: none;
      width: 16px;
      height: 16px;
      border: var(--border-heavy);
      background: var(--bg-surface);
      cursor: pointer;
      display: inline-grid;
      place-content: center;
      margin: 0;
    }

    .folio-check:checked {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .folio-check:checked::after {
      content: "";
      width: 8px;
      height: 8px;
      background: #F7F5F0;
    }

    /* ==========================================================================
       5. 原地“审片单与样片分镜”展开抽屉
       ========================================================================== */
    .screening-drawer-row td {
      padding: 0;
      background: var(--bg-surface);
      border-bottom: var(--border-heavy);
    }

    .screening-drawer {
      display: grid;
      grid-template-columns: 440px 1fr;
      border-top: var(--border-hair);
      background: var(--bg-surface);
    }

    /* 左侧：动态样片关键帧预览器 */
    .drawer-preview-col {
      padding: 18px 20px;
      border-right: var(--border-heavy);
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preview-stage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .timecode-readout {
      background: #16181D;
      color: #F7F5F0;
      padding: 2px 8px;
      font-size: 11.5px;
    }

    .cinema-canvas-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #16181D;
      border: var(--border-heavy);
      overflow: hidden;
    }

    .cinema-canvas-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .shot-caption-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(22, 24, 29, 0.86);
      color: #F7F5F0;
      padding: 7px 11px;
      font-size: 12px;
      border-top: 1px solid rgba(247, 245, 240, 0.25);
    }

    .shot-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .shot-btn-group {
      display: flex;
      gap: 6px;
    }

    .shot-btn {
      appearance: none;
      background: var(--bg-surface);
      border: var(--border-heavy);
      color: var(--ink-primary);
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      cursor: pointer;
    }

    .shot-btn[aria-pressed="true"] {
      background: var(--accent-signal);
      border-color: var(--accent-signal);
      color: #F7F5F0;
    }

    .shot-spec-note {
      font-size: 11.5px;
      color: var(--ink-secondary);
    }

    /* 右侧：制片人评估与商业对接档案 */
    .drawer-dossier-col {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .dossier-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 20px;
    }

    .dossier-block h3 {
      margin: 0 0 4px;
      font-family: var(--font-serif);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-primary);
      border-bottom: var(--border-hair);
      padding-bottom: 3px;
    }

    .dossier-block p {
      margin: 0;
      font-size: 12.5px;
      color: var(--ink-secondary);
      line-height: 1.6;
    }

    .dossier-actions {
      padding-top: 12px;
      border-top: var(--border-hair);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .workflow-summary {
      font-size: 12px;
      color: var(--ink-secondary);
    }

    .action-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-curatorial {
      appearance: none;
      padding: 7px 14px;
      border: var(--border-heavy);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-curatorial:hover {
      background: var(--bg-recessed);
    }

    .btn-curatorial.is-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #F7F5F0;
    }

    .btn-curatorial.is-primary:hover {
      background: #172C70;
    }

    .btn-curatorial.is-saved {
      border-color: var(--accent-signal);
      color: var(--accent-signal);
      font-weight: 600;
    }

    /* 空状态引导 */
    .empty-ledger {
      padding: 48px 24px;
      text-align: center;
      color: var(--ink-secondary);
    }

    .empty-ledger p {
      margin: 0 0 14px;
      font-size: 13.5px;
    }

    /* ==========================================================================
       6. 底部固定“选片对比夹（Selection Folio）”
       ========================================================================== */
    .selection-folio {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-surface);
      border-top: 2px solid var(--ink-primary);
      z-index: 60;
      transform: translateY(100%);
      transition: transform 0.24s var(--ease-curatorial);
    }

    .selection-folio.is-visible {
      transform: translateY(0);
    }

    .folio-inner {
      max-width: 1420px;
      margin: 0 auto;
      padding: 12px 24px;
      display: grid;
      grid-template-columns: 180px 1fr auto;
      align-items: center;
      gap: 18px;
    }

    .folio-heading {
      border-right: var(--border-heavy);
      padding-right: 14px;
    }

    .folio-heading-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 700;
    }

    .folio-heading-sub {
      font-size: 11.5px;
      color: var(--ink-secondary);
      margin-top: 2px;
    }

    .folio-compare-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr 1.35fr;
      align-items: center;
      gap: 12px;
    }

    .folio-slot {
      border: var(--border-heavy);
      background: var(--bg-canvas);
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 50px;

      /* ========================================================================
         5. 工具与艺术化分镜 SVG 生成器（纯矢量影展帧画面，无外链依赖）
         ======================================================================== */
      function showStatusToast(msg) {
        statusToast.textContent = msg;
        statusToast.classList.add("is-open");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          statusToast.classList.remove("is-open");
        }, 2600);
      }

      function esc(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // 根据条目色调与分镜序号生成具有电影构图感的矢量关键帧画面
      function buildStoryboardSVG(entry, shotIndex) {
        const [bg, accent, paper] = entry.palette;
        const shiftX = (shotIndex - 1) * 26;
        const scale = shotIndex === 0 ? 1 : shotIndex === 1 ? 1.12 : 1.24;

        // 电影安全框与三分线构图
        return `
          <svg viewBox="0 0 480 270" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <rect width="480" height="270" fill="${bg}" />
            <!-- 胶片环境光斑与建筑几何剪影 -->
            <g transform="translate(${240 + shiftX}, 135) scale(${scale}) translate(-240, -135)">
              <circle cx="${140 + shotIndex * 55}" cy="${95 - shotIndex * 10}" r="${58 + shotIndex * 12}" fill="${accent}" fill-opacity="0.28" />
              <rect x="42" y="158" width="396" height="112" fill="#0F1014" fill-opacity="0.72" />
              <!-- 场景主体几何叙事隐喻 -->
              <polygon points="${110 + shotIndex * 20},230 ${185 + shotIndex * 10},82 ${260 - shotIndex * 15},230" fill="${paper}" fill-opacity="0.16" />
              <rect x="${275 - shotIndex * 25}" y="64" width="6" height="166" fill="${accent}" fill-opacity="0.85" />
              <circle cx="${278 - shotIndex * 25}" cy="96" r="22" fill="none" stroke="${paper}" stroke-width="1.5" stroke-opacity="0.75" />
              <!-- 雨丝 / 光束斜线 -->
              <line x1="70" y1="20" x2="135" y2="250" stroke="${paper}" stroke-width="0.8" stroke-opacity="0.22" />
              <line x1="330" y1="15" x2="395" y2="245" stroke="${paper}" stroke-width="0.8" stroke-opacity="0.22" />
            </g>
            <!-- 摄影机取景器安全框与十字准星 -->
            <rect x="16" y="14" width="448" height="242" fill="none" stroke="${paper}" stroke-width="0.8" stroke-opacity="0.32" stroke-dasharray="6 4" />
            <line x1="232" y1="135" x2="248" y2="135" stroke="${paper}" stroke-width="1" stroke-opacity="0.55" />
            <line x1="240" y1="127" x2="240" y2="143" stroke="${paper}" stroke-width="1" stroke-opacity="0.55" />
            <text x="26" y="32" fill="${paper}" fill-opacity="0.78" font-family="JetBrains Mono, monospace" font-size="10">24FPS · SHOT 0${shotIndex + 1}</text>
            <text x="454" y="32" text-anchor="end" fill="${accent}" font-family="JetBrains Mono, monospace" font-size="10">REC ●</text>
          </svg>
        `;
      }

      /* ========================================================================
         6. 数据筛选与排序计算
         ======================================================================== */
      function getFilteredEntries() {
        const q = state.searchQuery.trim().toLowerCase();

        if (state.mode === "dramas") {
          const baseRanked = [...DRAMA_ENTRIES]
            .sort((a, b) => b.compositeIndex - a.compositeIndex)
            .map((item, idx) => ({ ...item, rank: idx + 1 }));

          const filtered = baseRanked.filter((d) => {
            const m1 = state.filter1 === "all" || d.genre === state.filter1;
            const m2 = state.filter2 === "all" || d.platform === state.filter2;
            const mq =
              !q ||
              d.title.toLowerCase().includes(q) ||
              d.creator.toLowerCase().includes(q) ||
              d.genre.toLowerCase().includes(q) ||
              d.workflow.toLowerCase().includes(q);
            return m1 && m2 && mq;
          });

          filtered.sort((a, b) => {
            let va, vb;
            if (state.sortBy === "score") {
              va = a.compositeIndex;
              vb = b.compositeIndex;
            } else if (state.sortBy === "completion") {
              va = a.completionRate;
              vb = b.completionRate;
            } else {
              va = a.viewsDeltaNum;
              vb = b.viewsDeltaNum;
            }
            return state.sortDir === "desc" ? vb - va : va - vb;
          });

          return { list: filtered, topThree: baseRanked.slice(0, 3) };
        } else {
          const baseRanked = [...CREATOR_ENTRIES]
            .sort((a, b) => b.authorityScore - a.authorityScore)
            .map((item, idx) => ({ ...item, rank: idx + 1 }));

          const filtered = baseRanked.filter((c) => {
            const m1 = state.filter1 === "all" || c.track === state.filter1;
            const m2 = state.filter2 === "all" || c.commercialStatus === state.filter2;
            const mq =
              !q ||
              c.name.toLowerCase().includes(q) ||
              c.works.toLowerCase().includes(q) ||
              c.track.toLowerCase().includes(q) ||
              c.visualSignature.toLowerCase().includes(q);
            return m1 && m2 && mq;
          });

          filtered.sort((a, b) => {
            let va, vb;
            if (state.sortBy === "score") {
              va = a.authorityScore;
              vb = b.authorityScore;
            } else if (state.sortBy === "completion") {
              va = a.avgCompletion;
              vb = b.avgCompletion;
            } else {
              va = a.followersNum;
              vb = b.followersNum;
            }
            return state.sortDir === "desc" ? vb - va : va - vb;
          });

          return { list: filtered, topThree: baseRanked.slice(0, 3) };
        }
      }

                      <div class="dossier-block">
                        <h3>受众画像与完播曲线分析</h3>
                        <p>${esc(item.audienceCurve)}</p>
                      </div>
                      <div class="dossier-block">
                        <h3>制作周期与单集成本估算</h3>
                        <p>${esc(item.budgetCycle)}</p>
                      </div>
                      <div class="dossier-block">
                        <h3>制作工作流拆解</h3>
                        <p>${esc(item.workflowDetail)}</p>
                      </div>
                    </div>

                    <div class="dossier-actions">
                      <span class="workflow-summary mono">
                        排片档案编号：${esc(item.id.toUpperCase())} · 第 47 周入围样本
                      </span>

                      <div class="action-btn-row">
                        <button type="button" class="btn-curatorial ${isSaved ? "is-saved" : ""}" data-save-id="${item.id}">
                          ${isSaved ? "移出选片单" : "收藏至选片单"}
                        </button>
                        <button type="button" class="btn-curatorial is-primary" data-letter-id="${item.id}">
                          导出制片联系函
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </td>
            `;

            // 镜头切换按钮事件
            drawerTr.querySelectorAll("[data-shot]").forEach((sBtn) => {
              sBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                state.activeShotIdx = Number(sBtn.dataset.shot);
                renderAll();
              });
            });

            // 收藏至选片单（动词一致反馈）
            const saveBtn = drawerTr.querySelector("[data-save-id]");
            saveBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              if (state.savedIds.has(item.id)) {
                state.savedIds.delete(item.id);
                showStatusToast(`已将 ${displayName} 移出选片单`);
              } else {
                state.savedIds.add(item.id);
                showStatusToast(`已将 ${displayName} 收藏至选片单`);
              }
              renderAll();
            });

            // 导出制片联系函
            const letterBtn = drawerTr.querySelector("[data-letter-id]");
            letterBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              openProducerLetterModal(item);
            });

            ledgerBody.appendChild(drawerTr);
          }
        });
      }

      /* ========================================================================
         10. 底部“选片对比夹（Selection Folio）”
         ======================================================================== */
      function toggleFolioSelection(id, add) {
        const idx = state.folioIds.indexOf(id);
        if (add && idx === -1) {
          if (state.folioIds.length >= 2) {
            state.folioIds.shift();
          }
          state.folioIds.push(id);
        } else if (!add && idx !== -1) {
          state.folioIds.splice(idx, 1);
        }
        renderAll();
      }

      function findEntryById(id) {
        return DRAMA_ENTRIES.find((d) => d.id === id) || CREATOR_ENTRIES.find((c) => c.id === id);
      }

      function renderSelectionFolio() {
        const count = state.folioIds.length;
        folioCountText.textContent = `已选 ${count} / 2 项对比对象`;

        if (count === 0) {
          selectionFolio.classList.remove("is-visible");
          selectionFolio.setAttribute("aria-hidden", "true");
          return;
        }

        selectionFolio.classList.add("is-visible");
        selectionFolio.setAttribute("aria-hidden", "false");

        const itemA = findEntryById(state.folioIds[0]);
        const itemB = state.folioIds[1] ? findEntryById(state.folioIds[1]) : null;
        const isDrama = state.mode === "dramas";

        const nameA = isDrama ? itemA.title : itemA.name;
        const metaA = isDrama
          ? `完播 ${itemA.completionRate}% · ${itemA.viewsDeltaText} · 指数 ${itemA.compositeIndex}`
          : `均完播 ${itemA.avgCompletion}% · ${itemA.quoteRange}/分钟 · 声量 ${itemA.authorityScore}`;

        const slotAHtml = `
          <div class="folio-slot">
            <div>
              <div class="folio-slot-title">样本 A · ${esc(nameA)}</div>
              <div class="folio-slot-meta mono">${esc(metaA)}</div>
            </div>
            <button type="button" class="pill-btn" data-remove-folio="${itemA.id}">移除</button>
          </div>
        `;

        if (!itemB) {
          folioCompareGrid.innerHTML =
            slotAHtml +
            `<div class="folio-diff-box mono"><span>等待第二个样本</span></div>` +
            `<div class="folio-slot is-empty">请在上方排片表中勾选第二部短剧或第二位创作者进行横向对比</div>` +
            `<div class="folio-advice">已锁定 <strong>${esc(nameA)}</strong>，再勾选一项即可生成买手排片或商单合作对比建议。</div>`;
        } else {
          const nameB = isDrama ? itemB.title : itemB.name;
          const metaB = isDrama
            ? `完播 ${itemB.completionRate}% · ${itemB.viewsDeltaText} · 指数 ${itemB.compositeIndex}`
            : `均完播 ${itemB.avgCompletion}% · ${itemB.quoteRange}/分钟 · 声量 ${itemB.authorityScore}`;

          const slotBHtml = `
            <div class="folio-slot">
              <div>
                <div class="folio-slot-title">样本 B · ${esc(nameB)}</div>
                <div class="folio-slot-meta mono">${esc(metaB)}</div>
              </div>
              <button type="button" class="pill-btn" data-remove-folio="${itemB.id}">移除</button>
            </div>
          `;

          let diffHtml = "";
          let adviceText = "";

          if (isDrama) {
            const compDiff = itemA.completionRate - itemB.completionRate;
            const viewDiff = itemA.viewsDeltaNum - itemB.viewsDeltaNum;
            const higherComp = compDiff >= 0 ? itemA : itemB;
            const higherReach = viewDiff >= 0 ? itemA : itemB;

            diffHtml = `
              <div class="folio-diff-box mono">
                <span>完播率差 <strong>${compDiff >= 0 ? "+" : ""}${compDiff.toFixed(1)}%</strong></span>
                <span>增量差 <strong>${viewDiff >= 0 ? "+" : ""}${viewDiff}万</strong></span>
              </div>
            `;
            adviceText = `买手排片建议：${higherComp.title} 完播粘性更高（${higherComp.completionRate}%），适合付费分账与会员留存；${higherReach.title} 破圈流量增量更猛（${higherReach.viewsDeltaText}），适合首页信息流拉新主推。`;
          } else {
            const compDiff = itemA.avgCompletion - itemB.avgCompletion;
            const lowerQuote = itemA.quoteMin <= itemB.quoteMin ? itemA : itemB;
            const higherScore = itemA.authorityScore >= itemB.authorityScore ? itemA : itemB;

            diffHtml = `
              <div class="folio-diff-box mono">
                <span>完播差 <strong>${compDiff >= 0 ? "+" : ""}${compDiff.toFixed(1)}%</strong></span>
                <span>声量差 <strong>${(itemA.authorityScore - itemB.authorityScore).toFixed(1)}</strong></span>
              </div>
            `;
            adviceText = `商单合作建议：S 级品牌大片与精品定制优先对接 ${higherScore.name}（综合声量 ${higherScore.authorityScore}）；追求高频日更与成本可控则推荐 ${lowerQuote.name}（起报价 ${lowerQuote.quoteRange}/分钟）。`;
          }

          folioCompareGrid.innerHTML =
            slotAHtml + diffHtml + slotBHtml + `<div class="folio-advice">${esc(adviceText)}</div>`;
        }

        folioCompareGrid.querySelectorAll("[data-remove-folio]").forEach((btn) => {
          btn.addEventListener("click", () => {
            toggleFolioSelection(btn.dataset.removeFolio, false);
          });
        });
      }

      /* ========================================================================
         11. 制片联系函导出预览窗
         ======================================================================== */
      function openProducerLetterModal(item) {
        const isDrama = state.mode === "dramas";
        const targetTitle = isDrama ? `${item.title}（出品方：${item.creator}）` : `${item.name}（代表作：${item.works}）`;
        letterModalTitle.textContent = `制片联系函草稿 · ${isDrama ? item.title : item.name}`;

        letterTextarea.value =
`【新影像排片室 · 2026年第47周入围项目对接函】

致：${targetTitle}
对接事由：${isDrama ? "短剧版权采购 / 平台联合排片合作" : "AI 短剧定制承制 / 品牌商业大片合作"}

您好：
贵方作品/团队已入选《新影像排片室 · 2026年第47周双榜》（当前排片位次：第 ${item.rank} 名，${isDrama ? `完播率 ${item.completionRate}%，本周播放增量 ${item.viewsDeltaText}` : `代表作平均完播率 ${item.avgCompletion}%，综合声量分 ${item.authorityScore}`}）。

我方希望就以下合作方向进行沟通：
1. 合作形式：${isDrama ? "首轮/二轮分账排片、海外译制发行" : `${item.commercialStatus}（参考预算区间：${item.quoteRange}/分钟）`}
2. 预计排期：2026 年 12 月上旬启动剧本与分镜对接

请回复贵方商务负责人联系方式与最新档期表。`;

        letterModalBackdrop.classList.add("is-open");
        showStatusToast("已生成制片联系函草稿");
      }

      closeLetterBtn.addEventListener("click", () => {
        letterModalBackdrop.classList.remove("is-open");
      });

      letterModalBackdrop.addEventListener("click", (e) => {
        if (e.target === letterModalBackdrop) {
          letterModalBackdrop.classList.remove("is-open");
        }
      });

      copyLetterBtn.addEventListener("click", () => {
        letterTextarea.select();
        document.execCommand("copy");
        showStatusToast("已复制联系函全文至剪贴板");
      });

      /* ========================================================================
         12. 总体渲染调度与键盘无障碍绑定
         ======================================================================== */
      function renderAll() {
        const { list, topThree } = getFilteredEntries();

        if (state.focusedRowIdx >= list.length) {
          state.focusedRowIdx = Math.max(0, list.length - 1);
        }

        // 更新顶部收藏计数
        savedCountNum.textContent = state.savedIds.size;
        savedSummaryBtn.classList.toggle("has-items", state.savedIds.size > 0);

        renderReelStrip(topThree);
        renderFilters();
        renderTable(list);
        renderSelectionFolio();
      }

      // 双模式切换（剧目榜 <-> 作者榜）
      modeBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const nextMode = btn.dataset.mode;
          if (state.mode === nextMode) return;

          modeBtns.forEach((b) => b.setAttribute("aria-selected", "false"));
          btn.setAttribute("aria-selected", "true");

          state.mode = nextMode;
          state.filter1 = "all";
          state.filter2 = "all";
          state.searchQuery = "";
          searchInput.value = "";
          state.sortBy = "score";
          state.sortDir = "desc";
          state.focusedRowIdx = 0;
          state.activeShotIdx = 0;
          state.folioIds = []; // 切换榜单类型时重置对比夹，避免跨类型字段混淆
          state.expandedId = nextMode === "dramas" ? "drama-01" : "creator-01";

          renderAll();
        });
      });

      // 实时搜索
      searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value;
        state.focusedRowIdx = 0;
        renderAll();
      });

      // 清空筛选
      resetFiltersBtn.addEventListener("click", () => {
        state.filter1 = "all";
        state.filter2 = "all";
        state.searchQuery = "";
        searchInput.value = "";
        renderAll();
      });

      // 清空对比夹
      clearFolioBtn.addEventListener("click", () => {
        state.folioIds = [];
        renderAll();
      });

      // 顶部收藏统计按钮提示
      savedSummaryBtn.addEventListener("click", () => {
        if (state.savedIds.size === 0) {
          showStatusToast("选片单暂无收藏项，展开任意排片行即可收藏");
        } else {
          showStatusToast(`当前选片单共收藏 ${state.savedIds.size} 项入围短剧/创作者`);
        }
      });

      // 键盘 ↑ / ↓ 切换排片行，Enter 展开/收起审片抽屉
      document.addEventListener("keydown", (e) => {
        if (document.activeElement === searchInput || letterModalBackdrop.classList.contains("is-open")) {
          if (e.key === "Escape" && letterModalBackdrop.classList.contains("is-open")) {
            letterModalBackdrop.classList.remove("is-open");
          }
          return;
        }

        const { list } = getFilteredEntries();
        if (!list.length) return;

        if (e.key === "ArrowDown") {
          e.preventDefault();
          state.focusedRowIdx = (state.focusedRowIdx + 1) % list.length;
          renderAll();
          const row = ledgerBody.querySelector(`tr.entry-row[data-idx="${state.focusedRowIdx}"]`);
          if (row) row.focus();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          state.focusedRowIdx = (state.focusedRowIdx - 1 + list.length) % list.length;
          renderAll();
          const row = ledgerBody.querySelector(`tr.entry-row[data-idx="${state.focusedRowIdx}"]`);
          if (row) row.focus();
        } else if (e.key === "Enter" && document.activeElement && document.activeElement.classList.contains("entry-row")) {
          e.preventDefault();
          const id = document.activeElement.dataset.id;
          state.expandedId = state.expandedId === id ? null : id;
          state.activeShotIdx = 0;
          renderAll();
          const row = ledgerBody.querySelector(`tr.entry-row[data-id="${id}"]`);
          if (row) row.focus();
        }
      });

      // 初始化排片室
      renderAll();
    })();
  </script>
</body>
</html>
