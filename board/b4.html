<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRAME·AIGC 打投现场</title>
<style>
  /* ==========================================================
     FRAME · AIGC 短剧/视频/创作者榜 · 打投现场
     风格：故障艺术 × 直播打投 · 信号干扰 · 扫描线 · 撕裂
     交互：投票 / 实时重排 / 票数跳动 / 按钮状态
     刻意避开：奶油底衬线、圆角卡片、灰阴影、居中大标题
     ========================================================== */

  *{ margin:0; padding:0; box-sizing:border-box; }

  :root{
    /* 调色板 — 6 个命名值，全部服务于"故障直播"语境 */
    --void:     #08070c;   /* 直播间的底：偏紫的黑 */
    --static:   #15131e;   /* 信号面板暗部 */
    --acid:     #d8ff3e;   /* 酸性荧光黄绿 — 主信号，刺眼、直播感 */
    --ultra:    #ff2ec4;   /* 荧光品红 — 故障/投票高亮 */
    --cyan:     #2ef2ff;   /* 电光青 — 次信号，撕裂边缘 */
    --paper:    #f2f0ea;   /* 冷白正文 */
    --fog:      #7d7a8c;   /* 雾紫灰，辅助 */

    --font-display: 'Anton', 'Impact', sans-serif;
    --font-mono:    'Space Mono', 'Courier New', monospace;
    --font-body:    'Space Grotesk', system-ui, sans-serif;
  }

  html{ scroll-behavior:smooth; }

  body{
    background:var(--void);
    color:var(--paper);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }

  /* ---- 全屏扫描线 + 信号噪点：整个页面的"直播信号"底噪 ---- */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    background:repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.18) 0px,
      rgba(0,0,0,.18) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:multiply;
    opacity:.55;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9998;
    background:
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(216,255,62,.10), transparent 55%),
      radial-gradient(ellipse 50% 40% at 90% 15%, rgba(255,46,196,.12), transparent 55%),
      radial-gradient(ellipse 50% 50% at 50% 110%, rgba(46,242,255,.08), transparent 55%);
  }

  .page{
    position:relative;
    z-index:1;
    max-width:1240px;
    margin:0 auto;
    padding:2rem 2rem 6rem;
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    padding-bottom:1.25rem;
    border-bottom:1px solid rgba(242,240,234,.12);
    margin-bottom:3rem;
  }
  .brand{
    font-family:var(--font-display);
    font-size:1.4rem;
    letter-spacing:-.02em;
    color:var(--paper);
    display:flex;
    align-items:center;
    gap:.6rem;
    position:relative;
  }
  .brand .glyph{
    width:.9rem;height:.9rem;
    background:var(--acid);
    clip-path:polygon(0 0, 100% 0, 100% 60%, 60% 60%, 60% 100%, 0 100%);
  }
  /* 品牌字的故障重影 */
  .brand::after{
    content:"FRAME";
    position:absolute;
    left:1.5rem;top:0;
    color:var(--ultra);
    opacity:.5;
    clip-path:inset(0 0 60% 0);
    animation:glitch 3.6s infinite steps(1);
    pointer-events:none;
  }
  @keyframes glitch{
    0%,90%,100%{ transform:translate(0); opacity:.5; }
    92%{ transform:translate(-3px,1px); opacity:.9; }
    94%{ transform:translate(3px,-1px); opacity:.8; }
    96%{ transform:translate(-1px,0); opacity:.6; }
  }

  .topbar .live-meta{
    display:flex;
    align-items:center;
    gap:1.25rem;
    font-family:var(--font-mono);
    font-size:.72rem;
    letter-spacing:.04em;
    color:var(--fog);
  }
  .live-badge{
    display:inline-flex;
    align-items:center;
    gap:.4rem;
    color:var(--ultra);
    font-weight:700;
  }
  .live-badge::before{
    content:"";
    width:.55rem;height:.55rem;
    background:var(--ultra);
    border-radius:50%;
    box-shadow:0 0 10px var(--ultra);
    animation:blink 1.2s steps(2) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- 主视觉 ---------- */
  .hero{
    margin-bottom:3.5rem;
    position:relative;
  }
  .hero .kicker{
    font-family:var(--font-mono);
    font-size:.75rem;
    letter-spacing:.14em;
    color:var(--acid);
    margin-bottom:1rem;
    display:flex;
    align-items:center;
    gap:.6rem;
  }
  .hero .kicker::before{
    content:"";
    width:2.2rem;height:1px;
    background:var(--acid);
  }
  .hero h1{
    font-family:var(--font-display);
    font-size:clamp(3rem, 10vw, 8.5rem);
    line-height:.86;
    letter-spacing:-.02em;
    text-transform:uppercase;
    color:var(--paper);
    position:relative;
  }
  .hero h1 .hit{
    color:var(--ultra);
    position:relative;
    display:inline-block;
  }
  /* 主标题的色差故障 */
  .hero h1 .hit::before,
  .hero h1 .hit::after{
    content:"打投";
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .hero h1 .hit::before{ color:var(--cyan); transform:translate(2px,-1px); opacity:.7; clip-path:inset(0 0 55% 0); }
  .hero h1 .hit::after{ color:var(--ultra); transform:translate(-2px,1px); opacity:.7; clip-path:inset(55% 0 0 0); }

  .hero .outline{
    color:transparent;
    -webkit-text-stroke:2px var(--fog);
  }

  .hero-sub{
    display:flex;
    flex-wrap:wrap;
    gap:.75rem 2.5rem;
    margin-top:2rem;
    font-family:var(--font-mono);
    font-size:.78rem;
    color:var(--fog);
    letter-spacing:.02em;
    align-items:baseline;
  }
  .hero-sub .stat b{
    color:var(--acid);
    font-size:1rem;
    font-weight:700;
    margin-right:.2rem;
  }

  /* ---------- 投票台：前三名 + 投票 ---------- */
  .podium{
    display:grid;
    grid-template-columns:1fr 1.18fr 1fr;
    gap:1rem;
    margin-bottom:4rem;
    align-items:end;
  }
  .podium-card{
    background:var(--static);
    border:1px solid rgba(242,240,234,.10);
    border-radius:0;
    padding:1.5rem 1.25rem;
    position:relative;
    transition:border-color .25s ease, transform .25s ease;
  }
  .podium-card:hover{
    border-color:var(--acid);
    transform:translateY(-3px);
  }
  /* 卡片右侧撕裂边 —— 唯一的形状装饰 */
  .podium-card::before{
    content:"";
    position:absolute;
    top:0;right:-1px;bottom:0;
    width:3px;
    background:var(--acid);
    clip-path:polygon(0 0,100% 0,100% 15%,0 22%,0 38%,100% 45%,100% 60%,0 68%,0 82%,100% 88%,100% 100%,0 100%);
    opacity:.5;
  }
  .podium-card.mid{
    background:linear-gradient(165deg, #1c1a28 0%, var(--static) 70%);
    border-color:rgba(255,46,196,.4);
    box-shadow:0 0 50px rgba(255,46,196,.12);
    padding:2rem 1.5rem;
  }
  .podium-card.mid::before{ background:var(--ultra); opacity:.9; }

  .podium-rank{
    font-family:var(--font-display);
    font-size:2.8rem;
    line-height:1;
    color:transparent;
    -webkit-text-stroke:1.5px var(--fog);
  }
  .podium-card.mid .podium-rank{
    font-size:3.6rem;
    color:var(--ultra);
    -webkit-text-stroke:0;
    text-shadow:0 0 24px rgba(255,46,196,.5);
  }
  .podium-title{
    font-family:var(--font-display);
    font-size:1.2rem;
    letter-spacing:.01em;
    margin-top:.9rem;
    line-height:1.15;
    text-transform:uppercase;
  }
  .podium-card.mid .podium-title{ font-size:1.45rem; }
  .podium-creator{
    font-family:var(--font-mono);
    font-size:.72rem;
    color:var(--fog);
    margin-top:.35rem;
  }
  .podium-votes{
    margin-top:1.25rem;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:.5rem;
  }
  .podium-votes .num{
    font-family:var(--font-display);
    font-size:1.5rem;
    color:var(--paper);
    font-variant-numeric:tabular-nums;
    transition:color .2s;
  }
  .podium-votes .num.bump{ color:var(--acid); }
  .vote-btn{
    font-family:var(--font-mono);
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--void);
    background:var(--acid);
    border:none;
    border-radius:0;
    padding:.5rem .9rem;
    cursor:pointer;
    position:relative;
    transition:background .15s, color .15s, transform .1s;
    text-transform:uppercase;
  }
  .vote-btn:hover{ background:var(--paper); }
  .vote-btn:active{ transform:scale(.94); }
  .vote-btn.voted{
    background:transparent;
    color:var(--acid);
    border:1px solid var(--acid);
    cursor:default;
    pointer-events:none;
  }
  .vote-btn.voted::after{ content:" ✓"; }

  /* ---------- 完整榜单 ---------- */
  .board-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:1rem;
    margin-bottom:1.25rem;
    padding-bottom:1rem;
    border-bottom:1px solid rgba(242,240,234,.12);
  }
  .board-head h2{
    font-family:var(--font-display);
    font-size:clamp(1.8rem, 4.5vw, 3rem);
    letter-spacing:.01em;
    text-transform:uppercase;
    line-height:1;
  }
  .board-head .sort-note{
    font-family:var(--font-mono);
    font-size:.7rem;
    color:var(--fog);
    letter-spacing:.03em;
    text-align:right;
    line-height:1.6;
  }
  .board-head .sort-note b{ color:var(--acid); }

  .rank-list{
    list-style:none;
  }
  .rank-item{
    display:flex;
    align-items:center;
    gap:1.1rem;
    padding:1.25rem .5rem;
    border-bottom:1px solid rgba(242,240,234,.08);
    transition:background .2s, padding-left .2s, border-color .2s;
    position:relative;
  }
  .rank-item:hover{
    background:rgba(216,255,62,.04);
    padding-left:1rem;
    border-bottom-color:rgba(216,255,62,.35);
  }
  /* 排名重排动画 */
  .rank-item.moving{
    transition:transform .45s cubic-bezier(.34,1.4,.4,1), background .45s;
    z-index:2;
  }
  .rank-item.flash{
    animation:flashRow .6s ease;
  }
  @keyframes flashRow{
    0%{ background:rgba(255,46,196,.22); }
    100%{ background:transparent; }
  }

  .rank-no{
    flex:0 0 3.2rem;
    font-family:var(--font-display);
    font-size:1.9rem;
    letter-spacing:-.01em;
    color:var(--fog);
    line-height:1;
    font-variant-numeric:tabular-nums;
    transition:color .25s;
  }
  .rank-item:hover .rank-no{ color:var(--acid); }
  .rank-no.top{ color:var(--ultra); }

  .rank-info{ flex:1 1 auto; min-width:0; }
  .rank-info .t{
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:.01em;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rank-info .c{
    font-family:var(--font-mono);
    font-size:.72rem;
    color:var(--fog);
    margin-top:.2rem;
  }

  .rank-tag{
    flex:0 0 auto;
    font-family:var(--font-mono);
    font-size:.66rem;
    color:var(--fog);
    border:1px solid rgba(242,240,234,.16);
    padding:.18rem .55rem;
    border-radius:0;
    white-space:nowrap;
  }

  .rank-votes{
    flex:0 0 4.5rem;
    text-align:right;
    font-family:var(--font-display);
    font-size:1.25rem;
    color:var(--paper);
    font-variant-numeric:tabular-nums;
    line-height:1;
    transition:color .2s;
  }
  .rank-votes.bump{ color:var(--acid); }

  .vote-mini{
    flex:0 0 auto;
    font-family:var(--font-mono);
    font-size:.66rem;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--void);
    background:var(--acid);
    border:none;
    border-radius:0;
    padding:.4rem .7rem;
    cursor:pointer;
    transition:background .15s, color .15s, transform .1s;
    text-transform:uppercase;
  }
  .vote-mini:hover{ background:var(--paper); }
  .vote-mini:active{ transform:scale(.94); }
  .vote-mini.voted{
    background:transparent;
    color:var(--acid);
    border:1px solid var(--acid);
    cursor:default;
    pointer-events:none;
  }
  .vote-mini.voted::after{ content:" ✓"; }

  /* ---------- 页脚 ---------- */
  .foot{
    margin-top:3rem;
    padding-top:1.5rem;
    border-top:1px solid rgba(242,240,234,.12);
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:1rem;
    font-family:var(--font-mono);
    font-size:.7rem;
    color:var(--fog);
    letter-spacing:.02em;
  }
  .foot a{
    color:var(--paper);
    text-decoration:none;
    border-bottom:1px solid var(--ultra);
    padding-bottom:1px;
    transition:color .2s, border-color .2s;
  }
  .foot a:hover{ color:var(--ultra); border-color:var(--paper); }

  /* ---------- 动效：一次编排的入场 ---------- */
  @media (prefers-reduced-motion: no-preference){
    .reveal{
      opacity:0;
      transform:translateY(20px);
      animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .reveal.d1{ animation-delay:.05s; }
    .reveal.d2{ animation-delay:.15s; }
    .reveal.d3{ animation-delay:.25s; }
    .reveal.d4{ animation-delay:.35s; }
    .reveal.d5{ animation-delay:.45s; }
    .reveal.d6{ animation-delay:.55s; }
    .reveal.d7{ animation-delay:.65s; }
    .reveal.d8{ animation-delay:.75s; }
    .reveal.d9{ animation-delay:.85s; }
    .reveal.d10{ animation-delay:.95s; }
    .reveal.d11{ animation-delay:1.05s; }
    @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

    /* 主视觉入场：横幅砸下的感觉 */
    .hero h1{
      animation:slam .8s cubic-bezier(.15,1.6,.3,1) .1s both;
    }
    @keyframes slam{
      from{ transform:scale(1.25) translateY(-30px); opacity:0; filter:blur(6px); }
      to{ transform:scale(1) translateY(0); opacity:1; filter:blur(0); }
    }
  }

  /* 键盘焦点 */
  button:focus-visible, a:focus-visible, .rank-item:focus-visible{
    outline:2px solid var(--acid);
    outline-offset:3px;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width:860px){
    .podium{ grid-template-columns:1fr; }
    .podium-card.mid{ order:-1; }
    .rank-tag{ display:none; }
  }
  @media (max-width:560px){
    .page{ padding:1.5rem 1.1rem 4rem; }
    .topbar{ margin-bottom:2rem; }
    .topbar .live-meta{ gap:.75rem; font-size:.64rem; }
    .hero h1{ font-size:3rem; }
    .hero-sub{ font-size:.7rem; gap:.5rem 1.5rem; }
    .rank-item{ gap:.7rem; padding:1rem .25rem; }
    .rank-no{ flex:0 0 2.2rem; font-size:1.4rem; }
    .rank-info .t{ font-size:.94rem; }
    .rank-votes{ flex:0 0 3.2rem; font-size:1.05rem; }
    .vote-mini{ padding:.35rem .5rem; font-size:.6rem; }
    .board-head{ flex-direction:column; align-items:flex-start; gap:.5rem; }
    .board-head .sort-note{ text-align:left; }
    .foot{ flex-direction:column; gap:.5rem; }
  }
</style>
<!-- 字体：Anton（重压缩标题）+ Space Mono（数据/标签）+ Space Grotesk（正文） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page">

  <!-- 顶栏 -->
  <div class="topbar reveal d1">
    <div class="brand"><span class="glyph"></span>FRAME</div>
    <div class="live-meta">
      <span class="live-badge">LIVE</span>
      <span>VOL.07 / 2025.04</span>
      <span>投票通道开启</span>
    </div>
  </div>

  <!-- 主视觉 -->
  <header class="hero">
    <div class="kicker reveal d2">AIGC SHORT-FORM AWARDS · 实时打投</div>
    <h1 class="reveal d2">
      AIGC<br>
      <span class="hit">打投</span><br>
      <span class="outline">现场</span>
    </h1>
    <div class="hero-sub reveal d3">
      <span class="stat"><b id="totalVotes">0</b>总票数</span>
      <span class="stat"><b>8</b>位创作者</span>
      <span>综合播放完成度 · 互动密度 · 跨平台传播</span>
      <span>每次点击 = 1 票，每人每项限投一次</span>
    </div>
  </header>

  <!-- 投票台：前三名 -->
  <section class="podium" id="podium" aria-label="本期前三名，可投票"></section>

  <!-- 完整榜单 -->
  <section aria-label="完整榜单，可投票">
    <div class="board-head reveal d6">
      <h2>完整榜单</h2>
      <div class="sort-note">
        按票数实时降序<br>
        <b>点击 VOTE 投票，榜单即时重排</b>
      </div>
    </div>
    <ul class="rank-list" id="rankList"></ul>
  </section>

  <!-- 页脚 -->
  <footer class="foot reveal d11">
    <span>指数 = 播放完成度 × 0.5 + 互动密度 × 0.3 + 跨平台传播 × 0.2</span>
    <span><a href="#">方法论</a> · <a href="#">提交作品</a></span>
  </footer>

</div>

<script>
(function(){
  "use strict";

  /* ---------- 数据：票数作为唯一排名依据 ---------- */
  const creators = [
    { id:'c1', rank:1, title:'《雾中回声》', creator:'林默',        meta:'悬疑短剧',   tag:'AI 短剧 · 8 集',  votes:9860 },
    { id:'c2', rank:2, title:'《蓝色断层》', creator:'Charmaine',   meta:'科幻微视频', tag:'AI 视频 · 单集',  votes:9620 },
    { id:'c3', rank:3, title:'《二十四帧》', creator:'暗房工作室', meta:'实验叙事',   tag:'AI 短剧 · 6 集',  votes:9470 },
    { id:'c4', rank:4, title:'《她的第二个身体》', creator:'陈墨白', meta:'',          tag:'AI 视频 · 系列',  votes:9210 },
    { id:'c5', rank:5, title:'《夜航西飞》', creator:'Aurora Lab',  meta:'',          tag:'AI 短剧 · 12 集', votes:9080 },
    { id:'c6', rank:6, title:'《像素回响》', creator:'李维',        meta:'',          tag:'AI 视频 · 单集',  votes:8930 },
    { id:'c7', rank:7, title:'《荒原往事》', creator:'北纬三十度', meta:'',          tag:'AI 短剧 · 10 集', votes:8750 },
    { id:'c8', rank:8, title:'《无声告白》', creator:'言午',        meta:'',          tag:'AI 视频 · 系列',  votes:8590 }
  ];

  const voted = new Set();          // 已投票创作者 id
  const podiumEl = document.getElementById('podium');
  const listEl   = document.getElementById('rankList');
  const totalEl  = document.getElementById('totalVotes');

  /* ---------- 数字格式化 ---------- */
  const fmt = n => n.toLocaleString('en-US');

  /* ---------- 计算总票数 ---------- */
  function updateTotal(){
    totalEl.textContent = fmt(creators.reduce((s,c)=>s+c.votes,0));
  }

  /* ---------- 渲染单个榜单项（用于完整榜单） ---------- */
  function renderRow(c, idx){
    const li = document.createElement('li');
    li.className = 'rank-item reveal';
    li.dataset.id = c.id;
    const rank = idx + 1;
    li.innerHTML = `
      <div class="rank-no ${rank<=3?'top':''}">${String(rank).padStart(2,'0')}</div>
      <div class="rank-info">
        <div class="t">${c.title}</div>
        <div class="c">${c.creator}${c.meta ? ' · ' + c.meta : ''}</div>
      </div>
      <span class="rank-tag">${c.tag}</span>
      <div class="rank-votes" data-votes>${fmt(c.votes)}</div>
      <button class="vote-mini" type="button" aria-label="为 ${c.title} 投票">VOTE</button>
    `;
    bindVote(li.querySelector('.vote-mini'), c, li);
    if (voted.has(c.id)) markVoted(li.querySelector('.vote-mini'));
    return li;
  }

  /* ---------- 渲染前三名投票台 ---------- */
  function renderPodium(){
    // 按票数降序取前三
    const top3 = [...creators].sort((a,b)=>b.votes-a.votes).slice(0,3);
    // 视觉顺序：第2名 / 第1名 / 第3名
    const order = [top3[1], top3[0], top3[2]];
    podiumEl.innerHTML = '';
    order.forEach((c, i) => {
      const card = document.createElement('div');
      const isMid = i === 1;
      const rankNow = top3.indexOf(c) + 1;
      card.className = 'podium-card reveal' + (isMid ? ' mid' : '') + ' d' + (3+i);
      card.dataset.id = c.id;
      card.innerHTML = `
        <div class="podium-rank">${String(rankNow).padStart(2,'0')}</div>
        <div class="podium-title">${c.title}</div>
        <div class="podium-creator">${c.creator}${c.meta ? ' · ' + c.meta : ''}</div>
        <div class="podium-votes">
          <span class="num" data-votes>${fmt(c.votes)}</span>
          <button class="vote-btn" type="button" aria-label="为 ${c.title} 投票">VOTE</button>
        </div>
      `;
      const btn = card.querySelector('.vote-btn');
      bindVote(btn, c, card);
      if (voted.has(c.id)) markVoted(btn);
      podiumEl.appendChild(card);
    });
  }

  /* ---------- 投票按钮状态 ---------- */
  function markVoted(btn){
    btn.classList.add('voted');
    btn.textContent = '已投';
  }

  /* ---------- 绑定投票 ---------- */
  function bindVote(btn, c, scope){
    btn.addEventListener('click', () => {
      if (voted.has(c.id)) return;
      voted.add(c.id);
      c.votes += 1;

      // 更新作用域内的票数显示（podium / 行）
      if (scope) {
        const numEl = scope.querySelector('[data-votes]');
        if (numEl) {
          numEl.textContent = fmt(c.votes);
          numEl.classList.add('bump');
          setTimeout(()=>numEl.classList.remove('bump'), 450);
        }
      }
      markVoted(btn);
      updateTotal();
      // 重排 + 高亮
      reorderAll(c.id);
    });
  }

  /* ---------- 整体重排：榜单 + 前三名 ---------- */
  function reorderAll(changedId){
    // 按票数降序
    creators.sort((a,b)=>b.votes-a.votes);

    // 1) 重排完整榜单
    const rows = Array.from(listEl.children);
    // 移除旧内容，按新顺序重建（保持简单可靠；用 flash 提示变化）
    const newOrder = creators.map((c, idx) => {
      const old = rows.find(r => r.dataset.id === c.id);
      if (old) {
        // 更新排名号与票数
        const no = old.querySelector('.rank-no');
        no.textContent = String(idx+1).padStart(2,'0');
        no.classList.toggle('top', idx < 3);
        const v = old.querySelector('[data-votes]');
        v.textContent = fmt(c.votes);
        return old;
      }
      return renderRow(c, idx);
    });
    listEl.innerHTML = '';
    newOrder.forEach(r => listEl.appendChild(r));

    // 2) 重排前三名投票台
    renderPodium();

    // 3) 高亮发生变化的行
    if (changedId) {
      const changedRow = listEl.querySelector(`.rank-item[data-id="${changedId}"]`);
      if (changedRow) {
        changedRow.classList.add('flash');
        setTimeout(()=>changedRow.classList.remove('flash'), 650);
      }
    }
  }

  /* ---------- 初始渲染 ---------- */
  function init(){
    // 初次按票数排序
    creators.sort((a,b)=>b.votes-a.votes);
    listEl.innerHTML = '';
    creators.forEach((c, i) => listEl.appendChild(renderRow(c, i)));
    renderPodium();
    updateTotal();
  }

  init();

  /* ---------- 投票数跳动（可选：定时模拟直播数据？不，保持用户驱动，避免噪音） ---------- */

})();
</script>
