<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Warm Orange-toned) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="55%" stop-color="#FF6A1A" />
      <stop offset="100%" stop-color="#E84D00" />
    </linearGradient>

    <!-- Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB070" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Swiss Grid Lines -->
  <path d="M128 64V448 M256 64V448 M384 64V448 M64 128H448 M64 256H448 M64 384H448" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5" />

  <!-- Frosted Glass Backing Polygon (Vector Radar Shape) -->
  <polygon points="256,110 402,216 346,382 166,382 110,216" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" />

  <!-- Secondary Inner Geometric Path (FUV Axis Intersection) -->
  <line x1="256" y1="110" x2="256" y2="340" stroke="#FFFFFF" stroke-opacity="0.55" stroke-dasharray="6,4" stroke-width="2" />
  <line x1="166" y1="260" x2="346" y2="260" stroke="#FFFFFF" stroke-opacity="0.55" stroke-dasharray="6,4" stroke-width="2" />

  <!-- Nodes / Vertex Points -->
  <circle cx="256" cy="110" r="6" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="402" cy="216" r="6" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="346" cy="382" r="6" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="166" cy="382" r="6" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="110" cy="216" r="6" fill="#FFFFFF" filter="url(#glow)" />

  <!-- Dynamic Optimal Vector Line (Pointing to top-right peak) -->
  <line x1="256" y1="260" x2="370" y2="150" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="370" cy="150" r="10" fill="#FFFFFF" stroke="#FF6A1A" stroke-width="4" />

  <!-- Bold Swiss Typography: FUV (Enlarged x2) -->
  <text x="256" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="192" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">FUV</text>

  <!-- Accent Sub-label / Version Indicator -->
  <text x="256" y="402" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">DECISION.ENGINE</text>

  <!-- Outer Glass Border -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" />
</svg>
