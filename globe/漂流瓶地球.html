<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漂流瓶地球</title>
<style>
:root{--bg:#050912;--fg:#e8f1ff;--mut:#8ea3c4;--card:rgba(12,20,38,.88);--line:rgba(140,180,255,.22);--acc:#ffb347;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.top{position:fixed;left:18px;top:calc(14px + env(safe-area-inset-top,0px));pointer-events:none;max-width:70vw}
.top h1{margin:0;font-size:22px;letter-spacing:2px}
.top p{margin:2px 0 0;color:var(--mut);font-size:13px}
.stat{position:fixed;left:18px;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--mut);font-size:12px;line-height:1.7;pointer-events:none}
.bar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;backdrop-filter:blur(8px)}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#1a1205;border-color:var(--acc);font-weight:600}
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#card[hidden]{display:none}
#card h2{margin:0 0 2px;font-size:16px}.mut{color:var(--mut);font-size:12px;margin:0 0 10px}
#cm{font-size:17px;margin:8px 0 14px;word-break:break-word}
textarea{width:100%;box-sizing:border-box;height:84px;resize:none;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;padding:10px;margin-bottom:12px}
.row{display:flex;gap:8px;justify-content:flex-end}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><h1>🍾 漂流瓶 · 地球</h1><p>点击地球任意一点，把一句话封进瓶子，丢给陌生人。</p></div>
<div class="stat" id="stat"></div>
<div class="bar"><button id="bAuto">⏸ 暂停自转</button><button id="bFish" class="pri">🍾 捞一只瓶子</button></div>
<div id="card" hidden><h2 id="ct"></h2><p class="mut" id="ci"></p><p id="cm"></p>
<textarea id="cta" maxlength="80" placeholder="写一句想对陌生人说的话…"></textarea>
<div class="row"><button id="cx">关闭</button><button id="cok" class="pri">投下瓶子</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),PI=Math.PI;
// 粗略大陆轮廓 (lon,lat 平铺)
const P=[
[-168,66,-162,70,-141,70,-125,70,-110,73,-95,72,-85,70,-82,68,-90,64,-94,59,-92,57,-82,55,-79,52,-78,60,-77,62,-70,61,-65,60,-62,57,-56,52,-60,47,-66,45,-70,43,-74,40,-76,35,-81,31,-80,26,-82,27,-85,30,-90,29,-97,27,-97,22,-94,18,-90,21,-87,21,-88,16,-83,15,-83,10,-80,8,-77,8,-80,7,-86,12,-92,14,-97,16,-105,20,-106,23,-112,29,-115,30,-117,32,-121,35,-124,40,-124,47,-128,51,-135,58,-142,60,-150,61,-155,58,-163,55,-158,58,-165,62],
[-73,78,-60,82,-30,83,-20,80,-20,72,-24,69,-40,65,-44,60,-50,63,-54,68,-60,76],
[-77,8,-72,12,-62,10,-52,5,-50,0,-44,-2,-35,-5,-39,-14,-41,-22,-48,-26,-53,-34,-58,-38,-62,-40,-65,-45,-68,-50,-69,-54,-73,-52,-75,-45,-73,-38,-71,-30,-70,-18,-76,-14,-81,-5,-80,0,-78,3],
[-9,37,-9,43,-2,44,-4,48,2,51,8,54,9,57,11,54,14,54,20,55,22,58,24,60,30,60,22,63,25,65,21,66,17,62,19,59,12,56,8,58,5,62,14,68,25,71,40,68,44,68,60,69,70,73,80,73,100,77,113,74,130,71,150,71,170,70,180,68,180,65,170,60,163,58,160,54,156,51,156,57,143,59,137,55,141,52,140,48,135,43,130,42,129,36,126,35,126,38,122,40,121,39,118,38,121,35,122,31,120,27,115,22,110,21,108,21,106,18,109,12,105,9,101,13,100,8,103,1,100,3,98,8,97,16,94,17,92,21,88,22,80,15,77,8,73,17,72,21,67,24,61,25,57,26,56,27,50,30,48,29,51,25,56,24,59,22,55,17,44,13,43,16,39,22,35,28,34,31,36,36,30,36,27,37,26,40,29,41,28,42,24,40,22,37,20,40,16,41,18,40,16,38,12,42,9,44,3,43,0,39,-2,37,-6,36],
[-17,21,-17,15,-13,9,-8,4,0,5,9,4,9,-1,13,-6,12,-17,15,-27,19,-34,26,-34,33,-27,35,-20,40,-15,40,-4,51,11,43,12,38,18,33,28,32,31,20,31,11,33,10,37,-6,36,-10,30],
[44,-25,48,-25,50,-15,49,-12,44,-17],
[114,-22,122,-18,130,-12,137,-12,142,-11,146,-19,153,-26,150,-37,141,-38,135,-34,124,-34,115,-34],
[-5,50,1,51,2,53,-2,56,-2,58,-5,58,-6,56,-3,54,-5,52],[-10,52,-6,52,-6,55,-10,54],
[130,31,135,34,140,36,142,40,141,45,145,44,140,41,136,37,131,34],
[95,5,98,4,106,-3,105,-6,100,-1],[109,1,117,7,119,1,116,-4,110,-3],[105,-6,114,-7,114,-8,106,-7],
[131,-1,141,-3,150,-10,141,-9,137,-5],[120,18,122,18,126,7,122,7,120,14],
[172,-34,178,-38,175,-41,166,-46,172,-41],[-24,64,-14,65,-14,64,-22,63],
[-80,73,-62,67,-65,63,-78,64,-90,70],[-118,72,-105,73,-100,69,-115,68],[-85,22,-74,20,-77,22],
[-180,-90,180,-90,180,-72,-180,-72]];
const mc=document.createElement('canvas');mc.width=360;mc.height=180;const g=mc.getContext('2d');g.fillStyle='#fff';
P.forEach(a=>{g.beginPath();for(let i=0;i<a.length;i+=2){const x=a[i]+180,y=90-a[i+1];i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.fill()});
const mask=g.getImageData(0,0,360,180).data;
const land=(la,lo)=>mask[(Math.min(179,Math.floor(90-la))*360+Math.min(359,Math.floor(lo+180)))*4+3]>128;
const ll2v=(lat,lon,r=1)=>{const p=(90-lat)*PI/180,t=(lon+180)*PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))};
const sunLL=()=>{const d=new Date(),doy=(d-Date.UTC(d.getUTCFullYear(),0,0))/864e5,h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;return{lat:-23.44*Math.cos(2*PI*(doy+10)/365),lon:-(h-12)*15}};
const coord=(a,o)=>Math.abs(a).toFixed(1)+'°'+(a>=0?'N':'S')+' '+Math.abs(o).toFixed(1)+'°'+(o>=0?'E':'W');
const tinfo=(la,lo)=>{const t=new Date(Date.now()+lo/15*36e5),s=sunLL();const day=ll2v(la,lo).dot(ll2v(s.lat,s.lon))>0;return(day?'☀️ 白天':'🌙 夜晚')+' · 当地约 '+String(t.getUTCHours()).padStart(2,'0')+':'+String(t.getUTCMinutes()).padStart(2,'0')};

// three 场景
const c=$('c'),ren=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true}),dpr=Math.min(devicePixelRatio||1,2);
ren.setPixelRatio(dpr);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.z=3.4;
const globe=new THREE.Group();scene.add(globe);
const sunU={value:new THREE.Vector3()},pxU={value:2.4*dpr};
const VS='varying vec3 n;uniform float px;void main(){n=position;gl_PointSize=px;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const core=new THREE.Mesh(new THREE.SphereGeometry(.985,48,48),new THREE.ShaderMaterial({uniforms:{sun:sunU,px:pxU},vertexShader:VS,fragmentShader:'varying vec3 n;uniform vec3 sun;void main(){float l=dot(normalize(n),sun);gl_FragColor=vec4(mix(vec3(.015,.03,.08),vec3(.05,.14,.3),smoothstep(-.1,.3,l)),1.);}'}));
globe.add(core);
const pos=[],N=16000;
for(let i=0;i<N;i++){const la=Math.asin(1-2*(i+.5)/N)*180/PI,lo=((i*137.508)%360)-180;if(land(la,lo)){const v=ll2v(la,lo);pos.push(v.x,v.y,v.z)}}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
globe.add(new THREE.Points(pg,new THREE.ShaderMaterial({uniforms:{sun:sunU,px:pxU},vertexShader:VS,fragmentShader:'varying vec3 n;uniform vec3 sun;void main(){vec2 q=gl_PointCoord-.5;if(dot(q,q)>.25)discard;float d=smoothstep(-.12,.18,dot(normalize(n),sun));gl_FragColor=vec4(mix(vec3(.18,.28,.55),vec3(.45,.95,.75),d)*(.55+.45*d),1.);}'})));
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.12,48,48),new THREE.ShaderMaterial({side:THREE.BackSide,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,vertexShader:'varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 n;void main(){float i=pow(max(.72-dot(n,vec3(0,0,1)),0.),3.);gl_FragColor=vec4(.3,.55,1.,1.)*i;}'})));
{const s=[];for(let i=0;i<500;i++){const v=new THREE.Vector3().randomDirection?new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(30):0;s.push(v.x,v.y,v.z)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(s,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:1.3,sizeAttenuation:false,color:0x7f93b8})))}

// 瓶子数据
const seeds=[[35.68,139.69,'东京的凌晨三点，便利店的关东煮真好吃。'],[31.23,121.47,'上海下雨了，如果你也在加班，愿你早点回家。'],[40.71,-74.0,'布鲁克林大桥的日出很美，愿你今天也有好运。'],[51.5,-0.12,'伦敦又是阴天，但我刚好买到了喜欢的书。'],[-33.87,151.2,'悉尼的海边今天出现了海豚，你那里呢？'],[-22.9,-43.2,'里约的夕阳把整片海染成了橙色。'],[30.04,31.23,'开罗的清晨，猫在金字塔旁边睡着了。'],[64.14,-21.9,'冰岛的夜里看到了极光，想分享给你。'],[-1.29,36.82,'内罗毕的雨季来了，咖啡特别香。'],[55.75,37.62,'莫斯科零下十度，但手里的热茶很暖。'],[19.43,-99.13,'墨西哥城的玉米饼摊，老板多送了我一个。'],[1.35,103.82,'新加坡的夜市，想和远方的朋友干杯。'],[28.61,77.21,'德里街头有人教我煮了一壶很甜的奶茶。'],[-41.29,174.78,'惠灵顿风很大，但我还是走完了海岸线。']].map((a,i)=>({lat:a[0],lon:a[1],text:a[2],mine:false}));
let mine=[];try{mine=JSON.parse(localStorage.getItem('drift-bottles-v1')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('drift-bottles-v1',JSON.stringify(mine))}catch(e){}};
const markers=[],geo=new THREE.SphereGeometry(.02,12,12);
function addMarker(b){const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:b.mine?0x5ee0ff:0xffb347}));m.position.copy(ll2v(b.lat,b.lon,1.012));m.userData.b=b;globe.add(m);markers.push(m);stat()}
seeds.concat(mine).forEach(addMarker);

// 交互
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),q1=new THREE.Quaternion(),q2=new THREE.Quaternion();
let drag=null,moved=0,auto=true,target=null,open=false,lastB=null,pend=null;
c.addEventListener('pointerdown',e=>{drag=1;moved=0;target=null;c.setPointerCapture(e.pointerId);c.style.cursor='grabbing'});
c.addEventListener('pointermove',e=>{if(!drag)return;moved+=Math.abs(e.movementX)+Math.abs(e.movementY);const k=.005*cam.position.z/3.4;
globe.quaternion.premultiply(q1.setFromAxisAngle(new THREE.Vector3(0,1,0),e.movementX*k)).premultiply(q2.setFromAxisAngle(new THREE.Vector3(1,0,0),e.movementY*k))});
c.addEventListener('pointerup',e=>{c.style.cursor='grab';if(drag&&moved<6)pick(e);drag=null});
c.addEventListener('wheel',e=>{e.preventDefault();cam.position.z=Math.min(6,Math.max(1.7,cam.position.z*(1+e.deltaY*.001)))},{passive:false});
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,cam);
const gh=ray.intersectObject(core)[0],mh=ray.intersectObjects(markers).filter(h=>!gh||h.distance<gh.distance+.03)[0];
if(mh){show(mh.object.userData.b);return}
if(gh){const p=globe.worldToLocal(gh.point.clone()),lat=Math.asin(p.y/p.length())*180/PI;let lon=Math.atan2(p.z,-p.x)*180/PI-180;if(lon<-180)lon+=360;write(lat,lon)}}
function fly(la,lo){target=new THREE.Quaternion().setFromUnitVectors(ll2v(la,lo).normalize(),new THREE.Vector3(0,0,1))}
function card(mode,title,info){open=true;$('card').hidden=false;$('ct').textContent=title;$('ci').textContent=info;$('cm').hidden=mode!=='read';$('cta').hidden=$('cok').hidden=mode!=='write'}
function write(la,lo){pend={lat:la,lon:lo};fly(la,lo);card('write','在 '+coord(la,lo)+' 投下一只瓶子',tinfo(la,lo));$('cta').value='';setTimeout(()=>$('cta').focus(),50)}
function show(b){lastB=b;fly(b.lat,b.lon);card('read',(b.mine?'你投下的瓶子':'你捞到了一只瓶子')+' · '+coord(b.lat,b.lon),tinfo(b.lat,b.lon));$('cm').textContent='“'+b.text+'”'}
const close=()=>{open=false;$('card').hidden=true;pend=null};
$('cx').onclick=close;
$('cok').onclick=()=>{const t=$('cta').value.trim();if(!t||!pend)return;const b={lat:pend.lat,lon:pend.lon,text:t,mine:true};mine.push(b);save();addMarker(b);close();show(b)};
$('bFish').onclick=()=>{const all=seeds.concat(mine).filter(b=>b!==lastB);show(all[Math.floor(Math.random()*all.length)])};
$('bAuto').onclick=()=>{auto=!auto;$('bAuto').textContent=auto?'⏸ 暂停自转':'▶ 继续自转'};
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function stat(){$('stat').innerHTML='';const s=sunLL(),a=document.createElement('div'),b=document.createElement('div');
a.textContent='UTC '+new Date().toISOString().slice(11,19)+' · 太阳直射 '+coord(s.lat,s.lon);b.textContent='海面上漂着 '+(seeds.length+mine.length)+' 只瓶子（你投了 '+mine.length+' 只）';$('stat').append(a,b)}
function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
setInterval(stat,1000);
const t0=performance.now();
(function loop(){requestAnimationFrame(loop);const t=(performance.now()-t0)/1000,s=sunLL();sunU.value.copy(ll2v(s.lat,s.lon).normalize());pxU.value=2.4*dpr*Math.sqrt(3.4/cam.position.z);
if(target){globe.quaternion.slerp(target,.07);if(globe.quaternion.angleTo(target)<.002)target=null}
else if(auto&&!drag&&!open)globe.quaternion.premultiply(q1.setFromAxisAngle(new THREE.Vector3(0,1,0),.0015));
markers.forEach((m,i)=>m.scale.setScalar(1+.3*Math.sin(t*3+i)));
ren.render(scene,cam)})();
</script></body></html>
